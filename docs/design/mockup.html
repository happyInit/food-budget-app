<meta charset="utf-8">
<title>밀플래닝 · 화면 목업 v1</title>
<style>
  :root{
    --bg:#eeeeec; --app:#fbfbfa; --surface:#fff; --ink:#1b1a19; --sub:#6f6b66; --faint:#a29d97;
    --line:#eceae7; --line2:#f4f2ef;
    --brand:#16a06a; --brand-ink:#0c7a4e; --brand-weak:#e8f6ef;
    --danger:#e0413f; --danger-weak:#fcecec; --warn:#d98200; --warn-weak:#fbf1df;
    --r:18px; --r-sm:12px; --pill:999px;
    --sh:0 1px 2px rgba(20,19,18,.04), 0 8px 22px rgba(20,19,18,.05);
    --font:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);font-family:var(--font);color:var(--ink);
    -webkit-font-smoothing:antialiased;padding:40px 24px 80px;line-height:1.45}
  .head{max-width:1200px;margin:0 auto 28px}
  .head h1{font-size:22px;font-weight:800;letter-spacing:-.02em}
  .head p{color:var(--sub);font-size:14px;margin-top:6px}
  .gallery{max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;gap:44px;justify-content:center}
  figure{width:344px}
  figcaption{margin-top:14px;text-align:center}
  figcaption b{font-size:14px;font-weight:700}
  figcaption span{display:block;color:var(--faint);font-size:12px;margin-top:2px}

  /* phone */
  .phone{width:344px;height:730px;background:#000;border-radius:44px;padding:9px;box-shadow:0 30px 60px rgba(20,19,18,.14)}
  .screen{width:100%;height:100%;background:var(--app);border-radius:36px;overflow:hidden;position:relative;display:flex;flex-direction:column}
  .sb{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:13px;font-weight:600;flex:none}
  .sb .dots{display:flex;gap:5px;align-items:center;color:var(--ink)}
  .appbar{height:52px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line2)}
  .appbar .t{font-size:17px;font-weight:800;letter-spacing:-.02em}
  .appbar .logo{font-size:17px;font-weight:800;letter-spacing:-.03em;color:var(--brand-ink)}
  .appbar .ic{display:flex;gap:14px;color:var(--ink)}
  .content{flex:1;overflow-y:auto;padding:16px 16px 84px}
  .content::-webkit-scrollbar{display:none}

  /* tabbar */
  .tab{position:absolute;left:0;right:0;bottom:0;height:64px;background:rgba(251,251,250,.92);
    backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding:6px 6px 10px}
  .tab a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--faint);font-size:10.5px;font-weight:600;text-decoration:none}
  .tab a.on{color:var(--brand)}
  .tab svg{width:23px;height:23px;stroke-width:1.9}

  /* type */
  .eyebrow{font-size:12px;font-weight:700;color:var(--brand);letter-spacing:.02em}
  .h1{font-size:22px;font-weight:800;letter-spacing:-.03em;margin:3px 0 2px}
  .lead{color:var(--sub);font-size:13px}
  .sec{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px}
  .sec h2{font-size:15px;font-weight:800;letter-spacing:-.02em}
  .sec .more{font-size:12px;color:var(--faint);font-weight:600}
  .num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}

  /* cards & bits */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
  .budget .k{font-size:12.5px;color:var(--sub);font-weight:600}
  .budget .v{font-size:34px;font-weight:800;letter-spacing:-.04em;margin:4px 0 2px}
  .budget .of{font-size:12.5px;color:var(--faint)}
  .bar{height:8px;background:var(--line);border-radius:var(--pill);margin:14px 0 8px;overflow:hidden}
  .bar>span{display:block;height:100%;background:var(--brand);border-radius:var(--pill)}
  .budget .hint{font-size:12px;color:var(--sub)}
  .budget .hint b{color:var(--brand-ink)}

  .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:12px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 12px}
  .stat .k{font-size:11px;color:var(--sub);font-weight:600}
  .stat .v{font-size:21px;font-weight:800;letter-spacing:-.02em;margin-top:5px}
  .stat .v small{font-size:12px;font-weight:700;color:var(--faint)}
  .stat .m{font-size:10.5px;margin-top:3px;color:var(--faint);font-weight:600}
  .stat .m.up{color:var(--brand)} .stat .m.warn{color:var(--warn)}

  .row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--r-sm);padding:12px 14px;margin-bottom:8px}
  .row .th{width:38px;height:38px;border-radius:11px;background:var(--line2);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
  .row .g{flex:1;min-width:0}
  .row .tt{font-size:14px;font-weight:700;letter-spacing:-.01em}
  .row .ts{font-size:11.5px;color:var(--sub);margin-top:1px}
  .row .rt{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
  .price{font-size:14px;font-weight:800}
  .dl{color:var(--brand);font-size:11px;font-weight:800}

  .btn{border:0;border-radius:10px;font-family:inherit;font-weight:700;cursor:pointer}
  .btn.sm{font-size:11.5px;padding:6px 12px}
  .btn.pri{background:var(--brand);color:#fff}
  .btn.ghost{background:var(--brand-weak);color:var(--brand-ink)}
  .btn.block{display:block;width:100%;padding:15px;font-size:15px;border-radius:14px}
  .btn.line{background:var(--surface);border:1px solid var(--line);color:var(--ink)}

  .chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:var(--pill)}
  .chip.g{background:var(--brand-weak);color:var(--brand-ink)}
  .chip.r{background:var(--danger-weak);color:var(--danger)}
  .chip.w{background:var(--warn-weak);color:var(--warn)}
  .chip.n{background:var(--line2);color:var(--sub)}

  .filters{display:flex;gap:7px;margin:2px 0 4px;overflow-x:auto}
  .filters::-webkit-scrollbar{display:none}
  .filters .f{flex:none;font-size:12.5px;font-weight:700;padding:8px 14px;border-radius:var(--pill);background:var(--surface);border:1px solid var(--line);color:var(--sub)}
  .filters .f.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  /* recipe detail */
  .hero{height:186px;border-radius:var(--r);background:
    radial-gradient(120% 120% at 20% 0%,#f6efe2,#eadfca);
    margin:-16px -16px 0;display:flex;align-items:flex-end;padding:16px;position:relative}
  .hero .big{position:absolute;top:34px;left:0;right:0;text-align:center;font-size:74px}
  .hero .tags{display:flex;gap:6px}
  .price-tot{display:flex;align-items:center;justify-content:space-between;background:var(--brand-weak);
    border-radius:var(--r-sm);padding:13px 15px;margin-top:12px}
  .price-tot .k{font-size:12.5px;color:var(--brand-ink);font-weight:700}
  .price-tot .v{font-size:18px;font-weight:800;color:var(--brand-ink)}
  ol.steps{list-style:none;counter-reset:s;margin-top:4px}
  ol.steps li{counter-increment:s;display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line2);font-size:13.5px;color:#3a3835}
  ol.steps li::before{content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}

  .cta-bar{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 16px;background:linear-gradient(transparent,var(--app) 22%)}
  .callout{background:var(--surface);border:1px dashed var(--brand);border-radius:var(--r-sm);padding:11px 13px;font-size:11.5px;color:var(--brand-ink);font-weight:600;margin-top:8px}
</style>

<div class="head">
  <h1>밀플래닝 — 화면 목업 v1 <span style="font-weight:600;color:var(--sub);font-size:15px">(스타일 확정용)</span></h1>
  <p>디자인 시스템 + 핵심 4화면. 톤: 토스(금액·여백)·컬리(카드)·당근(친근). 뉴트럴+그린 액센트, 진짜 위계 · AI틱 배제.</p>
</div>

  <figure>
  <div class="phone"><div class="screen">
    <div class="sb"><span class="num">9:41</span><span class="dots">●●● ▪ 100</span></div>
    <div class="appbar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" width="22"><path d="M15 5l-7 7 7 7" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>

    <div class="content" style="padding-bottom:96px">
      <div class="hero"><div class="big">🍲</div><div class="tags"><span class="chip g">보유 3</span><span class="chip r">부족 2</span></div></div>
      <div class="h1" style="margin-top:14px">돼지고기 김치찌개</div>
      <div class="lead">냉장고 대파·두부를 오늘 안에 · <span class="num">25분 · 2인분 · 쉬움</span></div>

      <div class="sec" style="margin-top:18px"><h2>재료 <span style="color:var(--faint);font-weight:600">2인 기준</span></h2><span class="more">인분 조절</span></div>
      <div class="row"><div class="th">🥩</div><div class="g"><div class="tt">돼지고기 300g</div><div class="ts"><span class="chip r" style="padding:2px 7px">부족</span> 마켓컬리 최저</div></div><div class="rt"><span class="price num">₩4,900</span></div></div>
      <div class="row"><div class="th">🥬</div><div class="g"><div class="tt">김치 1/4포기</div><div class="ts"><span class="chip r" style="padding:2px 7px">부족</span> 오아시스 최저</div></div><div class="rt"><span class="price num">₩3,300</span></div></div>
      <div class="row" style="opacity:.72"><div class="th">🧅</div><div class="g"><div class="tt">대파 1대</div><div class="ts"><span class="chip g" style="padding:2px 7px">보유</span> 냉장고 · D-1</div></div><div class="rt"><span class="chip n">보유</span></div></div>
      <div class="row" style="opacity:.72"><div class="th">🍚</div><div class="g"><div class="tt">두부 1/2모</div><div class="ts"><span class="chip g" style="padding:2px 7px">보유</span> 냉장고 · D-2</div></div><div class="rt"><span class="chip n">보유</span></div></div>

      <div class="price-tot"><span class="k">부족 재료 2개 합계</span><span class="v num">₩8,200</span></div>

      <div class="sec"><h2>조리 순서</h2></div>
      <ol class="steps">
