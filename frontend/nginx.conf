# frontend/nginx.conf — SPA 정적 서빙 + /api/* 리버스 프록시(게이트웨이 대체).
#   라우팅은 frontend/vite.config.ts(dev 프록시)와 1:1 동일 — 프론트 코드는 항상 /api/* 상대경로라 불변.
#   업스트림 = compose 서비스명(docker 내부 DNS 127.0.0.11 로 런타임 해석 → 재배포/재시작에도 502 최소화).
#   chat 은 compose 밖(별도 파이프라인, host:8001) → host.docker.internal 로 프록시.

server {
    listen 8080;                            # 비특권 포트 — K8s PSS restricted(NET_BIND_SERVICE 금지) 준수. compose 는 80:8080 매핑.
    server_name _;

    client_max_body_size 15m;               # 영수증 OCR 업로드 등 여유

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 프록시 공통 헤더 (Authorization 등 나머지 헤더는 기본 전달)
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # compose 내부 서비스는 변수 proxy_pass + resolver 로 "요청 시" 해석 → 컨테이너 재생성 IP 변동에 강함.
    # ($request_uri = 원본 경로+쿼리 그대로 → dev vite 프록시(무재작성)와 동일 동작)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── /api/* 라우팅 (구체적 경로 먼저 — nginx 는 최장 프리픽스 우선이라 순서 무관하나 가독성 유지) ──
    location /api/recipes/book   { set $u recipebook:8006; proxy_pass http://$u$request_uri; }
    location /api/recipes/mine   { set $u recipebook:8006; proxy_pass http://$u$request_uri; }  # 내 레시피(수동 등록)
    location /api/recipes/shared { set $u recipebook:8006; proxy_pass http://$u$request_uri; }  # 공개 공유 뷰
    location /api/recipes/extract { set $u video:8011;    proxy_pass http://$u$request_uri; }  # 영상→레시피(#24·#25)
    location /api/recipes        { set $u recipe:8001;     proxy_pass http://$u$request_uri; }

    location /api/mealplan/assistant { set $u chat:8003;      proxy_pass http://$u$request_uri; }

    location /api/mealplan      { set $u mealplan:8007;   proxy_pass http://$u$request_uri; }
    location /api/expenses      { set $u mealplan:8007;   proxy_pass http://$u$request_uri; }
    location /api/notifications { set $u notify:8008;     proxy_pass http://$u$request_uri; }
    location /api/pantry/ocr    { set $u ocr:8010;       proxy_pass http://$u$request_uri; }  # OCR 엔진(업로드/폴링) — 확정 /api/pantry/receipts 는 pantry
    location /api/pantry        { set $u pantry:8005;     proxy_pass http://$u$request_uri; }
    location /api/auth          { set $u account:8004;    proxy_pass http://$u$request_uri; }
    location /api/users         { set $u account:8004;    proxy_pass http://$u$request_uri; }
    location /api/prices        { set $u price:8002;      proxy_pass http://$u$request_uri; }

    # ── Prometheus용 FastAPI 메트릭 게이트웨이 ──
    # 개별 서비스 포트를 호스트에 공개하지 않고, fb-monitoring에서만 내부 /metrics를 조회한다.
    location = /internal/metrics/recipe {
        allow 192.168.0.11; deny all; access_log off;
        set $u recipe:8001; proxy_pass http://$u/metrics;
    }
    location = /internal/metrics/price {
        allow 192.168.0.11; deny all; access_log off;
        set $u price:8002; proxy_pass http://$u/metrics;
    }
    location = /internal/metrics/chat {
        allow 192.168.0.11; deny all; access_log off;
        set $u chat:8003; proxy_pass http://$u/metrics;
    }
    location = /internal/metrics/account {
        allow 192.168.0.11; deny all; access_log off;
        set $u account:8004; proxy_pass http://$u/metrics;
    }
    location = /internal/metrics/pantry {
        allow 192.168.0.11; deny all; access_log off;
        set $u pantry:8005; proxy_pass http://$u/metrics;
    }
    location = /internal/metrics/recipebook {
        allow 192.168.0.11; deny all; access_log off;
        set $u recipebook:8006; proxy_pass http://$u/metrics;
    }
    location = /internal/metrics/mealplan {
        allow 192.168.0.11; deny all; access_log off;
        set $u mealplan:8007; proxy_pass http://$u/metrics;
    }
    location = /internal/metrics/notify {
        allow 192.168.0.11; deny all; access_log off;
        set $u notify:8008; proxy_pass http://$u/metrics;
    }
    location = /internal/metrics/ocr {
        allow 192.168.0.11; deny all; access_log off;
        set $u ocr:8010; proxy_pass http://$u/metrics;
    }

    # nginx 자체 헬스체크 (compose healthcheck / 배포 스모크용)
    location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }

    # ── SPA ──
    root /usr/share/nginx/html;
    index index.html;

    # 해시된 정적 자산(빌드 산출물) 장기 캐시
    location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }

    # 클라이언트 라우팅(react-router) 폴백
    location / { try_files $uri $uri/ /index.html; }
}
