# 최저가 이상탐지 → 알림 fan-out (#9, ai-spec.md §2)
# 흐름: [CronJob 탐지배치] PG 가격이력 → z-score 탐지 → Kafka produce ─▶ price.anomaly.detected
#       ─▶ [mp-price-anomaly-notifier] consume → price.price_watch 역조회 → notify.notification(LOW_PRICE)
#
# ⚠️ 네이밍: 클러스터 실제 규약(`app` ns · `mp-` 프리픽스 · PodSecurity restricted)을 따른다.
#    같은 디렉터리의 retail-ingest.yaml / recipe-ingest.yaml 은 아직 구 규약(`fb-app` ns)이라
#    이전 단계에서 일괄 정합화가 필요하다(인수인계 문서 참조).
# ⚠️ 브로커 `auto.create.topics.enable=false` — 이 KafkaTopic 없이 배치를 돌리면 발행이 전량
#    미전달로 끝난다(실측 2026-07-29). 발행기가 DeliveryIncomplete 로 즉시 실패하게 되어 있다.
---
# ── Strimzi 토픽 (create_topics.py의 K8s 대체) ──
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: price.anomaly.detected
  namespace: kafka
  labels:
    strimzi.io/cluster: mp-kafka
spec:
  partitions: 1                          # 하루 최대 TOP_N=20건 — 파티션을 늘려도 컨슈머가 DB 쓰기에 묶인다
  replicas: 1                            # 단일 브로커(캡스톤). 운영은 3
  config:
    retention.ms: "604800000"            # 7d — 정본은 PG(notify.notification), Kafka는 트랜스포트
    cleanup.policy: delete
---
# ── 탐지 배치: 일 1회, 크롤 반영 이후 ──
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mp-price-anomaly-detect
  namespace: app
spec:
  schedule: "0 9 * * *"                  # UTC 09:00 = KST 18:00 (일 2회 크롤 모두 반영된 뒤)
  concurrencyPolicy: Forbid              # 겹침 방지 — 같은 관측일을 두 번 발행하지 않는다
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          securityContext:               # PodSecurity restricted
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: detect
              image: <ECR>/food-budget-app:latest
              # --emit 없이는 탐지만 하고 끝난다(dry-run). 알림은 되돌릴 수 없어 명시 플래그를 요구한다.
              command: ["python", "pipelines/ingest/detect_price_anomaly.py", "--emit"]
              envFrom:
                - configMapRef: {name: mp-kafka}    # KAFKA_BOOTSTRAP
                - secretRef: {name: mp-pg}          # PGHOST/PGPASSWORD 등
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 100m, memory: 128Mi}
                limits: {cpu: 500m, memory: 512Mi}
---
# ── fan-out 컨슈머: 관심 등록 유저에게만 알림 생성 ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp-price-anomaly-notifier
  namespace: app
spec:
  # replicas: 1 고정 — 탐지 배치가 하루 한 번 최대 20건만 발행해 스케일 대상이 아니다.
  # 다중 인스턴스여도 fan-out SQL이 INSERT..SELECT 한 방이라 중복은 나지 않는다(경쟁 안전).
  replicas: 1
  selector: {matchLabels: {app: mp-price-anomaly-notifier}}
  template:
    metadata: {labels: {app: mp-price-anomaly-notifier}}
    spec:
      terminationGracePeriodSeconds: 30  # SIGTERM → 커밋 후 종료(수동 커밋이라 재처리 최소화)
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: notifier
          image: <ECR>/food-budget-app:latest
          command: ["python", "pipelines/stream/consume_price_anomaly.py"]  # IDLE_EXIT 미설정=상주
          envFrom:
            - configMapRef: {name: mp-kafka}
            - secretRef: {name: mp-pg}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 200m, memory: 256Mi}
