# 최저가 이상탐지 → 알림 fan-out (#9, ai-spec.md §2) — **K8s 실 클러스터 규약 기준**
#
# 흐름: [CronJob mp-poller-price-anomaly] PG 가격이력 → z-score 탐지 → Kafka produce
#         ─▶ price.anomaly.detected
#         ─▶ [Deployment mp-price-anomaly-notifier] consume → price.price_watch 역조회
#            → notify.notification(LOW_PRICE)
#
# ── 이 파일의 성격 ─────────────────────────────────────────────────────────────
# 🔴 **매니페스트 정본은 이 레포가 아니다.** 라이브는 ArgoCD GitOps 이고 정본은
#    `happyInit/mealplanning-config` 레포다(Application `pipelines` · path `pipelines`).
#    AI 파트는 그 레포 권한이 없어(404) 직접 PR 할 수 없다.
#    → **이 파일은 그대로 복사해 넣을 수 있는 제안본**이다. 값은 발명하지 않고
#      **라이브 클러스터에서 실측해 추출**했다(2026-07-30). 인프라 요청 = 이슈 #381 요청 5.
#
# ── 2026-07-30 전면 개정 이유 ──────────────────────────────────────────────────
# 이전 버전은 이전 전 **추정 규약**으로 쓰여 그대로 적용하면 전부 실패했다:
#   KafkaTopic ns `kafka`/cluster `mp-kafka`  → 실제 ns `data`/cluster `kafka`
#   워크로드 ns `app`                          → 실제 `pipeline`
#   envFrom `mp-kafka`·`mp-pg`                 → 실제 `mp-pipeline-env`·`mp-pipeline-secrets`
#   image `<ECR>/food-budget-app:latest`       → 실제 `192.168.0.10/mealplanning/mp-data-pipeline:<sha>`
#   partitions/replicas 1                      → 실제 관례 3/3
#   UTC 스케줄                                  → 실제 `timeZone: Asia/Seoul`
#   `priorityClassName`·메트릭 포트 누락        → 스케줄링·스크레이프에서 누락
# **추정으로 매니페스트를 쓰면 안 된다**는 것이 이 개정의 교훈이다.
---
# ── Strimzi 토픽 ──────────────────────────────────────────────────────────────
# ⚠️ 브로커 `auto.create.topics.enable=false`(실측). 이 토픽이 없으면 발행이 성립하지 않는다.
#    조용히 유실되지는 않는다 — 발행기가 flush 후 미전달분에 `DeliveryIncomplete` 를 던진다.
# partitions 3 / replicas 3 / retention 7d = 기존 `retail.crawl.raw` 와 동일 관례(실측).
#   하루 TOP_N=20 건이라 1 파티션으로도 충분하지만, **다른 토픽과 다르게 두면 운영 규칙이
#   갈라진다** — 일관성을 택했다.
apiVersion: kafka.strimzi.io/v1   # ⚠️ v1beta2 는 더 이상 served 되지 않는다(실측: CRD served=v1 만)
kind: KafkaTopic
metadata:
  name: price.anomaly.detected
  namespace: data
  labels:
    strimzi.io/cluster: kafka
spec:
  partitions: 3
  replicas: 3
  config:
    retention.ms: 604800000               # 7d — 정본은 PG(notify.notification), Kafka 는 트랜스포트
---
# ── 탐지 배치 ─────────────────────────────────────────────────────────────────
# 스케줄 근거: 컬리 03:30 · 오아시스 04:10 KST → **두 소스가 모두 들어온 뒤** 04:40 KST 1회.
#   (13:10 오아시스 회차는 다음날 배치가 흡수. 소스별 기준선이라 한쪽만 늦어도 왜곡 없음.)
# ⚠️ 성숙도 게이트(`MATURE_SAMPLES=28`)로 2026-08-18 까지 발행 0건 → **그전까지 사실상 무동작**이고
#    이력이 쌓이면 자동으로 발행이 시작된다. 미리 넣어두는 것이 안전하다.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mp-poller-price-anomaly
  namespace: pipeline
spec:
  schedule: "40 4 * * *"
  timeZone: Asia/Seoul                    # 라이브 전 CronJob 이 KST 명시(UTC 환산 실수 방지)
  concurrencyPolicy: Forbid               # 같은 관측일을 두 번 발행하지 않는다
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  suspend: false
  jobTemplate:
    spec:
      backoffLimit: 0                     # 라이브 관례 — 재시도로 중복 발행되는 것을 막는다
      template:
        metadata:
          labels:
            app: poller-price-anomaly     # 라벨에는 mp- 프리픽스를 붙이지 않는다(라이브 관례)
        spec:
          restartPolicy: Never
          priorityClassName: pipeline-low
          securityContext:                # PodSecurity — pipeline ns 는 enforce=baseline·warn/audit=restricted.
            # 라이브 파이프라인 워크로드들은 securityContext 가 비어 있어 restricted 경고가 난다.
            # 새로 넣는 것은 처음부터 목표 수준(restricted)에 맞춘다 — 비용 0이고 dry-run 경고도 사라진다.
            runAsNonRoot: true
            runAsUser: 10001              # 이미지가 비루트 uid 10001 로 실행된다(Dockerfile 공통 명세 §3.1)
            runAsGroup: 10001
            seccompProfile: {type: RuntimeDefault}
          terminationGracePeriodSeconds: 30
          containers:
            - name: poller-price-anomaly
              image: 192.168.0.10/mealplanning/mp-data-pipeline:ffda23d3f4b8c9f232cd1e584d2694a046f5a95b
              imagePullPolicy: IfNotPresent
              # ⚠️ `--emit` 은 `--persist` 를 함의한다 — 근거 없이 알림만 나가면 "왜 급락인가"에
              #    답할 수 없고 오탐률도 사후 측정할 수 없다.
              command: ["python", "pipelines/ingest/detect_price_anomaly.py", "--emit"]
              envFrom:
                - configMapRef: {name: mp-pipeline-env}      # PGHOST=pg-rw.data.svc · KAFKA_BOOTSTRAP
                - secretRef: {name: mp-pipeline-secrets}     # PGPASSWORD 등
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true   # 스크립트는 디스크에 쓰지 않는다(결과는 PG/Kafka)
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {memory: 512Mi}                      # 라이브 관례: cpu limit 없음
---
# ── fan-out 컨슈머 ────────────────────────────────────────────────────────────
# replicas 1 — 탐지가 하루 한 번 최대 20건만 발행해 스케일 대상이 아니다. 다중이어도 fan-out 이
#   `INSERT ... SELECT` 한 방이고 `price_alert_sent` PK 가 있어 중복은 나지 않는다.
# ⚠️ METRICS_PORT 와 `ports.name: metrics` 가 있어야 PodMonitor 가 스크레이프한다.
#    9407 = 기존 컨슈머 번호 체계(retail 9401 · deal 9402 · recipe 9403 …)의 다음 자리.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp-price-anomaly-notifier
  namespace: pipeline
  labels:
    app: price-anomaly-notifier
spec:
  replicas: 1
  selector:
    matchLabels:
      app: price-anomaly-notifier
  template:
    metadata:
      labels:
        app: price-anomaly-notifier
    spec:
      priorityClassName: pipeline-low
      terminationGracePeriodSeconds: 30   # SIGTERM → 커밋 후 종료(수동 커밋이라 재처리 최소화)
      securityContext:            # PodSecurity — pipeline ns 는 enforce=baseline·warn/audit=restricted.
        # 라이브 파이프라인 워크로드들은 securityContext 가 비어 있어 restricted 경고가 난다.
        # 새로 넣는 것은 처음부터 목표 수준(restricted)에 맞춘다 — 비용 0이고 dry-run 경고도 사라진다.
        runAsNonRoot: true
        runAsUser: 10001          # 이미지가 비루트 uid 10001 로 실행된다(Dockerfile 공통 명세 §3.1)
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: price-anomaly-notifier
          image: 192.168.0.10/mealplanning/mp-data-pipeline:ffda23d3f4b8c9f232cd1e584d2694a046f5a95b
          imagePullPolicy: IfNotPresent
          command: ["python", "pipelines/stream/consume_price_anomaly.py"]   # IDLE_EXIT 미설정=상주
          env:
            - name: METRICS_PORT
              value: "9407"
          envFrom:
            - configMapRef: {name: mp-pipeline-env}
            - secretRef: {name: mp-pipeline-secrets}
          ports:
            - name: metrics
              containerPort: 9407
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true   # 스크립트는 디스크에 쓰지 않는다(결과는 PG/Kafka)
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
---
# ── PodMonitor 확장 — **새 리소스가 아니라 기존 것을 고쳐야 한다** ─────────────────
# 라이브 `pipeline/mp-pipeline-consumers` PodMonitor 는 `app in (...)` 목록으로 대상을 고른다.
# 새 컨슈머를 목록에 넣지 않으면 **메트릭이 조용히 수집되지 않는다**(파드는 정상이라 아무도 모른다).
#
#   spec.selector.matchExpressions[0].values:
#     - retail-refiner
#     - deal-notifier
#     - recipe-refiner
#     - user-event-sink
#     - price-anomaly-notifier      # ← 이 줄을 추가
#
# 임시 확인용(GitOps 정본이 아니라 손으로 볼 때만):
#   kubectl -n pipeline patch podmonitor mp-pipeline-consumers --type=json \
#     -p '[{"op":"add","path":"/spec/selector/matchExpressions/0/values/-","value":"price-anomaly-notifier"}]'
