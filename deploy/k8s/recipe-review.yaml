# 만개 요리후기 수집 (#10 감정분석·요약의 입력) — **K8s 실 클러스터 규약 기준**
#
# 흐름: recipe(source='10K') 대상 조회 → 상세 HTML 파싱 → PG 직접 적재
#         · recipe_review        원문(닉네임 미수집 — 감정분류·요약에 안 쓰이는 개인정보)
#         · recipe_review_crawl  시도 결과(재시도·멱등 판정)
#       Kafka 를 경유하지 않는다 — 후처리(정규화·매칭)가 없어 컨슈머가 불필요하다.
#
# 🔴 매니페스트 정본은 `happyInit/mealplanning-config`(Application `pipelines`)다.
#    이 파일은 **그대로 복사해 넣을 수 있는 제안본**이고, 값은 라이브에서 실측 추출했다(2026-07-30).
#
# ⚠️ **선행 조건: 이미지에 이 스크립트가 아직 없다.**
#    라이브 `mp-data-pipeline` 파드 실측 결과 `crawler/10k_recipe/review_crawler.py` 부재.
#    → 코드 병합 후 Jenkins 빌드로 새 :sha 가 나오면 아래 image 를 그 값으로 핀할 것.
#    (파이프라인 트랙은 CD 자동 핀 대상이 아니다 — config 오버레이가 앱 워크로드만 있다.)
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mp-poller-recipe-review
  namespace: pipeline
spec:
  # 일·수 06:00 KST — `mp-poller-recipe`(05:00 KST, 0 5 * * 0,3)가 새 레시피를 잡은 **뒤**여야
  # 그 레시피의 후기를 수집할 수 있다. 같은 요일에 1시간 뒤로 붙였다.
  # ⚠️ `mp-poller-es-recipes`(06:30 KST 일·수)까지 30분 창이다. 증분은 수십 건이라 충분하나
  #    전량 재수집(2026-07-29 에 6,873 레시피·141,298건 수동 완주) 시에는 겹친다 → 그때는 수동 실행.
  schedule: "0 6 * * 0,3"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid               # 겹치면 같은 레시피를 두 번 긁는다(멱등이지만 낭비)
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  suspend: false
  jobTemplate:
    spec:
      backoffLimit: 0                     # 라이브 관례. 실패분은 `--retry-failed` 로 다음 회차가 잡는다
      template:
        metadata:
          labels:
            app: poller-recipe-review
        spec:
          restartPolicy: Never
          priorityClassName: pipeline-low
          securityContext:                # PodSecurity — pipeline ns 는 enforce=baseline·warn/audit=restricted.
            # 라이브 파이프라인 워크로드들은 securityContext 가 비어 있어 restricted 경고가 난다.
            # 새로 넣는 것은 처음부터 목표 수준(restricted)에 맞춘다 — 비용 0이고 dry-run 경고도 사라진다.
            runAsNonRoot: true
            runAsUser: 10001              # 이미지가 비루트 uid 10001 로 실행된다(Dockerfile 공통 명세 §3.1)
            runAsGroup: 10001
            seccompProfile: {type: RuntimeDefault}
          terminationGracePeriodSeconds: 30
          containers:
            - name: poller-recipe-review
              image: 192.168.0.10/mealplanning/mp-data-pipeline:ffda23d3f4b8c9f232cd1e584d2694a046f5a95b
              imagePullPolicy: IfNotPresent
              # 인자 없음 = 증분(미수집 레시피만). `(recipe_id, seq)` upsert 라 재실행 안전.
              command: ["python", "crawler/10k_recipe/review_crawler.py"]
              envFrom:
                - configMapRef: {name: mp-pipeline-env}      # PGHOST=pg-rw.data.svc
                - secretRef: {name: mp-pipeline-secrets}     # PGPASSWORD
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true   # 스크립트는 디스크에 쓰지 않는다(결과는 PG/Kafka)
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                # 상세 HTML 을 레시피 단위로 파싱한다(누적 보관 없음) → 512Mi 로 충분.
                # 2026-07-29 전량 완주(141,298건) 때도 메모리 문제는 없었다.
                limits: {memory: 512Mi}
