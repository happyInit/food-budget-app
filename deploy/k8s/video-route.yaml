# 영상→레시피 추출 서비스 노출 (#11) — HTTPRoute + Service
#
# ── 왜 이 파일이 필요한가 ──────────────────────────────────────────────────────
# 🔴 **이미지를 만들고 워크로드를 배포해도 라우팅이 먼저 막는다.** 라이브 실측:
#
#     mp-recipe-route      /api/recipes                                    -> recipe:8001
#     mp-recipebook-route  /api/recipes/book /api/recipes/mine /...shared  -> recipebook:8006
#
# `/api/recipes` 프리픽스가 `recipe:8001` 을 잡고 있고 그 서비스에는
# `/api/recipes` · `/api/recipes/{id}` · `/health` 세 경로만 있다(라이브 OpenAPI 확인).
# 따라서 프론트 `YoutubeExtract.tsx` 가 부르는 `/api/recipes/extract` 는 **계속 404** 다.
#
# **새 패턴이 아니다** — `mp-recipebook-route` 가 이미 같은 방식으로 하위 경로를 떼내고 있다.
# Gateway API 는 더 구체적인 경로 프리픽스가 우선한다.
#
# 🔴 매니페스트 정본은 `happyInit/mealplanning-config` 다. 이 파일은 복사용 제안본이며
#    값은 라이브 `mp-recipebook-route` 에서 추출했다(2026-07-30). 인프라 요청 = #381 요청 6·7.
#
# ── 선행 조건 3개 (하나라도 없으면 404 그대로) ──────────────────────────────────
#   1. 🔴 **이미지가 존재하지 않는다** — Harbor `mealplanning/mp-video-service` = NOT_FOUND.
#      원인은 Jenkinsfile 카탈로그 누락이었고 **2026-07-30 에 엔트리를 추가**했다.
#      → 병합 후 Jenkins 빌드가 돌면 이미지가 생긴다.
#   2. config 레포에 `services/video/overlays/onprem` 오버레이 — 없으면 CD 스테이지가
#      *"config 오버레이 없음(스킵 — 앱 워크로드 아님)"* 으로 건너뛰어 **자동배포가 안 된다**.
#   3. 이 HTTPRoute + Service + Deployment.
---
apiVersion: v1
kind: Service
metadata:
  name: video
  namespace: app
  labels:
    app: mp-video
spec:
  # 서비스명은 `mp-` 없이 짧게 — 라이브 관례(ocr·price·recipe·pantry …).
  # 다른 서비스가 클러스터 DNS 로 `http://video:8011` 로 부를 수 있다.
  selector:
    app: mp-video
  ports:
    - name: http
      port: 8011
      targetPort: 8011
      protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mp-video-route
  namespace: app
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: mp-gw-public
      sectionName: https            # 라이브 전 라우트가 https 섹션에 붙는다(http 는 리다이렉트 전용)
  rules:
    - matches:
        # 접수(POST /api/recipes/extract)와 폴링(GET /api/recipes/extract/{job_id})이
        # 같은 프리픽스라 한 줄로 덮인다. 프론트는 202 접수 후 2초 간격 폴링을 한다.
        - path:
            type: PathPrefix
            value: /api/recipes/extract
      backendRefs:
        - group: ""
          kind: Service
          name: video
          port: 8011
          weight: 1
---
# ── ExternalSecret (신규) ─────────────────────────────────────────────────────
# api_key 모드용 영상 전용 키. **OCR·챗과 분리**한다 — 비용을 서비스별로 구분하기 위해서다.
# 🔴 `fb-secrets/app-secrets` 에 `VIDEO_GEMINI_API_KEY` 속성 추가가 선행돼야 한다(현재 없음).
#    Vertex 전환 시에는 이 키가 불필요해진다(ADC 사용) — 그때 이 시크릿은 롤백 경로용으로만 남는다.
apiVersion: external-secrets.io/v1            # ⚠️ v1beta1 은 이 클러스터에서 served=false
kind: ExternalSecret
metadata:
  name: mp-video-secrets
  namespace: app
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fb-kubernetes
  target:
    name: mp-video-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: VIDEO_GEMINI_API_KEY
      remoteRef: {key: app-secrets, property: VIDEO_GEMINI_API_KEY}
---
# ── Deployment ────────────────────────────────────────────────────────────────
# ⚠️ **이미지 태그는 CD 가 핀한다.** config 레포 오버레이에서 `kustomize edit set image` 로
#    `:sha` 가 박힌다. 여기 적힌 태그는 자리표시일 뿐이며, 오버레이에 넣는 순간 CD 가 덮는다.
# replicas 는 자유롭게 늘려도 된다 — #299 에서 replica-safe 확정(잡 상태가 Redis 에 있어
#   OCR 과 달리 파드 로컬 상태가 없다). HPA 도 가능.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp-video
  namespace: app
  labels:
    app: mp-video
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mp-video
  template:
    metadata:
      labels:
        app: mp-video
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:                      # app ns 는 PodSecurity **enforce=restricted**
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: video
          image: 192.168.0.10/mealplanning/mp-video-service:latest   # ← CD 가 :sha 로 덮는다
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8011, protocol: TCP}
          envFrom:
            - configMapRef: {name: app-common}      # PG*·ES*·Redis 공통
            - secretRef: {name: mp-video-secrets}
          env:
            - {name: OTEL_SERVICE_NAME, value: "video"}
            # ⚠️ **`-latest` 별칭 금지**(PR #272 — 별칭 드리프트로 OCR 전량 400 실패 이력).
            - {name: VIDEO_EXTRACT_MODEL, value: "gemini-3.5-flash-lite"}
            - {name: VIDEO_RETRY_MODEL,   value: "gemini-3.5-flash"}
            - {name: VIDEO_REFINE_ENABLED, value: "false"}           # 기본 OFF — 비용
            # ── Vertex 전환 시(#381 요청 1·2 와 동일 규약. OCR 과 **독립 전환** 가능) ──
            - {name: VIDEO_GENAI_BACKEND, value: "api_key"}          # vertex 로 바꾸면 전환
            - {name: GCP_PROJECT_ID, value: ""}                      # vertex 시 mealplanning-503911
            - {name: GCP_LOCATION,   value: ""}                      # vertex 시 global
            - {name: GOOGLE_APPLICATION_CREDENTIALS, value: ""}      # vertex 시 /etc/gcp/gcp-sa.json
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            # Vertex 전환 시 주석 해제(gcp-sa-secret.yaml 의 mp-gcp-sa)
            # - {name: gcp-sa, mountPath: /etc/gcp, readOnly: true}
          livenessProbe:
            httpGet: {path: /health, port: 8011}
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /health, port: 8011}
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}         # Gemini 클라 + 잡 상태 직렬화 여유
      volumes:
        - {name: tmp, emptyDir: {}}
        # - name: gcp-sa
        #   secret: {secretName: mp-gcp-sa, defaultMode: 0444}   # 0400 아님 — 비root(10001)가 읽어야 함
