# 리뷰 감정분석·요약 파이프라인 (#10) — **K8s 실 클러스터 규약 기준**
#
# 흐름(순서가 중요하다): 수집 → 감정분류 → LLM 요약 → 템플릿 채움
#   recipe-review.yaml (일·수 06:00 KST)  수집
#     └─ 07:00  score-review-sentiment   미분류 리뷰 → recipe_review_sentiment (nova-micro)
#         └─ 08:00  summarize-reviews    리뷰 10건+ 레시피 → summary·caution (claude-3-5-sonnet)
#             └─ 09:00  fill-summary-template  10건 미만 → 집계 문장(비용 0)
#
# 세 배치 모두 **증분·멱등**이라 겹치거나 재실행돼도 안전하다(실측 확인):
#   score      : `LEFT JOIN recipe_review_sentiment ... IS NULL` → 미분류만
#   summarize  : `summary IS NULL OR summary_kind='template'`     → 없는 것 + 템플릿 승격
#   template   : `review_count < 10` 만                            → LLM 대상과 경계가 SQL 로 못박힘
#
# 🔴 매니페스트 정본은 `happyInit/mealplanning-config`(Application `pipelines`)다.
#    이 파일은 복사용 제안본이며 값은 라이브에서 추출했다(2026-07-30).
#
# ══════════════════════════════════════════════════════════════════════════════
# 🔴🔴 **선행 블로커 2건 — 지금 적용하면 전부 실패한다** (실측 2026-07-30)
# ══════════════════════════════════════════════════════════════════════════════
#
# ① **`boto3` 가 이미지에 없다.** 라이브 `mp-data-pipeline` 파드에서 `import boto3` 실패.
#    `pipelines/ingest/requirements.txt` 에 추가했으므로 **재빌드하면 해소**된다.
#    (로컬에서만 돌려봤기 때문에 이 결손이 드러나지 않았다.)
#
# ② **클러스터에 AWS 자격증명이 없다.** `mp-pipeline-secrets` 키 = PGPASSWORD · ES_PASSWORD ·
#    DATA_GO_KR_SERVICE_KEY · REPORT_GEMINI_API_KEY 뿐이고, 원본 `fb-secrets/app-secrets` 에도
#    AWS/BEDROCK 계열 키가 없다. → **인프라 요청 필요**(#301 항목 2 와 같은 건).
#    온프렘이라 IRSA 를 쓸 수 없어 **access key 를 ESO 로 주입**해야 한다. 필요한 것:
#
#      fb-secrets/app-secrets 에 추가:  AWS_ACCESS_KEY_ID · AWS_SECRET_ACCESS_KEY
#      mp-pipeline-secrets ExternalSecret 에 두 키 매핑 추가
#      IAM 최소권한:  bedrock:InvokeModel  (리전 ap-northeast-2 / apac 크로스리전 프로필)
#
#    자격증명이 없어도 **파이프라인의 다른 부분은 무해**하다 — 이 세 CronJob 만 실패한다.
#    그래서 아래는 `suspend: true` 로 두었다. **자격증명이 준비되면 false 로 바꾼다.**
#
# ── 비용 (승인된 실측치) ────────────────────────────────────────────────────────
# 2026-07-29 전량 1회: LLM 요약 2,189건 ≈ 19,000원 · 주의사항 636건 ≈ 2,000원 · 템플릿 0원.
# 증분 운영은 신규 레시피분(주당 수십 건)이라 **월 수백 원 규모**다.
---
# ── 1) 감정분류 — nova-micro, 배치 20건/호출 ────────────────────────────────────
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mp-score-review-sentiment
  namespace: pipeline
spec:
  schedule: "0 7 * * 0,3"                 # 수집(06:00 일·수) 1시간 뒤
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  suspend: true                           # 🔴 AWS 자격증명 준비 후 false
  jobTemplate:
    spec:
      backoffLimit: 0                     # 증분이라 다음 회차가 남은 것을 잡는다
      template:
        metadata:
          labels:
            app: score-review-sentiment
        spec:
          restartPolicy: Never
          priorityClassName: pipeline-low
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile: {type: RuntimeDefault}
          terminationGracePeriodSeconds: 30
          containers:
            - name: score-review-sentiment
              image: 192.168.0.10/mealplanning/mp-data-pipeline:ffda23d3f4b8c9f232cd1e584d2694a046f5a95b
              imagePullPolicy: IfNotPresent
              command: ["python", "pipelines/ingest/score_review_sentiment.py"]
              envFrom:
                - configMapRef: {name: mp-pipeline-env}
                - secretRef: {name: mp-pipeline-secrets}   # 🔴 AWS_* 키가 여기 추가돼야 한다
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {memory: 512Mi}
---
# ── 2) LLM 요약 — claude-3-5-sonnet ────────────────────────────────────────────
# 모델 선정 근거: 후보 5종 실측에서 **존댓말 지시 준수**가 판정을 갈랐다(nova-micro 1/8 ·
# haiku-4.5 0/8 탈락 · sonnet-3.5 8/8 채택). 요약문은 유저에게 그대로 보이는 문장이다.
# ⚠️ 프롬프트로 고칠 수 없었다 — 제약을 늘리면 소형 모델이 다른 제약을 놓쳤다.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mp-summarize-reviews
  namespace: pipeline
spec:
  schedule: "0 8 * * 0,3"                 # 감정분류(07:00) 뒤 — 분포 주입이 분류 결과를 쓴다
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  suspend: true                           # 🔴 AWS 자격증명 준비 후 false
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: summarize-reviews
        spec:
          restartPolicy: Never
          priorityClassName: pipeline-low
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile: {type: RuntimeDefault}
          terminationGracePeriodSeconds: 30
          containers:
            - name: summarize-reviews
              image: 192.168.0.10/mealplanning/mp-data-pipeline:ffda23d3f4b8c9f232cd1e584d2694a046f5a95b
              imagePullPolicy: IfNotPresent
              command: ["python", "pipelines/ingest/summarize_reviews.py"]
              envFrom:
                - configMapRef: {name: mp-pipeline-env}
                - secretRef: {name: mp-pipeline-secrets}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {memory: 512Mi}
---
# ── 3) 템플릿 채움 — 비용 0, 자격증명 불필요 ───────────────────────────────────
# 리뷰 10건 미만 레시피(전체의 68%)는 LLM 대상이 아니라 **화면에 빈칸**이 생긴다.
# LLM 을 쓰면 정보가 줄고 비용이 배로 뛴다 → 집계 기반 템플릿으로 채운다. 창작이 없어 검증 불필요.
# ✅ **이 잡만은 지금 적용해도 동작한다** — AWS·boto3 를 쓰지 않는다(PG 만 접근).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mp-fill-summary-template
  namespace: pipeline
spec:
  schedule: "0 9 * * 0,3"                 # 요약(08:00) 뒤 — LLM 이 채운 것을 덮지 않도록 나중에
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  suspend: false                          # ✅ 자격증명 불필요 — 바로 켤 수 있다
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: fill-summary-template
        spec:
          restartPolicy: Never
          priorityClassName: pipeline-low
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile: {type: RuntimeDefault}
          terminationGracePeriodSeconds: 30
          containers:
            - name: fill-summary-template
              image: 192.168.0.10/mealplanning/mp-data-pipeline:ffda23d3f4b8c9f232cd1e584d2694a046f5a95b
              imagePullPolicy: IfNotPresent
              command: ["python", "pipelines/ingest/fill_summary_template.py"]
              envFrom:
                - configMapRef: {name: mp-pipeline-env}
                - secretRef: {name: mp-pipeline-secrets}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {memory: 512Mi}
