# mp-ocr → Vertex AI 전환 **kustomize 패치** (#381 요청 2)
#
# ⚠️ **단독 `kubectl apply` 대상이 아니다.** 부분 Deployment 라서 그대로 적용하면
#    `spec.selector: Required value` · `image: Required value` 로 실패한다(실측 확인).
#    config 레포 `services/ocr/overlays/onprem/kustomization.yaml` 의 patches 에 등록한다:
#
#      patches:
#        - path: patch-mp-ocr-vertex.yaml
#
# 선행: `deploy/k8s/gcp-sa-secret.yaml` 의 ExternalSecret `mp-gcp-sa` 가 먼저 있어야 한다.
#
# ── 주의 2건 (그냥 쓰면 막히는 지점) ───────────────────────────────────────────
# ⚠️ **`defaultMode: 0444` 여야 한다.** mp-ocr 은 `runAsNonRoot: true` · uid 10001 로 도는데
#    Secret 볼륨 파일은 `fsGroup` 이 없으면 `root:root` 소유다. `0400`(소유자만 읽기)이면
#    **파드가 자기 키를 읽지 못해 ADC 가 실패한다.** 시크릿 tmpfs 는 해당 파드에만 보이므로
#    0444 의 실질 노출 범위는 0400 과 같다.
# ⚠️ **컨테이너명 `ocr`** 이 라이브 값과 일치해야 병합된다(다르면 새 컨테이너가 추가된다).
#
# ── 리전 `global` — ✅ 팀 승인된 결정이다 (2026-07-30) ─────────────────────────
# **영수증 이미지가 국내 리전 밖에서 처리되는 것을 수용**한 결정이다.
# 레지던시를 포기한 것이 아니라 **채택 모델이 리전 엔드포인트에 아직 배치되지 않아** 선택지가
# 없었다 — 실측: `asia-northeast3`(서울)·도쿄·`us-central1` 전부 **404**, `global` 만 응답.
# 모델이 없는 게 아니라(존재 확인됨) 리전에서 서브되지 않는 상태다(2026-07-21 출시분).
#
# 서울 고정은 "+10% 할증" 문제가 아니라 **모델을 구세대로 낮춰야 하는** 문제다 → 채택 근거
# (실물 13장·성공률 92%·0.45원/장)가 전면 무효가 되어 재벤치마크가 선행된다.
#
# **재검토 트리거**: 서울에 배치되면 이 값 한 줄만 바꾸면 된다(코드 변경 없음). 확인법:
#   genai.Client(vertexai=True, project=..., location="asia-northeast3") \
#        .models.get(model="gemini-3.5-flash-lite")     # 200 이면 재검토 가능
# 상세·비교 기준 = `docs/gcp-migration-plan.md` §7-1
#
# ⚠️ **기본값을 두지 않은 이유**: 리전이 레지던시를 결정하므로 코드가 조용히 아무 리전에 붙어선
#    안 된다(미지정이면 기동 실패). 승인된 값이라도 **명시적으로** 적어야 한다.
#
# ── 전환 후 확인 (1분) ─────────────────────────────────────────────────────────
#   kubectl -n app exec deploy/mp-ocr -- python -c \
#     "from app.config import settings as s; print(s.genai_backend, s.gcp_location, s.gemini_model)"
#   kubectl -n app create job --from=cronjob/mp-ocr-config-canary canary-once
#
# ── 롤백 ──────────────────────────────────────────────────────────────────────
# **env 한 줄이다.** `GENAI_BACKEND=api_key` 로 되돌리면 즉시 기존 개인키 경로로 복귀한다.
# 현행 경로를 지우지 않고 토글로 만든 것이 이 설계의 전제다(`OCR_BACKEND` 와 같은 패턴).
#   단 egress 허용목록을 도입했다면 `generativelanguage.googleapis.com` 이 살아 있어야 한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp-ocr
  namespace: app
spec:
  template:
    spec:
      volumes:
        - name: gcp-sa
          secret:
            secretName: mp-gcp-sa
            defaultMode: 0444
      containers:
        - name: ocr
          env:
            - {name: GENAI_BACKEND,  value: "vertex"}
            - {name: GCP_PROJECT_ID, value: "mealplanning-503911"}
            - {name: GCP_LOCATION,   value: "global"}
            - {name: GOOGLE_APPLICATION_CREDENTIALS, value: "/etc/gcp/gcp-sa.json"}
          volumeMounts:
            - {name: gcp-sa, mountPath: /etc/gcp, readOnly: true}
