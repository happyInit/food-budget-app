# 데이터 불변식 점검 — **다음 결함을 손이 아니라 배치가 찾게 한다**
#
# ── 왜 필요한가 ────────────────────────────────────────────────────────────────
# 2026-07-30 에 유저에게 보이던 결함 4건을 고쳤는데 **넷 다 손으로 훑다가** 발견했다
# (식비 조용한 증발 · FK 크래시루프 · 색상어가 재료로 표시 · 빈 재료 줄 1,143 레시피).
# 유형별 전수 조사 결과 세 유형 모두 거의 소진됐으므로, 남은 문제는 "더 있느냐"가 아니라
# **"다음 것을 어떻게 발견하느냐"** 다. `preflight.sql` 은 DDL 전 1회용이고 주기 점검이 없었다.
#
# ── 🔴 하드/소프트를 나눈 이유 ─────────────────────────────────────────────────
# 후보를 운영 데이터로 먼저 재보니 **두 개는 불변식이 아니었다**:
#   · `expire_at < created_at`(11건) — 유저가 직접 수정 가능(_PATCH_COLS)하므로 정당
#   · `(item,storage)` 중복 source(3건) — 전부 item_id NULL 이라 조회에 영향 없음
# 가짜 실패가 섞이면 사람이 경보를 무시하고 **진짜가 가려진다**(mp-chat-insights 가 정상 스킵에
# exit 2 를 써서 매일 Error 파드를 만들던 것과 같은 실패 유형). → 하드는 **0 인 것만**.
#
# 실측(2026-07-30): 하드 6개 전부 0 · 소프트 11/149/360/16.
#
# 🔴 매니페스트 정본은 `happyInit/mealplanning-config`(Application `pipelines`)다 — 복사용 제안본.
# ⚠️ 선행: 라이브 이미지에 이 스크립트가 아직 없다 → 병합·빌드 후 새 :sha 로 핀.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mp-data-invariants
  namespace: pipeline
spec:
  # 주 1회 월요일 06:00 KST — 주말 배치(리뷰 수집·요약)가 끝난 뒤에 본다.
  schedule: "0 6 * * 1"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 5      # 실패 이력을 더 남긴다 — 이게 결함 신호다
  suspend: false
  jobTemplate:
    spec:
      backoffLimit: 0            # 읽기 전용이라 재시도 의미 없음
      template:
        metadata:
          labels:
            app: data-invariants
        spec:
          restartPolicy: Never
          priorityClassName: pipeline-low
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile: {type: RuntimeDefault}
          terminationGracePeriodSeconds: 30
          containers:
            - name: data-invariants
              image: 192.168.0.10/mealplanning/mp-data-pipeline:ffda23d3f4b8c9f232cd1e584d2694a046f5a95b
              imagePullPolicy: IfNotPresent
              # 읽기 전용 — SELECT 만 한다. 종료 0=통과 · 1=하드 위반 · 2=접속 실패
              command: ["python", "pipelines/ingest/data_invariants.py"]
              envFrom:
                - configMapRef: {name: mp-pipeline-env}
                - secretRef: {name: mp-pipeline-secrets}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {memory: 256Mi}
---
# ── 알림 연결 (권장) ───────────────────────────────────────────────────────────
