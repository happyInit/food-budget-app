# OCR 모델 드리프트 카나리 — 주 1회 "운영 config 가 여전히 수용되는가"만 검사
#
# ── 왜 필요한가 ────────────────────────────────────────────────────────────────
# `-latest` 별칭 드리프트로 `thinking_config` 가 거부돼 OCR 이 전량 400 실패한 사고가 있다(PR #272).
# 그래서 팀 규칙은 **모델 버전 핀**인데, **Vertex AI 에서는 핀을 강제할 수단이 없다**:
#     api_key  models.get() → version = 3.5-flash-lite-07-2026   (날짜 빌드 노출)
#     vertex   models.get() → version = default                  (가려짐)
# 날짜 접미 ID(`-07-2026`·`-072026`·`@07-2026`·`-001`)는 Vertex 에서 **전부 404**(실측 배제).
# 남은 방어는 **드리프트를 사후에라도 빨리 아는 것** 뿐이다.
#
# ── 무엇을 검사하지 않는가 (설계의 핵심) ─────────────────────────────────────────
# 출력을 스냅샷과 비교하는 카나리는 **오탐만 낸다.** `temperature=0` 이어도 결과가 실행마다
# 흔들린다는 것을 실측했다(같은 영수증 8회에 품목 수·가격이 갈렸다). 따라서 품목·금액은
# 판정 근거로 쓰지 않고, **결정적인 것만** 본다 — ①운영 config 수용 여부 ②JSON 파싱 여부.
#
# ── 왜 ocr 이미지인가 ──────────────────────────────────────────────────────────
# 🔴 처음 `pipelines/monitor/` 에 뒀는데 **그 위치로는 운영에서 실행이 불가능하다.**
#    `mp-data-pipeline` 이미지는 `pipelines/`·`crawler/`·`ml/chat-insights/` 만 COPY 하고
#    **`services/` 를 담지 않는다**(라이브 파드 실측: `/app/services` 없음).
#    카나리는 `app.config`·`app.pipeline.backend.vision` 을 임포트하므로 ocr 이미지에 실려야 한다.
#    → 스크립트를 `services/ocr/app/config_canary.py` 로 옮겼다. 검사 대상과 같은 이미지에
#      있는 것이 맞기도 하다 — **운영이 쓰는 그 코드로 검사해야** 의미가 있다.
#
# 🔴 매니페스트 정본은 `happyInit/mealplanning-config`(Application `mp-ocr` 계열)다.
#    이 파일은 복사용 제안본이며 값은 라이브 `mp-ocr` Deployment 에서 추출했다(2026-07-30).
#
# ⚠️ 선행: 라이브 ocr 이미지에 `app/config_canary.py` 가 아직 없다(미커밋). 병합·빌드 후
#    아래 image 를 새 :sha 로 핀할 것. 앱 트랙은 CD 가 자동으로 핀한다.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mp-ocr-config-canary
  namespace: app
spec:
  schedule: "15 5 * * 1"                  # 월 05:15 KST — 주간 1회. 트래픽 한가한 시각
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 5               # 실패 이력을 조금 더 남긴다 — 이게 유일한 드리프트 신호다
  suspend: false
  jobTemplate:
    spec:
      # 1 = 일시적 네트워크 오류로 인한 오탐을 한 번 흡수. 종료코드 2(설정/자격증명 오류)와
      # 1(드리프트)을 스크립트가 구분하므로, 재시도해도 진짜 드리프트는 계속 실패로 남는다.
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: ocr-config-canary
        spec:
          restartPolicy: Never
          terminationGracePeriodSeconds: 30
          securityContext:                # 라이브 mp-ocr 과 동일
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: ocr-config-canary
              image: 192.168.0.10/mealplanning/mp-ocr-service:6e3274e74e6503db2f2573f0cf11da8b1ddb3512
              imagePullPolicy: IfNotPresent
              # WORKDIR /app · `COPY app app` → /app/app/config_canary.py
              command: ["python", "-m", "app.config_canary"]
              envFrom:
                - configMapRef: {name: app-common}       # PG*·ES*·Redis (gazetteer 조회 등 공통)
                - secretRef: {name: mp-ocr-secrets}      # GEMINI_API_KEY(api_key 모드일 때)
              env:
                # 🔴 **운영 mp-ocr 과 같은 값이어야 한다.** 카나리가 다른 백엔드를 보면
                #    감시 대상이 달라져 의미가 없다. mp-ocr 을 vertex 로 바꿀 때 여기도 같이 바꿀 것.
                - {name: OCR_BACKEND,    value: "vision"}
                - {name: GENAI_BACKEND,  value: "api_key"}   # vertex 전환 시 "vertex"
                - {name: GCP_PROJECT_ID, value: ""}          # vertex 시 mealplanning-503911
                - {name: GCP_LOCATION,   value: ""}          # vertex 시 global (리전엔 모델 없음 — 실측 404)
                - {name: GOOGLE_APPLICATION_CREDENTIALS, value: ""}  # vertex 시 /etc/gcp/gcp-sa.json
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
                # vertex 전환 시 주석 해제(요청 1 의 mp-gcp-sa 시크릿)
                # - {name: gcp-sa, mountPath: /etc/gcp, readOnly: true}
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {memory: 512Mi}                  # Pillow 합성 이미지 생성 여유
              securityContext:            # 라이브 mp-ocr 과 동일
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true             # 카나리는 디스크에 쓰지 않는다(BytesIO)
                capabilities: {drop: ["ALL"]}
          volumes:
            - {name: tmp, emptyDir: {}}
            # - name: gcp-sa
            #   secret: {secretName: mp-gcp-sa, defaultMode: 0444}   # 0400 아님 — 비root(10001)가 읽어야 함
---
# ── 알림 연결 (선택, 권장) ─────────────────────────────────────────────────────
# 카나리는 **실패해야 의미가 있는** 잡이다. 아무도 안 보면 존재 이유가 없다.
# 라이브에 `pipeline/mp-pipeline` PrometheusRule 이 있으므로 같은 방식으로 규칙을 하나 더 두면 된다:
#
#   - alert: OcrConfigCanaryFailing
#     expr: kube_job_status_failed{namespace="app", job_name=~"mp-ocr-config-canary-.*"} > 0
#     for: 10m
#     labels: {severity: warning}
#     annotations:
#       summary: "OCR 운영 config 가 거부됨 — 모델 드리프트 의심(PR #272 재발)"
#       runbook: "docs/gcp-migration-plan.md §4.7 · ai-verification-backlog.md §1.11"
