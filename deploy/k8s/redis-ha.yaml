apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisReplication
metadata:
  name: mp-redis
  namespace: data
spec:
  clusterSize: 2
  priorityClassName: data-critical
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  kubernetesConfig:
    image: quay.io/opstree/redis:v7.2.3
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi
  redisExporter:
    enabled: true
    image: quay.io/opstree/redis-exporter:v1.44.0
---
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisSentinel
metadata:
  name: mp-redis-sentinel
  namespace: data
spec:
  clusterSize: 3
  priorityClassName: data-critical
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  pdb:
    enabled: false
  redisSentinelConfig:
    redisReplicationName: mp-redis
    masterGroupName: myMaster
    quorum: "2"
    downAfterMilliseconds: "10000"
    failoverTimeout: "60000"
    parallelSyncs: "1"
  kubernetesConfig:
    image: quay.io/opstree/redis-sentinel:v7.2.3
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
  redisExporter:
    enabled: false
    image: quay.io/opstree/redis-exporter:v1.44.0
