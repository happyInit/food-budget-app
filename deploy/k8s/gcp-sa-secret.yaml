# GCP 서비스계정 키 ESO 주입 + mp-ocr / mp-video 배선 (Vertex AI 전환) — #381 요청 1·2
#
# 🔴 매니페스트 정본은 `happyInit/mealplanning-config` 다. 이 파일은 복사용 제안본이며
#    구조는 라이브 `mp-app-tunnel-creds`(JSON 시크릿 → 파일 마운트 선례)에서 추출했다.
#    **새 패턴이 아니다** — cloudflared 가 이미 같은 방식으로 `credentials.json` 을 쓴다.
#
# ── 값(JSON 본문)은 어디에 넣나 ────────────────────────────────────────────────
# `fb-secrets/app-secrets` 에 속성 `GCP_SA_KEY_JSON` 을 추가한다(서비스계정 키 JSON 전문).
# **키 값은 이슈·레포·이 파일 어디에도 올리지 않는다** — 별도 경로로 전달.
#   서비스계정: mp-vertex-ai@mealplanning-503911.iam.gserviceaccount.com
#   IAM 역할  : roles/aiplatform.user  (실호출로 확인 완료)
---
# ── ExternalSecret: 파일용이라 **별도로 분리한다** ──────────────────────────────
# ⚠️ `mp-ocr-secrets` 에 넣지 말 것. 그건 `envFrom: secretRef` 로 소비되므로
#    `gcp-sa.json` 같은 파일명 키를 섞으면 env 이름 규칙(C_IDENTIFIER)에 맞지 않아
#    kubelet 이 그 키를 건너뛰며 경고 이벤트를 남긴다.
apiVersion: external-secrets.io/v1          # ⚠️ v1beta1 은 이 클러스터에서 served=false
kind: ExternalSecret
metadata:
  name: mp-gcp-sa
  namespace: app
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fb-kubernetes
  target:
    name: mp-gcp-sa
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: gcp-sa.json                # ← 이 이름이 마운트될 **파일명**이 된다
      remoteRef:
        key: app-secrets
        property: GCP_SA_KEY_JSON

---
# ── 이 파일은 **그대로 apply 가능**하다(ExternalSecret 1개) ─────────────────────
#   kubectl apply -f deploy/k8s/gcp-sa-secret.yaml
#
# mp-ocr / mp-video 에 env·마운트를 붙이는 것은 **kustomize 패치**라 파일을 분리했다:
#   · deploy/k8s/patch-mp-ocr-vertex.yaml   ← mp-ocr 을 Vertex 로 전환
#   · deploy/k8s/video-route.yaml           ← mp-video 는 Deployment 본체에 이미 포함
#
# 🔴 섞어두면 안 되는 이유(실측): 부분 Deployment 를 같은 파일에 두면
#    `kubectl apply -f` 가 **`spec.selector: Required value` 로 실패**한다.
#    패치는 kustomize 가 base 에 병합할 때만 유효하다.
