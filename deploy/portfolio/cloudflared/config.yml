# Cloudflare Tunnel — 유입 라우팅.
#
# 토큰(--token) 방식 대신 설정 파일 방식을 쓴다. 토큰 방식은 라우팅이 Cloudflare 대시보드에만
# 남아서 레포만 봐서는 "무엇이 어디로 가는지" 알 수 없다. 여기 적어두면 구성이 코드로 남는다.
#
# credentials.json 은 커밋하지 않는다 (cloudflared tunnel create 가 만든 파일).
# 🔴 그 파일의 소유자를 65532:65532 로 맞춰야 한다 — cloudflared 이미지는 비루트(uid 65532)로
#    돌아서 ubuntu 소유 600 파일을 못 읽고 "permission denied" 재시작 루프에 빠진다.
#      sudo chown 65532:65532 cloudflared/credentials.json && sudo chmod 600 그것
# 🔴 UUID 로 적는다. 이름(mp-portfolio)으로 적으면 cloudflared 가 이름→UUID 해석을 위해
#    cert.pem(계정 인증서)을 찾는데, 컨테이너에는 credentials.json 만 있어서
#    "Error locating origin cert" 로 재시작 루프에 빠진다.
tunnel: 4b67379c-df36-4bd9-bdad-318b5e0c81cb
credentials-file: /etc/cloudflared/credentials.json

# 터널은 아웃바운드로만 연결한다 — 호스트에 인바운드 포트를 열지 않는다.
ingress:
  - hostname: portfolio.mealbong.cloud   # 검증용. 컷오버 후에도 남겨 둔다
    service: http://frontend:8080
  - hostname: app.mealbong.cloud         # 정식 진입점 (DNS 전환 후 활성)
    service: http://frontend:8080
  - service: http_status:404             # 매칭되지 않는 요청은 여기서 끊는다
