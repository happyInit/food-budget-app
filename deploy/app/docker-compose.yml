# food-budget 앱 스택 — fb-app-ai(192.168.0.9). FastAPI 9개(chat·ocr 포함) + 프론트(nginx 리버스 프록시).
#   데이터티어(PG·ES·Redis)는 스택 밖 fb-data(192.168.0.8) — env 로 주입.
#   전 서비스 내부망 fbnet — 호스트 노출은 nginx :80 하나(모니터링 에이전트와 포트 무충돌).
#
#   포트 노출 = nginx(:80) 하나. 7개 서비스는 내부망 fbnet 에서 서비스명 DNS 로만 접근(호스트 포트 X → 충돌 없음).
#   image+build 듀얼: 최초 브링업 = `docker compose build && up -d`(로컬 빌드) / CI 정상경로 = `docker compose pull && up -d`(Harbor).
#   시크릿(PGPASSWORD/JWT_SECRET)은 같은 폴더 .env 에서 주입 — .env 는 커밋 금지(.env.example 참고).
#
#   사용:
#     cp .env.example .env && vi .env     # PGPASSWORD·JWT_SECRET 채우기
#     docker compose build && docker compose up -d      # 최초(로컬 빌드)
#     docker compose ps                                  # 헬스 확인
name: foodbudget

x-svc-env: &svc-env
  PGHOST: ${PGHOST:-192.168.0.8}
  PGPORT: ${PGPORT:-5432}
  PGDATABASE: ${PGDATABASE:-foodbudget}          # 프로덕션 앱 OLTP DB (dev clone 아님)
  PGUSER: ${PGUSER:-fbapp}
  PGPASSWORD: ${PGPASSWORD:?PGPASSWORD 필요 — .env 참고}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 필요 — 7개 서비스 동일해야 토큰 상호검증}
  JWT_ALG: ${JWT_ALG:-HS256}
  ESHOST: ${ESHOST:-192.168.0.8}                 # recipe(search_backend=es 기본)·chat 이 ES 검색에 사용
  ESPORT: ${ESPORT:-9200}
  # FastAPI 7개 서비스의 최소 자동 Trace 계측. Tempo는 별도 VM이므로 실제 IP로 직접 전송한다.
  OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-otlp_proto_grpc}
  OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-none}
  OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-none}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-192.168.0.11:4317}
  OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
  OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=${ENVIRONMENT:-production}
  OTEL_PYTHON_FASTAPI_EXCLUDED_URLS: ${OTEL_PYTHON_FASTAPI_EXCLUDED_URLS:-health,metrics}

x-svc-common: &svc-common
  restart: unless-stopped
  networks: [fbnet]
  mem_limit: 256m
  cpus: 0.75
  environment: *svc-env

services:
  recipe:
    <<: *svc-common
    environment:
      <<: *svc-env
      OTEL_SERVICE_NAME: recipe
      ES_INDEX: ${ES_INDEX:-recipes}     # 서빙 인덱스: recipes(batch 폴러) | recipes_pgsync(PGSync CDC)
    image: 192.168.0.10/food-budget/recipe-service:${IMAGE_TAG:-1.1.1}
    build: { context: ../../services/recipe }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  price:
    <<: *svc-common
    environment:
      <<: *svc-env
      OTEL_SERVICE_NAME: price
    image: 192.168.0.10/food-budget/price-service:${IMAGE_TAG:-1.1.1}
    build: { context: ../../services/price }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  account:
    <<: *svc-common
    environment:
      <<: *svc-env
      OTEL_SERVICE_NAME: account
    image: 192.168.0.10/food-budget/account-service:${IMAGE_TAG:-1.1.1}
    build: { context: ../../services/account }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  pantry:
    <<: *svc-common
    environment:
      <<: *svc-env
      OTEL_SERVICE_NAME: pantry
    image: 192.168.0.10/food-budget/pantry-service:${IMAGE_TAG:-1.1.1}
    build: { context: ../../services/pantry }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  recipebook:
    <<: *svc-common
    environment:
      <<: *svc-env
      OTEL_SERVICE_NAME: recipebook
    image: 192.168.0.10/food-budget/recipebook-service:${IMAGE_TAG:-1.1.1}
    build: { context: ../../services/recipebook }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  mealplan:
    <<: *svc-common
    environment:
      <<: *svc-env
      OTEL_SERVICE_NAME: mealplan
    image: 192.168.0.10/food-budget/mealplan-service:${IMAGE_TAG:-1.1.1}
    build: { context: ../../services/mealplan }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8007/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  notify:
    <<: *svc-common
    environment:
      <<: *svc-env
      OTEL_SERVICE_NAME: notify
    image: 192.168.0.10/food-budget/notify-service:${IMAGE_TAG:-1.1.1}
    build: { context: ../../services/notify }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8008/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  chat:
    <<: *svc-common
    image: 192.168.0.10/food-budget/chat-service:${IMAGE_TAG:-1.1.1}
    build:
      context: ../..                         # 레포 루트 (gazetteer/_db 를 pipelines/ingest/ 에서 COPY)
      dockerfile: services/chat/Dockerfile
    mem_limit: 384m                          # gazetteer 인메모리 로드 → 여유
    environment:
      <<: *svc-env                           # PG*(비번!)·JWT·ES* — 빈 PGPASSWORD 로 죽던 원인 해소
      REDISHOST: ${REDISHOST:-192.168.0.8}
      REDISPORT: ${REDISPORT:-6379}
      GENERATOR_BACKEND: ${GENERATOR_BACKEND:-template}
      EXTRACTOR_BACKEND: ${EXTRACTOR_BACKEND:-rule}
      # Gemini 생성 백엔드(#147). GENERATOR_BACKEND=gemini 로 켤 때만 사용. 챗 전용 키(ocr GEMINI_API_KEY 와 분리 — 비용 격리).
      #   빈 키 + GENERATOR_BACKEND=template(기본) 이면 무해. ⚠️ 유료 API — 팀 재승인 후 활성(chat-assistant-ai §3).
      GEMINI_API_KEY: ${CHAT_GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-lite-latest}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-false}
      # 계정 양방향 연동(마이페이지 제외재료 ↔ 챗 비선호) + 멀티턴 세션. 기본 OFF — .env 로 활성(#127·#125).
      #   활성: ACCOUNT_INTEGRATION_ENABLED=true (JWT는 프론트가 이미 첨부·chat이 포워딩) · MULTITURN_ENABLED=true (Redis 세션, 동의 무관).
      ACCOUNT_INTEGRATION_ENABLED: ${ACCOUNT_INTEGRATION_ENABLED:-false}
      ACCOUNT_BASE_URL: ${ACCOUNT_BASE_URL:-http://account:8004}
      MULTITURN_ENABLED: ${MULTITURN_ENABLED:-false}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Tempo는 fb-monitoring의 별도 Docker 네트워크에 있으므로 서비스명 대신 VM IP 사용.
      OTEL_TRACES_ENABLED: ${OTEL_TRACES_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-192.168.0.11:4317}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
      OTEL_TRACES_SAMPLER_RATIO: ${OTEL_TRACES_SAMPLER_RATIO:-1.0}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s                      # gazetteer 로드 여유

  ocr:
    <<: *svc-common
    # ⚠️ 기본 배포에서 제외(profile) — ocr 이미지가 Harbor에 push된 뒤 활성한다.
    #    이미지 없으면 `compose up`이 서버에서 빌드 시도→소스 없음→deploy 실패(#148 회귀 방지).
    #    활성: (1) services/ocr 변경 push로 이미지 빌드(#121) 또는 workflow_dispatch,
    #          (2) 서버 .env 에 GEMINI_API_KEY 주입, (3) `docker compose --profile ocr up -d`.
    profiles: ["ocr"]
    image: 192.168.0.10/food-budget/ocr-service:${IMAGE_TAG:-1.1.1}
    build: { context: ../../services/ocr }   # self-contained(챗봇과 달리 pipelines/ COPY 불필요 — DB gazetteer 사용)
    mem_limit: 384m                          # Gemini 클라 + Pillow 이미지 다운스케일 여유
    environment:
      <<: *svc-env                           # PG*(item_master gazetteer 조회, 읽기)·JWT(미사용)·ES(미사용) 공통
      OTEL_SERVICE_NAME: ocr
      OCR_BACKEND: ${OCR_BACKEND:-vision}     # vision(유료 Gemini) | mock(키 없이 데모 — #121 이후 사용가능)
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}     # vision 필수 — .env 주입(커밋 X). 빈값+vision 이면 ocr 컨테이너만 기동실패(스택 격리)
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-lite-latest}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    image: 192.168.0.10/food-budget/frontend:${IMAGE_TAG:-1.1.1}
    build: { context: ../../frontend }
    restart: unless-stopped
    networks: [fbnet]
    mem_limit: 96m
    cpus: 0.5
    ports:
      - "80:80"                          # 스택에서 유일하게 호스트 노출되는 포트
    depends_on:
      - recipe
      - price
      - account
      - pantry
      - recipebook
      - mealplan
      - notify
      - chat
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]   # 127.0.0.1 고정(localhost→::1 IPv6 회피)
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  fbnet:
    driver: bridge
