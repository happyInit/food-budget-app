---
# 물리 하이퍼바이저 전용 플레이북 — site.yml 과 **분리**되어 있다.
#   대상 = `[hypervisor]` = `fb-proxmox`(.12, 호스트 A) · `mp-proxmox-b`(.22, 호스트 B)
#
# 왜 분리했나: site.yml 의 전-호스트 플레이는 VM 베이스라인(Docker 설치 +
# `docker_data_disk` 전용 디스크 포맷)을 깐다. 하이퍼바이저에서 그 디스크(/dev/sdb)는
# **전 VM 스토리지가 올라간 `pve` VG** 다. 하이퍼바이저에는 감시 에이전트만 얹는다.
#   3중 방어 = ① `[hypervisor]` 는 `vms` 의 자식이 아니다(= `hosts: vms` 가 안 닿는다)
#             ② `group_vars/hypervisor.yml` 의 `docker_data_disk` 무효값
#             ③ `base` 롤 첫 태스크의 assert('hypervisor' not in group_names)
#   ⚠️ 셋 다 **그룹 소속으로 자동 적용**된다 — `.22` 를 [hypervisor] 에 넣은 것만으로
#      세 방어가 그대로 걸린다(2026-07-31 `ansible-inventory` 로 확인).
#
# 실행: ansible-playbook hypervisor.yml
#       ansible-playbook hypervisor.yml --tags evidence            # 급사 증거 경로만
#       ansible-playbook hypervisor.yml --limit mp-proxmox-b       # 호스트 B 만
# 접속: root (VM 들의 ubuntu 계정과 다름 — group_vars/hypervisor.yml)
#
# ── 이 호스트들에 얹는 것 = 급사 증거를 밖으로 내보내는 세 경로 ──────────────
# 호스트 A 는 무흔적 급사 3회(2026-07-19 17:03 · 07-21 18:04 · 07-21 23:49 KST) 이력이 있고
# 그때마다 로컬 로그는 같이 죽었다. 호스트 B 는 지금까지 **감시가 아예 0** 이었다
# (인벤토리에 없어 node-exporter 미설치 · Prometheus 타깃 없음 — 2026-07-31 실측).
# 그래서 이 플레이북의 롤은 전부 "증거가 이 머신 밖에 남게 하는" 것으로 통일돼 있다.
#   ① node_exporter_host — 인클러스터 Prometheus(호스트 B)가 **당겨 간다**(pull, 30초).
#                          온도·물리 디스크·게스트 LV(dm-*) 별 읽기량. 호스트가 죽으면
#                          시계열이 끊기는 것 자체가 급사 시각(±30초)의 기록이 된다.
#   ② ioburst_watch      — 로컬에서만 알 수 있는 것(범인 프로세스·15초 해상도 vitals)을
#                          **밀어낸다**(push). 죽으면 비콘이 끊긴다. 정상 종료 때는
#                          `kind=stop` 종료 비콘을 남겨 급사와 구분되게 한다.
#   ③ host_postmortem    — 살아 돌아왔을 때, 로컬에만 남아 있던 것(직전 부팅 journal·
#                          pstore·rate.log)을 회수해 밖으로 보낸다.
#
# 🔴 ②·③ 의 행선지가 **호스트 C(`.10`)로 바뀌었다** (2026-07-31 재설계 · 구 인클러스터 Loki).
#    왜: 실측 결과 Prometheus(`prometheus-…-0`=k8s-worker-b2) · Loki(`loki-0`=b1) ·
#    Alertmanager(=b2) · MinIO 가 **전부 호스트 B** 다(배치 원칙). 즉 호스트 B 가 죽으면
#    기록·수신·발화가 동시에 죽어 증거가 0 이 된다 — 클러스터는 자기 자신의 전면 장애를
#    관측할 수 없다. 그래서 관측자를 클러스터 **밖**(호스트 C, `hostwatch_sink` 롤)에 둔다.
#    결과는 상호 감시다: 클러스터가 C 를 보고(`MpHostCDown`) · C 가 물리 A·B 를 본다.
#    ⚠️ ① 은 여전히 인클러스터 Prometheus 가 당겨 간다 — 호스트 B 가 죽으면 같이 죽지만,
#       ②의 비콘이 정확히 그 구멍을 메운다(둘은 대체재가 아니라 보완재다).
#    상세·트레이드오프(UDP 를 고른 이유 등) = group_vars/all.yml 의 `mp_hostwatch_*` 블록.
#
# 🔴 선행 조건 = **싱크가 먼저 서 있어야 한다.**
#    ②·③ 은 배포 끝에 호스트 C 의 파일에서 프로브를 확인하는 end-to-end 검증을 한다
#    (delegate_to → wait_for). 싱크가 없으면 거기서 실패한다 — 의도된 동작이다.
#    순서: `ansible-playbook site.yml --tags hostwatch_sink` → `ansible-playbook hypervisor.yml`
- name: 하이퍼바이저 — 감시·급사 증거 보존
  hosts: hypervisor
  become: false          # 이미 root 로 접속한다
  roles:
    - { role: node_exporter_host, tags: [node_exporter, monitoring] }
    # 디스크 읽기 폭주 워처 + 15초 비콘 + 종료 비콘. 1세대(fb-ioburst, VM 4대 중 3대 파괴로 소멸)의 승계.
    - { role: ioburst_watch, tags: [evidence, ioburst] }
    # 부팅 직후 직전 부팅의 비정상 종료 판정·증거 회수.
    - { role: host_postmortem, tags: [evidence, postmortem] }
