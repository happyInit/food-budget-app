---
# K8s 노드 전용 플레이북 (호스트 B 3대). site.yml 과 **분리한 이유**:
#   site.yml 의 플레이는 `hosts: vms` 이고 그 첫 롤이 base 다. base 는 Docker 를 깔고
#   `docker_data_disk`(= /dev/sdb)를 ext4 로 포맷하는데, 워커의 /dev/sdb 는 OpenEBS VG 용
#   raw 디스크다(게스트 커널 이름이 scsi 인덱스 순서와 뒤집힘 — scsi1=sdc, scsi2=sdb).
#   K8s 노드는 Docker 를 쓰지 않고 containerd 만 쓰므로 애초에 base 가 필요 없다.
#
# 사용:
#   ansible k8s_nodes -m ping
#   ansible-playbook k8s.yml                    # 베이스라인 전체
#   ansible-playbook k8s.yml --tags team_keys   # 팀 키만
#   ansible-playbook k8s.yml --check --diff     # 드라이런
#
# 진행 상태: 이 플레이북이 끝난 시점의 정상 모습 = **kubelet 크래시루프**(설정 없음).
#            kubeadm init/join 은 후속 롤에서 담당한다(플랜 §10 P0).

- name: 팀원 SSH 공개키 배포 (additive — 기존 키 보존)
  hosts: k8s_nodes
  become: true
  tags: team_keys
  roles:
    - team_ssh_keys

- name: 로컬 CA 신뢰 (containerd 가 Harbor `.10` 에서 이미지를 당기는 전제)
  hosts: k8s_nodes
  become: true
  tags: ca_trust
  roles:
    # containerd 는 레지스트리 TLS 검증에 시스템 신뢰 저장소를 쓴다 → 이 롤로 충분하다.
    # (롤이 만드는 /etc/docker/certs.d 는 Docker 가 없어 무해)
    - ca_trust

- name: K8s 노드 베이스라인 (swap·sysctl·containerd·kubeadm 선행조건·OpenEBS VG)
  hosts: k8s_nodes
  become: true
  tags: k8s_node
  roles:
    - k8s_node

- name: 컨트롤플레인 부트스트랩 (kubeadm init · kube-proxy 스킵)
  hosts: k8s_master
  become: true
  tags: bootstrap
  vars_files:
    - secrets.yml          # etcd_encryption_key (at-rest 암호화 — k8s_control_plane enc 태스크). 없으면 assert 중단.
  roles:
    - k8s_control_plane

- name: 워커 조인
  hosts: k8s_workers
  become: true
  tags: bootstrap
  roles:
    - k8s_worker_join

- name: CNI — Cilium (kube-proxy 대체 · WireGuard · VXLAN 시작값)
  hosts: k8s_master
  become: true
  tags: cilium
  roles:
    - k8s_cilium

- name: 클러스터 공통 오브젝트 (노드 zone 레이블 · ns+PSS · PriorityClass)
  hosts: k8s_master
  become: true
  tags: cluster_base
  roles:
    - k8s_cluster_base

# 기반 플랫폼. 순서에 의미가 있다 —
#   MetalLB(외부 IP) → OpenEBS(StorageClass) → cert-manager(발급자) → MinIO(PVC+zone 필요)
- name: 기반 플랫폼 — MetalLB · OpenEBS · cert-manager · MinIO
  hosts: k8s_master
  become: true
  vars_files:
    - secrets.yml
  roles:
    - { role: k8s_metallb, tags: [platform, metallb] }
    - { role: k8s_storage, tags: [platform, storage] }
    - { role: k8s_certmanager, tags: [platform, certmanager] }
    - { role: k8s_minio, tags: [platform, minio] }
    - { role: k8s_eso, tags: [platform, eso] }
    - { role: k8s_observability, tags: [platform, observability] }
    - { role: k8s_istio, tags: [platform, istio] }
    - { role: k8s_argocd, tags: [platform, argocd] }
    # ArgoCD 가 동기화하는 플랫폼 스택(LGTM 선배포) — k8s_argocd 뒤가 전제(CRD·AppProject)
    - { role: k8s_platform_apps, tags: [platform, platform_apps] }
    # 카나리 운영 CLI(ADR-0001 운영절차 2단계) — 클러스터가 아니라 **master 에 까는 클라이언트 도구**다.
    #   Rollouts 컨트롤러 자체는 ArgoCD(config 레포 platform/argocd/rollouts.yaml)가 깐다. 여기는 사람 손용.
    - { role: k8s_rollouts_cli, tags: [platform, rollouts_cli] }

# 컨트롤플레인 DR — etcd 스냅샷 → S3 (마스터 systemd timer). 클러스터 건강과 무관하게 도는
#   호스트 레벨 백업이라 k8s CronJob 이 아니다(컨트롤플레인 death 에도 백업 지속). 단독: --tags etcd_backup
- name: 백업 — etcd 스냅샷 → S3
  hosts: k8s_master
  become: true
  vars_files:
    - secrets.yml
  tags: [backup, etcd_backup]
  roles:
    - etcd_backup

# 비밀·PKI 묶음 → S3 (마스터 systemd timer). **etcd 백업과 한 쌍이다.**
#   etcd 는 at-rest 암호화가 켜져 있어 `/etc/kubernetes/enc` 키가 없으면 스냅샷의 Secret 을 못 읽고,
#   kubeadm PKI(ca.key·sa.key)는 애초에 스냅샷에 안 들어간다 — 둘 다 없으면 스냅샷만으로 클러스터가 안 선다.
#   단독: --tags secrets_backup   (etcd_backup 이 aws CLI 를 먼저 깐다 → 신규 마스터면 --tags backup)
- name: 백업 — 비밀·PKI 묶음 → S3
  hosts: k8s_master
  become: true
  vars_files:
    - secrets.yml
  tags: [backup, secrets_backup]
  roles:
    - secrets_backup

# 백업 신선도 계측 → node-exporter textfile → Prometheus 알림.
#   "잡이 성공했다"가 아니라 **"S3 에 최신 오브젝트가 있나"** 를 잰다 — 자격증명 붕괴·타이머
#   미발화·무음 업로드 실패가 한 신호로 잡힌다(2026-08-03 이미지 백업 전량실패가 계기).
#   단독: --tags backup_freshness
- name: 백업 — 신선도 계측 (S3 실물 관측)
  hosts: k8s_master
  become: true
  vars_files:
    - secrets.yml
  tags: [backup, backup_freshness]
  roles:
    - backup_freshness

# 팀원 접근 RBAC (Phase 1 · 무중단) — 개인 SA + 티어 바인딩 + 장수 토큰 kubeconfig.
#   🔴 opt-in 전용: 전체 플레이북으로는 안 돈다(never). admin.conf 는 그대로 살려둔다.
#   적용: ansible-playbook k8s.yml --tags team_rbac.  계획 = docs/mp_k8s_rbac_plan.md
- name: 팀원 접근 RBAC (Phase 1 · 무중단)
  hosts: k8s_master
  become: true
  tags: [never, team_rbac]
  roles:
    - k8s_team_rbac
