# food-budget 온프렘 VM (design.md §8.4 Docker 베이스라인)
#
# ── 해체된 VM 3대 — 기록만 남긴다 (2026-07-31 P4 로 전부 실물 파괴) ────────────
# ~~[data] fb-data 192.168.0.8~~ → **제거 (2026-07-30, P2 데이터 컷오버 완료 후 정지 → 07-31 파괴)**
#   데이터 티어(PG·ES·Redis·Kafka)·PGSync·파이프라인이 K8s(data·pipeline ns)로 이전 완료.
#
# ~~[app] fb-app-ai 192.168.0.9~~ → **제거 (2026-07-28, P1 유입 전환 후 정지 → 07-31 파괴)**
#   앱 11 워크로드가 K8s(app ns)로 이전되고 게이트웨이 `.14` 가 유입을 받는다.
#
# ~~[monitoring] fb-monitoring 192.168.0.11~~ → **제거 (2026-07-31, P4 — 정지 후 같은 날 파괴)**
#   모니터링 컷오버(2026-07-30)로 규칙·Slack·스크레이프·로그·대시보드가 전부 인클러스터로
#   이관돼 역할이 없어졌다. 정지 시점에 클러스터 스크레이프 타깃 0 을 확인했다(56/56 UP 무영향).
#   ⚠️ 이 VM 의 Prometheus TSDB(07-16~07-28)는 사본 없이 소멸했다 — 인클러스터는 07-28 09:59부터.
#
# 🔴 롤백은 더 이상 "VM 을 켠다"가 아니다 — 디스크까지 사라졌으니 재구축이다.
#    빈 그룹 헤더도 함께 제거했다(2026-07-31) — 대상 롤(`monitoring`·`data_tier`·
#    `data_pipeline`·`tfstate_db`)이 같은 커밋에서 은퇴해 참조처가 없어졌다.
# ───────────────────────────────────────────────────────────────────────────

[ci]
fb-ci-harbor ansible_host=192.168.0.10

# 물리 하이퍼바이저 — VM 이 아니다. site.yml 대상이 **아니고** hypervisor.yml 로만 관리한다.
# 온도·팬 감시용 node-exporter(네이티브 패키지) 외에는 아무것도 얹지 않는다.
[hypervisor]
fb-proxmox ansible_host=192.168.0.12

# 🔴 `all` 은 Ansible 이 인벤토리의 **모든** 호스트를 자동 포함하는 암묵 그룹이라
#    아래처럼 명시해도 fb-proxmox 를 뺄 수 없다. 그래서 site.yml 의 전-호스트 플레이는
#    `hosts: all` 이 아니라 **`hosts: vms`** 를 쓴다.
#    (그냥 `all` 이면 base 롤이 하이퍼바이저에 Docker 를 깔고, 더 나쁘게는
#     group_vars/all.yml 의 `docker_data_disk: /dev/sdb` = .12 에선 전 VM 스토리지가
#     올라간 `pve` VG 디스크를 포맷 대상으로 잡는다. base 롤에 방어 assert 도 넣어뒀다.)
# ⚠️ 남은 구성원은 호스트 C(`.10`) 하나뿐이지만 그룹은 유지한다 — site.yml 의 전-호스트
#    플레이 5개가 `hosts: vms` 로 이걸 쓰고, 여기에 `ci` 를 직접 쓰면 "호스트 C 전용 플레이"와
#    "전 VM 플레이"의 구분이 사라진다(= 나중에 VM 이 늘면 조용히 누락된다).
[vms:children]
ci

# ── K8s 노드 (호스트 B, Proxmox `k8s1` @ .22) — 플랜 §2.2 ────────────────────
# 🔴 **`vms` 그룹에 넣지 말 것.** site.yml 의 `hosts: vms` 플레이가 base 롤을 돌리고,
#    base 는 group_vars/all.yml 의 `docker_data_disk: /dev/sdb` 를 ext4 로 포맷한다.
#    워커에서 /dev/sdb 는 **OpenEBS VG 용 raw 디스크**다(게스트 커널 이름이 scsi 인덱스
#    순서와 다름 — scsi1=sdc, scsi2=sdb) → 스토리지 계층이 조용히 사라진다.
#    K8s 노드는 전용 플레이북 `k8s.yml` 로만 관리한다(Docker 미설치, containerd 만).
[k8s_master]
k8s-master ansible_host=192.168.0.17

[k8s_workers]
k8s-worker-b1 ansible_host=192.168.0.18
k8s-worker-b2 ansible_host=192.168.0.19
# 호스트 A 램프분 (2026-07-28 생성) — .9 정지·203 파괴로 회수한 자원.
# ⚠️ 디스크 이름이 뒤집힌다: scsi1(40G)=/dev/sdc · scsi2(150G)=/dev/sdb (B 워커와 동일 현상)
#    → 롤은 /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsiN 으로 지정해야 한다
k8s-worker-a1 ansible_host=192.168.0.20
# P4 노드 램프 4→5 (2026-07-31). a1 과 같은 물리 호스트 A · 스펙은 b1/b2 와 동일.
# 🔴 host_vars/k8s-worker-a2.yml 로 `k8s_node_zone: host-a` 를 반드시 덮어쓴다
#    (그룹 기본값이 host-b 라 빠뜨리면 배치 원칙이 조용히 무너진다).
k8s-worker-a2 ansible_host=192.168.0.21

[k8s_nodes:children]
k8s_master
k8s_workers
