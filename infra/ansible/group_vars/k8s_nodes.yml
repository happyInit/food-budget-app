---
# K8s 노드 공통 (호스트 B 3대). 결정 근거 = docs/mp_k8s_infra_migration_plan.md §2.2
#
# 🔴 base 롤이 실수로 이 그룹에 닿아도 디스크를 포맷하지 못하게 값을 비워 둔다.
#    (base 는 `docker_data_disk` 가 존재하는 블록장치일 때만 mkfs 한다)
docker_data_disk: ""

# ── 버전 (2026-07-27 확정) ──────────────────────────────────────────────────
# Cilium 이 상한을 정한다: 최신 GA 1.19.6 이 e2e 검증한 K8s = 1.31–1.34.
# Istio 1.30 은 1.32–1.36 을 덮으므로 교집합의 최댓값 = **1.34**.
# 1.35·1.36 은 Cilium GA 미검증 — kube-proxy 대체(eBPF)는 K8s API·커널 결합이 깊어
# "하위호환으로 될 수도"에 걸 자리가 아니다. 1.33 은 이미 EOL.
# ⚠️ 1.34 EOL = 2026-10-27.
k8s_minor: "1.34"
k8s_pkg_version: "1.34.10-1.1" # apt 패치까지 핀 + apt-mark hold

# ── 보류된 옵션: 1.36 상향 (2026-07-27 조사 → 사용자 판단으로 보류) ─────────
# 되살릴 때 다시 조사하지 않도록 근거만 남긴다:
#   · K8s 지원 = 1.34·1.35·1.36 / EOL: 1.34=2026-10-27 · 1.35=2027-02-28 · 1.36=2027-06-28
#   · **노드 선행조건은 이미 충족**(실측): cgroup **v2**(1.35 부터 cgroup v1 은 kubelet
#     기동 거부) · containerd **2.2.6**(1.35 가 containerd 1.x 지원 마지막) ·
#     kube-proxy 미설치(1.36 이 IPVS 모드 제거) · Service externalIPs 미사용
#   · 유일한 걸림돌 = **Cilium**. 1.36 을 쓰려면 1.20 계열이 필요하고 현재 **1.20.0-rc.1**
#     (2026-07-21)까지만 나와 있다 → GA 를 포기해야 한다. 1.20 GA 가 나오면 이 제약 소멸.
#   · kubeadm 은 마이너를 건너뛸 수 없다(1.34→1.35→1.36 2단계). 클러스터가 비어 있는
#     동안은 reset 후 재구축이 더 빠르고 깨끗하다.

# ── 네트워크 ────────────────────────────────────────────────────────────────
# 🔴 Cilium 기본 cluster-pool(10.0.0.0/8)을 쓰지 않는다 — 호스트 A 의 내부망
#    10.10.10.0/24 를 포함해 버린다. kubeadm 이 노드별 podCIDR 을 나눠주고
#    Cilium 은 `ipam.mode=kubernetes` 로 그걸 따르게 한다.
k8s_pod_cidr: "10.244.0.0/16"
k8s_service_cidr: "10.96.0.0/12"

# apiserver 광고 주소 = master 의 관리망 IP (단일 master — VIP·HAProxy 불필요, 플랜 §2.1)
k8s_api_endpoint: "192.168.0.17"
k8s_api_port: 6443

# ── 디스크 (🔴 /dev/sdX 금지) ───────────────────────────────────────────────
# 실측(2026-07-27): 게스트 커널 이름이 scsi 인덱스 순서와 뒤집혀 잡힌다 —
#   scsi1(containerd 40G) = /dev/sdc · scsi2(OpenEBS 150G) = /dev/sdb
# by-id 는 QEMU 가 인터페이스 이름을 그대로 넣어주므로 순서에 무관하게 안전하다.
k8s_containerd_disk: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1

# ── 클러스터 공통 ───────────────────────────────────────────────────────────
k8s_kubeconfig: /etc/kubernetes/admin.conf
# 🔴 /etc/kubernetes/manifests 는 kubelet 의 static pod 디렉토리다 — 매니페스트를 거기 두면
#    kubelet 이 파드로 띄우려 든다. 우리 매니페스트는 반드시 별도 디렉토리에 둔다.
k8s_manifest_dir: /etc/kubernetes/fb

# ── etcd at-rest 암호화 (Secret) ─────────────────────────────────────────────
# true = kubeadm apiServer 에 encryption-provider-config 반영. 신규 클러스터는 init 이 바로,
#   기존 클러스터는 `ansible-playbook k8s.yml --tags etcd_encryption` 로 apiserver 매니페스트
#   재생성(백업+자동 롤백). 재암호화(기존 Secret)는 `--tags etcd_reencrypt`.
#   🔴 키 = secrets.yml 의 etcd_encryption_key (head -c 32 /dev/urandom | base64). 상세 = 백업전략 §7.
etcd_encryption_enabled: true

# ── CIS 하드닝 (kube-bench 실측 후속) ────────────────────────────────────────
# 근거·분류 = docs/mp_k8s_cis_benchmark_2026-08-03.md (§1-A 진짜 갭 / §3 권고 순서).
#
# true = 컨트롤플레인 3종(apiserver·controller-manager·scheduler)의 pprof 를 끈다
#        (CIS 1.2.15 · 1.3.2 · 1.4.1). 신규 클러스터는 init 이 바로 반영,
#        기존 클러스터는 `ansible-playbook k8s.yml --tags cis_hardening` 로 매니페스트
#        재생성(백업 + 자동 롤백 — etcd_encryption 과 같은 패턴).
# 🔴 되돌리려면 이 값을 false 로 두고 같은 태그를 다시 돌린다. 프로파일링이 실제로
#    필요해지는 성능 진단 국면이 오면 그때 일시적으로 켠다.
# ⚠️ 재생성은 컨트롤플레인 파드를 재시작시킨다 — kubectl 이 수십 초 끊기고 스케줄링이
#    잠깐 빈다. **배포 중에 돌리지 말 것.**
cis_profiling_disabled: true
#
# kubelet 파일 권한(4.1.1 · 4.1.9)은 별도 스위치가 없다 — k8s_node 롤이 항상 0600 으로
#   맞춘다(멱등, 부작용 없음). 같은 `cis_hardening` 태그로 단독 실행 가능.
#
# true = apiserver 감사 로그(CIS 1.2.16~19 · 3.2.1~3.2.2). CIS FAIL 중 **실질 갭이 가장 큰 항목**
#        이었다 — 켜기 전에는 "누가 무엇을 언제 지웠나" 를 사후에 물을 수단이 아예 없었다.
#   정책 = roles/k8s_control_plane/templates/audit-policy.yaml.j2
#          (잡음 None → RBAC·exec·워크로드 변경 RequestResponse → Secret 은 Metadata 까지만)
# 🔴 **Secret 을 RequestResponse 로 올리지 말 것** — 평문 값이 로그 파일에 남는다.
#    etcd 를 aescbc 로 암호화해 둔 것(#445)이 그 순간 무의미해진다.
# 🔴 디스크 상한이 곧 안전장치다: maxsize 100MB × (maxbackup 10 + 현재 1) = **최대 1.1GB**.
#    상한 없이 켜면 마스터 디스크가 차고 그러면 **apiserver 가 선다** = 클러스터 정지.
#    마스터 실측(2026-08-03) 48G 중 43G 여유 → 1.1GB 는 2.5%. 감시는 기존
#    NodeFilesystemAlmostOutOfSpace·MpVMDiskUsage* 가 이미 담당한다(신규 알람 불요).
cis_audit_enabled: true

# ── PSA(Pod Security Admission) — 우리가 안 만든 ns 몫 ───────────────────────
# `k8s_cluster_base` 템플릿은 **우리가 만드는 ns**(app·data·pipeline·observability·argocd·
#   오퍼레이터 6종)에 PSS 라벨을 박는다. 그런데 Helm·kubeadm 이 자기 손으로 만든 ns 10개는
#   그 템플릿을 안 거치므로 **라벨이 하나도 없었다**(2026-08-03 실측 = 무라벨 = enforce 없음).
#   ns 를 `kind: Namespace` 로 선언해 apply 하면 Helm 소유권과 다투므로, 여기서는
#   **라벨만 덧씌운다**(`kubectl label --overwrite` — 노드 zone 레이블과 같은 방식).
#
# 🔴 **enforce 는 이미 도는 파드를 쫓아내지 않는다.** admission 게이트라 다음 생성 때 거부된다 —
#    즉 잘못 걸면 지금은 멀쩡하다가 **노드 드레인·업그레이드 시점에 터진다**(가장 나쁜 형태).
#    그래서 아래 값은 전부 추측이 아니라 **서버 dry-run 실측**으로 정했다:
#      `kubectl label ns <ns> pod-security.kubernetes.io/enforce=<lv> --overwrite --dry-run=server`
#    가 되돌려주는 위반 경고를 보고 골랐다. 값을 바꾸려면 반드시 이 명령을 먼저 돌릴 것.
#
# 실측 결과(2026-08-03):
#   · kube-system   = cilium/cilium-envoy(privileged·hostPath·hostPort)·etcd·alloy → baseline 도 위반
#   · istio-system  = istio-cni-node(hostPath·비기본 capability) → baseline 위반
#   · metallb-system= speaker(hostNetwork·hostPort·capability) → baseline 위반
#   · openebs       = lvm-localpv-node(privileged·hostPath) → baseline 위반
#     → 위 4개는 **privileged 말고 답이 없다.** 낮추면 그 컴포넌트가 다음 재시작에 안 뜬다.
#   · cert-manager·external-secrets = **restricted 위반 0건**.
#     그래도 enforce 는 `baseline` 으로 둔다 — cluster-base.yaml.j2 머리말의 오퍼레이터 ns 방침
#     ("restricted 로 막으면 원인 찾기 어려운 실패가 난다, 대신 warn/audit 으로 미리 본다")과
#     같은 판단이다. 차트 업그레이드가 새 Job 을 들고 올 때 배포가 막히는 걸 피한다.
#   · default = 파드 0. 그런데도 restricted 가 아니라 `baseline` 인 이유는 **팀 디버깅** 때문이다 —
#     `kubectl run -it --rm debug --image=busybox` 가 restricted 에선 거부된다. baseline 이면
#     privileged·hostPath·hostNetwork 같은 **탈출 경로는 막으면서** 임시 파드는 살아 있다.
#   · kube-public·kube-node-lease·cilium-secrets = 파드가 영구히 0(각각 공개 CM·리스·시크릿 전용).
#     워크플로 영향이 없으므로 제일 강한 `restricted` 로 잠근다.
k8s_psa_enabled: true
k8s_psa_external_namespaces:
  - { name: kube-system, enforce: privileged, warn: privileged, audit: privileged }
  - { name: istio-system, enforce: privileged, warn: privileged, audit: privileged }
  - { name: metallb-system, enforce: privileged, warn: privileged, audit: privileged }
  - { name: openebs, enforce: privileged, warn: privileged, audit: privileged }
  - { name: cert-manager, enforce: baseline, warn: restricted, audit: restricted }
  - { name: external-secrets, enforce: baseline, warn: restricted, audit: restricted }
  - { name: default, enforce: baseline, warn: restricted, audit: restricted }
  - { name: kube-public, enforce: restricted, warn: restricted, audit: restricted }
  - { name: kube-node-lease, enforce: restricted, warn: restricted, audit: restricted }
  - { name: cilium-secrets, enforce: restricted, warn: restricted, audit: restricted }

# ── 오퍼레이터 설치 ns (P2 준비, 런북 Q1) ──────────────────────────────────
# 🔴 두 롤이 같은 목록을 봐야 해서 여기 한 곳에 둔다 —
#     `k8s_cluster_base` = ns 를 만든다(PSS 라벨 포함) /
#     `k8s_argocd`       = platform AppProject 의 destinations 에 넣는다.
#   한쪽만 고치면 "ns 는 있는데 ArgoCD 가 배포 거부" 또는 그 반대가 된다.
k8s_operator_namespaces:
  - cnpg-system # CloudNativePG + plugin-barman-cloud (같은 ns — 플러그인이 오퍼레이터 옆에 산다)
  - elastic-system # ECK
  - strimzi-system # Strimzi (watchNamespaces=data 로 좁힌다 — 매니페스트 몫)
  - redis-operator-system # OT-Container-Kit redis-operator
  - keda # KEDA (P3 스케일) — 업스트림 기본 ns 이름. 오퍼레이터·메트릭서버·어드미션 3파드
  - argo-rollouts # Argo Rollouts (카나리 배포전략, ADR-0001) — 컨트롤러·대시보드
  - tailscale # Tailscale K8s Operator (C-53 사람 평면) — 🔴 PSS 예외 있음, 아래 참조

# ── 오퍼레이터 ns 의 PSS 예외 (기본값 = enforce baseline / warn·audit restricted) ──
# 🔴 오퍼레이터가 **privileged 파드를 만드는** ns 만 여기 적는다. 그 밖에는 적지 말 것.
k8s_operator_namespace_pss:
  # Tailscale (C-53) — 🔴 privileged 말고 답이 없다.
  #   Tailscale **v1.78+ 부터 프록시 파드의 main 컨테이너와 init 컨테이너가 privileged 로 돈다**
  #   (main 은 `/dev/net/tun` 생성 때문 · CAP_NET_ADMIN 도 쓴다 — L3 노출이 iptables/nftables
  #   DNAT 로 동작한다). `baseline` 은 privileged 와 NET_ADMIN 을 **둘 다 금지**하므로
  #   프록시 파드가 admission 에서 거부된다.
  #   🔴 헷갈리는 실패 방식 — **오퍼레이터 파드 자체는 baseline 으로도 뜬다.** 그래서 증상이
  #      "Application 은 Synced/Healthy 인데 tailnet 에 디바이스가 안 생긴다" 로 조용하다.
  #   🔴 그래서 통제를 다른 데 둔다 — tailnet ACL(`platform/tailscale/acl/policy.hujson` 의
  #      deny 단정)과 K8s netpol(프록시 egress 를 data ns 5432·9200 으로 제한). config 레포.
  #   ⚠️ 대안(ProxyClass 로 privileged 를 벗기고 `/dev/net/tun` 을 device plugin 에 위임)은
  #      NET_ADMIN 이 여전히 필요해 **baseline 을 만족시키지 못한다** → 부품만 늘고 이득이 없다.
  tailscale: { enforce: privileged, warn: privileged, audit: privileged }

# 배치 원칙(플랜 §5.2)이 기대는 레이블. 지금 3대는 전부 물리 호스트 B 위에 있다.
# 호스트 A 워커(P1 후 worker-a1)가 붙으면 그 그룹에 host-a 를 준다.
k8s_node_zone: host-b

# ── ArgoCD GitHub 웹훅(즉시 CD) — in-cluster cloudflared ─────────────────────
# 터널 mp-argocd 생성됨(2026-07-29) · DNS argocd.mealbong.cloud → mp-argocd 연결됨.
# 남은 활성화 전제 = secrets.yml(vault)의 argocd_webhook_github_secret
#   + argocd_webhook_tunnel_credentials(호스트C ~/.cloudflared/<UUID>.json 내용).
#   상세 순서 = roles/k8s_argocd/defaults/main.yml 주석.
argocd_webhook_enabled: true # defaults 기본 false 를 덮음
argocd_webhook_tunnel_id: "db79b297-6cf2-4594-8b41-35a080ab151a"
