---
# EKS 플랫폼 부트스트랩 — C-78 A0 의 Ansible 소관
#
# 🔴 **이 플레이북은 `k8s.yml` 과 롤을 하나도 공유하지 않는다** (C-77 · 사용자 지시).
#    기존 `k8s_*` 롤이 이미 `kubectl --kubeconfig {{ }}` 라 *돌기는* 하지만, 공유하면
#    **AWS 쪽 수정이 온프렘으로 번진다.** 대가(중복)가 정확히 사려는 것(격리)이다.
#    ⇒ `eks_*` 롤은 전부 새 파일이고, `k8s.yml`·`site.yml`·`hypervisor.yml` 은 불변이다.
#
# 🔴 **온프렘과 결정적으로 다른 점 = 실행 위치.** 온프렘은 master 노드에 SSH 해서 돌지만
#    EKS 엔 우리가 들어갈 노드가 없다 ⇒ `connection: local` 로 **작업 머신에서** 돈다.
#    필요한 것 = `aws` CLI + `kubectl` + `helm` + 플랫폼 권한 프로필.
#
# 🔴 **선행 = Terraform `infra/terraform/aws-platform/` apply.** 이 플레이북은 클러스터를
#    만들지 않고 그 위에 얹는다. 값은 손으로 옮기지 말고 output 을 파일로 넘긴다:
#
#      cd infra/terraform/aws-platform
#      terraform output -raw ansible_extra_vars_json > /tmp/eks-vars.json
#      cd ../../ansible
#      ansible-playbook eks.yml -e @/tmp/eks-vars.json
#
#    특정 단계만: `--tags cilium` · `--tags karpenter` · `--tags argocd` …
#
# ── 순서가 곧 안전장치다 ──────────────────────────────────────────────────────
#   preflight → **cilium** → addons(coredns·EBS CSI) → operators → istio → rbac → karpenter → argocd
#
#   🔴 Cilium 이 첫 번째인 이유 = 그 전까지 **노드가 NotReady 이고 파드가 하나도 못 뜬다.**
#      C-82 로 vpc-cni 를 안 깔았으므로 CNI 가 없는 상태로 시작하는 것이 정상이다.
#   🔴 coredns 를 Cilium **뒤에** 만드는 이유 = CNI 없이는 coredns 파드가 Pending 이고,
#      애드온 생성이 ACTIVE 를 기다리다 실패한다(그래서 Terraform 이 아니라 여기 있다).
#   🔴 karpenter 를 operators 뒤에 두는 이유 = NodePool 이 뜨는 순간 노드가 늘 수 있고,
#      그때 오퍼레이터 웹훅이 없으면 새 노드의 파드가 검증 실패로 뜨지 못한다.

- name: EKS 선행 점검 · kubeconfig · 기본 StorageClass 정리
  hosts: localhost
  connection: local
  gather_facts: true
  tags: preflight
  roles:
    - eks_preflight

- name: CNI — Cilium ENI 모드 (C-82 · kube-proxy 대체)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [platform, cilium]
  roles:
    - eks_cilium

- name: EKS 애드온 — CoreDNS · EBS CSI (C-16)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [platform, addons]
  roles:
    - eks_addons

- name: 부트스트랩 계층 — cert-manager · ESO (🔴 ArgoCD 가 못 하는 것만)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [platform, operators]
  roles:
    - eks_operators

- name: Istio — sidecar 메시 + Gateway API 구현체
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [platform, istio]
  roles:
    - eks_istio

- name: 사람 권한 — mp:admin · mp:viewer ClusterRole (C-24)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [platform, rbac]
  roles:
    - eks_rbac

- name: Karpenter — 층2 노드 (A-12 채택 확정 · 평시 0대)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [platform, karpenter]
  roles:
    - eks_karpenter

- name: ArgoCD + AppProject 4종 (0-4 · 🔴 0-4b 확장 8엔트리 포함)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [platform, argocd]
  roles:
    - eks_argocd
