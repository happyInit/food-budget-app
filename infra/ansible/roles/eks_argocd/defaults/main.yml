---
eks_kubeconfig: "{{ lookup('env', 'HOME') }}/.kube/config-mp-eks"
# 🔴 온프렘 `helm list -A` 실측값이다 — `argo-cd-10.2.1`(앱 v3.4.5).
#    처음에 `8.0.10` 으로 적었고 그건 앱 v2.x 대의 차트다(결함 #19 · `eks_operators/defaults` 주석 참조).
#    ⇒ ArgoCD 메이저가 갈리면 AppProject·Application 스펙 해석이 달라질 수 있다.
eks_argocd_version: "10.2.1"
# 🔴 AppProject `sourceRepos` · 뿌리 Application `repoURL` 에 쓴다(templates/appprojects.yaml.j2).
# ⚠️ **이 값은 Secrets Manager 번들의 `url` 키와 반드시 같아야 한다.** 갈리면 ArgoCD 가
#    "자격증명 없는 다른 repo" 로 취급해 `repository not accessible` 이 되는데, 증상이
#    **인증 실패처럼 보여** 키를 의심하게 된다(실제 원인은 URL 불일치). 번들 값을 바꾸면 여기도 바꾼다.
eks_config_repo: "git@github.com:happyInit/mealplanning-config.git"

# 🔴 Secrets Manager 시크릿 이름 — 사람이 미리 넣어야 한다(assert 가 아니라 ESO 가 실패로 알려준다).
#    스토어 `prefix: mp/prod/` 가 앞에 붙어 실제 이름은 `mp/prod/repo-mealplanning-config` 다.
# 🔴 값은 **JSON 3키 번들**이다 — `sshPrivateKey` · `type`(= git) · `url`.
#    온프렘 `fb-secrets/repo-food-budget-config` 와 같은 모양이고, 그래서 ExternalSecret 이
#    `dataFrom.extract` 로 통째로 받는다(tasks/main.yml 의 근거 주석 참조).
#    ⚠️ 온프렘 이름은 `repo-food-budget-config` 다 — AWS 는 신규라 `mp-` 규칙을 따라 이 이름을 쓴다.
eks_argocd_repo_bundle: "repo-mealplanning-config"

# ── UI 노출 (cloudflared) + Google SSO ─────────────────────────────────────────
# 🔴 **C-85 ① 의 예외다.** 내부 도구 6종은 `kubectl port-forward` 인데 ArgoCD 만 UI 를 연다.
#    나머지 5종(Grafana 등)은 그대로다. 🟢 LB 0개(C-85)·공개 ALB 1개(C-9)는 안 깨진다 —
#    cloudflared 는 아웃바운드 QUIC 이라 인바운드 포트도 LB 도 만들지 않는다. 비용 $0.
#
# 🔴 **`argocd.mealbong.cloud` 를 쓰면 안 된다** — 온프렘 `argocd-webhook-tunnel` 이 소유 중이고
#    거기를 뺏으면 온프렘 ArgoCD 의 GitHub 웹훅이 끊긴다.
# 🔴 **`argocd.aws.mealbong.cloud` 도 안 된다** — Cloudflare Universal SSL 은 무료 플랜에서
#    **1단계 서브도메인만** 커버한다. 2단계는 인증서가 없어 브라우저가 막는다.
eks_argocd_tunnel_hostname: "argocd-aws.mealbong.cloud"

# 🔴 `cloudflared tunnel create mp-argocd-aws` 의 결과(2026-08-14 생성).
#    UUID 는 **비밀이 아니다** — `secrets.yml.example` 이 *"tunnel_id(비밀 아님)"* 라고 못박고 있고,
#    온프렘도 `group_vars/k8s_nodes.yml` 에 평문으로 둔다. 비밀은 `credentials.json`(TunnelSecret)이고
#    그건 Secrets Manager → ESO 로만 흐른다.
# ⚠️ **온프렘은 defaults 를 비우고 group_vars 에 값을 두지만 여기는 defaults 에 직접 둔다** —
#    EKS 플레이는 `connection: local` 이라 대응되는 group_vars 가 없고(변수는 Terraform output 을
#    `-e @/tmp/eks-vars.json` 으로 받는다), 이 값의 소비자도 이 롤 하나뿐이다.
# 🔴 그래도 tasks 의 assert 는 남겨 뒀다 — 이 줄을 비우고 돌리면 터널 없이 매니페스트만 올라가
#    CrashLoop 이 된다. 그때 원인을 Cloudflare 에서 찾게 되는 것을 막는 가드다.
eks_argocd_tunnel_id: "56c84cf1-831a-4d14-9aa4-0810dda9eb56"

# 🔴 Secrets Manager 번들 — 실제 이름은 prefix 가 붙어 `mp/prod/cloudflared-argocd`.
#    값 = {"tunnel_id": "<UUID>", "credentials": "<UUID>.json 내용 그대로"}
#    (GitLab 터널의 `mp/prod/cloudflared-gitlab` 과 같은 모양이다)
eks_argocd_tunnel_secret_bundle: "cloudflared-argocd"

# 🔴 GitLab 터널이 apt 로 핀한 것과 같은 버전(2026.8.0)이다. 버전을 짓지 말 것(gitlab 롤 결함 #30).
# ⚠️ CLI 가 *"2026.8.1 로 올려라"* 라고 경고하지만 **의도적으로 안 올린다** — 두 터널이 같은
#    버전이어야 한쪽에서 본 증상을 다른 쪽에 그대로 대입할 수 있다. 올릴 때는 GitLab 롤의
#    `cloudflared_version` 과 **같이** 올린다.
eks_argocd_tunnel_image: "cloudflare/cloudflared:2026.8.0"

# ── Google SSO (dex) ──────────────────────────────────────────────────────────
# 🔴 **admin 로컬 계정은 끄지 않는다 — break-glass 다.** SSO 가 깨지면 UI 로 들어갈 길이
#    없어진다. 바깥문은 Cloudflare WAF IP allowlist 가 맡으므로 방어는 여전히 두 겹이다.
# 🔴 **그래서 SSO 의 목적은 인증 강도가 아니라 감사(attribution)다.** admin 공용 계정으로
#    sync·rollback 하면 **누가 했는지 기록이 남지 않는다.** UI 에서 조작하기로 한 이상 이게 핵심이다.
#
# 🔴 Secrets Manager `mp/prod/argocd-google-oidc` = JSON 2키 번들 `clientID` · `clientSecret`.
#    Google Cloud Console 에서 OAuth 클라이언트를 만들고 승인된 리디렉션 URI 에
#      https://{{ eks_argocd_tunnel_hostname }}/api/dex/callback
#    를 등록한다. 🔴 대시보드 EC2 의 oauth2-proxy(C-84)와 **클라이언트를 공유하지 않는다** —
#    리디렉션 URI 가 다르고, 하나가 유출돼도 다른 쪽이 안 무너진다.
eks_argocd_oidc_bundle: "argocd-google-oidc"

# 🔴 RBAC 는 **이메일 단위**다. dex 의 Google 커넥터에서 groups 를 받으려면 Workspace +
#    서비스계정 도메인 위임이 필요한데 팀 계정이 개인 gmail 이라 **groups 가 아예 안 온다.**
#    ⇒ `scopes: '[email]'`(helm values)와 이 목록이 한 세트다. 한쪽만 바꾸면 로그인은 되는데
#      권한이 0 이라 빈 화면을 본다(가장 헷갈리는 실패 모드다).
# ⚠️ 팀원 이메일을 채운다. 여기 없는 계정은 로그인해도 `policy.default: ''` 라 아무것도 못 본다.
eks_argocd_admin_emails:
  - "kbs48631@gmail.com"
