---
# cloudflared 터널 — 🔴 **전체 개방 + Cloudflare WAF IP allowlist**(2026-08-14 사용자 확정)
#
# 🔴 **문지기가 cloudflared 가 아니라 Cloudflare WAF 로 바뀌었다.** 이 파일만 보고
#    *"열려 있으니 무방비"* 로 읽으면 안 되고, 반대로 *"Access 가 앞에 있겠지"* 로 읽어도 안 된다.
#    **Access 는 여전히 없다.** 지금 막고 있는 것은 존 `mealbong.cloud` 의 커스텀 룰 1개다:
#
#      gitlab-ip-allowlist  (Block · Active)
#        http.host eq "gitlab.mealbong.cloud"
#        and not ip.src in {118.131.22.86}            ← 학원 나가는 IP
#        and not starts_with(uri.path, "/.well-known/")
#        and not starts_with(uri.path, "/oauth/discovery/")
#
#    🔴 **아래 두 예외를 지우면 CI 가 죽는다** — IAM 에 OIDC 공급자가
#      `gitlab.mealbong.cloud` 로 등록돼 있어서(A-50), AWS STS 가 저 두 문서를
#      **익명·비허용 IP 로** 읽어야 한다. 실측(2026-08-14): 비허용 IP 에서
#      `/users/sign_in` = 403 · `/.well-known/openid-configuration` = 200 확인.
#
# 왜 경로 제한 모드를 걷었나 — 그 모드가 막던 것이 **git over HTTPS 와 브라우저 UI** 였고,
# 팀원 4명이 GitLab 에 들어와 작업하려면 둘 다 필요하다. 경로 규칙으로는 못 여는데
# *"인터넷 전체에 여는 것"* 과 *"열되 IP 로 거르는 것"* 은 다르다.
#
# 🔴 이 형상의 대가 = **신원이 아니라 위치로 판정한다.** 학원 밖(집·카페)에서는 막힌다.
#    그때의 대체 경로 = SSM 세션(`iam_team.tf` · #678). 두 경로는 서로 간섭하지 않는다.
# 🔴 두 번째 대가 = **인증이 GitLab 로그인 한 겹**이다. 그래서 `gitlab_server` 롤에
#    가입 차단 + 2FA 강제를 함께 넣었다(둘이 한 세트다 — 한쪽만 하면 의미가 준다).
#
# ⚠️ 정본 목표는 여전히 **C-61④ = cloudflared + Cloudflare Access(구글 SSO)** 다.
#    Access 는 **Zero Trust 플랜**이 필요하고 결제가 막혀 있다(별건 · 해외결제 카드).
#    🔵 비용이 아니라 결제수단이 블로커다 — Zero Trust 는 **50석까지 무료**이고 우리는 5명이다.
#    그게 풀리면 위 WAF 룰을 걷고 Access 앱을 얹는다. C-61④ 는 폐기가 아니라 **유예**다.

cloudflared_hostname: gitlab.mealbong.cloud
cloudflared_service_url: "http://127.0.0.1:80"

# 🔴 실측 핀(2026-08-13): `pkg.cloudflare.com` noble/arm64 = `2026.8.0`.
#    버전을 짓지 않는다(결함 #30) — `apt-cache madison cloudflared` 로 재고 쓴다.
cloudflared_version: "2026.8.0"
cloudflared_apt_keyring: /etc/apt/keyrings/cloudflare-main.gpg
cloudflared_apt_key_url: https://pkg.cloudflare.com/cloudflare-main.gpg
cloudflared_apt_repo_url: https://pkg.cloudflare.com/cloudflared

cloudflared_config_dir: /etc/cloudflared

# 🔴 자격증명은 **Secrets Manager 에서 기계가 직접 읽는다**(C-36).
#    JSON = {"tunnel_id": "...", "credentials": "<UUID>.json 내용 그대로"}
cloudflared_secret_id: mp/prod/cloudflared-gitlab

# 🔴 **지금은 쓰이지 않는다**(`cloudflared_expose_all: true` 라서). 지우지 않고 남기는 이유 =
#    이게 **되돌아갈 자리**이기 때문이다. WAF 룰이 실수로 지워지거나 존이 바뀌어 노출이
#    의심되면 `cloudflared_expose_all: false` 한 줄로 **터널 층에서** 다시 닫을 수 있다
#    (Cloudflare 대시보드를 못 여는 상황에서도 Ansible 만으로 닫힌다는 게 요점이다).
#    정규식이며 앵커(^...$)를 반드시 붙인다 — `^/oauth/` 처럼 넓히면 OAuth 가 통째로 열린다.
cloudflared_public_paths:
  - '^/\.well-known/openid-configuration$'
  - '^/oauth/discovery/keys$'

# 🔴 true = 터널은 전부 통과시키고 **차단은 Cloudflare WAF 가 한다**(머리말 참조).
#    ⚠️ **WAF 룰을 먼저 만들고 이걸 켜야 한다.** 순서를 뒤집으면 그 사이 UI 가 인터넷에 선다.
#    실측 순서(2026-08-14) = 룰 Active 확인 → 비허용 IP 403 검증 → 이 값 true.
cloudflared_expose_all: true
