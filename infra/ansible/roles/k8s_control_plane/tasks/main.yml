---
# 컨트롤플레인 부트스트랩 (master ×1). 워커 조인은 k8s_worker_join 롤.
#
# 🔴 kube-proxy 를 설치하지 않는다 — Cilium 이 eBPF 로 대체한다(status §2). 나중에 되돌리려면
#    `kubeadm init phase addon kube-proxy` 로 따로 깔 수 있지만, Cilium 의 kubeProxyReplacement
#    와 동시에 켜면 서비스 경로가 두 겹이 되어 진단이 불가능해진다.

- name: master 전용 방어
  ansible.builtin.assert:
    that: "'k8s_master' in group_names"
    fail_msg: "k8s_control_plane 롤은 master 에서만 실행한다 ({{ inventory_hostname }} 은 대상 아님)"
    quiet: true

- name: kubeadm 설정 파일
  ansible.builtin.template:
    src: kubeadm-init.yaml.j2
    dest: /etc/kubernetes/kubeadm-init.yaml
    mode: "0600"
  vars:
    k8s_version_plain: "{{ k8s_pkg_version | regex_replace('-.*$', '') }}"
  # etcd_encryption 태그로도 실행돼야 한다 — 라이브 적용(--tags etcd_encryption) 시 이 파일이
  #   enc extraArgs 를 담아야 뒤의 apiserver 재렌더가 암호화를 반영한다(안 그러면 옛 설정으로
  #   재생성돼 암호화가 안 붙는다). #445 후속 픽스.
  # cis_hardening 도 같은 이유 — profiling extraArgs 가 이 파일에 있어야 재렌더가 반영한다.
  tags: [etcd_encryption, cis_hardening]

# ── etcd at-rest 암호화: enc config 파일 (init 보다 먼저 — 신규 클러스터가 init 때 참조) ──
#    파일 생성만이라 apiserver 무영향·멱등. 라이브 적용(apiserver 재생성)은 파일 끝 etcd_encryption 태그.
- name: enc | 암호화 키 확인 (secrets.yml)
  ansible.builtin.assert:
    that:
      - etcd_encryption_key is defined
      - etcd_encryption_key | length >= 20
    fail_msg: >-
      etcd_encryption_enabled=true 인데 etcd_encryption_key 가 없다 → secrets.yml 에 넣어라
      (head -c 32 /dev/urandom | base64). secrets.yml.example 참조.
    quiet: true
  when: etcd_encryption_enabled | default(false)
  tags: [etcd_encryption]

- name: enc | 디렉토리 (/etc/kubernetes/enc, 0700 root)
  ansible.builtin.file:
    path: /etc/kubernetes/enc
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: etcd_encryption_enabled | default(false)
  tags: [etcd_encryption]

- name: enc | EncryptionConfiguration 배치 (키 포함 — no_log)
  ansible.builtin.template:
    src: encryption-config.yaml.j2
    dest: /etc/kubernetes/enc/encryption-config.yaml
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: etcd_encryption_enabled | default(false)
  tags: [etcd_encryption]

# ── 감사 로그: 정책 파일 + 로그 디렉토리 (init 보다 먼저 — 신규 클러스터가 init 때 참조) ──
#    파일·디렉토리 생성만이라 apiserver 무영향·멱등. 라이브 적용은 파일 끝 cis_hardening 태그.
#    🔴 이 둘이 apiserver 재생성보다 **먼저** 있어야 한다. 순서가 뒤집히면 apiserver 가
#       없는 정책 파일을 가리킨 채 뜨려다 **CrashLoop** 에 빠진다(= 클러스터 정지).
- name: audit | 정책 디렉토리 (/etc/kubernetes/audit, 0700 root)
  ansible.builtin.file:
    path: /etc/kubernetes/audit
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: cis_audit_enabled | default(true)
  tags: [cis_hardening]

- name: audit | 감사 정책 배치
  ansible.builtin.template:
    src: audit-policy.yaml.j2
    dest: /etc/kubernetes/audit/policy.yaml
    owner: root
    group: root
    mode: "0600"
  when: cis_audit_enabled | default(true)
  tags: [cis_hardening]

# 로그 디렉토리는 0700 이 아니라 0750 — apiserver 는 root 로 돌지만,
#   나중에 로그 수집기(Alloy 등)를 붙일 때 그룹 읽기가 필요해진다.
- name: audit | 로그 디렉토리 (/var/log/kubernetes/audit)
  ansible.builtin.file:
    path: /var/log/kubernetes/audit
    state: directory
    owner: root
    group: root
    mode: "0750"
  when: cis_audit_enabled | default(true)
  tags: [cis_hardening]

- name: 클러스터 초기화 여부 확인
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: k8s_admin_conf

# 이 명령은 되돌리기 어렵다(되돌리기 = `kubeadm reset`). admin.conf 존재를 가드로 삼아
# 재실행 시 절대 다시 돌지 않게 한다.
- name: kubeadm init (kube-proxy 스킵)
  ansible.builtin.command:
    cmd: >-
      kubeadm init
      --config /etc/kubernetes/kubeadm-init.yaml
      --skip-phases=addon/kube-proxy
  when: not k8s_admin_conf.stat.exists
  register: k8s_init
  changed_when: true

- name: kubeconfig 배치 (root · {{ ansible_user }})
  block:
    - name: .kube 디렉토리
      ansible.builtin.file:
        path: "{{ item.home }}/.kube"
        state: directory
        owner: "{{ item.user }}"
        group: "{{ item.user }}"
        mode: "0700"
      loop: &kube_users
        - { user: root, home: /root }
        - { user: "{{ ansible_user }}", home: "/home/{{ ansible_user }}" }

    - name: admin.conf → ~/.kube/config
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: "{{ item.home }}/.kube/config"
        remote_src: true
        owner: "{{ item.user }}"
        group: "{{ item.user }}"
        mode: "0600"
      loop: *kube_users

- name: apiserver 응답 확인 (부팅 직후 몇 초 걸린다)
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf get --raw=/readyz
  register: k8s_readyz
  until: k8s_readyz.rc == 0
  retries: 30
  delay: 5
  changed_when: false

# CNI 가 없으면 노드는 NotReady 이고 CoreDNS 는 Pending 이다 — **이 시점의 정상 상태다.**
# Cilium 설치(k8s_cilium 롤)가 해소한다.
- name: 현재 노드 상태 기록
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf get nodes -o wide
  register: k8s_nodes_out
  changed_when: false

- name: 노드 상태 출력
  ansible.builtin.debug:
    var: k8s_nodes_out.stdout_lines

# =====================================================================
# etcd at-rest 암호화 — 라이브 적용 (기존 클러스터 · --tags etcd_encryption)
#   🔴 apiserver 매니페스트를 kubeadm 으로 재생성 → kubelet 이 apiserver 를 재시작한다.
#      kubectl/API 가 수십초 끊긴다(워크로드는 안 죽음). 실패 시 매니페스트 백업 자동 롤백.
#   신규 클러스터는 위 enc config + init 이 이미 반영하므로 여기(재생성)는 스킵된다(rc==0).
# =====================================================================
- name: enc | apiserver 매니페스트에 이미 반영됐나
  ansible.builtin.command: grep -q encryption-provider-config /etc/kubernetes/manifests/kube-apiserver.yaml
  register: _enc_present
  failed_when: false
  changed_when: false
  when: etcd_encryption_enabled | default(false)
  tags: [never, etcd_encryption]

- name: enc | apiserver 매니페스트 백업 (manifests 밖 — kubelet 이 static pod 로 안 집게)
  ansible.builtin.copy:
    src: /etc/kubernetes/manifests/kube-apiserver.yaml
    dest: /etc/kubernetes/kube-apiserver.yaml.pre-enc
    remote_src: true
    owner: root
    group: root
    mode: "0600"
  when:
    - etcd_encryption_enabled | default(false)
    - _enc_present.rc | default(1) != 0
  tags: [never, etcd_encryption]

- name: enc | apiserver 매니페스트 재생성 (kubeadm — kubelet 이 재시작)
  ansible.builtin.command: kubeadm init phase control-plane apiserver --config /etc/kubernetes/kubeadm-init.yaml
  when:
    - etcd_encryption_enabled | default(false)
    - _enc_present.rc | default(1) != 0
  tags: [never, etcd_encryption]

- name: enc | apiserver 복귀 대기 (실패 시 자동 롤백)
  when:
    - etcd_encryption_enabled | default(false)
    - _enc_present.rc | default(1) != 0
  tags: [never, etcd_encryption]
  block:
    - name: enc | readyz 대기 (최대 2분)
      ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf get --raw=/readyz
      register: _enc_readyz
      until: _enc_readyz.rc == 0
      retries: 24
      delay: 5
      changed_when: false
  rescue:
    - name: 🔴 enc | apiserver 미복귀 → 매니페스트 롤백
      ansible.builtin.copy:
        src: /etc/kubernetes/kube-apiserver.yaml.pre-enc
        dest: /etc/kubernetes/manifests/kube-apiserver.yaml
        remote_src: true
        owner: root
        group: root
        mode: "0600"
    - name: enc | 롤백 후 복귀 대기
      ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf get --raw=/readyz
      register: _enc_rollback
      until: _enc_rollback.rc == 0
      retries: 24
      delay: 5
      changed_when: false
    - name: enc | 중단 (enc config 확인 필요)
      ansible.builtin.fail:
        msg: >-
          암호화 적용 후 apiserver 가 안 올라와 매니페스트를 롤백했다(클러스터는 암호화 없이 정상 복귀).
          /etc/kubernetes/enc/encryption-config.yaml 문법·키를 확인하라.

- name: enc | 적용 완료 안내
  ansible.builtin.debug:
    msg: >-
      etcd at-rest 암호화 적용됨. 🔴 기존 Secret 은 아직 평문 —
      재암호화: ansible-playbook k8s.yml --tags etcd_reencrypt
  when:
    - etcd_encryption_enabled | default(false)
    - _enc_present.rc | default(1) != 0
  tags: [never, etcd_encryption]

# ── 일회성: 기존 Secret 재암호화 (--tags etcd_reencrypt 로만) ──
#    replace 로 전 Secret 을 다시 써 aescbc 로 암호화. 검증 = etcd 에서 값이 k8s:enc:aescbc 인지 확인.
#    🔴 Conflict("Operation cannot be fulfilled") 는 실패로 치지 않는다 — get→replace 사이에 다른
#       주체(예: Prometheus 오퍼레이터)가 그 Secret 을 다시 썼다는 뜻이고, 그 쓰기는 이미 암호화가
#       켜진 apiserver 를 통과했으므로 해당 Secret 은 이미 암호문이다(레이스가 곧 암호화의 증거).
#       kubectl replace 는 일부만 충돌해도 rc=1 을 내므로, 충돌 외 오류가 하나라도 있을 때만 실패시킨다.
#       (오퍼레이터가 Secret 을 상시 회전시켜 이 태스크는 재실행마다 몇 개는 충돌한다 — 정상.)
- name: enc | 기존 Secret 전부 재암호화
  ansible.builtin.shell: >-
    set -o pipefail;
    kubectl --kubeconfig /etc/kubernetes/admin.conf get secrets --all-namespaces -o json
    | kubectl --kubeconfig /etc/kubernetes/admin.conf replace -f -
  args:
    executable: /bin/bash
  register: _enc_reencrypt
  changed_when: true
  failed_when:
    - _enc_reencrypt.rc != 0
    - _enc_reencrypt.stderr_lines | reject('search', 'Operation cannot be fulfilled') | select | list | length > 0
  when: etcd_encryption_enabled | default(false)
  tags: [never, etcd_reencrypt]

# =====================================================================
# CIS 하드닝 — profiling off ×3 (1.2.15 · 1.3.2 · 1.4.1) · 라이브 적용 (--tags cis_hardening)
#   근거·분류 = docs/mp_k8s_cis_benchmark_2026-08-03.md §1-A · §3
#
#   🔴 컨트롤플레인 정적 파드 3개를 kubeadm 으로 재생성한다 → kubelet 이 각각 재시작한다.
#      · apiserver 재시작 = kubectl/API 가 수십 초 끊긴다(워크로드는 안 죽는다).
#      · controller-manager·scheduler 재시작 = 리더선출이 잠깐 빈다. 그 사이 새 파드 스케줄링과
#        디플로이 롤아웃이 멈췄다 재개된다 — 배포 중에 돌리지 말 것.
#      실패 시 매니페스트 백업으로 자동 롤백(enc 패턴과 동일).
#
#   신규 클러스터는 위 init 이 템플릿을 바로 반영하므로 여기는 rc==0 으로 스킵된다.
# =====================================================================
# 🔴 체크는 **켜기로 한 항목 전부**를 봐야 한다. profiling 만 보면, 나중에 감사 로그를
#    추가했을 때 "profiling 은 이미 있으니 적용됨" 으로 판단해 재생성을 건너뛴다
#    → 감사 로그가 영영 안 붙는다(그리고 조용하다).
- name: cis | 하드닝 항목이 이미 매니페스트에 전부 반영됐나
  ansible.builtin.shell: >-
    set -o pipefail;
    {% if cis_profiling_disabled | default(true) %}
    for f in kube-apiserver kube-controller-manager kube-scheduler; do
      grep -q -- '--profiling=false' /etc/kubernetes/manifests/$f.yaml || exit 1;
    done;
    {% endif %}
    {% if cis_audit_enabled | default(true) %}
    grep -q -- '--audit-log-path=' /etc/kubernetes/manifests/kube-apiserver.yaml || exit 1;
    grep -q -- '--audit-policy-file=' /etc/kubernetes/manifests/kube-apiserver.yaml || exit 1;
    {% endif %}
    exit 0
  args:
    executable: /bin/bash
  register: _cis_prof_present
  failed_when: false
  changed_when: false
  when: (cis_profiling_disabled | default(true)) or (cis_audit_enabled | default(true))
  tags: [never, cis_hardening]

# 🔴 재생성 전에 설정을 검증한다. 재생성 루프(3개)는 rescue 밖이라, 2번째에서 죽으면
#    apiserver 만 새 설정이고 나머지는 옛 설정인 **반쪽 상태**로 플레이가 끝난다.
#    문법 오류는 여기서 전부 걸러 그 국면 자체를 안 만든다.
- name: cis | kubeadm 설정 검증 (재생성 전 게이트)
  ansible.builtin.command: kubeadm config validate --config /etc/kubernetes/kubeadm-init.yaml
  register: _cis_cfg_valid
  changed_when: false
  when:
    - (cis_profiling_disabled | default(true)) or (cis_audit_enabled | default(true))
    - _cis_prof_present.rc | default(1) != 0
  tags: [never, cis_hardening]

- name: cis | 컨트롤플레인 매니페스트 백업 (manifests 밖 — kubelet 이 static pod 로 안 집게)
  ansible.builtin.copy:
    src: "/etc/kubernetes/manifests/{{ item }}.yaml"
    dest: "/etc/kubernetes/{{ item }}.yaml.pre-cis"
    remote_src: true
    owner: root
    group: root
    mode: "0600"
  loop: [kube-apiserver, kube-controller-manager, kube-scheduler]
  when:
    - (cis_profiling_disabled | default(true)) or (cis_audit_enabled | default(true))
    - _cis_prof_present.rc | default(1) != 0
  tags: [never, cis_hardening]

- name: cis | 컨트롤플레인 매니페스트 재생성 (kubeadm — kubelet 이 재시작)
  ansible.builtin.command: >-
    kubeadm init phase control-plane {{ item }} --config /etc/kubernetes/kubeadm-init.yaml
  loop: [apiserver, controller-manager, scheduler]
  when:
    - (cis_profiling_disabled | default(true)) or (cis_audit_enabled | default(true))
    - _cis_prof_present.rc | default(1) != 0
  tags: [never, cis_hardening]

- name: cis | 컨트롤플레인 복귀 대기 (실패 시 자동 롤백)
  when:
    - (cis_profiling_disabled | default(true)) or (cis_audit_enabled | default(true))
    - _cis_prof_present.rc | default(1) != 0
  tags: [never, cis_hardening]
  block:
    - name: cis | readyz 대기 (최대 2분)
      ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf get --raw=/readyz
      register: _cis_readyz
      until: _cis_readyz.rc == 0
      retries: 24
      delay: 5
      changed_when: false

    # 🔴 apiserver 가 살아도 controller-manager·scheduler 가 죽어 있을 수 있다.
    #    readyz 만 보면 "스케줄링이 멈춘 클러스터" 를 정상으로 오판한다 — 리더선출까지 확인한다.
    - name: cis | controller-manager·scheduler 정상 확인
      ansible.builtin.shell: >-
        set -o pipefail;
        kubectl --kubeconfig /etc/kubernetes/admin.conf -n kube-system get pod
        -l 'tier=control-plane' -o jsonpath='{range .items[*]}{.metadata.name}{"="}{.status.phase}{"\n"}{end}'
        | grep -E 'controller-manager|scheduler' | grep -qv '=Running' && exit 1 || exit 0
      args:
        executable: /bin/bash
      register: _cis_cp_running
      until: _cis_cp_running.rc == 0
      retries: 24
      delay: 5
      changed_when: false
  rescue:
    - name: 🔴 cis | 컨트롤플레인 미복귀 → 매니페스트 롤백
      ansible.builtin.copy:
        src: "/etc/kubernetes/{{ item }}.yaml.pre-cis"
        dest: "/etc/kubernetes/manifests/{{ item }}.yaml"
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      loop: [kube-apiserver, kube-controller-manager, kube-scheduler]

    - name: cis | 롤백 후 복귀 대기
      ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf get --raw=/readyz
      register: _cis_rollback
      until: _cis_rollback.rc == 0
      retries: 24
      delay: 5
      changed_when: false

    - name: cis | 중단 (kubeadm 설정 확인 필요)
      ansible.builtin.fail:
        msg: >-
          profiling 적용 후 컨트롤플레인이 안 올라와 매니페스트 3개를 롤백했다(클러스터는 정상 복귀).
          /etc/kubernetes/kubeadm-init.yaml 의 extraArgs 문법을 확인하라.
