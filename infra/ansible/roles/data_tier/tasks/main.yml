---
# fb-data 데이터 티어 — Elasticsearch(nori) · Redis · Kafka(KRaft) + exporters
# PostgreSQL 은 별도(roles/tfstate_db, 같은 인스턴스에 앱 DB 분리)

- name: ES 요구 sysctl (vm.max_map_count) 영속 설정
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "262144"
    sysctl_set: true
    state: present
    reload: true

- name: data-tier 디렉토리 (빌드 컨텍스트 포함)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /opt/data-tier
    - /opt/data-tier/es

- name: Elasticsearch nori 커스텀 이미지 Dockerfile 배치
  ansible.builtin.template:
    src: es.Dockerfile.j2
    dest: /opt/data-tier/es/Dockerfile
    mode: "0644"
  register: es_dockerfile

- name: data-tier compose 배치
  ansible.builtin.template:
    src: compose.yml.j2
    dest: /opt/data-tier/docker-compose.yml
    mode: "0644"
  register: dt_compose

- name: data-tier 기동 (ES 이미지 빌드 포함)
  ansible.builtin.command:
    cmd: docker compose up -d --build
    chdir: /opt/data-tier
  changed_when: true

# --- PGSync — PG→ES CDC 배포 (design.md §330, Phase C) --------------------------
#   비-disruptive: 아티팩트 배치 + 인덱스 pre-create 는 항상. PGSync 실기동은
#   wal_level=logical(Phase 2 유지보수창) 이후에만 — compose profile 'pgsync' 게이트.
- name: PGSync 아티팩트 배치 (schema.json · plugins · 인덱스 매핑)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../deploy/pgsync/"
    dest: /opt/data-tier/pgsync/
    mode: "0644"

- name: ES 헬시 대기 (data-tier 재기동 후 부팅 완료까지 — recreate 시 연결 reset 방지)
  ansible.builtin.uri:
    url: http://localhost:9200/_cluster/health
    status_code: [200]
  register: es_health
  until: es_health.status == 200
  retries: 30
  delay: 3
  changed_when: false

- name: recipes_pgsync 인덱스 존재 확인
  ansible.builtin.uri:
    url: http://localhost:9200/recipes_pgsync
    method: GET
    status_code: [200, 404]
  register: es_recipes_pgsync
  changed_when: false

- name: recipes_pgsync 인덱스 pre-create (nori + servable 매핑 — PGSync 는 nori 안 깖)
  ansible.builtin.uri:
    url: http://localhost:9200/recipes_pgsync
    method: PUT
    body_format: json
    body: "{{ lookup('file', playbook_dir + '/../../deploy/pgsync/recipes_pgsync.index.json') | from_json }}"
    status_code: [200]
  when: es_recipes_pgsync.status == 404

- name: wal_level 확인 (PGSync 기동 전제 — Phase 2)
  ansible.builtin.command:
    cmd: docker exec tfstate-db psql -U terraform -d foodbudget -Atc "show wal_level"
  register: pg_wal_level
  changed_when: false

# PGSync 7.1.0 은 데몬(-d)이 슬롯을 자동생성하지 않음 → bootstrap 선행 필수.
# 공식 이미지가 arm64 전용이라 amd64 자체 빌드(deploy/pgsync/Dockerfile).
- name: PGSync 이미지 빌드 (amd64 — 공식 toluaina1/pgsync 는 arm64 전용)
  ansible.builtin.command:
    cmd: docker compose --profile pgsync build pgsync
    chdir: /opt/data-tier
  when: pg_wal_level.stdout == "logical"
  changed_when: true

- name: 복제슬롯 존재 확인 (bootstrap 필요 여부)
  ansible.builtin.command:
    cmd: docker exec tfstate-db psql -U terraform -d foodbudget -Atc "SELECT 1 FROM pg_replication_slots WHERE slot_name='foodbudget_recipes_pgsync'"
  register: pgsync_slot
  changed_when: false
  when: pg_wal_level.stdout == "logical"

- name: PGSync bootstrap (슬롯·트리거·MV 생성 — 슬롯 없을 때만, 멱등)
  ansible.builtin.command:
    cmd: docker compose --profile pgsync run --rm --entrypoint bootstrap pgsync -c schema.json
    chdir: /opt/data-tier
  when: pg_wal_level.stdout == "logical" and pgsync_slot.stdout != "1"
  changed_when: true

- name: PGSync 데몬 기동 (초기싱크 + CDC)
  ansible.builtin.command:
    cmd: docker compose --profile pgsync up -d pgsync
    chdir: /opt/data-tier
  when: pg_wal_level.stdout == "logical"
  changed_when: true

- name: PGSync 미기동 안내 (wal_level != logical → Phase 2 필요)
  ansible.builtin.debug:
    msg: "wal_level={{ pg_wal_level.stdout }} → PGSync 미기동. Phase 2(ALTER SYSTEM wal_level=logical + docker restart tfstate-db, 유지보수창) 후 ansible 재실행하면 기동."
  when: pg_wal_level.stdout != "logical"
