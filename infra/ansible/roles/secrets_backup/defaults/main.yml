---
# 비밀·PKI 묶음 백업 → S3 (마스터 systemd timer).
#
# 🔴 **왜 필요한가 — etcd 스냅샷만으로는 클러스터가 서지 않는다.**
#   1) etcd 는 at-rest 암호화(aescbc)가 켜져 있다. 키는 `/etc/kubernetes/enc/encryption-config.yaml`
#      에만 있고, 이걸 잃으면 스냅샷을 복원해도 **Secret 을 한 건도 못 읽는다.**
#   2) kubeadm PKI(`ca.key`·`sa.key`·`front-proxy-ca.key`·etcd CA)는 **etcd 스냅샷에 안 들어간다.**
#      `sa.key` 가 없으면 기존 ServiceAccount 토큰이 전부 무효가 되고, `ca.key` 가 없으면
#      kubelet·클라이언트 인증서를 재발급할 수 없다 = 사실상 클러스터 재구축이다.
#   즉 **etcd 백업의 값어치는 이 묶음이 있어야 성립한다.** 둘은 한 쌍이다.
#
# 🔴 **passphrase 는 반드시 오프라인에도 보관한다**(비밀번호 관리자 등).
#   묶음 안에 secrets.yml 이 들어 있어 passphrase 도 그 안에 있지만, 그건 **묶음을 연 뒤**의 얘기다.
#   passphrase 를 잃으면 S3 에 있어도 못 연다. 2026-07-29 묶음이 정확히 이 이유로 열 수 없게 됐다
#   (당시 passphrase 파일 `~/backups/SECRETS-PASSPHRASE-20260729.txt` 가 워크스테이션에서 소실).

secrets_backup_local_dir: /var/backups/secrets
secrets_backup_local_keep: 3                  # 로컬은 최근 3개 (S3 가 정본)
secrets_backup_s3_bucket: mp-backup-ap2       # 구 묶음과 같은 버킷·프리픽스를 승계
secrets_backup_s3_prefix: secrets
secrets_backup_s3_retention_days: 120         # 주1회 → ~17개 보존

# systemd timer — 매주 일요일 02:30 KST (etcd 02:00 뒤 = 같은 밤의 스냅샷과 짝이 맞는다)
secrets_backup_schedule: "Sun *-*-* 02:30:00 Asia/Seoul"
secrets_backup_randomized_delay_sec: 300

secrets_backup_script: /usr/local/sbin/mp-secrets-backup.sh
secrets_backup_env_file: /etc/mp-secrets-backup.env

# 마스터에 올려둘 "컨트롤 머신 전용 비밀" 사본. 타이머가 이 디렉토리를 함께 묶는다.
#   워크스테이션에만 있는 파일은 그 PC 가 죽으면 같이 사라진다 — 마스터는 이미 etcd 로 훨씬
#   민감한 것을 다 쥐고 있으므로(root 0600), 여기 두는 것의 한계노출 증가는 사실상 없다.
secrets_backup_vault_dir: /etc/mp-secrets-vault
secrets_backup_include_control_files: true

# 없는 파일은 조용히 건너뛴다(경고는 남긴다). src 는 컨트롤 머신 기준.
secrets_backup_control_files:
  - src: "{{ playbook_dir }}/secrets.yml"
    dest: ansible/secrets.yml
  - src: "{{ playbook_dir }}/../certs/ca.key"
    dest: local-ca/ca.key
  - src: "{{ playbook_dir }}/../certs/ca.crt"
    dest: local-ca/ca.crt
  - src: "{{ playbook_dir }}/../certs/ca.srl"
    dest: local-ca/ca.srl
  - src: "{{ playbook_dir }}/../terraform/credentials.env"
    dest: terraform/credentials.env
  - src: "{{ playbook_dir }}/../terraform/backend.conf"
    dest: terraform/backend.conf

# 마스터에서 묶을 대상 (경로 → 묶음 안 디렉토리명)
secrets_backup_master_paths:
  - src: /etc/kubernetes/pki
    dest: kubernetes-pki
  - src: /etc/kubernetes/enc
    dest: kubernetes-enc

backup_s3_region: ap-northeast-2
