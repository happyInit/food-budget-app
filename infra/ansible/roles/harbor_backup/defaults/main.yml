---
# Harbor 백업 → S3 (호스트 C systemd timer). 대상 = DB + 암호화키 + 설정 + 인증서.
#   이미지 blob(/data/registry)은 제외 — CI 재빌드 가능(백업전략 §2·§7). DB·키·설정·인증서는 재생성 어려움.
#   🔴 /data/secret(암호화키)이 없으면 복원해도 DB 안의 암호화 값을 못 푼다 → 반드시 포함.

harbor_backup_db_container: harbor-db
harbor_backup_db_user: postgres              # harbor-db 컨테이너 로컬 trust 인증 (무암호 pg_dumpall)
harbor_backup_secret_dir: /data/secret       # Harbor 암호화키 (keys/secretkey · core/private_key · registry/root.crt)
harbor_backup_config: /opt/harbor-installer/harbor/harbor.yml
harbor_backup_cert_dir: "{{ harbor_cert_dir | default('/opt/harbor-certs') }}"   # TLS (group_vars/ci.yml)

harbor_backup_local_dir: /var/backups/harbor
harbor_backup_local_keep: 2
harbor_backup_s3_prefix: harbor
harbor_backup_s3_retention_days: 14

# 매일 02:20 KST (etcd 02:00 뒤 · PG base 03:00 앞)
harbor_backup_schedule: "*-*-* 02:20:00 Asia/Seoul"
harbor_backup_randomized_delay_sec: 120

harbor_backup_script: /usr/local/sbin/mp-harbor-backup.sh
harbor_backup_env_file: /etc/mp-harbor-backup.env

# S3 대상 — 공통 백업 버킷. 자격증명(backup_s3_access_key/secret_key)은 secrets.yml (etcd 백업과 공유).
backup_s3_bucket: mp-backup-ap2
backup_s3_region: ap-northeast-2
