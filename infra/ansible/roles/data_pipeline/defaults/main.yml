---
# fb-data 수집 파이프라인 — pull 기반(image-only) 배포.
#   이미지는 CI(build-push-pipeline.yml)가 Harbor push, 이 롤은 pull 만 (로컬 빌드 X → 드리프트 차단).
#   소스 트리는 배치하지 않음 — compose(image-only) + 폴러 스크립트 + .env 만.
dp_dir: /opt/data-pipeline                    # ansible 소유 배포 경로 (구 dp_legacy_dir 대체)
dp_legacy_dir: /home/ubuntu/food-budget-app   # 구 rsync/git 복사본(드리프트 원천) — .env·크롤상태 마이그레이션 소스
dp_owner: ubuntu                              # 배포 파일 소유자 (크론/compose 실행은 root — ansible 기본 become)

# data-pipeline·crawler-kurly 공통 이미지 태그 핀 = build-push-pipeline.yml 의 APP_VERSION.
#   릴리스마다 올림. latest 자동빌드를 원하면 dp_image_tag=latest 로 오버라이드.
# 1.1.8 = 오아시스 딜 discovery 복구(딜 페이지 HTML 파싱). 마감세일 1→56종·타임세일 1→63종.
#   ⚠️ 병합·배포 전 build-push-pipeline.yml APP_VERSION=1.1.8 릴리스 런으로 :1.1.8 가 Harbor 에 있어야 함.
dp_image_tag: "1.1.8"

# 상주 컨슈머 (default profile → up -d). 폴러는 profile 'poller' 로 cron 실행(install-pollers.sh).
dp_consumers:
  - retail-refiner
  - deal-notifier
  - recipe-refiner
  - deal-pruner
  - user-event-sink      # 클릭스트림 컨슈머(events.user.activity → activity.user_event, Track 1 §2)
  - user-data-pruner     # activity/chat 원문 보존정리(180일, Track 1 §4)
  - chat-insights        # 대화분석 배치(chat_message → 리포트·선호·의도, 일1회). 데이터無면 graceful skip(#127 write 후 가동)

dp_poller_log_dir: /var/log/fb-pollers        # run-poller.sh 로그 (dp_owner 쓰기 가능해야 함)
