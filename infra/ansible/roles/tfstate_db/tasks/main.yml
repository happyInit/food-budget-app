---
- name: tfstate-db 디렉토리
  ansible.builtin.file:
    path: /opt/tfstate-db
    state: directory
    mode: "0755"

- name: tfstate-db compose 배치
  ansible.builtin.template:
    src: compose.yml.j2
    dest: /opt/tfstate-db/docker-compose.yml
    mode: "0600" # 비밀번호 포함

- name: PostgreSQL(state) 기동
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: /opt/tfstate-db
  changed_when: true
