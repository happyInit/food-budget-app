---
- name: tfstate-db 디렉토리
  ansible.builtin.file:
    path: /opt/tfstate-db
    state: directory
    mode: "0755"

- name: tfstate-db compose 배치
  ansible.builtin.template:
    src: compose.yml.j2
    dest: /opt/tfstate-db/docker-compose.yml
    mode: "0600" # 비밀번호 포함

- name: PostgreSQL(공유) 기동
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: /opt/tfstate-db
  changed_when: true

- name: PostgreSQL 헬시 대기
  ansible.builtin.command:
    cmd: docker exec tfstate-db pg_isready -U terraform
  register: pg_ready
  until: pg_ready.rc == 0
  retries: 15
  delay: 2
  changed_when: false

# --- 앱 OLTP DB/롤 (terraform_state 와 분리, 같은 인스턴스) -------------------
- name: 앱 롤(fbapp) 생성·비번 동기화 — 멱등
  ansible.builtin.command:
    cmd: >
      docker exec tfstate-db psql -U terraform -d postgres -v ON_ERROR_STOP=1 -tAc
      "DO $$ BEGIN
         IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='fbapp') THEN
           CREATE ROLE fbapp LOGIN PASSWORD '{{ app_db_password }}';
         ELSE
           ALTER ROLE fbapp LOGIN PASSWORD '{{ app_db_password }}';
         END IF;
       END $$;"
  changed_when: false
  no_log: true # 비밀번호 포함

- name: 앱 DB(foodbudget) 존재 확인
  ansible.builtin.command:
    cmd: docker exec tfstate-db psql -U terraform -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='foodbudget'"
  register: fb_db
  changed_when: false

- name: 앱 DB(foodbudget) 생성 — 소유자 fbapp
  ansible.builtin.command:
    cmd: docker exec tfstate-db psql -U terraform -d postgres -c "CREATE DATABASE foodbudget OWNER fbapp"
  when: fb_db.stdout != "1"
  changed_when: true

# --- P2 준비: CNPG 스트리밍 복제 소스 설정 (런북 §2-A-4 / Q7) --------------------
#   K8s 의 CNPG 가 `externalClusters` + pg_basebackup 으로 이 PG 를 따라잡는다.
#   전부 **비-disruptive**(reload 만, 재시작 없음) — 실서비스 무영향.
#
#   🔴 실측 전제(런북 §9-2): 이 PG 의 pg_hba 에는 `host all all all` 은 있어도
#      **replication 라인이 localhost 전용**이라 원격 복제가 그대로는 불가능하다.
- name: 복제 롤(streaming_replica) 생성·비번 동기화 — 멱등 (LOGIN+REPLICATION)
  ansible.builtin.command:
    cmd: >
      docker exec tfstate-db psql -U terraform -d postgres -v ON_ERROR_STOP=1 -tAc
      "DO $$ BEGIN
         IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='streaming_replica') THEN
           CREATE ROLE streaming_replica LOGIN REPLICATION PASSWORD '{{ streaming_replica_password }}';
         ELSE
           ALTER ROLE streaming_replica LOGIN REPLICATION PASSWORD '{{ streaming_replica_password }}';
         END IF;
       END $$;"
  changed_when: false
  no_log: true # 비밀번호 포함

# 파드→VM 트래픽은 **노드 IP 로 SNAT** 되므로 대상은 파드 CIDR 이 아니라 노드 IP 다(Q7).
# `.20` = worker-a1(P1 후 생성, 2026-07-28 ARP 실측으로 미점유 확인) — 미리 넣어 둔다.
# ⚠️ 컨테이너 안에서 `docker exec ... sh -c "... >> ..."` 로 붙이려 했더니 command 모듈의
#    인자 분해에 걸려 **조용히 아무것도 안 하고 ok 로 끝났다**(2026-07-28 실측 — rc=0 이라
#    실패로도 안 잡힌다). 볼륨의 호스트 경로에 `lineinfile` 을 쓰면 멱등성이 모듈 책임이 된다.
- name: pg_hba 에 복제 허용 라인 추가 — 멱등 (노드 IP ×4)
  ansible.builtin.lineinfile:
    path: /var/lib/docker/volumes/tfstate-db_tfstate_pg/_data/pg_hba.conf
    line: "host    replication     streaming_replica    {{ item }}/32    scram-sha-256"
    regexp: "^host\\s+replication\\s+streaming_replica\\s+{{ item | regex_escape }}/32"
    insertafter: EOF
    state: present
  loop: "{{ k8s_node_ips | default(['192.168.0.17', '192.168.0.18', '192.168.0.19', '192.168.0.20']) }}"
  notify: reload postgres hba

# 🔴 슬롯을 쓰지 않는 대신 WAL 을 넉넉히 남긴다(Q7·§9-6). 고아 슬롯이 디스크를 잠식하는
#    실패 모드보다, 뒤처지면 재-basebackup(분 단위) 하는 쪽이 싸다는 판단.
- name: wal_keep_size = 1GB (reload 로 반영되는 파라미터)
  ansible.builtin.command:
    cmd: >
      docker exec tfstate-db psql -U terraform -d postgres -v ON_ERROR_STOP=1 -tAc
      "ALTER SYSTEM SET wal_keep_size = '1GB'"
  changed_when: false

- name: 설정 reload (pg_hba + wal_keep_size 반영 — 재시작 아님)
  ansible.builtin.command:
    cmd: docker exec tfstate-db psql -U terraform -d postgres -tAc "SELECT pg_reload_conf()"
  changed_when: false

# --- PGSync 복제 롤 (PG→ES 색인 동기화 프리컨디션, design.md §330) --------------
#   비-disruptive: 롤 생성/GRANT만 (PG 재시작 없음). wal_level=logical 전환은 별도
#   유지보수창(재시작 필요) — docs/pgsync-adoption.md 참조.
- name: PGSync 롤(pgsync) 생성·비번 동기화 — 멱등 (LOGIN+REPLICATION)
  ansible.builtin.command:
    cmd: >
      docker exec tfstate-db psql -U terraform -d postgres -v ON_ERROR_STOP=1 -tAc
      "DO $$ BEGIN
         IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='pgsync') THEN
           CREATE ROLE pgsync LOGIN REPLICATION PASSWORD '{{ pgsync_db_password }}';
         ELSE
           ALTER ROLE pgsync LOGIN REPLICATION PASSWORD '{{ pgsync_db_password }}';
         END IF;
       END $$;"
  changed_when: false
  no_log: true # 비밀번호 포함

- name: PGSync 롤 권한(foodbudget) — 스키마 CREATE + 대상테이블 SELECT/TRIGGER, 멱등
  # public.CREATE = 트리거함수·머티리얼라이즈드뷰(_view) 생성용. TRIGGER = 변경캡처 트리거
  # 생성(테이블 소유는 fbapp). 대상 테이블 미존재(fresh 인프라)면 GRANT 스킵(to_regclass 가드).
  ansible.builtin.command:
    cmd: >
      docker exec tfstate-db psql -U terraform -d foodbudget -v ON_ERROR_STOP=1 -c
      "GRANT USAGE, CREATE ON SCHEMA public TO pgsync;
       DO $$ BEGIN
         IF to_regclass('public.recipe') IS NOT NULL THEN
           GRANT SELECT, TRIGGER ON public.recipe TO pgsync;
         END IF;
         IF to_regclass('public.recipe_ingredient') IS NOT NULL THEN
           GRANT SELECT, TRIGGER ON public.recipe_ingredient TO pgsync;
         END IF;
       END $$;"
  changed_when: false

- name: PGSync _view SELECT → fbapp (table_notify 트리거가 write 롤 권한으로 _view 읽음)
  # table_notify()=SECURITY INVOKER → recipe write 하는 fbapp 이 pgsync 소유 _view(MV)를 SELECT 해야 함.
  # 없으면 write 마다 InsufficientPrivilege → 컨슈머(recipe-refiner) 크래시. _view 는 pgsync bootstrap 이
  # 만들므로 to_regclass 가드. ALTER DEFAULT PRIVILEGES = 향후 재-bootstrap(_view 재생성) 시 자동 부여.
  ansible.builtin.command:
    cmd: >
      docker exec tfstate-db psql -U terraform -d foodbudget -v ON_ERROR_STOP=1 -c
      "ALTER DEFAULT PRIVILEGES FOR ROLE pgsync IN SCHEMA public GRANT SELECT ON TABLES TO fbapp;
       DO $$ BEGIN
         IF to_regclass('public._view') IS NOT NULL THEN
           GRANT SELECT ON public._view TO fbapp;
         END IF;
       END $$;"
  changed_when: false
