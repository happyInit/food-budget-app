---
# GitLab 하드닝 — 🔴 **UI 를 인터넷 쪽으로 여는 것과 한 세트다**(2026-08-14)
#
# `gitlab_cloudflared` 가 `expose_all: true` 로 가면서 **인증이 GitLab 로그인 한 겹**이 됐다.
# Cloudflare WAF IP allowlist 가 앞에 있지만 그건 **위치**를 보지 **신원**을 보지 않는다 —
# 학원 네트워크 안에 있는 누구든(혹은 그 네트워크를 밟은 누구든) 로그인 화면까지는 온다.
# ⇒ 그 한 겹을 실제로 쓸 만하게 만드는 것이 이 롤이다. **둘 중 하나만 하면 의미가 준다.**
#
# 🔴 **왜 `gitlab.rb` 가 아니라 API 인가** — `gitlab_rails['gitlab_signup_enabled']` 같은 키는
#    **최초 초기화 때 DB(`application_settings`)에 심어질 뿐**이고, 그 뒤로는 DB 값이 이긴다.
#    이미 도는 인스턴스에 `gitlab.rb` 로 넣으면 `reconfigure` 는 성공하는데 **설정은 안 바뀐다** —
#    가장 나쁜 실패 모양이다(성공했다고 믿게 된다). ⇒ 정본은 Application Settings API.
#
# 🔴 **REST `/api/v4` 로만 간다** — 내부 Rails 서비스 클래스는 버전마다 시그니처가 달라
#    조용히 깨진다(A0.5 결함 #32). `gitlab-rails runner` 는 **임시 토큰 발급/폐기 두 곳**만.

# ── 가입 차단 ────────────────────────────────────────────────────────────────
# 🔴 **켜는 순간 팀원이 스스로 가입할 수 없다.** 계정은 관리자가 만든다
#    (Admin → Users → New user, 또는 `POST /api/v4/users`).
#    이걸 모르고 열면 *"주소는 열렸는데 아무도 못 들어온다"* 가 된다.
gitlab_hardening_signup_enabled: false

# ── 2FA — 🔴 **전원 강제에서 root 만으로 축소**(2026-08-14 사용자 확정) ──────
#
# 처음에 `true`(전 사용자 강제)로 넣었다가 **되돌렸다.** 근거를 남긴다.
#
# 🔴 **되돌린 이유는 불편이 아니라 복구 비용이다.** 2FA 기기를 잃으면 자력 복구 수단은
#    등록 시 한 번 보여주는 복구 코드뿐이고, 그것마저 없으면 **서버 셸이 유일한 길**이다:
#      `gitlab-rails runner "User.find_by_username('<이름>').disable_two_factor!"`
#    ⇒ 전원 강제 = **5명 × 잠길 확률**이고, 잠긴 사람마다 SSM 세션 권한자가 붙어야 한다.
#      발표를 앞둔 국면에서 그 사고 비용이 막는 위험보다 크다고 판단했다.
#
# 🟢 **대신 root 는 개별적으로 2FA 를 켠다.** 인스턴스 전역 강제(`require_...`)와
#    개인 2FA 는 별개다 — 이 값을 false 로 둬도 이미 등록한 사람의 2FA 는 그대로 산다.
#    지키려는 대상이 실제로는 root 하나다: 브랜치 보호·OIDC 설정·사용자 권한을 다 바꿀 수 있다.
#
# 🔴 **이 축소가 성립하려면 상쇄 조건 2개가 있어야 한다.** 둘 다 없으면 다시 켜야 한다.
#    ⓐ **기본 브랜치 보호**(아래 `gitlab_hardening_protect_default_branch`) —
#       없으면 Developer 가 `main` 에 push 할 수 있고, `mp-ci-job` 의 OIDC 신뢰가
#       `ref:main` 이라 **그 push 가 곧 ECR 자격증명**이 된다(`iam_ci_oidc.tf`).
#    ⓑ **팀원 역할 = Reporter** — 지금 이 레인의 목표가 *"들어와서 보기"* 까지이고
#       정본은 여전히 GitHub 이다(A-51② 미완). Developer 를 주는 것은 A-51② 와 함께다.
#       🔵 이건 코드가 아니라 운영 결정이라 여기서 강제하지 않는다 — 위 ⓐ가 코드 쪽 보루다.
gitlab_hardening_require_2fa: false

# 유예 시간(시간 단위). `require_2fa: true` 일 때만 의미가 있다.
# 🔴 0 으로 두지 말 것 — 지금 로그인해 있는 관리자까지 즉시 잠글 수 있다.
gitlab_hardening_2fa_grace_period_hours: 24

# ── 기본 브랜치 보호 (위 ⓐ) ─────────────────────────────────────────────────
# 🔴 **`allow_force_push` 를 true 로 만든다 — 약하게 하려는 게 아니라 `gitlab_repo_sync`
#    와 싸우지 않기 위해서다.** 그 롤은 GitHub → GitLab 단방향 재동기화 직전에 이 필드를
#    켠다(정본이 GitHub 인 동안 GitLab 을 덮어써야 하므로). 여기서 false 로 두면 두 롤이
#    매 실행 서로를 되돌려 **멱등이 깨지고 어느 쪽이 이겼는지도 알 수 없게 된다.**
#    🟢 보호의 실체는 `push_access_level` 이다 — force 든 아니든 **Developer 는 아예 못 민다.**
# 🔴 A-51② 로 정본이 GitLab 이 되면 `gitlab_sync_enabled: false` 와 함께 이 값을 다시 좁힌다.
gitlab_hardening_protect_default_branch: true
gitlab_hardening_project: "{{ gitlab_ci_project | default('happyInit/food-budget-app') }}"
gitlab_hardening_default_branch: "{{ gitlab_default_branch | default('main') }}"
# 40 = Maintainer. 🔴 "No one"(0)으로 두면 재동기화까지 막혀 GitLab 이 조용히 낡는다.
gitlab_hardening_push_access_level: 40
gitlab_hardening_merge_access_level: 40

# ── 무차별 대입 완화 ────────────────────────────────────────────────────────
# 🔵 Omnibus 기본값이 이미 있지만 **명시한다** — 기본값은 버전이 바뀌면 말없이 변한다.
#    이 둘은 로그인 화면이 인터넷 쪽에 서는 형상에서 유일하게 남는 자동 방어다.
gitlab_hardening_throttle_unauthenticated: true
gitlab_hardening_throttle_authenticated_api: true
