---
# Karpenter — 🔴 오퍼레이터 **뒤에** 온다. NodePool 이 뜨는 순간 노드가 늘 수 있고,
#    그때 cert-manager·CNPG·ECK 웹훅이 없으면 새 노드의 파드가 검증 실패로 못 뜬다.

- name: 필수 변수
  ansible.builtin.assert:
    that:
      - irsa_karpenter is defined and irsa_karpenter | length > 0
      - karpenter_queue_name is defined and karpenter_queue_name | length > 0
      - karpenter_node_role is defined and karpenter_node_role | length > 0
    fail_msg: "Terraform karpenter.tf 의 output 3개가 필요하다 (irsa_karpenter · karpenter_queue_name · karpenter_node_role)"
    quiet: true

# Karpenter 차트는 OCI 레지스트리(public ECR)에 있다 — helm repo add 가 아니다.
- name: Karpenter 설치
  kubernetes.core.helm:
    name: karpenter
    chart_ref: "oci://public.ecr.aws/karpenter/karpenter"
    chart_version: "{{ eks_karpenter_version }}"
    release_namespace: kube-system
    kubeconfig: "{{ eks_kubeconfig }}"
    values:
      settings:
        clusterName: "{{ eks_cluster_name }}"
        # 🔴 인터럽션 큐 — Spot 을 안 쓰는데도 필요하다(Terraform karpenter.tf 주석):
        #    예정된 유지보수·인스턴스 상태 변경 통지를 여기서 받는다. 없으면 노드가
        #    drain 없이 사라진다.
        interruptionQueue: "{{ karpenter_queue_name }}"
      serviceAccount:
        annotations:
          eks.amazonaws.com/role-arn: "{{ irsa_karpenter }}"
      # 🔴 컨트롤러는 **MNG(층1) 위에서 돈다.** 자기가 만든 노드에서 돌면
      #    그 노드를 회수할 때 자기를 죽이는 순환이 된다.
      controller:
        # ══ CPU request 200m → 100m (2026-08-14 실측) ═══════════════════════════
        # 🔴 **replica 2 라 400m 이다** — 노드 2대 allocatable 7,840m 중 request 가
        #    **7,380m(94%)** 인데 실사용은 **506m(6.5%)** 였다. 이 둘이 5.1%p 를 차지한다.
        # 실측 = 7일 창 최대 **10m / 0m**(리더 / 대기 · 관측 25시간).
        #    Karpenter 컨트롤러는 **노드를 만들거나 회수할 때만** 일하고 평시엔 조용하다.
        # 🟢 **cpu limit 이 없다**(아래 limits 는 메모리뿐) — 진짜 스케일 이벤트가 오면
        #    노드 여유만큼 쓴다. requests 는 상한이 아니다.
        # 🔴 **replica 는 2를 유지한다.** 리더 선출로 HA 를 맞추는 구조라 1로 줄이면
        #    컨트롤러가 죽는 동안 **노드 확장·회수가 통째로 멈춘다.** 줄일 것은 replica 가
        #    아니라 예약이다.
        # ⚠️ 메모리 512Mi 는 그대로다 — `limits` 와 같은 값이라 Guaranteed 급 보호를 받고 있고,
        #    Karpenter 는 클러스터 상태를 메모리에 캐시해 노드가 늘면 함께 큰다.
        resources:
          requests: { cpu: 100m, memory: 512Mi }
          limits: { memory: 512Mi }
    wait: true
    wait_timeout: 10m

- name: NodePool · EC2NodeClass 매니페스트
  ansible.builtin.template:
    src: nodepool.yaml.j2
    dest: "{{ lookup('env', 'HOME') }}/.mp-eks-karpenter-nodepool.yaml"
    mode: "0644"

# 🔴 `kubernetes.core.k8s` 대신 `kubectl` — 근거는 `eks_operators/tasks/main.yml` 의 같은 지점 주석.
- name: NodePool 드리프트 확인
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ eks_kubeconfig }} diff
    -f {{ lookup('env', 'HOME') }}/.mp-eks-karpenter-nodepool.yaml
  register: eks_np_diff
  changed_when: false
  failed_when: eks_np_diff.rc > 1

- name: NodePool 적용
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ eks_kubeconfig }} apply
    -f {{ lookup('env', 'HOME') }}/.mp-eks-karpenter-nodepool.yaml
  changed_when: eks_np_diff.rc == 1

- name: 안내 — 평시 0대가 정상
  ansible.builtin.debug:
    msg: >-
      NodePool 이 떴어도 노드는 0대다(C-45 "평시 0대"). taint `mp.io/burst` 를 견디는 파드가
      생길 때만 산다. 확인 = kubectl get nodeclaims (비어 있어야 정상).
