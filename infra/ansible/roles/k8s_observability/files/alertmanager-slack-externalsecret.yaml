# alertmanager Slack 웹훅 — fb-secrets(정본) ──ESO──▶ observability ns (pipelines/app-secrets 와 동일 패턴).
# 🔴 선행조건: fb-secrets 에 Secret `alertmanager-slack` 적재(webhook_default·webhook_critical) —
#    값 = 구 `.11` /opt/monitoring/alertmanager.yml 의 api_url 2개(#monitoring · #alerts-critical).
#    alertmanagerSpec.secrets 가 이 산출물을 마운트하므로, 없으면 alertmanager 파드가 기동을 못 한다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mp-alertmanager-slack
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fb-kubernetes
  target:
    name: mp-alertmanager-slack
    creationPolicy: Owner
  data:
    - secretKey: webhook_default
      remoteRef: {key: alertmanager-slack, property: webhook_default}
    - secretKey: webhook_critical
      remoteRef: {key: alertmanager-slack, property: webhook_critical}
