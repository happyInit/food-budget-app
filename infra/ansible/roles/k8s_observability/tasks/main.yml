---
# 관측 — kube-prometheus-stack(클러스터 계층) + metrics-server(HPA 전제).
# 앱·데이터 관측과 Slack 알림은 P4 까지 VM `.11` 이 계속 담당한다.

- name: master 전용 방어
  ansible.builtin.assert:
    that: "'k8s_master' in group_names"
    fail_msg: "k8s_observability 는 master 에서만 실행한다"
    quiet: true

- name: Grafana 관리자 비밀번호 필수
  ansible.builtin.assert:
    that:
      - grafana_admin_password is defined
      - grafana_admin_password | length >= 8
    fail_msg: "secrets.yml 에 grafana_admin_password 를 넣을 것(8자 이상)"
    quiet: true

- name: helm 저장소
  kubernetes.core.helm_repository:
    name: "{{ item.name }}"
    repo_url: "{{ item.url }}"
  loop:
    - { name: prometheus-community, url: "https://prometheus-community.github.io/helm-charts" }
    # 🔴 끝에 `/` 를 붙이지 말 것. helm_repository 모듈은 **선언 URL만** rstrip("/") 한 뒤
    #    helm 에 저장된 URL 과 문자열 비교한다 → 저장본에 `/` 가 남아 있으면 영원히
    #    "Repository already have a repository named ..." 로 실패한다(2026-08-03 실측).
    #    이미 `/` 로 등록된 클러스터는 `helm repo add --force-update <name> <슬래시 없는 URL>` 로 1회 교정.
    - { name: metrics-server, url: "https://kubernetes-sigs.github.io/metrics-server" }
  loop_control:
    label: "{{ item.name }}"
  # node-exporter 만 따로 손볼 때도 저장소는 필요하다 → 같은 태그를 단다.
  tags: [node_exporter]

- name: kube-prometheus-stack values
  ansible.builtin.template:
    src: kube-prometheus-stack-values.yaml.j2
    dest: /etc/kubernetes/kube-prometheus-stack-values.yaml
    mode: "0600" # Grafana 관리자 비번 포함
  no_log: true

# ── alertmanager Slack 웹훅 배선 (모니터링 컷오버 2026-07-30: 알림 라우팅 .11 → in-cluster) ──
# 🔴 선행조건: fb-secrets 에 Secret `alertmanager-slack`(webhook_default·webhook_critical) 적재.
#    없으면 아래 물질화 대기에서 멈춘다 — values 의 alertmanagerSpec.secrets 가 이 Secret 을
#    마운트해서, 없으면 alertmanager 파드 기동 자체가 안 되기 때문에 여기서 미리 막는다.
- name: alertmanager Slack ExternalSecret 배치
  ansible.builtin.copy:
    src: alertmanager-slack-externalsecret.yaml
    dest: "{{ k8s_manifest_dir }}/alertmanager-slack-externalsecret.yaml"
    mode: "0644"

- name: alertmanager Slack ExternalSecret 드리프트 확인
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ k8s_kubeconfig }} diff -f {{ k8s_manifest_dir }}/alertmanager-slack-externalsecret.yaml
  register: k8s_obs_es_diff
  changed_when: false
  failed_when: k8s_obs_es_diff.rc > 1

- name: alertmanager Slack ExternalSecret 적용
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ k8s_kubeconfig }} apply -f {{ k8s_manifest_dir }}/alertmanager-slack-externalsecret.yaml
  changed_when: k8s_obs_es_diff.rc == 1

- name: Slack 웹훅 Secret 물질화 대기 (ESO 가 fb-secrets 에서 당겨온다)
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ k8s_kubeconfig }} -n observability get secret mp-alertmanager-slack -o name
  register: k8s_obs_am_secret
  until: k8s_obs_am_secret.rc == 0
  retries: 12
  delay: 5
  changed_when: false

- name: kube-prometheus-stack 설치
  kubernetes.core.helm:
    name: kube-prometheus-stack
    chart_ref: prometheus-community/kube-prometheus-stack
    chart_version: "{{ kube_prom_stack_version }}"
    release_namespace: observability
    create_namespace: false # k8s_cluster_base 가 PSS 라벨과 함께 만든다
    kubeconfig: "{{ k8s_kubeconfig }}"
    values_files:
      - /etc/kubernetes/kube-prometheus-stack-values.yaml
    wait: true
    wait_timeout: 15m

# ── node-exporter (kube-system) ────────────────────────────────────────────
# 위 values 주석 참조 — 호스트 접근이 필요해 PSS baseline ns 에 못 산다.
# kube-system 은 PSS 라벨이 없어(=privileged) cilium·istio-cni 와 같은 자리에 둔다.
  # 단독 적용: --tags node_exporter (kube-prometheus-stack 을 건드리지 않는다)
- name: node-exporter 설치 (kube-system)
  tags: [node_exporter]
  kubernetes.core.helm:
    name: node-exporter
    chart_ref: prometheus-community/prometheus-node-exporter
    chart_version: "{{ node_exporter_chart_version }}"
    release_namespace: kube-system
    kubeconfig: "{{ k8s_kubeconfig }}"
    values:
      prometheus:
        monitor:
          enabled: true # ServiceMonitor 생성 → Prometheus 가 ns 상관없이 잡는다
      # textfile collector — 호스트 레벨 스크립트가 내보내는 메트릭을 읽는다(백업 신선도 등).
      #   🔴 차트 기본값은 디렉토리 미지정이라 collector 는 등록만 되고 **아무 파일도 안 읽는다**
      #      (`node_textfile_scrape_error` 가 보인다고 켜진 게 아니다 — 2026-08-03 실측).
      #   경로에 `/host/root` 접두사가 붙는 이유: 차트가 호스트 `/` 를 거기에 마운트한다.
      extraArgs:
        - --collector.textfile.directory=/host/root/var/lib/node_exporter/textfile_collector
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
    wait: true
    wait_timeout: 10m

# ── metrics-server ─────────────────────────────────────────────────────────
# 🔴 `--kubelet-insecure-tls` 를 켠다. kubelet 의 서빙 인증서는 기본이 자기서명이라
#    metrics-server 가 검증에 실패한다. 정석은 kubelet `serverTLSBootstrap: true` +
#    CSR 승인 루프인데, 승인이 수동으로 남으면 노드 추가 때마다 조용히 막힌다.
#    내부망 단일 클러스터라 지금은 이 트레이드오프를 받아들이고, 나중에 CSR 자동승인을
#    붙일 때 전환한다(전환은 kubelet 설정 + 이 플래그 제거로 끝난다).
- name: metrics-server 설치
  kubernetes.core.helm:
    name: metrics-server
    chart_ref: metrics-server/metrics-server
    chart_version: "{{ metrics_server_version }}"
    release_namespace: kube-system
    kubeconfig: "{{ k8s_kubeconfig }}"
    values:
      args:
        - --kubelet-insecure-tls
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
    wait: true
    wait_timeout: 10m

- name: metrics API 응답 확인 (HPA 의 전제 — 없으면 P3 에서 막힌다)
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ k8s_kubeconfig }} top nodes --no-headers
  register: k8s_top
  until: k8s_top.rc == 0
  retries: 12
  delay: 10
  changed_when: false

- name: 노드 사용량 출력
  ansible.builtin.debug:
    var: k8s_top.stdout_lines
