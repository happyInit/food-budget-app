---
# SonarQube 내장 Elasticsearch 요구 커널 파라미터 (없으면 부팅 중 죽음).
- name: sysctl vm.max_map_count (SonarQube ES 요구)
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "524288"
    sysctl_set: true
    state: present
    reload: true

- name: sysctl fs.file-max
  ansible.posix.sysctl:
    name: fs.file-max
    value: "131072"
    sysctl_set: true
    state: present
    reload: true

- name: SonarQube 디렉토리
  ansible.builtin.file:
    path: "{{ sonarqube_dir }}"
    state: directory
    mode: "0755"

- name: docker-compose.yml 배치
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ sonarqube_dir }}/docker-compose.yml"
    mode: "0640"
  register: sonarqube_compose

- name: SonarQube 기동 (최초 또는 compose 변경 시)
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ sonarqube_dir }}"
  when: sonarqube_compose.changed
  changed_when: true

- name: SonarQube 부팅 유닛 배치
  ansible.builtin.template:
    src: sonarqube.service.j2
    dest: /etc/systemd/system/sonarqube.service
    mode: "0644"
  register: sonarqube_unit

- name: SonarQube 부팅 유닛 활성화
  ansible.builtin.systemd_service:
    name: sonarqube.service
    enabled: true
    state: started
    daemon_reload: "{{ sonarqube_unit.changed }}"
