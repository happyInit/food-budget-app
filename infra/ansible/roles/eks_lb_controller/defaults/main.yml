---
eks_kubeconfig: "{{ lookup('env', 'HOME') }}/.kube/config-mp-eks"

# AWS Load Balancer Controller 차트 버전 (핀 — 정본이 값을 안 준다).
#
# 🔴 **이 저장소는 차트 계열이 둘이다**(2026-08-14 실측 `helm search repo --versions` 81건):
#      `1.x`  → 컨트롤러 **v2.x**   (`1.17.1` = v2.17.1 · 최신 1.x · 68건)
#      `3.x`  → 컨트롤러 **v3.x**   (`3.5.0` = v3.5.0 · 메이저 재작성)
#    차트 버전과 앱 버전이 어긋나 있어서 *"1.13 이면 낡았고 3.5 면 최신"* 으로 읽기 쉬운데,
#    **1.17.1 이 3.4.x 보다 나중에 나온 것도 아니고 낡은 것도 아니다** — 계열이 다르다.
#
# 🔴 **3.x 를 쓰지 않는다** — 우리는 이 컨트롤러를 `TargetGroupBinding` **하나만** 쓰려고 깐다.
#    메이저 재작성은 values 키·CRD 스키마가 바뀔 여지가 크고, 얻을 기능이 우리에겐 없다.
#    ⇒ **최신 1.x = `1.17.1`.**
#
# ⚠️ 종전 핀 `1.13.4`(v2.13.4)는 **존재하기는 하지만 EKS 1.34 보다 앞선 계열**이다.
#    실물 확인(1.17.1): values 키 `clusterName`·`region`·`vpcId`·`replicaCount`·`serviceAccount`
#    ·`resources`·`enableShield`·`enableWaf`·`enableWafv2`·`enableServiceMutatorWebhook` 전부 존재 ·
#    CRD `targetgroupbindings.elbv2.k8s.aws` 의 **storage 버전 = `v1beta1`**(우리 매니페스트와 일치).
eks_lb_controller_chart_version: "1.17.1"

# 🔴 이 Service 가 ALB 의 타깃이다. Gateway `mp-gw-public`(config `ingress` 트랙)을 보고
#    istiod 가 만드는 Service 의 이름이며 규칙은 `<gateway-name>-istio` 다.
eks_lb_gateway_namespace: mp-ingress
eks_lb_gateway_service: mp-gw-public-istio
eks_lb_gateway_service_port: 443
