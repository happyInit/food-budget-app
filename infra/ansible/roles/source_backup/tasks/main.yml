---
# 소스 아카이브 (호스트 C 전용). site.yml 의 hosts: ci 플레이에서 호출. 단독: --tags source_backup

- name: S3 자격증명 확인 (secrets.yml 미주입 방어)
  ansible.builtin.assert:
    that:
      - backup_s3_access_key is defined and backup_s3_access_key | length > 0
      - backup_s3_secret_key is defined and backup_s3_secret_key | length > 0
    fail_msg: >-
      backup_s3_access_key·backup_s3_secret_key 를 secrets.yml 에 넣으세요
      (= mp-backup 유저 키, mp-source-backup-ap2 에 s3:PutObject/ListBucket/DeleteObject).
      상세 = secrets.yml.example.

- name: git 설치 (mirror 클론용)
  ansible.builtin.apt:
    name: git
    state: present
    update_cache: true

# --- S3 업로더 (AWS CLI v2 — apt awscli 는 이 배포판 리포에 없음 Candidate:none) ---
- name: aws CLI 존재 확인
  ansible.builtin.stat:
    path: /usr/local/bin/aws
  register: _aws_bin

- name: unzip 설치 (awscli v2 압축해제)
  ansible.builtin.apt:
    name: unzip
    state: present
    update_cache: true
  when: not _aws_bin.stat.exists

- name: AWS CLI v2 인스톨러 내려받기
  ansible.builtin.get_url:
    url: "https://awscli.amazonaws.com/awscli-exe-linux-{{ ansible_architecture }}.zip"
    dest: /tmp/awscliv2.zip
    mode: "0644"
  when: not _aws_bin.stat.exists

- name: 인스톨러 압축해제
  ansible.builtin.unarchive:
    src: /tmp/awscliv2.zip
    dest: /tmp
    remote_src: true
  when: not _aws_bin.stat.exists

- name: AWS CLI v2 설치
  ansible.builtin.command: /tmp/aws/install
  args:
    creates: /usr/local/bin/aws
  when: not _aws_bin.stat.exists

# --- 백업 스크립트·자격증명·systemd 유닛 ---
- name: 로컬 백업 디렉토리
  ansible.builtin.file:
    path: "{{ source_backup_local_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: S3 자격증명 EnvironmentFile 배치
  ansible.builtin.template:
    src: mp-source-backup.env.j2
    dest: "{{ source_backup_env_file }}"
    owner: root
    group: root
    mode: "0400"
  no_log: true

- name: 백업 스크립트 배치
  ansible.builtin.template:
    src: mp-source-backup.sh.j2
    dest: "{{ source_backup_script }}"
    owner: root
    group: root
    mode: "0750"

- name: systemd service 배치
  ansible.builtin.template:
    src: mp-source-backup.service.j2
    dest: /etc/systemd/system/mp-source-backup.service
    mode: "0644"
  notify: reload systemd

- name: systemd timer 배치
  ansible.builtin.template:
    src: mp-source-backup.timer.j2
    dest: /etc/systemd/system/mp-source-backup.timer
    mode: "0644"
  notify: reload systemd

- name: timer 활성화·기동
  ansible.builtin.systemd_service:
    name: mp-source-backup.timer
    enabled: true
    state: started
    daemon_reload: true
