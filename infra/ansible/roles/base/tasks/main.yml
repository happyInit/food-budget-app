---
# 🔴 안전장치 — 이 롤은 VM 전용이다. 물리 하이퍼바이저(.12)에 돌면 Docker 를 깔고
#    `docker_data_disk`(= group_vars/all.yml 의 /dev/sdb, .12 에선 전 VM 스토리지가
#    올라간 `pve` VG 디스크)를 포맷 대상으로 잡는다. 플레이가 `hosts: vms` 라 정상
#    경로로는 안 닿지만, `--limit` 오타 한 번에 클러스터가 날아가므로 여기서 한 번 더 막는다.
- name: 이 롤은 VM 전용 — 하이퍼바이저 방어
  ansible.builtin.assert:
    that: "'hypervisor' not in group_names"
    fail_msg: >-
      base 롤은 물리 하이퍼바이저({{ inventory_hostname }})에 실행할 수 없다.
      VM 전용이며 docker_data_disk 를 포맷한다. hypervisor.yml 을 쓸 것.
    quiet: true

# ── qemu-guest-agent (Proxmox 연동) ──
# ⚠️ terraform 의 agent-wait 는 여기서 못 푼다 — base 는 apply 가 끝나야 도는데,
#    apply 자체가 agent 의 IP 리포팅을 기다리기 때문(닭과 달걀).
#    신규 VM 생성 대기 해소 = 템플릿 9002 에 사전설치. 여기는 상태 보장 + 타 템플릿 대비.
- name: qemu-guest-agent 설치
  ansible.builtin.apt:
    name: qemu-guest-agent
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: qemu-guest-agent 활성화·기동
  ansible.builtin.service:
    name: qemu-guest-agent
    state: started
    enabled: true

# ── /var/lib/docker 전용 디스크 (scsi1) ──
- name: docker 데이터 디스크 존재 확인
  ansible.builtin.stat:
    path: "{{ docker_data_disk }}"
  register: docker_disk

- name: docker 데이터 디스크 ext4 포맷 (기존 fs 있으면 no-op)
  community.general.filesystem:
    fstype: ext4
    dev: "{{ docker_data_disk }}"
  when: docker_disk.stat.exists

- name: /var/lib/docker 마운트 (fstab 등록)
  ansible.posix.mount:
    path: /var/lib/docker
    src: "{{ docker_data_disk }}"
    fstype: ext4
    opts: defaults,noatime
    state: mounted
  when: docker_disk.stat.exists

# ── Docker Engine (공식 apt 저장소) ──
- name: Docker 사전 패키지
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg]
    state: present

- name: apt keyrings 디렉토리
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Docker GPG 키
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Docker apt 저장소 등록
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    filename: docker
    state: present

- name: Docker Engine + compose 플러그인 설치
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

# ── 로그 로테이션 (json-file 무제한 증가로 인한 디스크 폭발 방지) ──
# 컨테이너별 logging: 블록으로 개별 지정하는 대신 데몬 기본값으로 일괄 적용.
# 단, 이미 떠 있는 컨테이너는 재생성(recreate) 전까지 이 설정을 못 받음 —
# 데몬 재시작만으로는 기존 컨테이너의 로그 드라이버 옵션이 바뀌지 않음.
- name: Docker daemon.json (로그 로테이션 10m x 3)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
    mode: "0644"
  register: docker_daemon_cfg

- name: docker 서비스 활성화·기동
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: docker 데몬 재시작 (daemon.json 변경 시 — 이 VM의 전 컨테이너가 잠깐 재시작됨)
  ansible.builtin.service:
    name: docker
    state: restarted
  when: docker_daemon_cfg.changed

- name: "{{ ansible_user }} 를 docker 그룹에"
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
