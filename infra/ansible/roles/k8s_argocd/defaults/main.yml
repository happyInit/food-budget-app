---
argocd_chart_version: "10.2.1" # argo/argo-cd (ArgoCD v3.4.5)

# 🔴 **P2 까지 자동 CD 는 없다**(2026-07-27 확정). ArgoCD 는 지금 설치만 해 두고,
#    Jenkins 가 config 레포에 이미지 태그를 커밋하는 스텝은 P2 에 붙인다.
#    → 그때까지 앱 변경은 수동 반영이다(플랜 §7.3).
#
# config 레포는 아래에서 연결한다(2026-07-27 신설). 다만 **Application 은 아직 0개**다 —
# 앱 매니페스트가 P1 에 들어오기 때문. 지금 배선하는 것은 "레포를 읽을 수 있는가"까지다.
argocd_namespace: argocd

# ── config 레포 배선 ────────────────────────────────────────────────────────
# ✅ **레포 생성됨 (2026-07-28, 앱 담당자)** — happyInit/mealplanning-config (private).
#    구조 = argocd/applications/(app-of-apps child) + services/<svc>/base+overlays(onprem·eks).
#    배포키는 secrets.yml `argocd_repo_ssh_key` (2026-07-28 생성 · 공개키는 레포 소유자가
#    읽기 전용으로 등록해야 연결이 완성된다 — 콜라보레이터는 등록 불가).
#
# 배선 구조(검증 완료): fb-secrets ns Secret(정본) ──ESO──▶ argocd ns repository Secret.
# ArgoCD 에 자격증명을 직접 박지 않는다 — P1 앱 비밀이 탈 경로와 같아서 미리 검증된다.
# 🔴 이 URL 은 config 레포 Application 들의 source.repoURL 과 **문자열까지 일치**해야 한다
#    (ArgoCD 는 URL 매칭으로 자격증명을 고른다 — https/ssh 혼용 금지).
argocd_repo_url: "git@github.com:happyInit/mealplanning-config.git"
argocd_repo_secret: repo-food-budget-config
argocd_project: mealplanning
# 앱 트랙 AppProject 가 배포를 허용하는 ns. 이 밖으로는 config 레포 Application 이 아무것도 못 만든다.
# 🔴 `k8s_cluster_base` 의 ns 선언과 **목록을 공유한다** — 새 ns 를 앱 트랙에 쓰려면 두 곳 다 고쳐야 한다.
#    한쪽만 고치면 ns 는 있는데 ArgoCD 가 거부하거나(여기 누락), 프로젝트는 열렸는데 ns 가 없다.
#    (platform 쪽 `argocd_platform_namespaces` + `k8s_operator_namespaces` 와 같은 관계다.)
argocd_app_namespaces:
  - app # FastAPI 9 + frontend + ranking-serving + HTTPRoute
  - data # 데이터 CR 중 앱 트랙이 만지는 것(정책 등)
  - pipeline # Kafka 컨슈머·CronJob
  - mp-ingress # 공개 진입점 — Gateway(.14) + cloudflared (#532 ③, 2026-08-06)
# app-of-apps root 전용 프로젝트(2026-07-28) — argocd ns 에 Application 오브젝트만 허용.
# config 레포의 root Application 이 spec.project 로 이 이름을 써야 한다.
argocd_root_project: mealplanning-root

# ── mealplanning-root Application (2026-08-10 IaC 편입) ─────────────────────
# 🔴 이 Application 은 2026-08-10 까지 **어떤 레포에도 없었다** — 손 apply + 손 patch 로만
#    라이브에 떠 있었다. 그런데 앱 child 23개가 전부 여기서 나온다 = 재구축 블로커였다.
#    상세·주의사항은 `templates/argocd-mealplanning-root.yaml.j2` 머리말.
argocd_root_app: mealplanning-root
argocd_root_revision: main
# 🔴 **이 값을 바꾸는 것 = 라이브 앱 23개의 운명을 바꾸는 것이다.** root 는 `prune: true` 라
#    여기가 가리키는 곳이 비면 child 23개가 통째로 프룬된다.
#    EKS 이관(0-4)에서 이 값이 `argocd/overlays/<site>` 로 바뀔 예정인데,
#    **새 경로가 config 레포 main 에 실재하는 것을 확인한 뒤에만** 바꾼다(SITES.md §0-4 컷오버 2단계).
argocd_root_path: argocd/applications

# ── platform AppProject (2026-07-28 신설 — LGTM 선배포 / 2026-07-29 P2 확장) ─
# config 레포 배선과 **부분적으로** 독립이다: 차트 소스 child(오퍼레이터·LGTM)는 공개 레포라
# 자격증명이 필요 없어 항상 만들어지지만, platform-root 는 config 레포를 읽으므로
# `argocd_repo_url` 이 비면 건너뛴다(아래 platform-root 블록).
argocd_platform_project: platform
argocd_platform_source_repos:
  - https://grafana.github.io/helm-charts # LGTM (Loki·Tempo·Alloy)
  # ── P2 오퍼레이터 4종 (버전 핀 = 런북 §1.1) ──
  - https://cloudnative-pg.github.io/charts # cloudnative-pg + plugin-barman-cloud
  - https://helm.elastic.co # eck-operator
  - https://strimzi.io/charts/ # strimzi-kafka-operator
  - https://ot-container-kit.github.io/helm-charts/ # redis-operator
  # ── P3 스케일 ──
  - https://kedacore.github.io/charts # KEDA (Kafka lag 기반 컨슈머 스케일링)
  # ── 배포전략 카나리 (ADR-0001, 2026-08-03) ──
  - https://argoproj.github.io/argo-helm # Argo Rollouts (account·recipe 카나리 컨트롤러)
  # ── 재배치 교정 ──
  # 🔴 이 줄이 없어서 descheduler Application 이 죽어 있었다 (2026-08-03 실측).
  #    경위: 라이브 AppProject 에 **손으로 patch** 해서 descheduler 를 띄웠는데,
  #    이 defaults 에는 안 넣었다 → 이후 `--tags argocd` 실행이 템플릿대로 덮어쓰면서
  #    URL 이 사라졌고 Application 이 `InvalidSpecError`("repo is not permitted") 로 정지.
  #    ⚠️ 교훈: **AppProject 를 라이브에서 patch 하면 다음 playbook 이 되돌린다.**
  #       sourceRepos·destinations 추가는 반드시 여기(git)부터.
  - https://kubernetes-sigs.github.io/descheduler/ # descheduler (topologySpread 위반 축출)
  # 데이터 CR·values 본문이 사는 곳. 🔴 platform-root 와 **문자열까지 같아야** 한다
  # (ArgoCD 는 URL 매칭으로 자격증명을 고른다).
  - "{{ argocd_repo_url }}"
argocd_platform_namespaces: # 이 밖의 ns 로는 플랫폼 Application 이 아무것도 못 만든다
  - observability # Loki·Tempo
  - kube-system # Alloy (hostPath 필수 → node-exporter 와 같은 수칙)
  - data # P2 데이터 CR (PG·ES·Kafka·Redis·PGSync)
# + 오퍼레이터 설치 ns 4개 = group_vars/k8s_nodes.yml 의 `k8s_operator_namespaces`
#   (ns 를 만드는 롤과 목록을 공유한다 — 한쪽만 고치면 배포가 조용히 거부된다)

# ── platform-root (app-of-apps · 2026-07-29 신설, 런북 Q2) ──────────────────
# `platform/argocd/*.yaml` 의 child Application 을 자동으로 집는 뿌리 하나.
# 🔴 **root 는 platform 프로젝트에 두지 않는다** — root 는 argocd ns 에 Application
#    "오브젝트"를 만들어야 하는데, platform 에 argocd ns 를 넣으면 화이트리스트가
#    전역(*/*)이라 **모든 플랫폼 child 가 argocd ns 에 아무 리소스나** 만들 수 있게 된다.
#    앱 트랙에서 같은 이유로 `mealplanning-root` 를 판 것과 동일한 판단(§argocd-repo ④).
argocd_platform_root_project: platform-root
argocd_platform_root_app: platform-root
argocd_platform_root_path: platform/argocd
argocd_platform_root_revision: main
# AppProject 가 배포를 허용할 ns. 여기 없는 ns 로는 Application 이 아무것도 못 만든다.
argocd_allowed_namespaces:
  - app
  - data
  - pipeline

# ── GitHub 웹훅(즉시 CD) — in-cluster cloudflared ────────────────────────────
# **기본 OFF.** argocd-server 는 ClusterIP(외부 노출 없음, argocd-values §server)라 GitHub
# push 이벤트를 받으려면 클러스터 안에 cloudflared 를 띄워 argocd-server 의 `/api/webhook`
# **만** 인터넷에 연다(ingress path 정규식 — UI/API 는 노출 안 함, Jenkins 와 달리).
# 켜지면 config 레포 push → ArgoCD 즉시 refresh → 3분 폴링(cm timeout.reconciliation)
# 대기 없이 배포된다. auto-sync(selfHeal off)는 새 git 커밋에 정상 fire 확인됨.
#
# 🔴 켜기 전 준비(정석 순서 — 자격증명은 사람이 만든다, 로그 경유 금지):
#   1) cert 있는 곳(예: 호스트 C)에서  cloudflared tunnel create mp-argocd
#        → creds JSON(<uuid>.json) 과 tunnel UUID 획득
#   2) group_vars/k8s_nodes.yml 에  argocd_webhook_tunnel_id: <uuid>
#   3) secrets.yml(vault) 에  argocd_webhook_github_secret(openssl rand -hex 20)
#        + argocd_webhook_tunnel_credentials(<uuid>.json 내용, 한 줄 JSON)
#   4) DNS 라우팅:  cloudflared tunnel route dns mp-argocd argocd.mealbong.cloud
#   5) argocd_webhook_enabled: true  → ansible-playbook k8s.yml --tags argocd
#   6) mealplanning-config 레포에 GitHub 웹훅 등록:
#        Payload = https://argocd.mealbong.cloud/api/webhook · JSON · Secret = 위 3)
argocd_webhook_enabled: false
argocd_webhook_hostname: "argocd.mealbong.cloud"
argocd_webhook_tunnel_name: mp-argocd
# 비밀 아님 — 실제 UUID 는 group_vars/k8s_nodes.yml 에 둔다(빈 값 = 비활성 시 안전 폴백).
argocd_webhook_tunnel_id: ""
# cloudflared 이미지 — 🔴 실존 릴리스 태그로 핀(버전 규율, CLAUDE.md). Docker Hub cloudflare/cloudflared.
argocd_webhook_cloudflared_image: "cloudflare/cloudflared:2026.7.3"
