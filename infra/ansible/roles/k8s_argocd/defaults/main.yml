---
argocd_chart_version: "10.2.1" # argo/argo-cd (ArgoCD v3.4.5)

# 🔴 **P2 까지 자동 CD 는 없다**(2026-07-27 확정). ArgoCD 는 지금 설치만 해 두고,
#    Jenkins 가 config 레포에 이미지 태그를 커밋하는 스텝은 P2 에 붙인다.
#    → 그때까지 앱 변경은 수동 반영이다(플랜 §7.3).
#
# config 레포는 아래에서 연결한다(2026-07-27 신설). 다만 **Application 은 아직 0개**다 —
# 앱 매니페스트가 P1 에 들어오기 때문. 지금 배선하는 것은 "레포를 읽을 수 있는가"까지다.
argocd_namespace: argocd

# ── config 레포 배선 ────────────────────────────────────────────────────────
# ✅ **레포 생성됨 (2026-07-28, 앱 담당자)** — happyInit/mealplanning-config (private).
#    구조 = argocd/applications/(app-of-apps child) + services/<svc>/base+overlays(onprem·eks).
#    배포키는 secrets.yml `argocd_repo_ssh_key` (2026-07-28 생성 · 공개키는 레포 소유자가
#    읽기 전용으로 등록해야 연결이 완성된다 — 콜라보레이터는 등록 불가).
#
# 배선 구조(검증 완료): fb-secrets ns Secret(정본) ──ESO──▶ argocd ns repository Secret.
# ArgoCD 에 자격증명을 직접 박지 않는다 — P1 앱 비밀이 탈 경로와 같아서 미리 검증된다.
# 🔴 이 URL 은 config 레포 Application 들의 source.repoURL 과 **문자열까지 일치**해야 한다
#    (ArgoCD 는 URL 매칭으로 자격증명을 고른다 — https/ssh 혼용 금지).
argocd_repo_url: "git@github.com:happyInit/mealplanning-config.git"
argocd_repo_secret: repo-food-budget-config
argocd_project: mealplanning

# ── platform AppProject (2026-07-28 신설 — LGTM 선배포) ─────────────────────
# config 레포 배선과 독립이다: 소스가 공개 Helm 차트 레포라 자격증명·레포가 필요 없어
# **항상** 만들어진다(위의 조건부 스킵과 무관). Application 정본 = roles/k8s_platform_apps.
argocd_platform_project: platform
argocd_platform_source_repos:
  - https://grafana.github.io/helm-charts
argocd_platform_namespaces: # 이 밖의 ns 로는 플랫폼 Application 이 아무것도 못 만든다
  - observability # Loki·Tempo
  - kube-system # Alloy (hostPath 필수 → node-exporter 와 같은 수칙)
# AppProject 가 배포를 허용할 ns. 여기 없는 ns 로는 Application 이 아무것도 못 만든다.
argocd_allowed_namespaces:
  - app
  - data
  - pipeline
