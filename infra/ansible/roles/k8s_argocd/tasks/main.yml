---
# ArgoCD (CD) — 설치까지만. config 레포 연결·Application 은 레포가 정해진 뒤.

- name: master 전용 방어
  ansible.builtin.assert:
    that: "'k8s_master' in group_names"
    fail_msg: "k8s_argocd 는 master 에서만 실행한다"
    quiet: true

- name: argo helm 저장소
  kubernetes.core.helm_repository:
    name: argo
    repo_url: https://argoproj.github.io/argo-helm

- name: ArgoCD values
  ansible.builtin.template:
    src: argocd-values.yaml.j2
    dest: /etc/kubernetes/argocd-values.yaml
    mode: "0644"

# 웹훅 시크릿(githubSecret)만 담는 분리 values — 0600·no_log(월드리더블 유출 방지).
# 웹훅 비활성이면 빈 문자열(차트 기본값)이라 항상 렌더·include 해도 no-op.
- name: ArgoCD 웹훅 시크릿 values (분리·0600)
  ansible.builtin.template:
    src: argocd-values-secret.yaml.j2
    dest: /etc/kubernetes/argocd-values-secret.yaml
    mode: "0600"
  no_log: true

# ── argocd-secret 보존 (2026-07-30 실사고 대응) ─────────────────────────────
# 🔴 `server.secretkey`·`admin.password` 는 argocd-server 가 런타임에 만들어 넣는다.
#    차트가 이 Secret 을 소유하면 helm upgrade 마다 그 값이 지워져 UI 가 전면 불통이 된다.
#    → 차트에서 떼어내고(values createSecret:false) 여기서 존재만 보장한다.
# 🔴 `--ignore-not-found` + `create --dry-run | apply` 가 아니라 **없을 때만 create** 다 —
#    apply 로 덮으면 그 자체가 데이터를 지운다(이 사고의 반복).
- name: argocd-secret 존재 확인
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ k8s_kubeconfig }} -n {{ argocd_namespace }} get secret argocd-secret
  register: k8s_argocd_secret_check
  changed_when: false
  failed_when: false

- name: argocd-secret 생성 (없을 때만 — 데이터는 argocd-server 가 채운다)
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ k8s_kubeconfig }} -n {{ argocd_namespace }}
    create secret generic argocd-secret
  when: k8s_argocd_secret_check.rc != 0

# helm 이 차트 렌더에서 빠진 리소스를 삭제하지 않게 하는 유일한 장치.
# 이미 차트 소유였던 기존 클러스터에서도 이 한 줄이 삭제를 막는다.
# 🔴 `annotate --overwrite` 는 값이 같아도 매번 "annotated" 를 찍는다 → changed 오보고.
#    이 레포는 "전체 재실행 changed=0" 을 IaC 수렴 신호로 쓰므로 현재값을 먼저 읽어 비교한다.
# 🔴 jsonpath 에 `helm\.sh` 같은 **이스케이프를 쓰지 말 것** — command 모듈의 shlex 가 백슬래시를
#    먹어 `helm.sh` 가 되고, 중첩 필드로 해석돼 항상 빈 값이 된다(2026-07-31 실측).
#    annotations 전체를 받아 문자열로 검사한다.
- name: argocd-secret 의 helm 삭제 방지 정책 현황
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ k8s_kubeconfig }} -n {{ argocd_namespace }}
    get secret argocd-secret -o jsonpath={.metadata.annotations}
  register: k8s_argocd_secret_policy
  changed_when: false

- name: argocd-secret 에 helm 삭제 방지 정책
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ k8s_kubeconfig }} -n {{ argocd_namespace }}
    annotate secret argocd-secret helm.sh/resource-policy=keep --overwrite
  when: >-
    '"helm.sh/resource-policy":"keep"' not in k8s_argocd_secret_policy.stdout

- name: ArgoCD 설치
  kubernetes.core.helm:
    name: argocd
    chart_ref: argo/argo-cd
    chart_version: "{{ argocd_chart_version }}"
    release_namespace: "{{ argocd_namespace }}"
    create_namespace: false # k8s_cluster_base 가 PSS 라벨과 함께 만든다
    kubeconfig: "{{ k8s_kubeconfig }}"
    values_files:
      - /etc/kubernetes/argocd-values.yaml
      - /etc/kubernetes/argocd-values-secret.yaml # 뒤가 우선 — configs.secret 만 덮음
    wait: true
    wait_timeout: 15m

- name: ArgoCD 준비 확인
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ k8s_kubeconfig }} -n {{ argocd_namespace }}
    rollout status deploy/argocd-server --timeout=300s
  changed_when: false

# 초기 admin 비밀번호는 차트가 Secret 으로 만든다(설치 1회성). 사람이 꺼내 쓸 수 있게 알려준다.
- name: 초기 admin 비밀번호 확인 방법 안내
  ansible.builtin.debug:
    msg: >-
      ArgoCD UI = kubectl -n {{ argocd_namespace }} port-forward svc/argocd-server 8080:443 →
      https://localhost:8080 (admin) ·
      초기 비번 = kubectl -n {{ argocd_namespace }} get secret argocd-initial-admin-secret
      -o jsonpath='{.data.password}' | base64 -d ·
      🔴 최초 로그인 후 비번을 바꾸고 argocd-initial-admin-secret 을 삭제할 것.

# 웹훅 HMAC 시크릿 — 종전엔 차트 values(configs.secret.githubSecret)로 넣었으나 createSecret:false
# 로 바뀌어 그 경로가 사라졌다. **그 키만** patch 한다(다른 키는 건드리지 않는다).
- name: 웹훅 HMAC 시크릿 주입 (argocd-secret 의 해당 키만)
  when: argocd_webhook_enabled | bool and (argocd_webhook_github_secret | default('') | length > 0)
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ k8s_kubeconfig }} -n {{ argocd_namespace }}
    patch secret argocd-secret --type merge
    -p {{ {'stringData': {'webhook.github.secret': argocd_webhook_github_secret}} | to_json | quote }}
  no_log: true
  changed_when: true

# ── GitHub 웹훅(즉시 CD) — in-cluster cloudflared ───────────────────────────
# 🔴 기본 OFF(argocd_webhook_enabled). config 레포 배선과 독립 — argocd-server 만 있으면 된다.
#    켜기 전 준비(터널 생성·DNS·vault) = defaults/main.yml 주석 참조.
#    githubSecret 은 위 helm(argocd-values-secret) 로 이미 argocd-secret 에 반영된다 —
#    여기서는 그 웹훅을 인터넷에서 받을 터널(Deployment)만 세운다.
- name: GitHub 웹훅 터널 (in-cluster cloudflared)
  when: argocd_webhook_enabled | bool
  block:
    - name: 웹훅 전제값 확인
      ansible.builtin.assert:
        that:
          - argocd_webhook_tunnel_id | length > 0
          - argocd_webhook_github_secret | default('') | length > 0
          - argocd_webhook_tunnel_credentials | default('') | length > 0
        fail_msg: >-
          웹훅 활성화 전 tunnel_id(group_vars/k8s_nodes.yml)·github_secret·tunnel_credentials
          (secrets.yml)를 모두 채워라. 준비 순서 = roles/k8s_argocd/defaults/main.yml 주석.
        quiet: true

    - name: 웹훅 터널 매니페스트 (Secret 포함 → 0600)
      ansible.builtin.template:
        src: argocd-webhook-tunnel.yaml.j2
        dest: "{{ k8s_manifest_dir }}/argocd-webhook-tunnel.yaml"
        mode: "0600"
      no_log: true

    # apply 는 차이가 없어도 configured 를 찍는 종류가 있어 드리프트 판정은 diff 로 한다.
    - name: 웹훅 터널 드리프트 확인
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ k8s_kubeconfig }} diff -f {{ k8s_manifest_dir }}/argocd-webhook-tunnel.yaml
      register: k8s_argocd_wh_diff
      changed_when: false
      failed_when: k8s_argocd_wh_diff.rc > 1
      no_log: true # diff 에 Secret 값이 드러날 수 있다

    - name: 웹훅 터널 적용
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ k8s_kubeconfig }} apply -f {{ k8s_manifest_dir }}/argocd-webhook-tunnel.yaml
      changed_when: k8s_argocd_wh_diff.rc == 1
      no_log: true

    - name: 웹훅 터널 롤아웃 확인
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ k8s_kubeconfig }} -n {{ argocd_namespace }}
        rollout status deploy/argocd-webhook-tunnel --timeout=120s
      changed_when: false

    - name: 웹훅 등록 안내 (GitHub 쪽은 수동/gh)
      ansible.builtin.debug:
        msg: >-
          터널 가동됨. 남은 1스텝(수동) = mealplanning-config 레포에 GitHub 웹훅 등록 →
          Payload URL = https://{{ argocd_webhook_hostname }}/api/webhook · Content-Type = application/json ·
          Secret = argocd_webhook_github_secret(vault) · events = Just the push event.
          검증 = config 레포 push 후 argocd-server 로그에 "Received push event" 즉시 확인.

# ── mealplanning AppProject (앱 트랙) ──────────────────────────────────────
# 🔴 2026-08-06 IaC 편입(#532 ③ 부산물). 그전까지 이 AppProject 는 **어느 레포에도 없었고**
#    손으로 apply 된 상태로만 존재했다. config 레포 Application 20여 개가 전부 이걸 참조하므로
#    재구축 시 앱이 하나도 안 뜨는 블로커였다. 템플릿 상단에 상세.
# platform 과 달리 **config 레포 URL 이 유일한 sourceRepo** 라, 레포가 아직 없으면 의미가 없다 —
#    다만 프로젝트 자체는 자격증명과 무관하므로 항상 만든다(Application 이 먼저 와도 거부되지 않게).
- name: mealplanning AppProject 매니페스트
  ansible.builtin.template:
    src: argocd-mealplanning-project.yaml.j2
    dest: "{{ k8s_manifest_dir }}/argocd-mealplanning-project.yaml"
    mode: "0644"

- name: mealplanning AppProject 드리프트 확인
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ k8s_kubeconfig }} diff -f {{ k8s_manifest_dir }}/argocd-mealplanning-project.yaml
  register: k8s_argocd_app_project_diff
  changed_when: false
  failed_when: k8s_argocd_app_project_diff.rc > 1

- name: mealplanning AppProject 적용
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ k8s_kubeconfig }} apply -f {{ k8s_manifest_dir }}/argocd-mealplanning-project.yaml
  changed_when: k8s_argocd_app_project_diff.rc == 1

# ── platform AppProject ────────────────────────────────────────────────────
# LGTM 선배포(2026-07-28)의 울타리. config 레포 배선과 독립 — 공개 차트 레포가 소스라
# 자격증명이 필요 없고, config 레포가 없어도 이 프로젝트는 항상 존재한다.
- name: platform AppProject 매니페스트
  ansible.builtin.template:
    src: argocd-platform-project.yaml.j2
    dest: "{{ k8s_manifest_dir }}/argocd-platform-project.yaml"
    mode: "0644"

- name: platform AppProject 드리프트 확인
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ k8s_kubeconfig }} diff -f {{ k8s_manifest_dir }}/argocd-platform-project.yaml
  register: k8s_argocd_platform_diff
  changed_when: false
  failed_when: k8s_argocd_platform_diff.rc > 1

- name: platform AppProject 적용
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ k8s_kubeconfig }} apply -f {{ k8s_manifest_dir }}/argocd-platform-project.yaml
  changed_when: k8s_argocd_platform_diff.rc == 1

# ── config 레포 연결 (ESO 경유) ────────────────────────────────────────────
# 🔴 레포가 아직 없으면(defaults 의 `argocd_repo_url` 이 빈 문자열) 통째로 건너뛴다 —
#    죽은 URL·죽은 키를 가리키는 오브젝트를 클러스터에 남기지 않기 위해서다.
#    레포가 생기면 URL·키만 채우고 `--tags argocd` 로 돌리면 배선이 완성된다.
- name: config 레포 연결
  when: argocd_repo_url | length > 0
  block:
    - name: 레포 자격증명·AppProject 매니페스트
      ansible.builtin.template:
        src: argocd-repo.yaml.j2
        dest: "{{ k8s_manifest_dir }}/argocd-repo.yaml"
        mode: "0600" # SSH 개인키가 들어간다
      no_log: true

    # apply 는 실제 차이가 없어도 `configured` 를 찍는 종류가 있어 드리프트 판정은 diff 로 한다.
    - name: 레포 배선 드리프트 확인
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ k8s_kubeconfig }} diff -f {{ k8s_manifest_dir }}/argocd-repo.yaml
      register: k8s_argocd_diff
      changed_when: false
      failed_when: k8s_argocd_diff.rc > 1

    - name: 레포 배선 적용
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ k8s_kubeconfig }} apply -f {{ k8s_manifest_dir }}/argocd-repo.yaml
      changed_when: k8s_argocd_diff.rc == 1
      retries: 5
      delay: 10
      register: k8s_argocd_apply
      until: k8s_argocd_apply.rc == 0

    # ESO 가 실제로 복제했는지 확인한다 — 여기서 실패하면 P1 앱 비밀도 같은 이유로 안 흐른다.
    - name: ESO 복제 확인 (argocd ns 에 repository Secret 생성)
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ k8s_kubeconfig }} -n {{ argocd_namespace }}
        wait --for=condition=Ready externalsecret/{{ argocd_repo_secret }} --timeout=120s
      changed_when: false

    # ── platform-root (app-of-apps) ────────────────────────────────────────
    # 🔴 반드시 위 repository Secret 뒤에 온다 — 자격증명 없이 만들면 root 가 곧바로
    #    ComparisonError(레포 인증 실패)로 떨어진다. 순서가 곧 배선 조건이다.
    - name: platform-root 매니페스트 (AppProject + Application)
      ansible.builtin.template:
        src: argocd-platform-root.yaml.j2
        dest: "{{ k8s_manifest_dir }}/argocd-platform-root.yaml"
        mode: "0644" # 비밀 없음 — 레포 URL 과 경로뿐

    - name: platform-root 드리프트 확인
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ k8s_kubeconfig }} diff -f {{ k8s_manifest_dir }}/argocd-platform-root.yaml
      register: k8s_argocd_root_diff
      changed_when: false
      failed_when: k8s_argocd_root_diff.rc > 1

    - name: platform-root 적용
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ k8s_kubeconfig }} apply -f {{ k8s_manifest_dir }}/argocd-platform-root.yaml
      changed_when: k8s_argocd_root_diff.rc == 1
      retries: 5
      delay: 10
      register: k8s_argocd_root_apply
      until: k8s_argocd_root_apply.rc == 0

    # ── mealplanning-root (앱 app-of-apps) ─────────────────────────────────
    # 🔴 platform-root 와 같은 이유로 repository Secret 뒤에 온다(자격증명 없이 만들면
    #    곧바로 ComparisonError). AppProject 는 argocd-repo.yaml.j2 ④ 가 이미 만들었다.
    # 🔴 이 Application 은 2026-08-10 까지 IaC 밖이었다(손 apply + 손 patch). 앱 child 23개가
    #    전부 여기서 나오므로 재구축 블로커였다 — 템플릿 머리말 참조.
    - name: mealplanning-root 매니페스트 (Application)
      ansible.builtin.template:
        src: argocd-mealplanning-root.yaml.j2
        dest: "{{ k8s_manifest_dir }}/argocd-mealplanning-root.yaml"
        mode: "0644" # 비밀 없음 — 레포 URL 과 경로뿐

    # 🔴 이 diff 가 **이 롤에서 가장 중요한 안전장치**다. root 는 prune: true 라
    #    spec 이 의도치 않게 바뀌면 child 23개가 프룬된다. `kubectl diff` 로 먼저 보고,
    #    rc==1(차이 있음)이면 changed 로 보고돼 로그에 남는다.
    #    ⚠️ 첫 실행은 라이브와 필드 단위로 맞춰 놨으므로 **차이 0(rc==0)이 기대값**이다.
    #       차이가 뜨면 라이브가 그새 손으로 바뀐 것이니 **적용 전에 사람이 확인할 것.**
    - name: mealplanning-root 드리프트 확인
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ k8s_kubeconfig }} diff -f {{ k8s_manifest_dir }}/argocd-mealplanning-root.yaml
      register: k8s_argocd_mp_root_diff
      changed_when: false
      failed_when: k8s_argocd_mp_root_diff.rc > 1

    - name: mealplanning-root 적용
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ k8s_kubeconfig }} apply -f {{ k8s_manifest_dir }}/argocd-mealplanning-root.yaml
      changed_when: k8s_argocd_mp_root_diff.rc == 1
      retries: 5
      delay: 10
      register: k8s_argocd_mp_root_apply
      until: k8s_argocd_mp_root_apply.rc == 0
