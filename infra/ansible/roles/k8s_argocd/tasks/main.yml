---
# ArgoCD (CD) — 설치까지만. config 레포 연결·Application 은 레포가 정해진 뒤.

- name: master 전용 방어
  ansible.builtin.assert:
    that: "'k8s_master' in group_names"
    fail_msg: "k8s_argocd 는 master 에서만 실행한다"
    quiet: true

- name: argo helm 저장소
  kubernetes.core.helm_repository:
    name: argo
    repo_url: https://argoproj.github.io/argo-helm

- name: ArgoCD values
  ansible.builtin.template:
    src: argocd-values.yaml.j2
    dest: /etc/kubernetes/argocd-values.yaml
    mode: "0644"

- name: ArgoCD 설치
  kubernetes.core.helm:
    name: argocd
    chart_ref: argo/argo-cd
    chart_version: "{{ argocd_chart_version }}"
    release_namespace: "{{ argocd_namespace }}"
    create_namespace: false # k8s_cluster_base 가 PSS 라벨과 함께 만든다
    kubeconfig: "{{ k8s_kubeconfig }}"
    values_files:
      - /etc/kubernetes/argocd-values.yaml
    wait: true
    wait_timeout: 15m

- name: ArgoCD 준비 확인
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ k8s_kubeconfig }} -n {{ argocd_namespace }}
    rollout status deploy/argocd-server --timeout=300s
  changed_when: false

# 초기 admin 비밀번호는 차트가 Secret 으로 만든다(설치 1회성). 사람이 꺼내 쓸 수 있게 알려준다.
- name: 초기 admin 비밀번호 확인 방법 안내
  ansible.builtin.debug:
    msg: >-
      ArgoCD UI = kubectl -n {{ argocd_namespace }} port-forward svc/argocd-server 8080:443 →
      https://localhost:8080 (admin) ·
      초기 비번 = kubectl -n {{ argocd_namespace }} get secret argocd-initial-admin-secret
      -o jsonpath='{.data.password}' | base64 -d ·
      🔴 최초 로그인 후 비번을 바꾸고 argocd-initial-admin-secret 을 삭제할 것.

# ── config 레포 연결 (ESO 경유) ────────────────────────────────────────────
# 🔴 레포가 아직 없으면(defaults 의 `argocd_repo_url` 이 빈 문자열) 통째로 건너뛴다 —
#    죽은 URL·죽은 키를 가리키는 오브젝트를 클러스터에 남기지 않기 위해서다.
#    레포가 생기면 URL·키만 채우고 `--tags argocd` 로 돌리면 배선이 완성된다.
- name: config 레포 연결
  when: argocd_repo_url | length > 0
  block:
    - name: 레포 자격증명·AppProject 매니페스트
      ansible.builtin.template:
        src: argocd-repo.yaml.j2
        dest: "{{ k8s_manifest_dir }}/argocd-repo.yaml"
        mode: "0600" # SSH 개인키가 들어간다
      no_log: true

    # apply 는 실제 차이가 없어도 `configured` 를 찍는 종류가 있어 드리프트 판정은 diff 로 한다.
    - name: 레포 배선 드리프트 확인
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ k8s_kubeconfig }} diff -f {{ k8s_manifest_dir }}/argocd-repo.yaml
      register: k8s_argocd_diff
      changed_when: false
      failed_when: k8s_argocd_diff.rc > 1

    - name: 레포 배선 적용
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ k8s_kubeconfig }} apply -f {{ k8s_manifest_dir }}/argocd-repo.yaml
      changed_when: k8s_argocd_diff.rc == 1
      retries: 5
      delay: 10
      register: k8s_argocd_apply
      until: k8s_argocd_apply.rc == 0

    # ESO 가 실제로 복제했는지 확인한다 — 여기서 실패하면 P1 앱 비밀도 같은 이유로 안 흐른다.
    - name: ESO 복제 확인 (argocd ns 에 repository Secret 생성)
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ k8s_kubeconfig }} -n {{ argocd_namespace }}
        wait --for=condition=Ready externalsecret/{{ argocd_repo_secret }} --timeout=120s
      changed_when: false
