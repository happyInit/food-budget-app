---
# 부트스트랩 계층 — 🔴 **ArgoCD 가 못 하는 것만** 여기 있다.
#
# 🔴 **범위를 좁힌 근거 = 라이브 실측**(2026-08-13 · `secret -l owner=helm`). 온프렘에서
#    helm 릴리스로 존재하는 것(= ArgoCD 밖)은 13개이고, 그중 AWS 에서도 Ansible 이 맡아야 하는 것은
#      cilium(별 롤) · cert-manager · external-secrets · istio 3종(별 롤) · argocd(별 롤)
#    뿐이다. 나머지는 AWS 에서 사라지거나 소유자가 바뀐다:
#      ❌ metallb        → ALB (C-60)
#      ❌ openebs lvm    → EBS CSI 애드온 (C-16)
#      ❌ minio          → S3 (C-18)
#      🔄 metrics-server · node-exporter · kube-prometheus-stack
#                        → **ArgoCD** 가 소유한다(config #162 = 0-3, `platform/argocd/overlays/eks`)
#
# 🔴 **CNPG·ECK·Argo Rollouts·KEDA 를 여기서 깔지 않는다.** 그것들은 온프렘에서도 helm 릴리스가
#    아니라 **ArgoCD Application**(config `platform/argocd/base`)이다. 여기서 helm 으로 깔면
#    같은 오브젝트에 소유자가 둘이 되고, ArgoCD 가 OutOfSync 를 영구히 보고하거나
#    **한쪽이 다른 쪽의 리소스를 지운다.** 이 레포가 이미 겪은 실패 유형이다
#    (ArgoCD `server.secretkey` 유실 = 차트가 런타임 키를 지운 사건).

- name: helm 저장소
  kubernetes.core.helm_repository:
    name: "{{ item.name }}"
    repo_url: "{{ item.url }}"
  loop:
    - { name: jetstack, url: "https://charts.jetstack.io" }
    - { name: external-secrets, url: "https://charts.external-secrets.io" }

- name: cert-manager
  kubernetes.core.helm:
    name: cert-manager
    chart_ref: jetstack/cert-manager
    chart_version: "{{ eks_certmanager_version }}"
    release_namespace: cert-manager
    create_namespace: true
    kubeconfig: "{{ eks_kubeconfig }}"
    values:
      crds:
        enabled: true
    wait: true
  # 🔴 **ACM 이 cert-manager 를 대체하지 않는다** — ACM 이 맡는 것은 공개 인증서 **1장**(ALB)뿐이고
  #    내부 TLS(ECK · CNPG · 웹훅)는 그대로 cert-manager 다(`1-58` 실측).
  #    🔴 와일드카드 DNS-01 을 양 사이트에서 동시에 돌리면 경합한다(`1-59`) — 이 롤은
  #    ClusterIssuer 를 만들지 않는다. 발급자 배선은 A2(진입 전환)에서 `1-48`·`1-59` 와 함께 한다.

- name: external-secrets (ESO) — IRSA 로 SSM 을 읽는다 (C-23)
  kubernetes.core.helm:
    name: external-secrets
    chart_ref: external-secrets/external-secrets
    chart_version: "{{ eks_eso_version }}"
    release_namespace: external-secrets
    create_namespace: true
    kubeconfig: "{{ eks_kubeconfig }}"
    values:
      serviceAccount:
        annotations:
          # 🔴 이게 없으면 스토어가 `Ready=False`(NoCredentialProviders)로 뜨고
          #    **ExternalSecret 30종이 전건 NotReady** 다(config `bootstrap/eso/README.md`).
          eks.amazonaws.com/role-arn: "{{ irsa_external_secrets }}"
    wait: true

# 🔴 **`kubernetes.core.k8s` 를 쓰지 않는다 — 온프렘 `k8s_*` 롤과 같은 방식으로 맞췄다**(2026-08-13).
#    ① 그 모듈은 **Python `kubernetes` 라이브러리**를 요구하는데, 이 작업 머신의 시스템 파이썬은
#       PEP 668(externally-managed)로 막혀 있다. 팀원마다 환경이 갈리고, `eks_preflight` 의
#       도구 점검(aws·kubectl·helm)에도 안 걸려 **플레이 중간에 처음 막힌다.**
#    ② 온프렘 `k8s_*` 롤 9개는 이 모듈을 **0건** 쓰고 전부 `kubectl apply` 다 —
#       그쪽은 전체 재실행 `changed=0` 으로 검증된 방식이다.
#    ⇒ 도구 요구사항을 **바이너리 3개(aws·kubectl·helm)** 로 유지한다.
#
# 🔴 멱등 판정은 온프렘과 같다 — **`kubectl diff`(rc 1 = 차이 있음)로 판정**하고 apply 는 항상 돌린다.
#    `apply` 는 실제 차이가 없어도 일부 종류에 `configured` 를 찍어서 changed 판정에 쓸 수 없다.
- name: ClusterSecretStore 매니페스트 (본문 정본 = config `bootstrap/eso/overlays/eks/`)
  ansible.builtin.copy:
    dest: "{{ lookup('env', 'HOME') }}/.mp-eks-clustersecretstore.yaml"
    mode: "0644"
    content: |
      apiVersion: external-secrets.io/v1
      kind: ClusterSecretStore
      metadata:
        name: mp-aws-secrets
      spec:
        # ns 를 제한한다 (0-14b — 온프렘에서 이미 적용·검증된 형태)
        conditions:
          - namespaces: [app, argo-rollouts, argocd, data, mp-ingress, observability, pipeline]
        provider:
          aws:
            # 🔴 **C-36** — *"비밀 = AWS Secrets Manager. C-23 의 SSM Parameter Store 를 정정한다
            #    (ESO provider `service: SecretsManager`)"* (2026-08-10 · 선생님 지시 · 4KB 한도 소멸).
            #    ⟳ 처음에 `ParameterStore` 로 지었다 — C-23 행의 정정 머리말을 건너뛰고 정정 전
            #      본문을 읽은 것이다(결함 #24). **정정된 결정 행은 머리말이 본문을 이긴다.**
            service: SecretsManager
            region: {{ eks_region }}
            # 🔴 끝 슬래시 필수 — 이 한 줄이 `remoteRef` 70엔트리 무수정의 근거다(C-23 이 남긴 배선).
            #    prefix 가 key 앞에 붙어 시크릿 이름이 된다(`app-secrets` → `mp/prod/app-secrets`).
            # 🔴 **앞 슬래시는 없다** — ParameterStore 는 `/mp/prod/` 였지만 Secrets Manager 이름은
            #    슬래시로 시작하지 않는 것이 관례다(ARN 이 `secret:/mp/...` 가 되는 것을 피한다).
            #    ⚠️ 이 값이 IAM Resource `secret:mp/prod/*` 와 **정확히 짝**이어야 한다.
            prefix: mp/prod/
  # ⚠️ 온프렘에는 apply 하지 않는다 — C-23 = 양 사이트 독립, 서로를 참조하지 않는다.

- name: ClusterSecretStore 드리프트 확인
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ eks_kubeconfig }} diff
    -f {{ lookup('env', 'HOME') }}/.mp-eks-clustersecretstore.yaml
  register: eks_css_diff
  changed_when: false
  failed_when: eks_css_diff.rc > 1

- name: ClusterSecretStore 적용
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ eks_kubeconfig }} apply
    -f {{ lookup('env', 'HOME') }}/.mp-eks-clustersecretstore.yaml
  changed_when: eks_css_diff.rc == 1

# 🔴 `-o jsonpath={...[?(@.type=="Ready")]...}` 를 쓰지 않는다 — `command` 모듈은 셸을 거치지 않고
#    인자를 쪼개며 **따옴표를 벗겨** `@.type==Ready` 가 되어 jsonpath 파싱이 깨진다(#14 에서 실측).
#    ⇒ `-o json` 을 받아 Ansible 이 파싱한다.
- name: 스토어가 Ready 인지 (= IRSA 가 실제로 동작한다)
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ eks_kubeconfig }} get clustersecretstore mp-aws-secrets -o json
  register: eks_eso_ready
  changed_when: false
  retries: 10
  delay: 6
  until: >-
    (eks_eso_ready.stdout | from_json).status.conditions
    | default([]) | selectattr('type', 'equalto', 'Ready')
    | selectattr('status', 'equalto', 'True') | list | length > 0
  # 🔴 여기서 실패하면 IRSA 배선(OIDC 프로바이더 · 신뢰정책의 `sub`)이 잘못된 것이다.
  #    SSM 에 값이 없어서 나는 실패가 아니다 — 그건 ExternalSecret 쪽에서 난다.
