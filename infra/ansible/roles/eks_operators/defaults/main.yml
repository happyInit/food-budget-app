---
eks_kubeconfig: "{{ lookup('env', 'HOME') }}/.kube/config-mp-eks"

# 🔴 온프렘과 같은 값으로 시작한다 — 갈리면 "온프렘에서 되던 것" 이 근거가 되지 못한다.
#    ⚠️ 여기는 **독립 선언**이다(C-77). 온프렘을 올려도 여기는 안 따라온다 — 격리의 대가이자 목적.
#
# 🔴 **아래 값은 온프렘 `helm list -A` 실측이다 — 기억이나 최신 버전이 아니다**(2026-08-13 · 결함 #19).
#    처음에 `v1.16.2`·`0.10.4` 로 적었는데 **둘 다 실물과 달랐고**, 위 주석은 의도만 적고
#    값을 재지 않은 상태였다. ESO 는 특히 위험했다:
#      · 0.10.4 는 `v1alpha1`+**`v1beta1`** 만 서브한다
#      · 온프렘 2.8.0 은 **`v1` 만** 서브한다(`v1beta1=false` 실측)
#      · config 레포 매니페스트는 `external-secrets.io/v1` 이다
#    ⇒ 낡은 핀으로 갔으면 A0 는 지나가고 **⑦(ArgoCD sync)에서 ExternalSecret 30종이
#      전건 실패**했다 — 원인이 "차트 버전"이라는 걸 그 지점에서 짚기는 훨씬 어렵다.
#    🔴 **버전 핀을 새로 쓸 때는 온프렘 `sudo helm list -A` 로 대조한다.**
eks_certmanager_version: "v1.21.0" # 온프렘 = cert-manager-v1.21.0
eks_eso_version: "2.8.0"           # 온프렘 = external-secrets-2.8.0 (앱 v2.8.0)
