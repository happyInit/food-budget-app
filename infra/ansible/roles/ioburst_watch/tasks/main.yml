---
# mp-ioburst 워처 배포/철수. 배경·설정값은 defaults/main.yml 참조.
#
# 대상 (2026-07-31 재지정):
#   ✅ hypervisor(`.12` 호스트 A)  — 정식 대상. 물리 SSD 포화가 실제로 일어난 계층이다.
#   ⬜ k8s_nodes                    — 2단계 드릴다운. 호스트 워처가 "범인은 kvm(vmid=NNN)"
#                                     까지 좁혀 준 뒤, 그 게스트 안을 볼 필요가 생기면 켠다.
#                                     `k8s.yml` 에 아래 플레이를 추가하면 된다:
#                                       - hosts: k8s_nodes
#                                         become: true
#                                         tags: ioburst
#                                         roles: [ioburst_watch]
#                                     (스크립트는 crictl 을 이미 지원한다. `.12` 처럼 root 가
#                                      아니라 ubuntu+become 이라 become: true 가 필요하다.)
#   ❌ ci / vms(호스트 C `.10`)     — 별개 물리 머신이고 폭주 이력이 없다. 아래 assert 로 차단.
#                                     `ioburst_enabled: false` 로만 돌려 1세대 잔재를 걷어낸다.

- name: 설치 대상 방어 — 호스트 C(ci)에는 설치하지 않는다
  ansible.builtin.assert:
    that: "'ci' not in group_names"
    fail_msg: >-
      ioburst_watch 를 호스트 C(.10)에 **설치**하려 하고 있다. 호스트 C 는 폭주·급사 이력이
      없는 별개 물리 머신이고, 1세대가 대상 3대를 잃고 여기만 남아 생긴 착오가 바로 그것이다.
      정식 대상은 하이퍼바이저(.12)와 (필요 시) K8s 노드다.
      호스트 C 에서는 `ioburst_enabled: false` 로만 돌린다(1세대 fb-* 철수용).
    quiet: true
  when: ioburst_enabled | bool

# ── 철수 경로 (ioburst_enabled: false) ─────────────────────────────────────
# 수집한 덤프는 지우지 않는다 — 원인 규명 증거를 롤 한 번으로 날리지 않기 위해서.
# 덤프까지 지우려면 `mp-ioburst-uninstall.sh --purge` 를 수동 실행할 것.
# 🔴 1세대 이름(fb-ioburst-watch.service 등)은 **그대로 참조**해 제거한다. 이름을 mp- 로
#    바꾼 것은 신규 유닛뿐이고, 잔재를 안 걷으면 두 세대가 같이 도는 상태가 된다.
- name: 워처 철수 — 서비스 중지·비활성 (2세대·1세대 모두)
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - mp-ioburst-watch.service
    - fb-ioburst-watch.service
  failed_when: false
  when: not (ioburst_enabled | bool)

- name: 워처 철수 — 유닛·스크립트 제거 (2세대·1세대 모두)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/mp-ioburst-watch.service
    - /usr/local/bin/mp-ioburst-watch.sh
    - /usr/local/bin/mp-ioburst-uninstall.sh
    - /etc/systemd/system/fb-ioburst-watch.service
    - /usr/local/bin/fb-ioburst-watch.sh
    - /usr/local/bin/fb-ioburst-uninstall.sh
  when: not (ioburst_enabled | bool)
  notify: reload systemd

- name: 철수 시 이후 태스크 건너뛰기
  ansible.builtin.meta: end_host
  when: not (ioburst_enabled | bool)

# ── 배포 경로 ──────────────────────────────────────────────────────────────
# 워처는 /proc/PID/io(타 프로세스)·dmsetup·qm 을 읽어야 해서 root 로 돈다.

# 1세대가 남아 있으면 같은 디스크를 두 워처가 감시하게 된다(덤프 중복·부하 2배).
# 실측상 어느 호스트에도 배포된 적이 없지만, 멱등하게 한 번 걷고 간다.
- name: 1세대 fb-ioburst 잔재 정리 — 서비스
  ansible.builtin.systemd_service:
    name: fb-ioburst-watch.service
    state: stopped
    enabled: false
  failed_when: false
  changed_when: false

- name: 1세대 fb-ioburst 잔재 정리 — 유닛·스크립트
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/fb-ioburst-watch.service
    - /usr/local/bin/fb-ioburst-watch.sh
    - /usr/local/bin/fb-ioburst-uninstall.sh
  notify: reload systemd

# 🔴 원격 송출 경로가 없으면 이 롤의 존재 이유가 통째로 사라진다(= 1세대와 같아진다).
#    조용히 로컬 전용으로 퇴화하는 대신 배포 시점에 큰 소리로 실패한다.
- name: 원격 싱크 주소 확인 (급사 생존의 전제)
  ansible.builtin.assert:
    that:
      - ioburst_syslog_host | default('') | length > 0
      - ioburst_host_label | default('') | length > 0
    fail_msg: >-
      ioburst_syslog_host 또는 ioburst_host_label 이 비어 있다. 이 상태로 배포하면 워처는
      돌지만 증거는 로컬에만 남고, 전원이 끊기는 급사에서 그 증거는 같이 죽는다
      (1세대 fb-ioburst 가 실패한 바로 그 구조). 값의 정본 = group_vars/all.yml `mp_hostwatch_*`.
    quiet: true

# 🔴 라벨에 `[`·`:`·공백이 들어가면 rsyslog 의 programname 파싱이 거기서 잘려
#    파일명이 엉뚱해지고(또는 다른 호스트와 합쳐지고) 알림이 조용히 어긋난다.
- name: 호스트 라벨이 syslog TAG 로 안전한지 확인
  ansible.builtin.assert:
    that: "ioburst_host_label is match('^[A-Za-z0-9._-]+$')"
    fail_msg: >-
      ioburst_host_label='{{ ioburst_host_label }}' 에 syslog TAG 로 못 쓰는 문자가 있다.
      허용 = 영숫자 . _ - (rsyslog 는 '[' ':' 공백에서 programname 을 자른다).
    quiet: true

# logger 는 util-linux 내장이라 사실상 항상 있지만, 없으면 송출이 통째로 조용히 사라진다.
- name: logger 존재 확인 (util-linux — 원격 송출의 유일한 수단)
  ansible.builtin.command: command -v logger
  register: ioburst_logger
  changed_when: false
  failed_when: ioburst_logger.rc != 0

# 교차검증용 선택 의존. `.12` 는 Proxmox 엔터프라이즈 repo 401 때문에 apt 캐시 갱신이
# 실패하므로 캐시 갱신 없이 설치만 시도하고, 실패해도 넘어간다(스크립트가 없으면 건너뛴다).
- name: sysstat 설치 (pidstat·iostat 교차검증 — 선택)
  ansible.builtin.apt:
    name: sysstat
    state: present
    update_cache: false
  register: ioburst_sysstat
  failed_when: false
  when: ioburst_install_sysstat | bool

- name: sysstat 미설치 안내 (실패해도 롤은 진행 — /proc/PID/io 만으로 결론은 난다)
  ansible.builtin.debug:
    msg: >-
      sysstat 설치 실패 — 덤프의 [3] pidstat·iostat 섹션이 비어 나온다.
      범인 식별의 본체는 [1] /proc/PID/io 5초 델타라 결론에는 영향이 없다.
  when:
    - ioburst_install_sysstat | bool
    - ioburst_sysstat is failed

- name: 덤프 디렉터리
  ansible.builtin.file:
    path: "{{ ioburst_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: 워처 스크립트 배치
  ansible.builtin.copy:
    src: mp-ioburst-watch.sh
    dest: /usr/local/bin/mp-ioburst-watch.sh
    owner: root
    group: root
    mode: "0755"
  notify: restart ioburst watcher

# Ansible 이 안 닿는 상황(네트워크 단절 등)에서의 수동 폴백. 정식 철수는 ioburst_enabled: false.
- name: 수동 제거 스크립트 배치 (폴백)
  ansible.builtin.copy:
    src: mp-ioburst-uninstall.sh
    dest: /usr/local/bin/mp-ioburst-uninstall.sh
    owner: root
    group: root
    mode: "0755"

- name: systemd 유닛 배치 (임계·주기·행선지는 여기서 주입)
  ansible.builtin.template:
    src: mp-ioburst-watch.service.j2
    dest: /etc/systemd/system/mp-ioburst-watch.service
    owner: root
    group: root
    mode: "0644"
  notify: restart ioburst watcher

- name: 워처 활성화·기동
  ansible.builtin.systemd_service:
    name: mp-ioburst-watch.service
    state: started
    enabled: true
    daemon_reload: true

- name: 핸들러 즉시 반영 (아래 검증이 새 설정을 보도록)
  ansible.builtin.meta: flush_handlers

# 워처는 "평소엔 아무것도 안 하는" 물건이라, 죽어 있어도 티가 안 난다.
# 배포 때마다 최소한 살아 있는지는 단언해 둔다.
- name: 워처 실동작 검증 — 서비스 active
  ansible.builtin.command: systemctl is-active mp-ioburst-watch.service
  register: ioburst_active
  changed_when: false
  failed_when: ioburst_active.stdout.strip() != 'active'
  when: not ansible_check_mode

# ── 원격 송출 end-to-end 검증 ──────────────────────────────────────────────
# 🔴 여기가 이번 개편의 핵심이라 배포 시점에 **실제로 보내 보고, 싱크에서 눈으로 확인한다.**
#    로컬에서 도는 것만 확인하면 1세대와 똑같이 "죽을 때 아무것도 안 남는" 상태를 못 걸러낸다.
#    ⚠️ UDP 는 실패해도 송신측이 성공으로 보인다 — 그래서 **받는 쪽에서** 확인하는 것이
#       유일하게 의미 있는 검증이다(delegate_to 로 호스트 C 에 붙어 파일을 본다).
- name: 검증 프로브 nonce 생성 (송신·수신 태스크가 같은 값을 봐야 한다)
  ansible.builtin.set_fact:
    ioburst_probe_nonce: "mpprobe{{ ansible_date_time.epoch }}x{{ 999999 | random }}"
  when: ioburst_verify_sink | bool

- name: 원격 송출 경로 검증 ① — 대상 호스트에서 싱크로 프로브 송신
  ansible.builtin.command:
    argv:
      - logger
      - --rfc3164
      - --server={{ ioburst_syslog_host }}
      - --port={{ ioburst_syslog_port }}
      - --udp
      - --tag={{ ioburst_host_label }}
      - --priority={{ ioburst_syslog_priority }}
      - --size={{ ioburst_logger_max_size }}
      - --
      - >-
        ts={{ ansible_date_time.iso8601 }} host={{ ioburst_host_label }} kind=deploy
        evt=deploy-{{ ansible_date_time.epoch }}-ansible seq=1 nonce={{ ioburst_probe_nonce }}
        threshold_mbs={{ ioburst_threshold_mbs }} interval_s={{ ioburst_interval_s }}
        beacon_idle_s={{ ioburst_beacon_idle_s }} msg="mp-ioburst 배포 검증 프로브"
  changed_when: false
  when:
    - not ansible_check_mode
    - ioburst_verify_sink | bool

- name: 원격 송출 경로 검증 ② — 싱크(호스트 C)의 파일에 실제로 도착했는지 확인
  ansible.builtin.wait_for:
    path: "{{ ioburst_sink_dir }}/{{ ioburst_host_label }}.log"
    search_regex: "{{ ioburst_probe_nonce }}"
    timeout: 30
  delegate_to: "{{ ioburst_sink_inventory_host }}"
  become: true
  changed_when: false
  when:
    - not ansible_check_mode
    - ioburst_verify_sink | bool
  # 실패 시 볼 곳: 싱크에 hostwatch_sink 롤이 배포됐는지 · rsyslog 가 514/udp 를 듣는지
  # (`ss -lunp | grep :514`) · $AllowedSender 에 이 호스트 IP 가 있는지.
