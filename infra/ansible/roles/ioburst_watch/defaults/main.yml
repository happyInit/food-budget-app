---
# mp-ioburst — 디스크 읽기 폭주 감시 + **증거의 원격 송출**.
#
# ── 왜 있나 (사실) ───────────────────────────────────────────────────────────
# 2026-07-21·07-22 두 차례, 호스트 A(`.12`) 위 fb-data 게스트 sda 에서 390~400 MB/s ·
#   8,700 tps · util 82% 읽기가 28분 지속 → 호스트 SSD 포화 → 전 게스트 iowait 62~76%.
#   총 ~670GB(100GB 디스크를 7회 재독)인데 페이지캐시는 안 늘었다 ⇒ O_DIRECT/원시블록 추정.
#   크론·systemd 타이머·컨테이너 시작·vzdump 어디에도 해당 시각 작업이 없고 주기적이지도
#   않아 사후 로그로는 프로세스를 특정할 수 없다. **원인 미규명.**
# 같은 호스트가 무흔적 급사 3회(2026-07-19 17:03 · 07-21 18:04 · 07-21 23:49 KST).
#   패닉·OOM·MCE 0건. 폭주와 급사의 인과관계는 **미확인**이다.
#
# ── 1세대(fb-ioburst)에서 무엇이 바뀌었나 ───────────────────────────────────
# 🔴 ① 행선지. 1세대는 덤프를 로컬 디스크에만 남겼다 → 전원이 끊기는 급사에서 증거가 같이
#      죽는다. 2세대는 모든 관측을 **즉시 호스트 C(`.10`)의 rsyslog 로** 밀어낸다.
#      로컬 파일은 백업(재부팅 생존, 디스크 상실은 못 견딤)으로 강등.
#      ⚠️ 2026-07-31 재설계 — 행선지가 **인클러스터 Loki 에서 호스트 C 로 바뀌었다.**
#         Loki(`loki-0`)·Prometheus·Alertmanager 가 전부 호스트 B 라, 호스트 B 가 죽으면
#         기록·수신·발화가 동시에 죽어 증거가 0 이 됐다. 근거·트레이드오프 = group_vars/all.yml
#         의 `mp_hostwatch_*` 블록. 평시 조회는 호스트 C 의 alloy 가 그 파일을 Loki 로
#         tail 해 주므로 Grafana 경험은 그대로다(급사 시에만 경로가 갈린다).
# 🔴 ② 대상. 1세대는 VM 4대에 깔렸고 그중 3대가 P1~P4 에서 파괴됐다. 남은 대상이 호스트 C
#      뿐이라 **폭주가 난 적도 없는 CI 서버에만 설치되는** 상태였다(실제 배포는 되지 않았음).
#      2세대의 정식 대상 = **하이퍼바이저(`.12`)**. 물리 SSD 포화는 게스트 계층이 아니라
#      호스트 계층의 사건이고, 호스트에서 보면 ⓐ 게스트 프로세스가 범인이든 호스트
#      프로세스가 범인이든 **항상 보이며** ⓑ 게스트가 파괴돼도 감시가 사라지지 않는다.
#      게스트(K8s 노드) 배포는 2단계 드릴다운 — tasks/main.yml 상단 주석 참조.
# 🔴 ③ 비콘. 15초마다 디스크·부하·PSI·온도를 logfmt 한 줄로 밖에 내보낸다.
#      **비콘이 끊긴 시각 = 급사 시각**이고, 마지막 몇 줄이 "죽기 직전 무슨 일이 있었나"다.
#      (게스트 `sar` 커버리지 공백으로 호스트 다운타임을 역추정하던 기법의 원격판이다.)

# false 로 두고 롤을 돌리면 **깨끗이 제거**된다(mp-* 유닛 + 1세대 fb-* 잔재 모두).
#   수집한 덤프(ioburst_dir)는 제거해도 남긴다 — 증거를 롤 한 번으로 날리지 않기 위해서.
ioburst_enabled: true

# ── 임계 ────────────────────────────────────────────────────────────────────
# 100 MB/s: 인클러스터 Prometheus 알람 `MpHypervisorDiskReadBurst` 와 **같은 값**으로 맞춘다
#   (알람이 울린 시각 ↔ 덤프 파일이 1:1 로 대응해야 사후 대조가 된다).
#   여유 확인 — `.12` 실측 유휴 0.06 MB/s, 최근 7일 5분평균 최대 10.5 MB/s(sdb), 폭주 395 MB/s.
ioburst_threshold_mbs: 100
# 이 값 이상이면 비콘을 모으지 않고 **즉시** push 한다 = 폭주 중 증거 손실 상한이 15초로 내려간다.
ioburst_hot_mbs: 20
ioburst_interval_s: 15        # 샘플 주기. /proc 한 줄 읽기라 비용 ≈ 0
ioburst_beacon_idle_s: 60     # 유휴 시 비콘 flush 주기 = 유휴 구간 증거 손실 상한
ioburst_cooldown_s: 300       # 연속 덤프 억제 — 28분짜리 폭주가 덤프를 도배하지 않게
ioburst_retain_days: 14       # 로컬 덤프 보존
ioburst_topology_interval_s: 3600
ioburst_dir: /var/log/mp-ioburst

# ── 감시 대상 디바이스 ──────────────────────────────────────────────────────
# 트리거 = 물리 디스크만. 하이퍼바이저에서 dm-* 는 게스트 LV 라 물리 포화의 지표가 아니고,
#   dm 으로 트리거하면 게스트 한 대의 정상 부하에도 덤프가 뜬다.
ioburst_trigger_dev_re: '^(sd[a-z]+|vd[a-z]+|nvme[0-9]+n[0-9]+)$'
# 보고 = 물리 + dm-*. 🔴 이게 귀속의 핵심이다 —
#   인클러스터 Prometheus 는 이미 `node_disk_read_bytes_total{job="hypervisor", device="dm-N"}`
#   (게스트 LV 별 읽기량)을 30초마다 호스트 B 에 저장하고 있다. 즉 **어느 게스트가 읽었는지는
#   이미 급사에서 살아남고 있다.** 다만 dm-N 번호는 재부팅마다 바뀌어 사후에 못 푼다
#   → 워처가 `dmsetup ls`·`qm list` 사전을 주기적으로 싱크에 보내 번역 가능하게 만든다.
ioburst_report_dev_re: '^(sd[a-z]+|vd[a-z]+|nvme[0-9]+n[0-9]+|dm-[0-9]+)$'

# ── 원격 송출 (급사 생존의 전부) ────────────────────────────────────────────
# 행선지 = 호스트 C(`.10`)의 rsyslog. 값의 정본은 group_vars/all.yml 의 `mp_hostwatch_*`.
#   여기서 참조만 한다 — 두 롤(+싱크 롤)이 각자 상수를 들고 있으면 반드시 어긋난다.
# ⚠️ 비면 배포가 assert 로 실패한다. "원격 없이 로컬만"은 1세대가 실패한 바로 그 구조다.
ioburst_syslog_host: "{{ mp_hostwatch_sink_host | default('') }}"
ioburst_syslog_port: "{{ mp_hostwatch_sink_port | default(514) }}"
# syslog facility·priority. daemon.info = 하이퍼바이저 로컬 journal 도 오염시키지 않고,
#   싱크에서는 전용 ruleset 이 받으므로 사실상 라우팅에 안 쓰인다(가독성용).
ioburst_syslog_priority: "daemon.info"
# 🔴 한 줄(syslog 메시지 1건)의 payload 상한. RFC3164 전통 상한이 1024B 라 여유를 두고 자른다.
#    logger 는 `-S` 로 그보다 크게 열어 두되, 스크립트가 먼저 자른다(잘림이 조용히 나지 않게).
ioburst_msg_maxlen: 1600
ioburst_logger_max_size: 2048

# 🔴 이 값이 **세 곳에서 동시에 정체(identity)로 쓰인다.** 바꾸면 셋이 같이 깨진다:
#    ① syslog TAG → 싱크의 파일 이름 `{{ mp_hostwatch_dir }}/<이 값>.log`
#    ② alloy → Loki 스트림 라벨 `host`
#    ③ 인클러스터 Prometheus 의 `instance` 라벨(job=hypervisor)
#    ③ 과 같아야 메트릭↔로그 상호 점프가 된다. `fb-proxmox` 는 **기존 실물 라벨**이라
#    mp- 로 바꾸지 않는다(호스트 B 는 신규라 `mp-proxmox-b`).
# ⚠️ TAG 는 rsyslog 의 programname 으로 파싱된다 — `[`·`:`·공백이 들어가면 잘린다. 쓰지 말 것.
ioburst_host_label: "{{ inventory_hostname }}"

# 배포 시점 end-to-end 검증(대상 호스트에서 프로브 송신 → 싱크의 파일에서 확인).
#   🔴 이걸 끄면 "로컬에서는 도는데 밖에는 아무것도 안 남는" 1세대의 실패를 못 걸러낸다.
ioburst_verify_sink: true
ioburst_sink_inventory_host: "{{ mp_hostwatch_sink_inventory_host | default('fb-ci-harbor') }}"
ioburst_sink_dir: "{{ mp_hostwatch_dir | default('/var/log/mp-hostwatch') }}"

# sysstat(pidstat·iostat)은 교차검증용 **선택** 의존이다. 없어도 [1] 프로세스별 /proc/PID/io
#   델타로 결론이 난다. 하이퍼바이저에 패키지를 늘리기 싫으면 false.
ioburst_install_sysstat: true
