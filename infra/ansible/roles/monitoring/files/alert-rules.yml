# Ansible이 그대로 복사하는 정적 파일 (Go 템플릿 $labels/$value가
# Jinja2와 충돌하지 않도록 templates/가 아니라 files/에 둠)

groups:
  - name: watchdog
    rules:
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
          owner: infra-sre
        annotations:
          summary: "Alertmanager 알림 파이프라인이 살아있는지 확인하는 항시-발화 알림 (이 알림이 안 보이면 파이프라인 자체가 죽은 것)"

  - name: infra-basic
    rules:
      - alert: PrometheusTargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: warning
          owner: infra-sre
        annotations:
          summary: "{{ $labels.job }}/{{ $labels.instance }} 타깃이 5분 이상 다운"

      - alert: VMDown
        expr: up{job="node"} == 0
        for: 1m
        labels:
          severity: critical
          owner: infra-sre
        annotations:
          summary: "{{ $labels.instance }} VM 다운 추정 (node-exporter 응답 없음)"

      - alert: DiskUsageHigh
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 > 85
        for: 1m
        labels:
          severity: warning
          owner: infra-sre
        annotations:
          summary: "{{ $labels.instance }} 루트 디스크 사용률 85% 초과 (design.md thin 풀 임계값과 동일)"

  # 물리 하이퍼바이저(.12 = VM 4대를 얹은 그 머신) 발열 감시.
  # 2026-07-19·07-21(2회) 무흔적 급사 후속 — 당시 유휴 CPU 90°C 가 관측됐는데
  # 정작 .12 는 Prometheus 감시 대상이 아니라 급사 순간의 온도 곡선이 하나도 없었다.
  #
  # ⚠️ 이 그룹으로 **급사 자체를 실시간 통보받을 수는 없다** — Prometheus 도
  #    Alertmanager 도 .12 위의 VM 이라 호스트가 죽으면 같이 죽는다. 이 알람의 값은
  #    ① 급사 *전* 온도 상승 경고, ② 재부팅 후에도 남는 급사 직전 온도 곡선(TSDB 는
  #    fb-monitoring VM 디스크에 영속) 이다.
  #
  # 센서 해독: chip=platform_coretemp_0 → temp1=Package, temp2~temp9=Core 0~7 /
  #            chip=0000:00:01_0_… → nouveau GPU(GTX 1060).
  # 임계값을 하드코딩하지 않고 **각 센서가 스스로 보고하는 한계치**에 맞춘다
  # (node_hwmon_temp_max_celsius: CPU 80·GPU 95 / _crit_: CPU 100·GPU 105).
  - name: hypervisor-thermal
    rules:
      - alert: HypervisorTempHigh
        expr: |
          node_hwmon_temp_celsius{job="hypervisor"}
            >= on(instance, chip, sensor) node_hwmon_temp_max_celsius{job="hypervisor"}
        for: 5m
        labels:
          severity: warning
          service: hypervisor
          owner: infra-sre
        annotations:
          summary: "{{ $labels.instance }} {{ $labels.chip }}/{{ $labels.sensor }} 온도 {{ $value }}°C — 센서 자체 경고선(high) 도달"

      - alert: HypervisorTempCritical
        expr: |
          node_hwmon_temp_celsius{job="hypervisor"}
            >= on(instance, chip, sensor) (node_hwmon_temp_crit_celsius{job="hypervisor"} - 10)
        for: 1m
        labels:
          severity: critical
          service: hypervisor
          owner: infra-sre
        annotations:
          summary: "{{ $labels.instance }} {{ $labels.chip }}/{{ $labels.sensor }} 온도 {{ $value }}°C — 크리티컬 10°C 이내. 급사 임박 가능(과거 급사 전 유휴 90°C 관측)"

      # 하드웨어가 스스로 임계 초과를 표시하는 플래그. 여기까지 오면 이미 늦었지만
      # 급사 원인이 열이었는지 사후에 확정해 주는 유일한 신호다.
      - alert: HypervisorTempCritAlarm
        expr: node_hwmon_temp_crit_alarm_celsius{job="hypervisor"} > 0
        for: 0m
        labels:
          severity: critical
          service: hypervisor
          owner: infra-sre
        annotations:
          summary: "{{ $labels.instance }} {{ $labels.chip }}/{{ $labels.sensor }} 하드웨어 크리티컬 알람 발생 — 즉시 부하 차단"

      # ⚠️ 호스트 급사는 이걸로 못 잡는다(위 참조). node-exporter 프로세스만 죽은
      #    경우를 잡는 용도 — 방치하면 온도 감시가 조용히 사라진다.
      - alert: HypervisorExporterDown
        expr: up{job="hypervisor"} == 0
        for: 10m
        labels:
          severity: warning
          service: hypervisor
          owner: infra-sre
        annotations:
          summary: "{{ $labels.instance }} node-exporter 무응답 10분 — 하이퍼바이저 온도 감시가 꺼진 상태(호스트 급사면 Prometheus 도 같이 죽으므로 이 알람은 안 온다)"

  # 물리 하이퍼바이저 디스크 I/O 감시 — 정체불명 읽기 폭주(docker-infra-status.md §7) 조사용.
  #
  # 배경: 07-21·07-22 에 `sdb`(WD Blue 1TB = VM 4대 스토리지가 올라간 pve VG)에서
  #   390~400 MB/s 순수 읽기가 28~30분 지속돼 전 게스트 iowait 를 62~76% 로 밀어올렸다.
  #   범인 프로세스를 못 잡아 게스트 4대에 `fb-ioburst` 워처를 상주시켰는데(롤 ioburst_watch),
  #   **그 워처는 VM 전용이라 호스트에서 도는 프로세스가 범인이면 영원히 안 잡힌다.**
  #
  # 이 알람의 값 = **판별**이다. 발동했는데 같은 시각 게스트 워처 덤프
  #   (`/var/log/fb-ioburst/burst-*.txt`, journal `-t fb-ioburst`)가 **없으면**
  #   범인은 호스트측(PVE 태스크·LVM thin·smartd 롱테스트 등)으로 좁혀진다. 있으면 게스트측.
  #   → 임계값을 게스트 워처와 **똑같이 100 MB/s** 로 맞춘 이유가 이 교차판정이다.
  #
  # ⚠️ util(io_time) 기반으로 쓰지 말 것 — 07-22 실측에서 `sdb` util 은 72% 였고
  #    99.5% 는 dm-3/4/7(LVM thin 계층)에서 나왔다. 물리 디바이스 util 임계로는 이 사건을 놓친다.
  # ⚠️ 대상은 물리 디바이스만 — dm-* 은 같은 I/O 를 LVM 계층에서 중복 계상해 알람이 4중으로 뜬다.
  #    (어느 게스트인지는 발동 후 Grafana 에서 dm-* 계열을 보고 특정한다.)
  - name: hypervisor-disk
    rules:
      - alert: HypervisorDiskReadBurst
        expr: |
          rate(node_disk_read_bytes_total{job="hypervisor", device=~"sd[a-z]+|nvme[0-9]+n[0-9]+"}[5m])
            / 1024 / 1024 > 100
        # 실측 폭주가 28~30분짜리라 5m 은 충분히 짧다. terraform 템플릿 클론 같은
        # 짧은 정상 부하(관측 최대 72 MB/s·5분)를 걸러내는 마진이기도 하다.
        for: 5m
        labels:
          severity: warning
          service: hypervisor
          owner: infra-sre
        annotations:
          summary: "{{ $labels.instance }} {{ $labels.device }} 읽기 {{ $value | printf \"%.0f\" }} MB/s 5분 지속 — 디스크 읽기 폭주(§7 미해결 건) 재발 가능"
          description: >-
            즉시 판별: 같은 시각 게스트 4대에 fb-ioburst 덤프가 있는지 확인
            (ansible vms -m shell -a 'ls -t /var/log/fb-ioburst/burst-*.txt | head -1').
            덤프가 없으면 호스트측 프로세스가 범인 — .12 에서 `iotop -oPa` / `pidstat -d 5` 로 현장 포착할 것.
            폭주 중에는 전 게스트 iowait 가 60% 이상으로 오르므로 앱 지연도 함께 본다.

  - name: data-pipeline
    rules:
      - alert: DataPollerLastRunFailed
        expr: fb_poller_last_run_success == 0
        for: 1m
        labels:
          severity: warning
          service: data-pipeline
          owner: data-pipeline
        annotations:
          summary: "{{ $labels.poller }} 마지막 실행 실패"

      - alert: DataPollerStale
        expr: |
          (time() - fb_poller_last_success_timestamp_seconds{poller="poller-price-matview"} > 10800)
          or (time() - fb_poller_last_success_timestamp_seconds{poller="poller-oasis"} > 57600)
          or (time() - fb_poller_last_success_timestamp_seconds{poller=~"poller-kurly|poller-deal-timesale|poller-deal-closesale"} > 108000)
          or (time() - fb_poller_last_success_timestamp_seconds{poller=~"poller-recipe|poller-es-recipes"} > 432000)
        for: 5m
        labels:
          severity: warning
          service: data-pipeline
          owner: data-pipeline
        annotations:
          summary: "{{ $labels.poller }} 성공 데이터가 예정 주기보다 오래 갱신되지 않음"

      - alert: KafkaConsumerLagGrowing
        expr: |
          sum by(consumergroup, topic) (kafka_consumergroup_lag{consumergroup=~"retail-refiner|deal-notifier|recipe-refiner"}) > 100
          and
          deriv(sum by(consumergroup, topic) (kafka_consumergroup_lag{consumergroup=~"retail-refiner|deal-notifier|recipe-refiner"})[10m:]) > 0
        for: 1m
        labels:
          severity: warning
          service: data-pipeline
          owner: data-pipeline
        annotations:
          summary: "{{ $labels.consumergroup }}/{{ $labels.topic }} lag이 100건을 넘고 계속 증가"

      - alert: PipelineSinkWriteFailure
        expr: sum by(component, sink) (rate(fb_pipeline_sink_writes_total{result="failure"}[5m])) > 0
        for: 5m
        labels:
          severity: critical
          service: data-pipeline
          owner: data-pipeline
        annotations:
          summary: "{{ $labels.component }}의 {{ $labels.sink }} 저장 실패 지속"

  # PGSync 프리컨디션 (PG→ES 색인 동기화, design.md §330). 논리 복제슬롯이 멈추면
  # WAL 이 /var/lib/docker(pg_wal) 에 무한 축적 → 디스크 full → PG 쓰기 전면중단.
  # 단일노드라 물리 안전장치가 없어 이 알람이 유일한 조기경보 (docs/pgsync-adoption.md).
  - name: data-tier-pgsync
    rules:
      # 백스톱: WAL 이 실제로 차는 디스크. 기존 DiskUsageHigh 는 "/"만 커버 → sdb 미커버였음.
      - alert: DockerDiskUsageHigh
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/var/lib/docker"} / node_filesystem_size_bytes{mountpoint="/var/lib/docker"}) * 100 > 80
        for: 10m
        labels:
          severity: warning
          owner: infra-sre
        annotations:
          summary: "{{ $labels.instance }} /var/lib/docker 사용률 80% 초과 (pg_wal·docker 볼륨 — 복제슬롯 WAL 축적 백스톱)"

      # 슬롯별 조기경보. postgres-exporter replication_slot 컬렉터(default-on, v0.16 확인).
      # 메트릭은 슬롯 최초 생성 후 노출 — 첫 슬롯 생성 시 이름 재확인.
      - alert: PGReplicationSlotRetainedWALHigh
        expr: pg_replication_slots_pg_wal_lsn_diff > 5 * 1024 * 1024 * 1024
        for: 15m
        labels:
          severity: warning
          service: data-tier
          owner: data-pipeline
        annotations:
          summary: "복제슬롯 {{ $labels.slot_name }} 이 5GB+ WAL 보유 (PGSync 소비 지연/정지 의심 — 방치시 디스크 full)"

      # ⚠️ 삭제됨: PGReplicationSlotInactive (expr `pg_replication_slots_slot_is_active == 0`)
      #   ① 메트릭명이 애초에 존재하지 않아(postgres-exporter v0.16 실제 이름 =
      #      pg_replication_slot_slot_is_active / pg_replication_slots_active) 발화 불가한 죽은 룰이었다.
      #   ② 이름을 고쳐도 못 쓴다 — PGSync 7.1.0 은 LISTEN/NOTIFY 로 변경을 감지하고
      #      walsender 를 상주시키지 않아 **active=0 이 정상 스테디상태**다. 켜면 상시 오탐.
      #   → PGSync 정지 감지는 아래 컨테이너 레벨 룰(PGSyncDown/PGSyncCrashLooping)로 대체.
      #     (2026-07-22 급사 후 16시간 크래시루프가 무알람으로 지나간 사고의 후속)

      # PGSync 스택이 통째로 사라진 경우(중지·삭제). cadvisor 가 살아있을 때만 발화 —
      # VM 자체가 죽으면 VMDown/PrometheusTargetDown 이 이미 잡으므로 중복 소음 방지.
      - alert: PGSyncDown
        expr: |
          (
            absent(container_last_seen{name="pgsync"})
            or absent(container_last_seen{name="redis-pgsync"})
          )
          and on() (up{job="cadvisor", instance="fb-data"} == 1)
        for: 10m
        labels:
          severity: critical
          service: data-tier
          owner: data-pipeline
        annotations:
          summary: "{{ $labels.name }} 컨테이너가 10분째 없음 — PG→ES CDC 정지(ES 색인 stale + 복제슬롯 WAL 축적)"

      # 크래시루프. cadvisor 는 docker RestartCount 를 `restartcount` **라벨**로 노출해
      # 재시작마다 새 시계열이 생긴다 → 15분 창의 시계열 개수 = 그 창의 재시작 횟수.
      #   ⚠️ container_start_time_seconds 로는 못 잡는다 — 그건 컨테이너 '생성'시각이라
      #      docker 가 같은 컨테이너를 재시작해도 안 변한다(2026-07-22 실측: changes()=0).
      #   임계값 근거(7일 실측): 정상 = 항상 1, 단발 재배포 = 2, 7/21 급사 크래시루프 = 3~6.
      - alert: PGSyncCrashLooping
        expr: count by(name, instance) (count_over_time(container_last_seen{name=~"pgsync|redis-pgsync"}[15m])) > 2
        for: 5m
        labels:
          severity: critical
          service: data-tier
          owner: data-pipeline
        annotations:
          summary: "{{ $labels.name }} 이 15분간 {{ $value }}회 재시작(크래시루프) — PG→ES CDC 정지. `docker logs {{ $labels.name }} | grep -i error` 로 근인 확인"

  # ─────────────────────────────────────────────────────────────────────────
  # 관측 스택 자신의 건강 — "죽지 않고 조용히 일을 안 하는" 상태를 잡는다.
  #
  # 왜 필요한가: 2026-07-21 급사로 Tempo 블록 15개의 meta.json 이 0바이트로 깨졌고,
  #   블록리스트 폴러가 5분마다 실패해 **압축·보존이 33시간 정지**했다. 그런데 Tempo
  #   컨테이너는 계속 Up 이었다 — PrometheusTargetDown(up==0)도, PGSyncCrashLooping 류의
  #   재시작 카운트 룰도 이 상태를 못 잡는다. 프로세스가 살아있고 재시작도 안 하니까.
  #   무알람으로 33시간이 지나간 뒤 사람이 우연히 발견했다.
  - name: observability-health
    rules:
      # 블록리스트 인덱스가 안 만들어지면 압축기·보존기가 대상 목록을 못 받아 전부 정지한다.
      #   시리즈 '부재'가 신호다 — 폴러가 실패하면 tempodb_blocklist_length 자체가 노출되지
      #   않는다(값이 0으로 떨어지는 게 아니다). 그래서 threshold 가 아니라 absent() 를 쓴다.
      #   `and on() up==1` = Tempo 가 살아있는데도 부재인 경우로 한정 — 컨테이너가 아예
      #   죽은 경우는 PrometheusTargetDown 이 이미 잡으므로 중복 소음을 막는다.
      #   백테스트(2026-07-23): 실제 사고 구간 07-22 09:00~07-23 15:30 KST 31시간 연속 발화,
      #   손상 블록 제거 직후 소멸 확인.
      - alert: TempoBlocklistIndexBroken
        expr: absent(tempodb_blocklist_length) and on() (up{job="tempo"} == 1)
        for: 15m
        labels:
          severity: critical
          service: observability
          owner: infra-sre
        annotations:
          summary: "Tempo 블록리스트 인덱스 생성 실패 15분 — 압축·보존이 정지한다(컨테이너는 Up 이라 다른 알람에 안 걸림)"
          description: >-
            `docker logs tempo | grep 'failed to poll'` 확인. 급사 후라면 0바이트 meta.json 이
            원인일 수 있다 — `find <tempo volume>/blocks -name meta.json -size 0` 로 찾아
            해당 블록 디렉터리를 볼륨 밖으로 옮기고 tempo 재생성(2026-07-21 사고 실제 원인).

      - alert: TempoCompactionErrors
        expr: increase(tempodb_compaction_errors_total[30m]) > 0
        for: 5m
        labels:
          severity: warning
          service: observability
          owner: infra-sre
        annotations:
          summary: "Tempo 압축 에러 발생 — 방치하면 블록이 쌓여 디스크·메모리 압박"

      # OOM 사전 경고. 2026-07-21 Tempo 는 한도 768M 에서 OOM 크래시루프에 빠졌는데,
      # 그 전에 메모리가 자라는 것을 알려주는 알람이 없었다. 컨테이너를 특정하지 않고
      # **한도가 설정된 전 컨테이너**에 건다.
      #   ⚠️ 분모 `> 0` 필수 — 한도 없는 컨테이너는 container_spec_memory_limit_bytes 가
      #      0 이라 그냥 나누면 +Inf 가 되어 전부 발화한다(실측 확인).
      #   임계값 근거(24h 실측): 정상 대역 = alloy 52~68% · ES 69% · kafka 82%.
      #      0.85 는 그 위. 도입 시점에 cadvisor(최대 99.9%)·grafana(92.6%)가 걸리는데
      #      오탐이 아니라 실제 위험이라 같은 PR 에서 한도를 올려 해소했다.
      - alert: ContainerMemoryNearLimit
        expr: |
          container_memory_working_set_bytes{name!=""}
            / (container_spec_memory_limit_bytes{name!=""} > 0) > 0.85
        for: 15m
        labels:
          severity: warning
          service: infra
          owner: infra-sre
        annotations:
          summary: "{{ $labels.name }}({{ $labels.instance }}) 메모리가 한도의 {{ $value | humanizePercentage }} — OOM 임박. 한도 상향 또는 워크로드 축소 검토"
