---
- name: 모니터링 디렉토리
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /opt/monitoring
    - /opt/monitoring/grafana-provisioning/datasources

- name: prometheus.yml 배치 (인벤토리에서 스크레이프 타깃 생성)
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /opt/monitoring/prometheus.yml
    mode: "0644"
  register: prom_cfg

- name: loki 설정 배치
  ansible.builtin.template:
    src: loki-config.yaml.j2
    dest: /opt/monitoring/loki-config.yaml
    mode: "0644"

- name: tempo 설정 배치
  ansible.builtin.template:
    src: tempo.yaml.j2
    dest: /opt/monitoring/tempo.yaml
    mode: "0644"

- name: grafana 데이터소스 프로비저닝 (Prometheus/Loki/Tempo)
  ansible.builtin.template:
    src: grafana-datasource.yml.j2
    dest: /opt/monitoring/grafana-provisioning/datasources/prometheus.yml
    mode: "0644"

- name: Grafana TLS 인증서 디렉토리
  ansible.builtin.file:
    path: /opt/monitoring/certs
    state: directory
    mode: "0755"

- name: Grafana TLS 인증서 배치 (로컬 CA 서명)
  ansible.builtin.copy:
    src: "{{ certs_dir }}/{{ item }}"
    dest: "/opt/monitoring/certs/{{ item }}"
    mode: "0644"
  loop:
    - grafana.crt
    - grafana.key

- name: compose 배치
  ansible.builtin.template:
    src: compose.yml.j2
    dest: /opt/monitoring/docker-compose.yml
    mode: "0644"

- name: LGTM 스택 기동 (Prometheus+Loki+Tempo+Grafana)
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: /opt/monitoring
  changed_when: true

# 단일파일 bind-mount + Ansible 원자적 rename → 컨테이너는 옛 inode 고수.
# /-/reload 는 컨테이너 안 옛 파일을 읽어 무력 → 재생성으로 마운트 inode 갱신.
- name: Prometheus 재생성 (설정 변경 반영)
  ansible.builtin.command:
    cmd: docker compose up -d --force-recreate prometheus
    chdir: /opt/monitoring
  when: prom_cfg.changed
  changed_when: true
