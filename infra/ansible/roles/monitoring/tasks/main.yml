---
- name: 모니터링 디렉토리
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /opt/monitoring
    - /opt/monitoring/grafana-dashboards

- name: Grafana 프로비저닝 표준 디렉토리
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /opt/monitoring/grafana-provisioning/access-control
    - /opt/monitoring/grafana-provisioning/alerting
    - /opt/monitoring/grafana-provisioning/dashboards
    - /opt/monitoring/grafana-provisioning/datasources
    - /opt/monitoring/grafana-provisioning/plugins
  register: grafana_provisioning_dirs

- name: prometheus.yml 배치 (인벤토리에서 스크레이프 타깃 생성)
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /opt/monitoring/prometheus.yml
    mode: "0644"
  register: prom_cfg

- name: alert-rules.yml 배치 (정적 파일, Go 템플릿 그대로 복사)
  ansible.builtin.copy:
    src: alert-rules.yml
    dest: /opt/monitoring/alert-rules.yml
    mode: "0644"
  register: alert_rules_cfg

- name: alertmanager.yml 배치 (Slack 라우팅)
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: /opt/monitoring/alertmanager.yml
    mode: "0644"
  register: alertmgr_cfg

- name: loki 설정 배치
  ansible.builtin.template:
    src: loki-config.yaml.j2
    dest: /opt/monitoring/loki-config.yaml
    mode: "0644"

- name: tempo 설정 배치
  ansible.builtin.template:
    src: tempo.yaml.j2
    dest: /opt/monitoring/tempo.yaml
    mode: "0644"

- name: grafana 데이터소스 프로비저닝 (Prometheus/Loki/Tempo)
  ansible.builtin.template:
    src: grafana-datasource.yml.j2
    dest: /opt/monitoring/grafana-provisioning/datasources/prometheus.yml
    mode: "0644"
  register: grafana_ds_cfg

- name: Grafana 대시보드 provider 프로비저닝
  ansible.builtin.template:
    src: dashboard-provider.yml.j2
    dest: /opt/monitoring/grafana-provisioning/dashboards/provider.yml
    mode: "0644"
  register: grafana_dashboard_provider_cfg

- name: 서버의 Grafana 대시보드 JSON 목록 확인
  ansible.builtin.find:
    paths: /opt/monitoring/grafana-dashboards
    patterns: "*.json"
    file_type: file
    recurse: false
  register: grafana_remote_dashboards

- name: Git에서 제거된 Grafana 대시보드 JSON 정리
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ grafana_remote_dashboards.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  vars:
    grafana_managed_dashboard_files: >-
      {{ query('fileglob', role_path + '/files/grafana-dashboards/*.json')
         | map('basename') | list }}
  when: (item.path | basename) not in grafana_managed_dashboard_files

- name: Git의 Grafana 대시보드 JSON 배치
  ansible.builtin.copy:
    src: grafana-dashboards/
    dest: /opt/monitoring/grafana-dashboards/
    mode: "0644"

- name: Grafana TLS 인증서 디렉토리
  ansible.builtin.file:
    path: /opt/monitoring/certs
    state: directory
    mode: "0755"

- name: Grafana TLS 인증서 배치 (로컬 CA 서명)
  ansible.builtin.copy:
    src: "{{ certs_dir }}/{{ item }}"
    dest: "/opt/monitoring/certs/{{ item }}"
    mode: "0644"
  loop:
    - grafana.crt
    - grafana.key

- name: compose 배치
  ansible.builtin.template:
    src: compose.yml.j2
    dest: /opt/monitoring/docker-compose.yml
    mode: "0644"

- name: LGTM+Alertmanager 스택 기동 (Prometheus+Loki+Tempo+Grafana+Alertmanager)
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: /opt/monitoring
  changed_when: true

# 단일파일 bind-mount + Ansible 원자적 rename → 컨테이너는 옛 inode 고수.
# /-/reload 는 컨테이너 안 옛 파일을 읽어 무력 → 재생성으로 마운트 inode 갱신.
- name: Prometheus 재생성 (설정·alert rule 변경 반영)
  ansible.builtin.command:
    cmd: docker compose up -d --force-recreate prometheus
    chdir: /opt/monitoring
  when: prom_cfg.changed or alert_rules_cfg.changed
  changed_when: true

- name: Alertmanager 재생성 (라우팅 설정 변경 반영)
  ansible.builtin.command:
    cmd: docker compose up -d --force-recreate alertmanager
    chdir: /opt/monitoring
  when: alertmgr_cfg.changed
  changed_when: true

- name: Grafana 재생성 (프로비저닝 설정 변경 반영)
  ansible.builtin.command:
    cmd: docker compose up -d --force-recreate grafana
    chdir: /opt/monitoring
  when: >-
    grafana_provisioning_dirs.changed
    or grafana_ds_cfg.changed
    or grafana_dashboard_provider_cfg.changed
  changed_when: true
