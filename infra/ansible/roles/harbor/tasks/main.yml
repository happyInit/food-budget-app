---
- name: Harbor 인스톨러 디렉토리
  ansible.builtin.file:
    path: /opt/harbor-installer
    state: directory
    mode: "0755"

- name: Harbor 온라인 인스톨러 다운로드
  ansible.builtin.get_url:
    url: "https://github.com/goharbor/harbor/releases/download/{{ harbor_version }}/harbor-online-installer-{{ harbor_version }}.tgz"
    dest: "/opt/harbor-installer/harbor-{{ harbor_version }}.tgz"
    mode: "0644"

- name: 인스톨러 압축 해제
  ansible.builtin.unarchive:
    src: "/opt/harbor-installer/harbor-{{ harbor_version }}.tgz"
    dest: /opt/harbor-installer
    remote_src: true
    creates: /opt/harbor-installer/harbor/install.sh

- name: Harbor TLS 인증서 디렉토리
  ansible.builtin.file:
    path: "{{ harbor_cert_dir }}"
    state: directory
    mode: "0755"

- name: Harbor TLS 인증서 배치 (로컬 CA 서명)
  ansible.builtin.copy:
    src: "{{ certs_dir }}/{{ item.f }}"
    dest: "{{ harbor_cert_dir }}/{{ item.f }}"
    mode: "{{ item.m }}"
  loop:
    - { f: harbor.crt, m: "0644" }
    - { f: harbor.key, m: "0600" }
  register: harbor_certs

- name: harbor.yml 생성 (http + https)
  ansible.builtin.template:
    src: harbor.yml.j2
    dest: /opt/harbor-installer/harbor/harbor.yml
    mode: "0640"
  register: harbor_cfg

- name: docker-compose.yml 존재 확인
  ansible.builtin.stat:
    path: /opt/harbor-installer/harbor/docker-compose.yml
  register: harbor_compose

- name: Harbor install.sh (최초 또는 설정/인증서 변경 시 — compose 재생성)
  ansible.builtin.command:
    cmd: ./install.sh
    chdir: /opt/harbor-installer/harbor
  when: (not harbor_compose.stat.exists) or harbor_cfg.changed or (harbor_certs is changed)
  changed_when: true

- name: Harbor 리소스 제한 override 배치
  ansible.builtin.template:
    src: docker-compose.override.yml.j2
    dest: /opt/harbor-installer/harbor/docker-compose.override.yml
    mode: "0644"
  register: harbor_override

- name: Harbor 컨테이너 재적용 (리소스 제한)
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: /opt/harbor-installer/harbor
  when: harbor_override.changed
  changed_when: true

# 부팅 시 Harbor 자동 기동 — Docker 의 restart:always 만으로는 안 된다(로깅 드라이버 경합).
# 상세 사유는 harbor.service.j2 주석 참조.
- name: Harbor 부팅 유닛 배치 (docker.service 이후 compose up)
  ansible.builtin.template:
    src: harbor.service.j2
    dest: /etc/systemd/system/harbor.service
    mode: "0644"
  register: harbor_unit

# state=started 는 `docker compose up -d` 1회 실행 — 이미 떠 있으면 no-op(멱등).
# 유닛을 active 로 만들어 systemd 상태와 실제를 일치시킨다(다음 부팅 전이라도).
- name: Harbor 부팅 유닛 활성화
  ansible.builtin.systemd_service:
    name: harbor.service
    enabled: true
    state: started
    daemon_reload: "{{ harbor_unit.changed }}"
