---
# ArgoCD 가 동기화하는 플랫폼 스택 — Application CR 의 정본 (2026-07-28 신설).
#
# LGTM 선배포 결정(2026-07-28, 리스크 검사 통과 후 확정):
#   P4 의 "LGTM in-cluster 이전" 중 **스택 세우기만** 앞당긴다. 근거 요약(상세 = status §4.3):
#     · P1 브리지는 메트릭만 커버 → K8s 앱 로그가 P1~P3 동안 kubectl logs 뿐이던 공백을 메운다
#     · 플랜 §2.2 워커 예산표가 이미 Loki 1G·Tempo 2G 를 포함 — 예산 내 소비를 앞당기는 것
#     · 3노드가 전부 호스트 B 안 → LGTM→MinIO 트래픽이 물리 1GbE 를 안 탄다(집계 대역 우려와 무관)
#   🔴 **컷오버는 P4 유지** — 알림규칙 20개·Slack 수신자·Grafana 대시보드 이관·`.11` 철거는
#      여기서 하지 않는다. 그전까지 in-cluster LGTM 은 예비 스택이고 프로덕션 관측은 `.11` 이다.
#
# 방식(2026-07-28 확정): 소스 = 공개 Helm 차트 레포(자격증명 불요·config 레포 무관),
#   values = Application 인라인(valuesObject), Application CR 정본 = 이 롤.
#   플랫폼 매니페스트의 git 집이 정해지면(P2 전 결정) 멀티소스($values)로 이사한다 — 락인 없음.

# 버전 핀 (2026-07-28 grafana.github.io 최신 안정 확인)
loki_chart_version: "7.1.0" # Loki 3.6.8
tempo_chart_version: "1.24.4" # Tempo 2.9.0
alloy_chart_version: "1.11.0" # Alloy v1.18.0

lgtm_chart_repo: https://grafana.github.io/helm-charts

# Loki·Tempo 가 사는 곳. PSS enforce=baseline 을 통과한다(hostPath 불요 — 백엔드가 MinIO).
# 🔴 Alloy 만 kube-system — 로그 수집 DaemonSet 은 hostPath(/var/log/pods)가 필수라
#    baseline 에서 거부된다. node-exporter 와 같은 수칙(호스트 접근 워크로드는 kube-system).
lgtm_namespace: observability

lgtm_retention: 168h # 로그·트레이스 공통 — "MinIO 소비자 = 168h 지연 허용"(플랜 §5.4) 정합

# Loki·Tempo → MinIO 자격증명 Secret 이름 (observability ns).
# 컨테이너가 -config.expand-env=true 로 ${MINIO_...} 를 치환한다 — values 에 평문 금지.
lgtm_minio_secret: lgtm-minio-creds
