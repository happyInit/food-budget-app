---
# ── 멀티아키(arm64) 빌드 전제 — AWS Graviton 이관 선행 1-6 ────────────────────────
# buildx 플러그인(Dockerfile.j2)은 **클라이언트** 쪽만 해결한다. 실제로 arm64 레이어를 만들려면
# 호스트 커널에 aarch64 바이너리 핸들러가 등록돼 있어야 한다 — 없으면 buildx 가
# `linux/amd64` 밖의 플랫폼을 아예 후보로 내놓지 않는다(실측: default 빌더 Platforms 가
# `linux/amd64, linux/amd64/v2` 뿐이고 /proc/sys/fs/binfmt_misc 에 qemu-aarch64 부재).
#
# 🔴 `docker run --privileged tonistiigi/binfmt` 대신 **배포판 패키지**를 쓴다 —
#    그쪽은 등록이 커널 런타임 상태라 **재부팅하면 사라진다**(급사 이력이 있는 집이라 특히 나쁘다).
#    qemu-user-static 은 /usr/lib/binfmt.d/*.conf 를 깔고 systemd-binfmt 가 부팅마다 재등록한다 = 멱등·영속.
- name: 멀티아키 빌드용 QEMU binfmt (arm64 크로스 빌드)
  ansible.builtin.apt:
    name:
      - qemu-user-static
      - binfmt-support
    state: present
    update_cache: true
    cache_valid_time: 3600
  notify: restart systemd-binfmt

- name: Jenkins 디렉토리
  ansible.builtin.file:
    path: "{{ jenkins_dir }}"
    state: directory
    mode: "0755"

# 컨테이너 안 jenkins 유저가 호스트 docker.sock 에 접근하려면 호스트 docker 그룹 GID 가 필요하다.
- name: docker 그룹 GID 조회
  ansible.builtin.getent:
    database: group
    key: docker

- name: docker GID 팩트
  ansible.builtin.set_fact:
    jenkins_docker_gid: "{{ getent_group.docker[1] }}"

- name: Dockerfile 배치 (Jenkins + docker CLI)
  ansible.builtin.template:
    src: Dockerfile.j2
    dest: "{{ jenkins_dir }}/Dockerfile"
    mode: "0644"
  register: jenkins_dockerfile

- name: docker-compose.yml 배치
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ jenkins_dir }}/docker-compose.yml"
    mode: "0644"
  register: jenkins_compose

- name: Jenkins 빌드·기동 (최초 또는 Dockerfile/compose 변경 시)
  ansible.builtin.command:
    cmd: docker compose up -d --build
    chdir: "{{ jenkins_dir }}"
  when: jenkins_dockerfile.changed or jenkins_compose.changed
  changed_when: true

- name: Jenkins 부팅 유닛 배치
  ansible.builtin.template:
    src: jenkins.service.j2
    dest: /etc/systemd/system/jenkins.service
    mode: "0644"
  register: jenkins_unit

- name: Jenkins 부팅 유닛 활성화
  ansible.builtin.systemd_service:
    name: jenkins.service
    enabled: true
    state: started
    daemon_reload: "{{ jenkins_unit.changed }}"
