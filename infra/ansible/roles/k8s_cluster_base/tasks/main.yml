---
# 클러스터 공통 오브젝트 — 노드 레이블 · 네임스페이스(+PSS) · PriorityClass.
# P1 앱 배포의 전제이고, 배치 원칙(플랜 §5.2)이 기대는 레이블 규약을 여기서 만든다.

- name: master 전용 방어
  ansible.builtin.assert:
    that: "'k8s_master' in group_names"
    fail_msg: "k8s_cluster_base 는 master 에서만 실행한다"
    quiet: true

- name: 매니페스트 디렉토리
  ansible.builtin.file:
    path: "{{ k8s_manifest_dir }}"
    state: directory
    mode: "0755"

# ── 노드 레이블 ────────────────────────────────────────────────────────────
# 🔴 이게 없으면 "Prometheus·MinIO 는 B, PG·Redis primary 는 A" 라는 배치 원칙을
#    nodeAffinity 로 표현할 수가 없다. 표준 키(topology.kubernetes.io/zone)를 쓰는 이유는
#    topologySpreadConstraints·볼륨 토폴로지가 이 키를 기본으로 이해하기 때문이다.
- name: 노드 zone 레이블 (물리 호스트 = zone)
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ k8s_kubeconfig }} label node {{ item }}
    topology.kubernetes.io/zone={{ hostvars[item].k8s_node_zone }} --overwrite
  loop: "{{ groups['k8s_nodes'] }}"
  register: k8s_zone_label
  changed_when: "'not labeled' not in k8s_zone_label.stdout"

- name: 워커 role 레이블 (`kubectl get nodes` 가독성 — kubeadm 은 워커에 role 을 안 준다)
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ k8s_kubeconfig }} label node {{ item }}
    node-role.kubernetes.io/worker= --overwrite
  loop: "{{ groups['k8s_workers'] }}"
  register: k8s_role_label
  changed_when: "'not labeled' not in k8s_role_label.stdout"

# ── 네임스페이스 · PriorityClass ───────────────────────────────────────────
- name: 공통 오브젝트 매니페스트
  ansible.builtin.template:
    src: cluster-base.yaml.j2
    dest: "{{ k8s_manifest_dir }}/cluster-base.yaml"
    mode: "0644"

# `kubectl apply` 는 실제 차이가 없어도 일부 종류(PriorityClass·ValidatingAdmissionPolicy 등)에
# `configured` 를 찍는다 → 매 실행이 changed 로 뜨면 "IaC 가 수렴했다"는 신호가 무의미해진다.
# 그래서 **드리프트 판정은 `kubectl diff`(rc 1 = 차이 있음)** 로 하고, apply 는 항상 돌려 수렴시킨다.
- name: 공통 오브젝트 드리프트 확인
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ k8s_kubeconfig }} diff -f {{ k8s_manifest_dir }}/cluster-base.yaml
  register: k8s_base_diff
  changed_when: false
  failed_when: k8s_base_diff.rc > 1

- name: 공통 오브젝트 적용
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ k8s_kubeconfig }} apply -f {{ k8s_manifest_dir }}/cluster-base.yaml
  changed_when: k8s_base_diff.rc == 1

# ── PSA — Helm·kubeadm 이 만든 ns (2026-08-03) ─────────────────────────────
# 위 템플릿은 **우리가 만드는 ns** 만 다룬다. Helm·kubeadm 이 자기 손으로 만든 ns 10개는
#   라벨이 없어 enforce 가 아예 없는 상태였다(실측). 값과 근거 = group_vars/k8s_nodes.yml.
# 🔴 `kind: Namespace` 로 선언해 apply 하지 않는 이유 = Helm 이 소유한 ns 와 관리자가 갈린다.
#    라벨만 덧씌우면 소유권 다툼이 없다(노드 zone 레이블과 같은 방식·같은 멱등 판정).
- name: PSA | Helm·kubeadm 생성 ns 에 Pod Security 라벨
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ k8s_kubeconfig }} label ns {{ item.name }} --overwrite
    pod-security.kubernetes.io/enforce={{ item.enforce }}
    pod-security.kubernetes.io/warn={{ item.warn }}
    pod-security.kubernetes.io/audit={{ item.audit }}
  loop: "{{ k8s_psa_external_namespaces }}"
  loop_control:
    label: "{{ item.name }} → {{ item.enforce }}"
  register: k8s_psa_label
  changed_when: "'not labeled' not in k8s_psa_label.stdout"
  when: k8s_psa_enabled | default(true)
  tags: [psa]

# 🔴 새로 생긴 ns 가 무라벨로 남는 걸 잡는다. PSA 는 **라벨이 없으면 아무것도 강제하지 않는다** —
#    즉 ns 하나가 조용히 추가되면 그 안에서는 privileged 파드가 자유롭게 뜬다. 게다가 증상이
#    전혀 없어서(에러도 경고도 없음) 점검을 돌리기 전까지 아무도 모른다.
#    → 여기서 배포 시점에 **명시적으로 실패**시킨다. 고치는 법은 실패 메시지에 적어 둔다.
#    🔴 라벨 셀렉터의 **존재-부정 `!key`** 를 쓴다. jsonpath 로 하려다 실패했다 —
#       kubectl 의 jsonpath 구현은 `?(!(...))` 부정 필터를 파싱하지 못한다
#       ("unclosed array expect ]"). 셀렉터 쪽이 네이티브고 이스케이프도 필요 없다.
- name: PSA | 무라벨 ns 검출
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ k8s_kubeconfig }} get ns
    -l '!pod-security.kubernetes.io/enforce'
    -o custom-columns=NAME:.metadata.name --no-headers
  register: k8s_psa_unlabeled
  changed_when: false
  when: k8s_psa_enabled | default(true)
  tags: [psa]

- name: PSA | 무라벨 ns 가 없어야 한다
  ansible.builtin.assert:
    that: k8s_psa_unlabeled.stdout | trim | length == 0
    fail_msg: >-
      PSA 라벨이 없는 네임스페이스가 있다: {{ k8s_psa_unlabeled.stdout_lines | join(', ') }}.
      새 ns 를 우리가 만든 것이면 roles/k8s_cluster_base/templates/cluster-base.yaml.j2 에,
      Helm·오퍼레이터가 만든 것이면 group_vars/k8s_nodes.yml 의 k8s_psa_external_namespaces 에
      추가한다. 수준은 반드시 먼저 실측할 것 —
      kubectl label ns <ns> pod-security.kubernetes.io/enforce=baseline --overwrite --dry-run=server
    quiet: true
  when: k8s_psa_enabled | default(true)
  tags: [psa]

# ── Harbor pull 배선 — default SA (런북 §9-21 부채 해소, 2026-07-30) ──────────
# Secret `harbor` 자체는 ESO 가 만든다(config 레포 — 백엔드 = fb-secrets `harbor-pull`).
# 여기서는 재구축 시 유실되는 나머지 반쪽 = **default SA 의 imagePullSecrets** 를 고정한다.
# 이게 빠지면 harbor 이미지를 쓰는 전 워크로드(mp-*·pgsync·ES nori)가 ImagePullBackOff.
- name: default SA imagePullSecrets 현황 (app·data·pipeline)
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ k8s_kubeconfig }} -n {{ item }}
    get sa default -o jsonpath={.imagePullSecrets}
  loop: [app, data, pipeline]
  register: k8s_sa_pull
  changed_when: false

- name: default SA 에 harbor pull secret 연결
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ k8s_kubeconfig }} -n {{ item.item }} patch sa default
    --type merge -p '{"imagePullSecrets":[{"name":"harbor"}]}'
  loop: "{{ k8s_sa_pull.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: "'harbor' not in (item.stdout | default(''))"

