---
# 물리 하이퍼바이저(.12) 온도·팬·리소스 감시용 node-exporter.
#
# ⚠️ VM 들과 달리 **Docker 가 아니라 네이티브 apt 패키지**로 깐다. 하이퍼바이저에
#    컨테이너 런타임을 얹지 않는다는 원칙 + hwmon 센서는 호스트 커널에 직접 붙어야 한다.
#    (monitoring_agents 롤 = VM 용 compose 배포. 이 롤과 헷갈리지 말 것.)
- name: 이 롤은 하이퍼바이저 전용 — 오폭 방어
  ansible.builtin.assert:
    that: "'hypervisor' in group_names"
    fail_msg: "node_exporter_host 는 hypervisor 그룹 전용이다({{ inventory_hostname }} 은 대상이 아님)."
    quiet: true

# ⚠️ 이 호스트는 Proxmox **엔터프라이즈 repo**(구독 필요)가 켜져 있어 `apt update` 가
#    401 로 실패한다. 정작 필요한 prometheus-node-exporter 는 deb.debian.org trixie/main
#    에 있으므로, 캐시 갱신 실패는 무시하고 설치만 진행한다.
#    (남의 apt 소스를 재구성하는 건 이 작업 범위 밖 — 구독 붙이거나 no-subscription
#     repo 로 바꾸는 건 팀 결정 사항.)
- name: apt 캐시 갱신 (엔터프라이즈 repo 401 은 무시)
  ansible.builtin.apt:
    update_cache: true
  failed_when: false
  changed_when: false

- name: node-exporter 설치 (Debian trixie main, 네이티브 패키지)
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present

# hwmon 컬렉터가 `sensors` 와 같은 소스(/sys/class/hwmon)를 읽어
# node_hwmon_temp_celsius 로 노출한다.
- name: node-exporter 실행 인자 (LAN IP 바인딩 + hwmon 명시)
  ansible.builtin.template:
    src: prometheus-node-exporter.j2
    dest: /etc/default/prometheus-node-exporter
    mode: "0644"
  notify: restart node-exporter

# 🔴 부팅 시 "bind: cannot assign requested address" 로 죽던 것을 막는다(2026-07-27 실발생 —
#    재부팅 후 1일 9시간 동안 온도 감시가 꺼져 있었고, .9 은퇴 작업 중 타깃 점검으로 발견).
- name: node-exporter systemd 드롭인 디렉토리
  ansible.builtin.file:
    path: /etc/systemd/system/prometheus-node-exporter.service.d
    state: directory
    mode: "0755"

- name: node-exporter 드롭인 — 네트워크 대기 + 무제한 재시도
  ansible.builtin.template:
    src: override-wait-network.conf.j2
    dest: /etc/systemd/system/prometheus-node-exporter.service.d/10-wait-network.conf
    mode: "0644"
  notify: restart node-exporter

- name: systemd 데몬 리로드 (드롭인 반영)
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: node-exporter 활성화·기동
  ansible.builtin.service:
    name: prometheus-node-exporter
    state: started
    enabled: true

- name: 핸들러 즉시 반영 (아래 검증 태스크가 새 설정을 보도록)
  ansible.builtin.meta: flush_handlers

- name: 온도 메트릭 노출 확인 (hwmon 컬렉터 실동작 검증)
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:9100/metrics"
    return_content: true
  register: ne_metrics
  retries: 5
  delay: 3
  until: ne_metrics.status == 200
  changed_when: false

- name: 온도 센서가 실제로 잡혔는지 단언 (없으면 알람이 조용히 무의미해짐)
  ansible.builtin.assert:
    that: "'node_hwmon_temp_celsius' in ne_metrics.content"
    fail_msg: >-
      node-exporter 는 떴는데 node_hwmon_temp_celsius 가 없다.
      hwmon 컬렉터/커널 모듈 확인 필요 — 이 상태면 온도 알람이 영원히 안 뜬다.
    quiet: true
