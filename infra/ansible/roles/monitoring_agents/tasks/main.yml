---
- name: 에이전트 디렉토리
  ansible.builtin.file:
    path: /opt/monitoring-agents
    state: directory
    mode: "0755"

- name: node-exporter textfile collector 디렉토리
  ansible.builtin.file:
    path: /var/lib/node_exporter/textfile_collector
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Alloy 설정 배치
  ansible.builtin.template:
    src: config.alloy.j2
    dest: /opt/monitoring-agents/config.alloy
    mode: "0644"

- name: 에이전트 compose 배치
  ansible.builtin.template:
    src: compose.yml.j2
    dest: /opt/monitoring-agents/docker-compose.yml
    mode: "0644"

- name: node-exporter + cAdvisor + Alloy 기동
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: /opt/monitoring-agents
  changed_when: true
