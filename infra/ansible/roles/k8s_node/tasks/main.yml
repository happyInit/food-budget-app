---
# K8s 노드 베이스라인 = kubeadm 선행조건. 클러스터 부트스트랩 자체는 별 롤
# (k8s_control_plane / k8s_worker_join). 이 롤만 돌린 상태의 정상 모습 =
# **kubelet 이 크래시루프**다(설정이 아직 없음). init/join 이 그걸 해소한다.
#
# 🔴 base 롤과 상호배타다. base 는 Docker 를 깔고 `docker_data_disk`(/dev/sdb)를 포맷하는데
#    워커의 /dev/sdb 는 OpenEBS VG 용 raw 디스크다. 그래서 K8s 노드는 `vms` 그룹에
#    넣지 않고(인벤토리 주석 참조) 이 롤을 전용 플레이북으로 돌린다.

- name: 이 롤은 K8s 노드 전용 — 오적용 방어
  ansible.builtin.assert:
    that:
      - "'k8s_nodes' in group_names"
      - "'hypervisor' not in group_names"
      - "'vms' not in group_names"
    fail_msg: >-
      k8s_node 롤은 K8s 노드에서만 실행한다({{ inventory_hostname }} 은 대상이 아니다).
      디스크를 포맷·VG 화하므로 오적용 시 데이터가 사라진다.
    quiet: true

- name: 디스크는 by-id 로만 지정 (커널 이름 /dev/sdX 금지)
  ansible.builtin.assert:
    that:
      - k8s_containerd_disk is match('^/dev/disk/by-id/')
      - k8s_storage_disk | length == 0 or k8s_storage_disk is match('^/dev/disk/by-id/')
    fail_msg: >-
      /dev/sdX 하드코딩 금지. 실측(2026-07-27) 게스트 커널 이름이 scsi 인덱스 순서와
      뒤집혀 잡힌다(scsi1=sdc, scsi2=sdb) → OpenEBS VG 용 raw 디스크를 containerd 용으로
      mkfs 하는 사고로 직결된다.
    quiet: true

# ── swap off (kubelet 요구사항) ─────────────────────────────────────────────
# Ubuntu 클라우드 이미지엔 swap 이 없지만(실측 0), 템플릿이 바뀌어도 깨지지 않게 보장한다.
- name: swap 비활성 (런타임)
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb | int > 0
  changed_when: true

- name: fstab swap 항목 주석처리 (재부팅 후에도 유지)
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\s+swap\s+.*)$'
    replace: '# \1  # k8s: swap off (kubelet 요구사항)'

# ── 커널 모듈 ───────────────────────────────────────────────────────────────
- name: 커널 모듈 부팅 시 로드 (overlay · br_netfilter)
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    mode: "0644"

- name: 커널 모듈 즉시 로드
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

# ── sysctl ─────────────────────────────────────────────────────────────────
- name: sysctl 튜닝 (kubeadm 요구사항 + 운영 경험치)
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kubernetes.conf
    content: |
      # kubeadm 요구사항 — 브리지 트래픽이 iptables/eBPF 훅을 타야 서비스·정책이 성립
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1

      # 오퍼레이터·Prometheus·kubelet 이 파드마다 watch 를 걸어 기본값(128 instances)을
      # 쉽게 넘긴다. 넘치면 "too many open files" 가 아니라 조용한 watch 실패로 나타난다.
      fs.inotify.max_user_instances = 8192
      fs.inotify.max_user_watches   = 524288

      # ECK 요구사항 (P2 데이터 티어). 미설정이면 ES 파드가 기동조차 못 한다 — status §3.
      # 노드 레벨 설정이라 지금 넣어 두는 게 싸다(빈 클러스터에선 무해).
      vm.max_map_count = 262144
    mode: "0644"
  register: k8s_sysctl

- name: sysctl 적용
  ansible.builtin.command: sysctl --system
  when: k8s_sysctl.changed
  changed_when: true

# ── containerd 데이터 디스크(scsi1) → /var/lib/containerd ───────────────────
# 순서 주의: containerd 설치 **전에** 마운트해야 패키지가 만드는 디렉토리와 이미지가
# 이 디스크 위에 올라간다. 이 분리가 kubelet 의 imagefs/nodefs 를 갈라 놓는 장치다 —
# 이미지가 불어나도 nodefs 를 말려 노드를 죽이는 대신 imagefs 임계로 이미지 GC 가 돈다.
- name: containerd 디스크 존재 확인
  ansible.builtin.stat:
    path: "{{ k8s_containerd_disk }}"
  register: k8s_cd_disk

- name: containerd 디스크 필수
  ansible.builtin.assert:
    that: k8s_cd_disk.stat.exists
    fail_msg: "{{ k8s_containerd_disk }} 없음 — Terraform 의 scsi1 이 붙었는지 확인할 것"
    quiet: true

- name: containerd 디스크 ext4 포맷 (기존 fs 있으면 no-op)
  community.general.filesystem:
    fstype: ext4
    dev: "{{ k8s_containerd_disk }}"

- name: /var/lib/containerd 마운트 (fstab 등록)
  ansible.posix.mount:
    path: /var/lib/containerd
    src: "{{ k8s_containerd_disk }}"
    fstype: ext4
    opts: defaults,noatime
    state: mounted

# ── containerd (Docker 공식 저장소 — 함대 나머지와 같은 저장소·키링) ────────
# 🔴 docker-ce 는 깔지 않는다. 노드에 Docker 데몬이 있으면 자기 bridge·iptables 규칙을
#    만들어 Cilium(eBPF·kube-proxy 대체)과 겹친다. K8s 는 CRI = containerd 만 필요하다.
- name: 사전 패키지
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lvm2 # OpenEBS VG 생성용 (워커)
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: apt keyrings 디렉토리
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Docker GPG 키
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Docker apt 저장소 등록
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    filename: docker
    state: present

- name: containerd.io 설치 (docker-ce 는 설치하지 않는다)
  ansible.builtin.apt:
    name: containerd.io
    state: present
    update_cache: true

# ── kubeadm · kubelet · kubectl (pkgs.k8s.io, 패치까지 핀 + hold) ───────────
- name: Kubernetes apt 키
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor }}/deb/Release.key"
    dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    mode: "0644"

- name: Kubernetes apt 저장소 등록
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc]
      https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor }}/deb/ /
    filename: kubernetes
    state: present

- name: kubelet · kubeadm · kubectl 설치 (패치 핀)
  ansible.builtin.apt:
    name:
      - "kubelet={{ k8s_pkg_version }}"
      - "kubeadm={{ k8s_pkg_version }}"
      - "kubectl={{ k8s_pkg_version }}"
    state: present
    update_cache: true
    allow_downgrade: true

# 마이너가 저절로 올라가면 컨트롤플레인/노드 버전 스큐가 깨져 클러스터가 망가진다.
# 업그레이드는 `kubeadm upgrade` 절차로만 — hold 를 손으로 풀고 진행한다.
- name: 버전 hold
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl

# ── containerd 설정 ────────────────────────────────────────────────────────
# Docker 패키지가 깔아 두는 기본 config.toml 은 `disabled_plugins = ["cri"]` 다 —
# 그대로 두면 kubelet 이 CRI 소켓을 못 잡고 노드가 영원히 NotReady 로 남는다.
# 그래서 기본 설정을 새로 덤프해 쓴다(containerd 2.x = config version 3).
- name: containerd 기본 설정 덤프
  ansible.builtin.command: containerd config default
  register: k8s_containerd_default
  changed_when: false
  check_mode: false # 읽기 전용 — --check 에서도 실행해야 아래 렌더가 성립

# pause 이미지가 kubeadm 기대값과 다르면 containerd 가 kubeadm 이 당겨 둔 이미지를
# "미사용"으로 GC 하고 자기 것을 다시 당긴다(오프라인·레지스트리 장애 시 사고).
- name: kubeadm 이 기대하는 pause 이미지 확인
  ansible.builtin.command: "kubeadm config images list --kubernetes-version=v{{ k8s_pkg_version | regex_replace('-.*$', '') }}"
  register: k8s_kubeadm_images
  changed_when: false
  check_mode: false

- name: pause 이미지 값 확정
  ansible.builtin.set_fact:
    k8s_pause_image: "{{ k8s_kubeadm_images.stdout_lines | select('search', '/pause:') | first }}"

# 키 이름이 버전마다 다르다 — containerd 1.7 = `sandbox_image`, 2.x = `sandbox`
# (2.2.6 실측: `[plugins.'io.containerd.cri.v1.images'] sandbox = 'registry.k8s.io/pause:3.10.1'`).
# 셋 다 치환해 두고, 아래에서 결과를 검증한다.
- name: config.toml 작성 (SystemdCgroup=true · pause 이미지 정렬)
  ansible.builtin.copy:
    dest: /etc/containerd/config.toml
    mode: "0644"
    content: >-
      {{ k8s_containerd_default.stdout
         | regex_replace('SystemdCgroup = false', 'SystemdCgroup = true')
         | regex_replace("sandbox_image = '[^']*'", "sandbox_image = '" ~ k8s_pause_image ~ "'")
         | regex_replace('sandbox_image = "[^"]*"', 'sandbox_image = "' ~ k8s_pause_image ~ '"')
         | regex_replace("(?m)^(\\s*)sandbox = '[^']*'$", "\\g<1>sandbox = '" ~ k8s_pause_image ~ "'") }}
  notify: containerd 재시작

# 치환이 실패해도(키 이름·인용부호가 바뀌면) 조용히 cgroupfs 로 남는 게 최악이다 —
# kubelet 은 systemd 드라이버라 회계가 갈리고, 그 증상은 몇 주 뒤 메모리 압박에서
# "축출이 안 도는데 OOM 이 난다"로 나타난다. 그래서 여기서 눈에 보이게 실패시킨다.
- name: SystemdCgroup 이 실제로 켜졌는지 검증
  ansible.builtin.command: grep -c '^\s*SystemdCgroup = true' /etc/containerd/config.toml
  register: k8s_cgroup_check
  changed_when: false
  failed_when: k8s_cgroup_check.rc != 0

# pause 이미지가 kubeadm 기대값과 어긋나면, containerd 가 kubeadm 이 미리 당겨 둔 이미지를
# "미사용"으로 GC 하고 자기 것을 다시 당긴다 — 레지스트리가 죽은 순간에 노드가 파드
# 샌드박스를 못 만드는 형태로 터진다. 치환 성공을 값으로 확인한다.
- name: pause 이미지가 kubeadm 기대값과 일치하는지 검증
  ansible.builtin.command: grep -cF "{{ k8s_pause_image }}" /etc/containerd/config.toml
  register: k8s_pause_check
  changed_when: false
  failed_when: k8s_pause_check.rc != 0

- name: containerd 활성화·기동
  ansible.builtin.service:
    name: containerd
    state: started
    enabled: true

- name: crictl 엔드포인트 (kubeadm 경고 제거 + 수동 디버깅용)
  ansible.builtin.copy:
    dest: /etc/crictl.yaml
    mode: "0644"
    content: |
      runtime-endpoint: unix:///run/containerd/containerd.sock
      image-endpoint: unix:///run/containerd/containerd.sock
      timeout: 10

# ── OpenEBS LVM VG (워커 전용) ─────────────────────────────────────────────
# ⚠️ **mkfs 하지 않는다.** VG 만 만들고 OpenEBS LVM CSI 가 LV 를 잘라 PVC 에 붙인다.
- name: OpenEBS 스토리지 디스크 존재 확인 (워커)
  ansible.builtin.stat:
    path: "{{ k8s_storage_disk }}"
  register: k8s_st_disk
  when: k8s_storage_disk | length > 0

- name: OpenEBS VG 생성 (워커 · pvcreate + vgcreate, 파일시스템 없음)
  community.general.lvg:
    vg: "{{ k8s_openebs_vg }}"
    pvs: "{{ k8s_storage_disk }}"
    state: present
  when:
    - k8s_storage_disk | length > 0
    - k8s_st_disk.stat.exists | default(false)

# ── kubelet ────────────────────────────────────────────────────────────────
# 지금은 설정이 없어 크래시루프가 정상이다 — kubeadm init/join 이 /var/lib/kubelet/config.yaml
# 을 만들면 안정된다. enabled 만 켜 두고 여기서 start 를 강제하지 않는다.
- name: kubelet 서비스 활성화 (기동은 kubeadm 이 담당)
  ansible.builtin.service:
    name: kubelet
    enabled: true
