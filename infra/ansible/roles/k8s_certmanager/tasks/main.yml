---
# cert-manager + 로컬 CA ClusterIssuer.
# 쓰임새: P1 Gateway TLS 종단 · 오퍼레이터 웹훅 인증서 · (P2) 내부 서비스 TLS.

- name: master 전용 방어
  ansible.builtin.assert:
    that: "'k8s_master' in group_names"
    fail_msg: "k8s_certmanager 는 master 에서만 실행한다"
    quiet: true

- name: jetstack helm 저장소
  kubernetes.core.helm_repository:
    name: jetstack
    repo_url: https://charts.jetstack.io

- name: cert-manager values
  ansible.builtin.template:
    src: cert-manager-values.yaml.j2
    dest: /etc/kubernetes/cert-manager-values.yaml
    mode: "0644"

- name: cert-manager 설치
  kubernetes.core.helm:
    name: cert-manager
    chart_ref: jetstack/cert-manager
    chart_version: "{{ cert_manager_version }}"
    release_namespace: cert-manager
    create_namespace: true
    kubeconfig: "{{ k8s_kubeconfig }}"
    values_files:
      - /etc/kubernetes/cert-manager-values.yaml
    wait: true
    wait_timeout: 10m

# ── 로컬 CA 를 Secret 으로 ─────────────────────────────────────────────────
# 🔴 CA **개인키**를 다루는 구간이다. 노드 디스크에 남기지 않기 위해 만들고 즉시 지운다.
- name: CA secret 존재 확인
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ k8s_kubeconfig }} -n cert-manager
    get secret {{ cert_manager_ca_secret }} -o name
  register: k8s_ca_secret
  failed_when: false
  changed_when: false

- name: 로컬 CA 를 cert-manager 에 등록
  when: k8s_ca_secret.rc != 0
  block:
    - name: CA 파일 임시 배치
      ansible.builtin.copy:
        src: "{{ certs_dir }}/{{ item.f }}"
        dest: "/etc/kubernetes/fb-ca-{{ item.f }}"
        mode: "{{ item.m }}"
      loop:
        - { f: ca.crt, m: "0644" }
        - { f: ca.key, m: "0600" }
      loop_control:
        label: "{{ item.f }}"

    - name: CA Secret 생성
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ k8s_kubeconfig }} -n cert-manager
        create secret tls {{ cert_manager_ca_secret }}
        --cert=/etc/kubernetes/fb-ca-ca.crt --key=/etc/kubernetes/fb-ca-ca.key
      changed_when: true

  always:
    - name: CA 개인키 흔적 제거 (노드에 남기지 않는다)
      ansible.builtin.file:
        path: "/etc/kubernetes/fb-ca-{{ item }}"
        state: absent
      loop:
        - ca.crt
        - ca.key

- name: ClusterIssuer 매니페스트
  ansible.builtin.template:
    src: cluster-issuer.yaml.j2
    dest: "{{ k8s_manifest_dir }}/cluster-issuer.yaml"
    mode: "0644"

# `kubectl apply` 는 실제 차이가 없어도 일부 종류(PriorityClass·ValidatingAdmissionPolicy 등)에
# `configured` 를 찍는다 → 매 실행이 changed 로 뜨면 "IaC 가 수렴했다"는 신호가 무의미해진다.
# 그래서 **드리프트 판정은 `kubectl diff`(rc 1 = 차이 있음)** 로 하고, apply 는 항상 돌려 수렴시킨다.
- name: ClusterIssuer 드리프트 확인
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ k8s_kubeconfig }} diff -f {{ k8s_manifest_dir }}/cluster-issuer.yaml
  register: k8s_issuer_diff
  changed_when: false
  failed_when: k8s_issuer_diff.rc > 1

- name: ClusterIssuer 적용
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ k8s_kubeconfig }} apply -f {{ k8s_manifest_dir }}/cluster-issuer.yaml
  changed_when: k8s_issuer_diff.rc == 1
  retries: 5
  delay: 10
  register: _apply_retry
  until: _apply_retry.rc == 0

- name: ClusterIssuer Ready 확인
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ k8s_kubeconfig }}
    wait --for=condition=Ready clusterissuer/{{ cert_manager_ca_issuer }} --timeout=120s
  changed_when: false
