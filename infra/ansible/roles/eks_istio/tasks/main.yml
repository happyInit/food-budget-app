---
# Istio — sidecar 메시 (ambient 기각 · 정본 "✅ 해소됨") + Gateway API 구현체
#
# 🔴 **Cilium 과 공존한다** — istio-cni 는 체이닝 플러그인이고 온프렘이 같은 조합
#    (Cilium + istio-cni)으로 돌고 있다. ENI 모드로 바뀐 것은 IPAM 이지 CNI 체이닝이 아니다.
# 🔴 **Gateway 오브젝트는 여기서 만들지 않는다** — config `gateway`/`gateway-internal`
#    트랙(ArgoCD)이 정본이다. 여기는 **구현체(istiod)와 CRD** 까지만.
#    ⚠️ AWS 는 리스너가 HTTP 다(`1-50` — ALB 가 TLS 를 종단한다). 그 값도 config 소관.

- name: Gateway API CRD (Istio 보다 먼저 — istiod 가 이 CRD 를 watch 한다)
  ansible.builtin.command: >-
    kubectl apply -f
    https://github.com/kubernetes-sigs/gateway-api/releases/download/{{ eks_gateway_api_version }}/standard-install.yaml
  environment:
    KUBECONFIG: "{{ eks_kubeconfig }}"
  register: eks_gwapi
  changed_when: "'created' in eks_gwapi.stdout or 'configured' in eks_gwapi.stdout"

- name: istio helm 저장소
  kubernetes.core.helm_repository:
    name: istio
    repo_url: https://istio-release.storage.googleapis.com/charts

- name: istio-base (CRD)
  kubernetes.core.helm:
    name: istio-base
    chart_ref: istio/base
    chart_version: "{{ eks_istio_version }}"
    release_namespace: istio-system
    create_namespace: true
    kubeconfig: "{{ eks_kubeconfig }}"
    wait: true

- name: istiod
  kubernetes.core.helm:
    name: istiod
    chart_ref: istio/istiod
    chart_version: "{{ eks_istio_version }}"
    release_namespace: istio-system
    kubeconfig: "{{ eks_kubeconfig }}"
    values:
      # 🔴🔴 **`pilot.cni.enabled: true` 가 없으면 사이드카가 주입된 파드가 하나도 못 뜬다**
      #    (2026-08-13 실측 · 결함 #25). 이 값이 istiod 의 **주입 템플릿**을 바꾼다:
      #      없으면 → initContainer `istio-init` (iptables 를 파드 안에서 직접 만든다
      #                → `NET_ADMIN`·`NET_RAW` 필요 → **PSA `restricted` 가 거부**)
      #      있으면 → initContainer `istio-validation` (특권 없음 · iptables 는 istio-cni 가 이미 했다)
      #    실측 증상 = ReplicaSet `FailedCreate`:
      #      pods "mp-chat-…" is forbidden: violates PodSecurity "restricted:latest":
      #      unrestricted capabilities (container "istio-init" must not include "NET_ADMIN", "NET_RAW")
      # 🔴 **istio-cni 를 깔았다는 사실만으로는 안 된다** — istio-cni 차트는 istiod 에게 자기 존재를
      #    알리지 않는다. 두 릴리스가 **서로 모른 채** 돌고, 그래서 "CNI 는 Running 인데 파드가 안 뜬다"
      #    가 된다. 증상이 PSA 로 나와 원인이 istiod 값 누락이라는 것을 짚기 어렵다.
      # 🟢 온프렘 실측 대조로 찾았다 — `helm -n istio-system get values istiod` 에 이 키가 있고
      #    온프렘 파드의 initContainer 는 `istio-validation` 이었다(EKS 는 `istio-init`).
      pilot:
        cni:
          enabled: true
        # ══ CPU request 500m → 200m (2026-08-14 실측) ═══════════════════════════
        # 🔴 **istiod 가 이 클러스터의 최대 낭비자였다** — request 500m / 실측 최대 **3m**.
        #    노드 2대 allocatable 7,840m 중 request 가 **7,380m(94%)** 인데 실사용은
        #    **506m(6.5%)** 다. 파드를 더 못 올리는데 CPU 는 논다. 그 94% 에서 이 파드가 6.4%p.
        # 🟢 **성능이 나빠지지 않는다** — requests 는 상한이 아니다. 이 차트는 **cpu limit 을
        #    걸지 않으므로**(실물 확인 — requests 만 있다) istiod 는 필요하면 노드 여유만큼 쓴다.
        #    줄이는 것은 ① 스케줄러 장부의 자리 ② 경합 시 몫뿐이다.
        # ⚠️ **관측 창이 짧다** — 이 파드는 6시간짜리다. istiod CPU 는 파드가 무더기로 재시작할 때
        #    (설정 푸시) 튀는데 그 구간이 창에 없었을 수 있다. 그래서 3m 에 **200m(66배)** 을 준다.
        #    사이드카를 100m→30m 로 내릴 때 쓴 것과 같은 기준이다.
        # 🔴 **메모리 2Gi 를 반드시 함께 적는다.** 차트가 `pilot.resources` 를 통째로 치환하므로
        #    (`toYaml`), cpu 만 적으면 **메모리 request 가 사라진다.**
        #    (실사용 63Mi 라 2Gi 도 과하지만 메모리는 압축 불가라 잘못 깎으면 throttle 이 아니라
        #     OOMKill 이고, istiod 메모리는 메시 서비스 수에 따라 큰다 — 별건으로 본다.)
        # 🟢 선점 방지는 그대로다 — 아래 `global.priorityClassName: system-cluster-critical` 이
        #    맡는다. 이 변경은 **자리를 적게 잡을 뿐, 밀려나기 쉬워지지 않는다.**
        resources:
          requests:
            cpu: 200m
            memory: 2Gi
      # 🔴 `numTrustedProxies` 는 여기서 정하지 않는다 — `1-13`·`1-53` 이 미결이고
      #    ALB 가 앞에 서면 홉 수가 바뀐다(온프렘 실측은 키 자체가 없었다).
      #    잘못 넣으면 클라이언트 IP 가 틀려 레이트리밋·감사로그가 조용히 오염된다.
      meshConfig:
        accessLogFile: /dev/stdout

        # ── 🔴 사이드카가 준비되기 전에 앱을 시작하지 않는다 (온프렘 승계) ──────
        # 없으면 앱 컨테이너가 사이드카보다 먼저 떠서 **기동 직후 아웃바운드가 통째로 실패**한다
        # (iptables 는 이미 걸렸는데 Envoy 가 아직 안 받는 구간). 증상이 "재시작 직후에만
        # 잠깐 5xx" 라 재현이 어렵고, 그래서 원인을 못 찾은 채 넘어가기 쉽다.
        # 🔵 대가 = 파드 기동이 몇 초 늘어난다. 그게 이 옵션의 전부다.
        defaultConfig:
          holdApplicationUntilProxyReady: true

        # ── 트레이스 행선지 (`templates/telemetry-tracing.yaml.j2` 와 한 쌍) ────
        # 🔴 **이것만 있으면 아무 일도 안 일어난다** — 이 블록은 *"mp-tempo-otlp 라는 이름은
        #    이 주소를 뜻한다"* 는 정의일 뿐이고, 실제로 녹화를 시키는 것은 `Telemetry` CR 이다.
        #    반대로 CR 만 있으면 istiod 가 이름을 못 찾아 설정이 거부된다. ⇒ 둘은 같이 간다.
        # 🟢 주소는 양 사이트가 같다(실측 2026-08-14 — `tempo.observability` ClusterIP 가
        #    양쪽 다 `4317` 을 연다). 그래서 온프렘 값을 한 글자도 안 바꾸고 옮겼다.
        extensionProviders:
          - name: mp-tempo-otlp
            opentelemetry:
              service: tempo.observability.svc.cluster.local
              port: 4317
      global:
        # ══ ① istiod 우선순위 (2026-08-14 실측 — A2 를 막던 것) ═══════════════════
        # 🔴 **증상**: istiod 가 앱 파드에 두 번 연속 선점당해 사라졌다.
        #      Preempted by pod … on node ip-10-10-64-103
        #      istiod-…  0/1  Pending   0/2 nodes are available: 2 Insufficient cpu
        #    그러면 사이드카가 인증서를 못 받아(`connect: no route to host` → istiod ClusterIP)
        #    앱 파드가 전부 `Init:1/2` 로 서고, 나아가 **주입 웹훅 자체가 실패**해
        #    ReplicaSet 이 파드를 만들지도 못한다:
        #      failed calling webhook "namespace.sidecar-injector.istio.io":
        #      no endpoints available for service "istiod"
        # 🔴 **자기참조 교착**이다 — 앱이 뜨려면 istiod 가 필요한데 istiod 는 그 앱에 밀려난다.
        #    노드를 늘려도 우선순위가 그대로면 압력이 올 때마다 재발한다. 그래서 용량이 아니라
        #    **우선순위**를 고친다.
        #
        # 값의 근거 = **이 클러스터의 기존 관례**(실측 2026-08-14). istiod 만 체계 밖(0)이었다:
        #    system-node-critical  2000001000 : cilium · cilium-envoy · **istio-cni-node**
        #    system-cluster-critical 2000000000 : cilium-operator · coredns · ebs-csi-controller
        #    data-critical           1000000   : pg · es
        #    app-normal               100000   : 앱 12종 · pgsync
        #    (istiod = 없음 → priority 0)
        #    ⇒ istiod 의 동료는 coredns·cilium-operator 다(클러스터 전역 컨트롤플레인이고 죽으면
        #      전부가 죽는다). **자기 DaemonSet 짝인 istio-cni-node 조차 이미 node-critical 이다.**
        # 🟢 차트 자신이 이 값을 권한다 — values.yaml 주석: *"it is better to configure this in
        #    order to make sure your Istio pods will not be killed because of low priority class."*
        # ⚠️ `system-*` PriorityClass 를 kube-system 밖에서 쓸 수 있는지는 **실측으로 확인했다**
        #    (`kubectl -n istio-system run … --dry-run=server` 통과). 문서 기억이 아니라 실물이다.
        # 🟢 **주입되는 앱 파드는 영향받지 않는다** — 렌더 검증: 이 값은 injector ConfigMap 의
        #    `data.values`(값 blob)에만 들어가고 `data.config`(실제 주입 템플릿)에는 없다.
        #    앱 파드는 자기 매니페스트의 `app-normal` 을 그대로 유지한다.
        priorityClassName: system-cluster-critical

        proxy:
          # ══ ② 사이드카 CPU 예약 100m → 30m ═══════════════════════════════════
          # 🔴 숨은 최대 예약자였다 — 사이드카 19개 × 100m = **1,900m = 노드 총량의 24%**.
          #    파드 목록에 안 보인 이유 = native sidecar 라 `spec.containers` 가 아니라
          #    `spec.initContainers`(restartPolicy: Always) 에 있다. 컨테이너만 세면 안 잡힌다.
          #
          # 실측 근거(2026-08-14): 노드 CPU **예약 89~90% vs 실사용 10~11%** (8배).
          #    같은 성격의 istio-cni-node 가 **100m 예약 / 1m 실사용**이다. 사이드카도 자릿수가 같다.
          #    30m = 유휴 대비 15~30배 여유를 두면서 예약을 70% 걷는다(회수 ≈ 1,330m).
          # 🟢 **성능이 나빠지지 않는다** — requests 는 상한이 아니다. `limits` 는 차트 기본값
          #    (cpu 2000m · memory 1024Mi)이 그대로 살아 있다(렌더로 확인 — 깊은 병합).
          #    requests 는 ① 스케줄링 자리 ② 경합 시 share ③ 축출 우선순위인데, 실사용 10% 라
          #    경합 자체가 없다. 지금 실제 피해는 **안 쓰는 자리를 예약해 남을 못 뜨게 하는 것**이다.
          # 🟢 HPA 에 영향 없다 — account·recipe HPA 는 `containerResource`(앱 컨테이너 지정)라
          #    파드 합계를 분모로 쓰지 않는다.
          # ⚠️ 메모리는 건드리지 않는다(128Mi 유지) — 메모리 예약/실사용은 이미 정직하고
          #    (온프렘 1.1~1.5배) 잘못 깎으면 throttle 이 아니라 OOMKill 이다.
          # 🔵 이 값은 **A2·A3 완주 후 VPA 추천 모드로 재산정할 1순위**다. 지금은 관측 창이 없다
          #    (EKS 는 어제 만들어졌고 앱이 정상 가동한 적이 없다).
          # ⚠️ 이 값은 **주입 템플릿**을 바꾼다 — 이미 도는 파드는 재생성돼야 반영된다.
          resources:
            requests:
              cpu: 30m
              memory: 128Mi

      # ══ ③ Gateway API 게이트웨이 파드의 securityContext (A2 후반 실측) ═══════
      # 🔴 **없으면 게이트웨이 파드가 생성 자체가 거부된다** — 2026-08-14 실측:
      #      Error creating: pods "mp-gw-public-istio-…" is forbidden:
      #      violates PodSecurity "restricted:latest": seccompProfile
      #      (pod or container "istio-proxy" must set securityContext.seccompProfile.type
      #       to "RuntimeDefault" or "Localhost")
      #    Deployment 는 만들어지고 ReplicaSet 도 만들어지는데 **파드만 0개**라
      #    `Gateway` 가 `Programmed=False :: no instances found for hostname …` 로 선다.
      #    증상이 Gateway 조건으로 나와서 원인이 istiod values 라는 것을 짚기 어렵다(#25 와 같은 부류).
      #
      # 🔴 **두 키가 다 필요하다 — 하나만 넣으면 다음 벽에 걸린다.**
      #   ① `seccompProfile` = PSA `restricted` 통과. 이게 없으면 위처럼 **생성 거부**.
      #   ② `sysctls net.ipv4.ip_unprivileged_port_start=0` = **저포트 바인딩**.
      #      게이트웨이는 uid **1337**(비루트)로 도는데 Service 의 targetPort 가
      #      `15021,80,443` 이다(온프렘 실측 — 8080/8443 이 아니다). 이 sysctl 이 없으면
      #      파드는 뜨지만 **:443 을 못 잡아 ALB 타깃이 영구 unhealthy** 가 된다.
      #      ⇒ ①만 고치고 넘어가면 그 다음 증상이 완전히 다른 곳(ALB)에서 나온다.
      # 🟢 PSA `restricted` 에서 허용되는 **안전 sysctl** 이다(K8s 1.22+ 에서 safe 목록 편입).
      #    온프렘이 같은 ns 라벨(`enforce: restricted`)로 돌고 있는 것이 그 증명이다.
      #
      # 🟢 **값의 출처 = 온프렘 실측이다**(추측 아님). `helm -n istio-system get values istiod`
      #    대조로 찾았다 — 온프렘엔 이 블록이 있고 EKS 엔 없었다. 같은 istio `1.30.3` 인데
      #    values 가 갈려 있었던 것이다. **#25(`pilot.cni.enabled` 누락)와 같은 방법·같은 부류.**
      #
      # ⚠️ 이 값은 istiod 가 렌더하는 **게이트웨이 Deployment 템플릿**을 바꾼다 —
      #    반영하려면 게이트웨이 파드가 다시 만들어져야 한다(지금은 0개라 무관).
      # ⚠️ `spec.infrastructure.parametersRef` ConfigMap 으로도 넣을 수 있지만 **여기가 맞다** —
      #    온프렘이 여기에 두고 있고, 게이트웨이가 늘어날 때마다 ConfigMap 마다 복사할 값이 아니다.
      gateways:
        securityContext:
          seccompProfile:
            type: RuntimeDefault
          sysctls:
            - name: net.ipv4.ip_unprivileged_port_start
              value: "0"
    wait: true

- name: istio-cni
  kubernetes.core.helm:
    name: istio-cni
    chart_ref: istio/cni
    chart_version: "{{ eks_istio_version }}"
    release_namespace: istio-system
    kubeconfig: "{{ eks_kubeconfig }}"
    values:
      # 🔴 **키는 `cni.` 아래다 — 최상위가 아니다**(2026-08-13 실측 · 결함 #20).
      #    처음에 `cniBinDir`·`cniConfDir` 을 최상위에 썼고 **helm 이 조용히 무시**했다.
      #    ⚠️ 무해했던 이유는 기본값이 마침 같은 경로였기 때문일 뿐이다
      #      (`helm show values istio/cni` = `/opt/cni/bin` · `/etc/cni/net.d`).
      #    ⇒ 그래서 **명시하지 않는다.** 두 정본을 만들지 않는 것이 낫고, AL2023 의 실제 경로가
      #      기본값과 같다는 것이 실측으로 확인됐다(파드가 `/host/etc/cni/net.d/05-cilium.conflist`
      #      를 실제로 읽고 썼다).
      cni:
        # 온프렘과 같은 값 — 체인 모드(Cilium 뒤에 istio-cni 를 얹는다).
        chained: true
        # ══ CPU request 100m → 30m (2026-08-14 실측) ════════════════════════════
        # 🔴 **DaemonSet 이라 노드 수만큼 곱해진다** — 지금 2노드 200m 이지만 Karpenter 가
        #    5노드로 늘리면 500m 이다. 지금 잡아두는 편이 이득이다.
        # 실측 = 7일 창 최대 **0m**(관측 6시간). 이 파드는 파드가 뜰 때만 iptables 를 쓰고
        #    평시엔 아무 일도 하지 않는다 — 사이드카(istio-proxy)를 100m→30m 로 내릴 때
        #    "같은 성격의 istio-cni-node 가 100m 예약 / 1m 실사용"이라고 근거로 삼았던 그 파드다.
        #    ⇒ 근거로 쓴 쪽도 같이 고친다. 30m = 그 기준과 같은 값.
        # 🟢 이 차트도 **cpu limit 이 없다**(실물 확인) — 파드가 무더기로 뜰 때 필요하면 더 쓴다.
        # 🔴 메모리 100Mi 를 함께 적는다 — cpu 만 적으면 차트가 블록을 치환해 메모리가 사라진다.
        # 🟢 우선순위는 이미 `system-node-critical` 이다(체계 안에 있다) — 축출 위험은 안 는다.
        resources:
          requests:
            cpu: 30m
            memory: 100Mi
      # 🔴 **전제 = Cilium 쪽 `cni.exclusive: false`.** 그것이 없으면 이 릴리스는 영구히
      #    Ready 가 안 되고 helm `--wait` 이 `context deadline exceeded` 로 죽는다(결함 #21).
      #    근거·증상은 `eks_cilium/templates/cilium-values.yaml.j2` 의 `cni:` 주석.
    wait: true

# ── 메시 트레이싱 Telemetry — 🔴 위 `extensionProviders` 와 한 쌍 ──────────────
# 온프렘 `k8s_istio` 와 같은 3단(template → kubectl diff → apply)이다.
# 🔴 `kubernetes.core.k8s` 를 쓰지 않는 이유는 `eks_rbac` 주석 참조(Python 라이브러리 의존 제거).
- name: mesh tracing Telemetry 렌더
  ansible.builtin.template:
    src: telemetry-tracing.yaml.j2
    dest: "{{ lookup('env', 'HOME') }}/.mp-eks-telemetry-tracing.yaml"
    mode: "0644"

- name: mesh tracing 드리프트 확인
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ eks_kubeconfig }} diff
    -f {{ lookup('env', 'HOME') }}/.mp-eks-telemetry-tracing.yaml
  register: eks_telemetry_diff
  changed_when: false
  failed_when: eks_telemetry_diff.rc > 1

- name: mesh tracing 적용 (Tempo OTLP · 샘플링 100%)
  ansible.builtin.command: >-
    kubectl --kubeconfig {{ eks_kubeconfig }} apply
    -f {{ lookup('env', 'HOME') }}/.mp-eks-telemetry-tracing.yaml
  changed_when: eks_telemetry_diff.rc == 1

- name: 안내 — 검증 지점
  ansible.builtin.debug:
    msg: >-
      확인: kubectl -n istio-system get pods (istiod·istio-cni Running) ·
      kubectl get crd gateways.gateway.networking.k8s.io ·
      사이드카 주입은 A2 에서 앱 ns 라벨과 함께 검증한다.
