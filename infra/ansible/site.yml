---
- name: Base setup — qemu-guest-agent + Docker + /var/lib/docker 전용 디스크
  hosts: all
  become: true
  roles:
    - base

- name: 로컬 CA 신뢰 배포 (전 VM — 시스템 + docker)
  hosts: all
  become: true
  roles:
    - ca_trust

- name: 관측 에이전트 — node-exporter + cAdvisor (전 VM)
  hosts: all
  become: true
  roles:
    - monitoring_agents

- name: 모니터링 스택 — Prometheus + Grafana (fb-monitoring)
  hosts: monitoring
  become: true
  roles:
    - monitoring

- name: CI 티어 — Harbor 레지스트리 (fb-ci-harbor)
  hosts: ci
  become: true
  vars_files:
    - secrets.yml
  roles:
    - harbor
    - github_runner

- name: data 티어 — Terraform state 전용 PostgreSQL (fb-data)
  hosts: data
  become: true
  vars_files:
    - secrets.yml
  roles:
    - tfstate_db

- name: app 티어 — CD 배포 공개키 (fb-app-ai)
  hosts: app
  become: true
  roles:
    - cd_deploy_key
