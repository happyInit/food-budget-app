---
- name: Base setup — qemu-guest-agent + Docker + /var/lib/docker 전용 디스크
  hosts: all
  become: true
  roles:
    - base

- name: 팀원 SSH 공개키 배포 (전 VM ubuntu authorized_keys, additive)
  hosts: all
  become: true
  tags: team_keys
  roles:
    - team_ssh_keys

- name: 로컬 CA 신뢰 배포 (전 VM — 시스템 + docker)
  hosts: all
  become: true
  roles:
    - ca_trust

- name: 관측 에이전트 — node-exporter + cAdvisor (전 VM)
  hosts: all
  become: true
  roles:
    - monitoring_agents

- name: 모니터링 스택 — Prometheus + Grafana (fb-monitoring)
  hosts: monitoring
  become: true
  roles:
    - monitoring

- name: CI 티어 — Harbor 레지스트리 (fb-ci-harbor)
  hosts: ci
  become: true
  vars_files:
    - secrets.yml
  roles:
    - harbor
    - github_runner

- name: data 티어 — 공유 PostgreSQL(state+앱) + ES·Redis·Kafka (fb-data)
  hosts: data
  become: true
  vars_files:
    - secrets.yml
  roles:
    - tfstate_db   # 공유 PG (terraform_state + 앱 foodbudget DB) + postgres-exporter
    - data_tier    # Elasticsearch(nori) · Redis · Kafka(KRaft) + exporters

- name: app 티어 — CD 배포 공개키 (fb-app-ai)
  hosts: app
  become: true
  roles:
    - cd_deploy_key
