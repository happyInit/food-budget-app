---
- name: Base setup — qemu-guest-agent + Docker + /var/lib/docker 전용 디스크
  hosts: vms
  become: true
  roles:
    - base

- name: 팀원 SSH 공개키 배포 (전 VM ubuntu authorized_keys, additive)
  hosts: vms
  become: true
  tags: team_keys
  roles:
    - team_ssh_keys

- name: 로컬 CA 신뢰 배포 (전 VM — 시스템 + docker)
  hosts: vms
  become: true
  roles:
    - ca_trust

- name: 관측 에이전트 — node-exporter + cAdvisor (전 VM)
  hosts: vms
  become: true
  roles:
    - monitoring_agents

- name: 디스크 읽기 폭주 워처 — fb-ioburst (전 VM, 임시 진단)
  hosts: vms
  become: true
  tags: ioburst
  roles:
    # 임시 도구다. 원인 규명되면 defaults 의 ioburst_enabled 를 false 로 바꿔 커밋하고
    # `--tags ioburst` 로 한 번 돌리면 깨끗이 철수한다. 배경 = 롤 defaults 주석.
    - ioburst_watch

- name: 모니터링 스택 — Prometheus + Grafana + Alertmanager (fb-monitoring)
  hosts: monitoring
  become: true
  vars_files:
    - secrets.yml
  roles:
    - monitoring

- name: CI 티어 — Harbor 레지스트리 (fb-ci-harbor)
  hosts: ci
  become: true
  vars_files:
    - secrets.yml
  roles:
    # 단독 실행: --tags harbor  (base 롤의 docker 데몬 재시작 없이 Harbor 만 손볼 때)
    - { role: harbor, tags: [harbor] }
    - { role: github_runner, tags: [github_runner] }

- name: data 티어 — 공유 PostgreSQL(state+앱) + ES·Redis·Kafka (fb-data)
  hosts: data
  become: true
  vars_files:
    - secrets.yml
  roles:
    # 단독 실행: --tags tfstate_db / --tags data_tier
    #   (base 롤이 docker 데몬을 재시작 = 해당 VM 전 컨테이너 재기동 → 좁혀서 돌릴 수 있어야 함)
    - { role: tfstate_db, tags: [tfstate_db] }   # 공유 PG (terraform_state + 앱 foodbudget DB) + postgres-exporter
    - { role: data_tier, tags: [data_tier] }     # Elasticsearch(nori) · Redis · Kafka(KRaft) + exporters
    - { role: data_pipeline, tags: [data_pipeline] }  # 수집 파이프라인 pull 배포 (/opt/data-pipeline). 단독: --tags data_pipeline

- name: app 티어 — CD 배포 공개키 (fb-app-ai)
  hosts: app
  become: true
  roles:
    - cd_deploy_key
