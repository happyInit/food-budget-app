---
- name: Base setup — qemu-guest-agent + Docker + /var/lib/docker 전용 디스크
  hosts: vms
  become: true
  roles:
    - base

- name: 팀원 SSH 공개키 배포 (전 VM ubuntu authorized_keys, additive)
  hosts: vms
  become: true
  tags: team_keys
  roles:
    - team_ssh_keys

- name: 로컬 CA 신뢰 배포 (전 VM — 시스템 + docker)
  hosts: vms
  become: true
  roles:
    - ca_trust

- name: 관측 에이전트 — node-exporter + cAdvisor (전 VM)
  hosts: vms
  become: true
  roles:
    # 호스트 C 포함 전 VM 적용 (2026-07-27 스킵 철회). 호스트 C 는 클러스터 *밖*이라
    # K8s 인클러스터 모니터링이 영원히 못 보고, Harbor 는 죽으면 클러스터 배포가 전면
    # 실패하는 SPOF 라 무감시가 더 위험하다. prometheus.yml 의 node·cadvisor job 이
    # groups['vms'] 루프라 .10 타깃은 이미 존재 — 에이전트만 깔면 up 으로 돌아온다.
    - { role: monitoring_agents, tags: [monitoring_agents] }

- name: 디스크 읽기 폭주 워처 — fb-ioburst (전 VM, 임시 진단)
  hosts: vms
  become: true
  tags: ioburst
  roles:
    # 임시 도구다. 원인 규명되면 defaults 의 ioburst_enabled 를 false 로 바꿔 커밋하고
    # `--tags ioburst` 로 한 번 돌리면 깨끗이 철수한다. 배경 = 롤 defaults 주석.
    - ioburst_watch

# ~~모니터링 스택 — Prometheus + Grafana + Alertmanager (fb-monitoring)~~
#   → **은퇴 완료 (2026-07-31, P4)**. `monitoring` 롤 삭제. 모니터링 컷오버(2026-07-30)로
#   규칙·대시보드·스크레이프·알림이 전부 인클러스터 정본이 됐고, `.11` VM 은 P4 에서 파괴됐다.
#   승계처 — 대시보드 13종 = config 레포 `monitoring/dashboards/`(CM `app/mp-grafana-dashboards`) ·
#   알람 20종 = config 레포 `monitoring/rules*.yaml` 외 PrometheusRule CR(`Mp` 접두사) + kps 빌트인.
#   ⚠️ **에이전트(`monitoring_agents`)는 존치**다 — 위 플레이 참조. 호스트 C 는 클러스터 밖이라
#   node-exporter·cAdvisor·alloy 가 계속 필요하고, alloy 는 이미 인클러스터 Loki 로 쏜다.

- name: CI 티어 — Harbor 레지스트리 (fb-ci-harbor)
  hosts: ci
  become: true
  vars_files:
    - secrets.yml
  roles:
    # 단독 실행: --tags harbor  (base 롤의 docker 데몬 재시작 없이 Harbor 만 손볼 때)
    - { role: harbor, tags: [harbor] }
    - { role: jenkins, tags: [jenkins] }          # CI (github_runner 대체 — 플랜 §7). 단독: --tags jenkins
    - { role: sonarqube, tags: [sonarqube] }       # 코드 품질 게이트. 단독: --tags sonarqube
    - { role: cloudflared, tags: [cloudflared] }   # CI webhook 터널 (ci.mealbong.cloud → Jenkins:8081). 존치 롤. 단독: --tags cloudflared
    - { role: harbor_backup, tags: [backup, harbor_backup] }   # Harbor DB·키·설정·인증서 → S3 (백업전략 §7). 단독: --tags harbor_backup
    - { role: jenkins_backup, tags: [backup, jenkins_backup] }  # JENKINS_HOME → S3 (백업전략 §7, workspace 제외). 단독: --tags jenkins_backup
    # github_runner 롤 제거(2026-07-27) — Jenkins 이관 완료·러너 은퇴. 롤 디렉토리는
    # 롤백 대비 보존하되 플레이에서 빼서 풀런이 은퇴 러너를 재설치하지 않게 한다.

# ~~data 티어 — 공유 PostgreSQL(state+앱) + ES·Redis·Kafka (fb-data)~~
#   → **은퇴 완료 (2026-07-31, P4)**. `tfstate_db`·`data_tier`·`data_pipeline` 롤 삭제.
#   P2 데이터 컷오버(2026-07-30)로 세 롤이 배포하던 것이 전부 K8s 오퍼레이터로 넘어갔고,
#   `.8` VM 은 P4 에서 파괴됐다. 승계처 —
#     tfstate_db    → PG = CNPG(`data` ns) · terraform_state DB 는 **소멸**(backend 가 S3 로
#                     이관됐다 — `infra/terraform/backend.tf`, 2026-07-29. PG 백엔드는 "인프라를
#                     만드는 도구의 상태가 그 인프라 안에 있는" 순환 의존이라 끊었다)
#     data_tier     → ES = ECK · Redis = OT-Container-Kit(Sentinel) · Kafka = Strimzi
#     data_pipeline → pipeline ns 워크로드(컨슈머 Deployment + CronJob 폴러, config 레포 관리)

# ~~app 티어 — CD 배포 공개키 (fb-app-ai)~~ → **은퇴 완료 (2026-07-28, P1)**
#   앱이 K8s 로 이전되고 `.9` 를 정지하면서 인벤토리에서 host 를 제거했다. CD 는 ArgoCD 단독이라
#   `cd_deploy_key` 롤도 소멸 대상이었다(CLAUDE.md §인프라 "대체될 롤"). 롤 디렉토리는 남겨 두되
#   플레이에서만 뺀다 — `.9` 롤백이 필요하면 VM 을 켜는 것으로 끝나고(컨테이너 restart 정책),
#   Ansible 이 닿을 필요는 없다.
