# food-budget 수집 파이프라인 — Docker (fb-data VM). Kafka/PG/Redis는 이미 도커로 떠 있음(외부, 192.168.0.8).
#   상주: 컨슈머 3 + 만료 pruner  →  docker compose up -d
#   on-demand: 토픽생성 · 크롤러(폴러)  →  docker compose run --rm <svc>  (host cron으로 주기 실행)
# 설정은 .env(KAFKA_BOOTSTRAP·PG*·REDIS_URL, 비밀 포함·gitignore)에서 주입.
#
# image-only(배포용) — build: 는 docker-compose.build.yml override 로 분리(로컬 브링업 전용).
#   .8(fb-data)은 이 파일만 받아 pull-only 배포(ansible data_pipeline 롤). 로컬 빌드 불가 → 드리프트 차단.
#   로컬 빌드: docker compose -f docker-compose.yml -f docker-compose.build.yml build
#   CI(build-push-pipeline.yml)는 docker build 로 직접 빌드하므로 이 파일의 build: 유무와 무관.
name: food-budget-app   # 프로젝트명 고정 → 디렉토리 위치와 무관하게 컨테이너 이름 안정(food-budget-app-*-1)

x-app: &app
  image: 192.168.0.10/food-budget/data-pipeline:${IMAGE_TAG:-1.1.5}   # fb Harbor (deploy/app 과 동일 IMAGE_TAG 규칙 — 기본=릴리스 핀, latest 원하면 IMAGE_TAG=latest)
  env_file: .env               # KAFKA_BOOTSTRAP=192.168.0.8:9092 · PGHOST/PGPASSWORD · REDIS_URL
  environment:
    PYTHONUNBUFFERED: "1"      # 컨테이너 stdout 즉시 flush → docker logs 실시간(비-TTY 버퍼링 방지)
  restart: unless-stopped

services:
  # ── 상주 컨슈머 (docker compose up) ──
  retail-refiner:              # retail.crawl.raw → PG(가격이력) + 단가뷰
    <<: *app
    command: python pipelines/stream/consume_retail.py
    environment:
      PYTHONUNBUFFERED: "1"
      METRICS_PORT: "9401"
    ports: ["9401:9401"]
  deal-notifier:               # retail.deal.raw → PG(deal_type) + Redis 핫딜
    <<: *app
    command: python pipelines/stream/consume_deal.py
    environment:
      PYTHONUNBUFFERED: "1"
      METRICS_PORT: "9402"
    ports: ["9402:9402"]
  recipe-refiner:              # recipe.crawl.raw → PG(recipe/step/ingredient)
    <<: *app
    command: python pipelines/stream/consume_recipe.py
    environment:
      PYTHONUNBUFFERED: "1"
      METRICS_PORT: "9403"
    ports: ["9403:9403"]
  deal-pruner:                 # 만료 딜 정리(Redis) — 10분 간격 상주
    <<: *app
    command: python pipelines/stream/prune_deals.py --loop 600
    environment:
      PYTHONUNBUFFERED: "1"
      METRICS_PORT: "9404"
    ports: ["9404:9404"]
  user-event-sink:             # events.user.activity → PG(activity.user_event) 클릭스트림 (Track 1 §2)
    <<: *app
    command: python pipelines/stream/consume_user_event.py
    environment:
      PYTHONUNBUFFERED: "1"
      METRICS_PORT: "9405"
    ports: ["9405:9405"]
  user-data-pruner:            # activity/chat 원문 보존정리 — 일1회 상주 (Track 1 §4)
    <<: *app
    command: python pipelines/stream/prune_user_data.py --loop 86400
    environment:
      PYTHONUNBUFFERED: "1"
      METRICS_PORT: "9406"
    ports: ["9406:9406"]
  chat-insights:               # chat_message → 대화분석 리포트·선호신호·의도학습 (ml/chat-insights, prep-ahead)
    <<: *app                   #   일1회 상주. 미마이그레이션/데이터無면 graceful skip. intent(sklearn)·LLM(REPORT_GEMINI_API_KEY)은 dep·키 있을 때만.
    command: python ml/chat-insights/run.py --loop 86400
    environment:
      PYTHONUNBUFFERED: "1"
      CHAT_REPORTS_DIR: /app/reports/chat
    volumes:
      - ${CHAT_REPORTS_HOST:-./chat-reports}:/app/reports/chat   # 데이터 담당이 읽을 리포트 산출물(호스트 바인드)

  # ── on-demand: docker compose run --rm <svc> (host cron으로 스케줄) ──
  create-topics:               # 최초 1회 — 토픽 생성
    <<: *app
    restart: "no"
    profiles: ["tools"]
    command: python pipelines/stream/create_topics.py
  poller-oasis:                # 오아시스 가격 폴링(일1~2회) → 직접 produce
    <<: *app
    restart: "no"
    profiles: ["poller"]
    command: >
      python crawler/oasis/oasis_crawler.py
      --categories 11,142,141,12,49,9,13,3,216,1274,1275,219,1191 --kafka
  poller-deal-timesale:        # 오아시스 타임세일(15시) → 딜토픽 라우팅
    <<: *app
    restart: "no"
    profiles: ["poller"]
    command: python crawler/oasis/oasis_crawler.py --deal timeSale --kafka
  poller-deal-closesale:       # 오아시스 마감세일(17시) → 딜토픽 라우팅
    <<: *app
    restart: "no"
    profiles: ["poller"]
    command: python crawler/oasis/oasis_crawler.py --deal closeSale --kafka
  poller-recipe:               # 만개 레시피 최신순 재스캔 → Kafka recipe.crawl.raw 직접 produce (주기 폴러)
    <<: *app
    restart: "no"
    profiles: ["poller"]
    working_dir: /data/recipe-crawl      # 크롤 상태(CSV·크롤링_상태.json) 영속 볼륨 → resume/dedup
    volumes: ["${RECIPE_CRAWL_STATE_HOST:-./recipe-crawl-state}:/data/recipe-crawl"]
    command: python /app/crawler/10k_recipe/10k_recipe_crawler.py --kafka --order date
  poller-es-recipes:           # PG(recipe/recipe_ingredient) → ES(recipes, nori) 재색인 — servable 게이트(source=10K·strict)는 스크립트 내장
    <<: *app
    restart: "no"
    profiles: ["poller"]
    command: python pipelines/ingest/index_recipes_es.py
  poller-kurly:                # 컬리 크롤(Playwright) → 직접 produce. 별도 이미지(브라우저 포함)
    image: 192.168.0.10/food-budget/crawler-kurly:${IMAGE_TAG:-1.1.5}   # data-pipeline 과 같은 IMAGE_TAG 로 함께 핀 (build: 는 docker-compose.build.yml)
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"    # 별도 이미지라 앵커 미상속 → 여기도 명시
    restart: "no"
    profiles: ["poller"]
    command: python crawler/kurly/prototype.py --kafka
