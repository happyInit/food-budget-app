name: build-push
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ci-sample/**'
      - '.github/workflows/build-push.yml'

env:
  IMAGE: 192.168.0.10/food-budget/ci-sample

jobs:
  build-push:
    runs-on: [self-hosted, fb-ci]
    steps:
      - uses: actions/checkout@v4

      - name: Harbor 로그인
        run: echo "${{ secrets.HARBOR_PASSWORD }}" | docker login 192.168.0.10 -u "${{ secrets.HARBOR_USERNAME }}" --password-stdin

      - name: 이미지 빌드
        run: docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" ci-sample

      # --- 보안 게이트: Harbor push '전'에 스캔 → 취약 이미지 반입 차단 ---
      - name: Trivy 스캔 리포트 (HIGH·CRITICAL, 비차단)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache \
            aquasec/trivy:0.72.0 image \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 0 \
              "$IMAGE:${{ github.sha }}"

      - name: Trivy 게이트 (CRITICAL 발견 시 실패)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache \
            aquasec/trivy:0.72.0 image \
              --scanners vuln \
              --severity CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              "$IMAGE:${{ github.sha }}"

      - name: Harbor push
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: 로그아웃 (항상)
        if: always()
        run: docker logout 192.168.0.10 || true

  deploy:
    needs: build-push
    runs-on: [self-hosted, fb-ci]
    steps:
      - name: 배포 SSH 키 준비
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/cd_deploy_key
          chmod 600 ~/.ssh/cd_deploy_key

      - name: fb-app-ai 배포 (pull + run)
        run: |
          ssh -i ~/.ssh/cd_deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ubuntu@192.168.0.9 \
            "docker pull $IMAGE:${{ github.sha }} && docker rm -f ci-sample 2>/dev/null; docker run -d --name ci-sample --restart unless-stopped -p 8000:8000 $IMAGE:${{ github.sha }} && echo deployed"

      - name: 헬스체크 (fb-app-ai:8000)
        run: |
          for i in $(seq 1 10); do
            if curl -sf http://192.168.0.9:8000/health; then echo " — health OK"; exit 0; fi
            sleep 3
          done
          echo "health FAILED"; exit 1

      - name: 배포 키 삭제 (항상)
        if: always()
        run: rm -f ~/.ssh/cd_deploy_key
