name: ci-selfhosted-smoke
# ⚠️ 2026-07-27 비활성 — 러너 은퇴(Jenkins 이관). pytest 게이트는 Jenkinsfile 이 서비스별로 수행.
#    PR 시점 게이트는 공백(후속 과제 = Jenkins 멀티브랜치 PR 빌드).
on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: [self-hosted, fb-ci]
    steps:
      - name: 러너 정보
        run: |
          echo "self-hosted 러너 실행: $(hostname)"
          uname -sr
      - uses: actions/checkout@v4
      - name: Docker 접근 확인 (빌드용 소켓)
        run: |
          docker version
          docker ps --format 'up: {{.Names}}' | head
      - name: 완료
        run: echo "CI 스모크 테스트 성공"
