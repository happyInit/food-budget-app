name: build-push-app
# 앱 스택(FastAPI 8[chat 포함] + frontend nginx) — 서비스별 빌드 + compose 배포.
#   chat 은 이 워크플로가 흡수(build-push-chat 은퇴). 기존 build-push(ci-sample)·build-push-pipeline 만 별개.
#   detect 잡이 변경된 서비스/프론트만 골라 매트릭스 빌드 → Trivy 게이트 → Harbor push → .9 에서 compose pull+up.
on:
  workflow_dispatch:            # 수동 = 전부 빌드
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'frontend/**'
      - 'deploy/app/**'
      - 'pipelines/ingest/gazetteer.py'   # chat vendor 원본(빌드컨텍스트=레포루트)
      - 'pipelines/ingest/_db.py'
      - '.github/workflows/build-push-app.yml'

env:
  REGISTRY: 192.168.0.10
  PROJECT: food-budget
  APP_VERSION: "1.1.1"        # 배포/푸시 버전 태그(SoT) — deploy 는 이 태그를 pin. 릴리스마다 올림.

jobs:
  # ── 변경 감지 → 빌드할 컴포넌트 매트릭스 ──
  detect:
    runs-on: [self-hosted, fb-ci]
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      any: ${{ steps.pick.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          services="recipe price account pantry recipebook mealplan notify"
          if [ "$EVENT" = "workflow_dispatch" ] || [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            diff="ALL"     # 수동/최초 푸시 → 전부
          else
            diff="$(git diff --name-only "$BEFORE" "$SHA" 2>/dev/null || echo ALL)"
          fi
          items=""
          for s in $services; do
            if [ "$diff" = "ALL" ] || printf '%s\n' "$diff" | grep -q "^services/$s/"; then
              items="$items{\"name\":\"$s\",\"context\":\"services/$s\",\"dockerfile\":\"services/$s/Dockerfile\",\"image\":\"$PROJECT/$s-service\"},"
            fi
          done
          # chat — 빌드 컨텍스트=레포 루트(pipelines/ingest 공유코드를 COPY), 트리거=services/chat 또는 vendor 원본
          if [ "$diff" = "ALL" ] || printf '%s\n' "$diff" | grep -qE "^services/chat/|^pipelines/ingest/gazetteer\.py|^pipelines/ingest/_db\.py"; then
            items="$items{\"name\":\"chat\",\"context\":\".\",\"dockerfile\":\"services/chat/Dockerfile\",\"image\":\"$PROJECT/chat-service\"},"
          fi
          if [ "$diff" = "ALL" ] || printf '%s\n' "$diff" | grep -q "^frontend/"; then
            items="$items{\"name\":\"frontend\",\"context\":\"frontend\",\"dockerfile\":\"frontend/Dockerfile\",\"image\":\"$PROJECT/frontend\"},"
          fi
          items="${items%,}"
          if [ -z "$items" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
            echo "matrix={\"include\":[$items]}" >> "$GITHUB_OUTPUT"
          fi
          echo "diff=$diff"; echo "include=[$items]"

  # ── 서비스별 빌드 → Trivy 게이트 → Harbor push ──
  build-push:
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: [self-hosted, fb-ci]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Harbor 로그인
        run: echo "${{ secrets.HARBOR_PASSWORD }}" | docker login "$REGISTRY" -u "${{ secrets.HARBOR_USERNAME }}" --password-stdin

      - name: 이미지 빌드   # 7 서비스=서비스디렉토리 self-contained · frontend=멀티스테이지 · chat=레포루트(-f)
        run: |
          docker build \
            -f "${{ matrix.dockerfile }}" \
            -t "$REGISTRY/${{ matrix.image }}:${{ github.sha }}" \
            -t "$REGISTRY/${{ matrix.image }}:${{ env.APP_VERSION }}" \
            -t "$REGISTRY/${{ matrix.image }}:latest" \
            "${{ matrix.context }}"

      - name: Trivy 게이트 (CRITICAL fixable → 실패, 취약 이미지 반입 차단)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache \
            aquasec/trivy:0.72.0 image \
              --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 \
              "$REGISTRY/${{ matrix.image }}:${{ github.sha }}"

      - name: Harbor push
        run: |
          docker push "$REGISTRY/${{ matrix.image }}:${{ github.sha }}"
          docker push "$REGISTRY/${{ matrix.image }}:${{ env.APP_VERSION }}"
          docker push "$REGISTRY/${{ matrix.image }}:latest"

      - name: 로그아웃 (항상)
        if: always()
        run: docker logout "$REGISTRY" || true

  # ── .9 에서 스택 갱신 (compose pull + up) ──
  deploy:
    needs: [detect, build-push]
    # 빌드 성공했거나(=이미지 갱신), 빌드가 스킵(=compose-only 변경)일 때 배포. 빌드 실패면 배포 안 함.
    if: ${{ !cancelled() && (needs.build-push.result == 'success' || needs.build-push.result == 'skipped') }}
    runs-on: [self-hosted, fb-ci]
    steps:
      - uses: actions/checkout@v4

      - name: 배포 SSH 키 준비
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/cd_deploy_key
          chmod 600 ~/.ssh/cd_deploy_key

      - name: compose 파일 동기화 (.9)   # 시크릿 .env 는 .9 에 상주(커밋/전송 X)
        run: |
          SSHOPT="-i ~/.ssh/cd_deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          ssh $SSHOPT ubuntu@192.168.0.9 'mkdir -p ~/foodbudget-app/deploy/app'
          scp $SSHOPT deploy/app/docker-compose.yml ubuntu@192.168.0.9:~/foodbudget-app/deploy/app/docker-compose.yml

      - name: pull + up (.9)
        # --ignore-pull-failures: Harbor 미시딩 이미지(로컬빌드분)는 건너뛰고 로컬 것 사용.
        #   전체 이미지를 Harbor 에 시딩하려면 build-push-app 을 workflow_dispatch(=전체 빌드)로 1회 실행.
        run: |
          ssh -i ~/.ssh/cd_deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ubuntu@192.168.0.9 \
            'cd ~/foodbudget-app/deploy/app && IMAGE_TAG=${{ env.APP_VERSION }} docker compose pull --ignore-pull-failures || true; IMAGE_TAG=${{ env.APP_VERSION }} docker compose up -d --remove-orphans'

      - name: 헬스체크 (:80)
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://192.168.0.9/healthz >/dev/null; then echo "nginx :80 OK"; exit 0; fi
            sleep 3
          done
          echo "nginx :80 health FAILED"; exit 1

      - name: 배포 키 삭제 (항상)
        if: always()
        run: rm -f ~/.ssh/cd_deploy_key
