name: build-push-app
# 앱 스택(FastAPI 9[chat·ocr 포함] + frontend nginx) — 서비스별 빌드 + compose 배포.
#   chat 은 이 워크플로가 흡수(build-push-chat 은퇴). 기존 build-push-pipeline(데이터 파이프라인 이미지)만 별개.
#   detect 잡이 변경된 서비스/프론트만 골라 매트릭스 빌드 → Trivy 게이트 → Harbor push → .9 에서 compose pull+up.
# ⚠️ 2026-07-27 비활성 — CI 는 Jenkins(호스트 C, 레포 루트 Jenkinsfile)로 이관됐고 self-hosted
#    러너는 은퇴했다(구 fb-ci-harbor VM 과 함께 소멸 예정). push 트리거를 남겨두면 배정될 수 없는
#    런이 큐에 쌓이고 PR 체크가 영원히 pending 이 된다 → workflow_dispatch 만 남기고 제거.
#    파일은 이관 레퍼런스로 보존(변경감지 paths·3태그 로직의 원본). 재활성화 = push 트리거 복원 + 러너 재등록.
on:
  workflow_dispatch:            # 수동 = 릴리스: 전 서비스 빌드 + :APP_VERSION 버전 태그 + 그 태그로 배포

env:
  REGISTRY: 192.168.0.10
  PROJECT: food-budget
  APP_VERSION: "1.1.1"        # 릴리스 버전 태그(SoT). workflow_dispatch(릴리스) 런에서만 이미지에 :X.Y.Z 로 찍힘(전 서비스 완전세트) → deploy 가 pin. 자동 push 는 :latest 만. 릴리스마다 올림.

jobs:
  # ── 변경 감지 → 빌드할 컴포넌트 매트릭스 ──
  detect:
    runs-on: [self-hosted, fb-ci]
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      any: ${{ steps.pick.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          services="price account pantry recipebook mealplan notify ocr"
          if [ "$EVENT" = "workflow_dispatch" ] || [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            diff="ALL"     # 수동/최초 푸시 → 전부
          else
            diff="$(git diff --name-only "$BEFORE" "$SHA" 2>/dev/null || echo ALL)"
          fi
          items=""
          for s in $services; do
            if [ "$diff" = "ALL" ] || printf '%s\n' "$diff" | grep -q "^services/$s/"; then
              items="$items{\"name\":\"$s\",\"context\":\"services/$s\",\"dockerfile\":\"services/$s/Dockerfile\",\"image\":\"$PROJECT/$s-service\"},"
            fi
          done
          # chat·recipe — 빌드 컨텍스트=레포 루트(pipelines/ingest 공유코드 COPY). 트리거=서비스 디렉토리 또는 vendor 원본
          if [ "$diff" = "ALL" ] || printf '%s\n' "$diff" | grep -qE "^services/chat/|^pipelines/ingest/gazetteer\.py|^pipelines/ingest/_db\.py|^pipelines/ingest/quantity\.py"; then
            items="$items{\"name\":\"chat\",\"context\":\".\",\"dockerfile\":\"services/chat/Dockerfile\",\"image\":\"$PROJECT/chat-service\"},"
          fi
          if [ "$diff" = "ALL" ] || printf '%s\n' "$diff" | grep -qE "^services/recipe/|^pipelines/ingest/quantity\.py"; then
            items="$items{\"name\":\"recipe\",\"context\":\".\",\"dockerfile\":\"services/recipe/Dockerfile\",\"image\":\"$PROJECT/recipe-service\"},"
          fi
          # ranking-serving — 컨텍스트=ml/recipe-ranking. 이 한 이미지를 serving·retrain 두 서비스가 공유(compose command 오버라이드).
          if [ "$diff" = "ALL" ] || printf '%s\n' "$diff" | grep -q "^ml/recipe-ranking/"; then
            items="$items{\"name\":\"ranking-serving\",\"context\":\"ml/recipe-ranking\",\"dockerfile\":\"ml/recipe-ranking/Dockerfile\",\"image\":\"$PROJECT/ranking-serving\"},"
          fi
          if [ "$diff" = "ALL" ] || printf '%s\n' "$diff" | grep -q "^frontend/"; then
            items="$items{\"name\":\"frontend\",\"context\":\"frontend\",\"dockerfile\":\"frontend/Dockerfile\",\"image\":\"$PROJECT/frontend\"},"
          fi
          items="${items%,}"
          if [ -z "$items" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
            echo "matrix={\"include\":[$items]}" >> "$GITHUB_OUTPUT"
          fi
          echo "diff=$diff"; echo "include=[$items]"

  # ── 서비스별 빌드 → Trivy 게이트 → Harbor push ──
  build-push:
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: [self-hosted, fb-ci]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Harbor 로그인
        run: echo "${{ secrets.HARBOR_PASSWORD }}" | docker login "$REGISTRY" -u "${{ secrets.HARBOR_USERNAME }}" --password-stdin

      - name: 이미지 빌드   # 7 서비스=서비스디렉토리 self-contained · frontend=멀티스테이지 · chat=레포루트(-f)
        run: |
          IMG="$REGISTRY/${{ matrix.image }}"
          # 공통 = 불변 :<sha> + 편의 :latest (매 푸시). 버전 태그 :X.Y.Z 는 릴리스 런에서만(전 서비스 완전세트 보장).
          TAGS=(-t "$IMG:${{ github.sha }}" -t "$IMG:latest")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAGS+=(-t "$IMG:${{ env.APP_VERSION }}")
          fi
          docker build -f "${{ matrix.dockerfile }}" "${TAGS[@]}" "${{ matrix.context }}"

      - name: Trivy 게이트 (CRITICAL fixable → 실패, 취약 이미지 반입 차단)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache \
            aquasec/trivy:0.72.0 image \
              --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 \
              "$REGISTRY/${{ matrix.image }}:${{ github.sha }}"

      - name: Trivy 결과를 메트릭으로 기록 (배포는 막지 않음)
        continue-on-error: true
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache -v /tmp:/tmp \
            aquasec/trivy:0.72.0 image --scanners vuln -f json -o /tmp/trivy-${{ matrix.name }}.json \
            "$REGISTRY/${{ matrix.image }}:${{ github.sha }}" || true

          python3 -c "
          import json, time
          data = json.load(open('/tmp/trivy-${{ matrix.name }}.json'))
          vulns = [v for r in data.get('Results') or [] for v in r.get('Vulnerabilities') or []]
          critical = sum(1 for v in vulns if v['Severity'] == 'CRITICAL')
          high = sum(1 for v in vulns if v['Severity'] == 'HIGH')
          with open('/tmp/fb_ci_trivy_${{ matrix.name }}.prom.tmp', 'w') as f:
              f.write(f'fb_ci_trivy_vulnerabilities_total{{image=\"${{ matrix.name }}\",severity=\"CRITICAL\"}} {critical}\n')
              f.write(f'fb_ci_trivy_vulnerabilities_total{{image=\"${{ matrix.name }}\",severity=\"HIGH\"}} {high}\n')
              f.write(f'fb_ci_trivy_last_scan_timestamp_seconds{{image=\"${{ matrix.name }}\"}} {int(time.time())}\n')
          "
          chmod 0644 /tmp/fb_ci_trivy_${{ matrix.name }}.prom.tmp
          mv /tmp/fb_ci_trivy_${{ matrix.name }}.prom.tmp /var/lib/node_exporter/textfile_collector/fb_ci_trivy_${{ matrix.name }}.prom

      - name: Harbor push
        run: |
          IMG="$REGISTRY/${{ matrix.image }}"
          docker push "$IMG:${{ github.sha }}"
          docker push "$IMG:latest"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            docker push "$IMG:${{ env.APP_VERSION }}"   # 릴리스 런만 버전 태그 push
          fi

      - name: 로그아웃 (항상)
        if: always()

# ── ~~deploy — .9 에서 스택 갱신 (compose pull + up)~~ → **삭제 (2026-07-31, P4)** ──
#
# 이 잡은 self-hosted 러너에서 `secrets.DEPLOY_SSH_KEY` 로 `ubuntu@192.168.0.9` 에 ssh/scp 해
# `deploy/app/docker-compose.yml` 을 밀어넣고 `docker compose up -d` 를 돌렸다. 세 가지가 동시에
# 무너져서 걷어낸다 — 하나만 고쳐도 살아나지 않는다:
#   ① self-hosted 러너 `fb-ci` 은퇴(2026-07-27) → 이 잡은 배정 자체가 안 된다
#   ② 대상 VM `.9`(fb-app-ai) **실물 파괴**(2026-07-31, P4) → ssh 할 곳이 없다
#   ③ CD 정본이 **ArgoCD 단독**으로 확정 → CI 가 배포하는 것 자체가 현행 정책 위반이다
#
# 🔴 위 ①~③ 중 무엇도 되돌릴 계획이 없으므로 "비활성 보존"이 아니라 삭제한다. 이 파일의 나머지
#    (변경감지 `detect` · 3태그 빌드/푸시)는 **이관 레퍼런스로 보존**하지만, deploy 잡은 Jenkins 로
#    포팅된 적이 없어(Jenkins 는 배포하지 않는다) 레퍼런스 가치가 0이고 위험만 남는다.
#
# 승계처 = Jenkins(빌드·push, 레포 루트 `Jenkinsfile`) → config 레포 `:sha` 핀 → ArgoCD(배포).
# 함께 폐기 = Ansible `cd_deploy_key` 롤(키를 심던 반대쪽) · `infra/certs/deploy_key{,.pub}`.
# 🔴 남은 조치 = GitHub 레포 시크릿 **`DEPLOY_SSH_KEY` 삭제**(파일 정리 ≠ 시크릿 무효화).
