# 수집 파이프라인 이미지 CI — Harbor 빌드/푸시 (data-pipeline + crawler-kurly).
# build-push-app 과 동일 패턴(self-hosted fb-ci · Harbor login · Trivy 게이트)을 따름.
# 배포(CD)는 여기서 안 함 — 라이브 컨슈머/폴러는 fb-data에서 host-side로 (deploy/README.md).
name: build-push-pipeline
# ⚠️ 2026-07-27 비활성 — CI 는 Jenkins(호스트 C, 레포 루트 Jenkinsfile)로 이관, 러너 은퇴.
#    paths 규칙(스키마 SQL 트리거·output 제외 포함)은 Jenkinsfile CATALOG 의 srcs/extra 로 승계됨.
#    파일은 레퍼런스로 보존. 재활성화 = push 트리거 복원 + 러너 재등록.
on:
  workflow_dispatch:

env:
  REGISTRY: 192.168.0.10
  PROJECT: food-budget
  APP_VERSION: "1.1.10"       # 릴리스 버전 태그(SoT). workflow_dispatch(릴리스) 런에서만 :X.Y.Z 로 찍힘. 자동 push 는 :latest 만. 릴리스마다 올림. (1.1.10 = 단가 콤마 파싱 장애 수정(#285) + 매트뷰 마이그레이션 DROP relkind 분기(#287). 둘 다 버그픽스라 PATCH. build-push-app 은 별도 트랙 1.1.1.)

jobs:
  build-push:
    runs-on: [self-hosted, fb-ci]
    strategy:
      max-parallel: 1        # 단일 러너·물리 8코어 → 동시 빌드 회피 (design §8.4)
      fail-fast: false
      matrix:
        include:
          - name: data-pipeline
            dockerfile: Dockerfile
            gate: critical    # 우리가 관리하는 python-slim → CRITICAL 발견 시 차단
          - name: crawler-kurly
            dockerfile: crawler/kurly/Dockerfile
            gate: report      # upstream Playwright 브라우저 베이스 → 리포트만(비차단)
    steps:
      - uses: actions/checkout@v5

      - name: 이미지 좌표
        id: img
        run: echo "ref=$REGISTRY/$PROJECT/${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Harbor 로그인
        run: echo "${{ secrets.HARBOR_PASSWORD }}" | docker login "$REGISTRY" -u "${{ secrets.HARBOR_USERNAME }}" --password-stdin

      - name: 이미지 빌드
        run: |
          REF="${{ steps.img.outputs.ref }}"
          # 공통 :<sha> + :latest (매 푸시). 버전 태그 :X.Y.Z 는 릴리스 런(workflow_dispatch)에서만 — build-push-app 규칙과 통일.
          TAGS=(-t "$REF:${{ github.sha }}" -t "$REF:latest")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAGS+=(-t "$REF:${{ env.APP_VERSION }}")
          fi
          docker build "${TAGS[@]}" -f "${{ matrix.dockerfile }}" .

      # --- 스모크: 빌드된 이미지가 실제로 기동/import 되나 (build는 pip+COPY만 → 실행 검증 X) ---
      - name: 스모크 — 이미지 기동/import 확인 (push 전)
        run: |
          IMG="${{ steps.img.outputs.ref }}:${{ github.sha }}"
          if [ "${{ matrix.name }}" = "data-pipeline" ]; then
            # 오아시스 크롤러 기동(argparse·requests·bs4 import; --help는 fetch 전 exit) + 런타임 deps 존재
            docker run --rm "$IMG" python crawler/oasis/oasis_crawler.py --help >/dev/null
            docker run --rm "$IMG" python -c "import confluent_kafka, psycopg, redis, prometheus_client, bs4, lxml.etree, requests, dotenv; import sys; sys.path.insert(0, 'pipelines/stream'); import _metrics; print('deps OK')"
          else
            # 컬리 크롤러 기동 — --help는 parse_args가 asyncio.run보다 먼저 실행 → 브라우저 안 띄움
            docker run --rm "$IMG" python crawler/kurly/prototype.py --help >/dev/null
            # ★ --help 만으로는 브라우저를 안 띄워서 playwright/베이스이미지 버전 드리프트를 못 잡는다
            #   (실장애: base v1.47 + playwright 1.61 → chromium 바이너리 없음, 폴러가 매일 조용히 실패).
            #   prototype 과 동일한 stealth-async 경로로 실제 기동까지 확인.
            docker run --rm "$IMG" python -c "
          import asyncio
          from playwright.async_api import async_playwright
          from playwright_stealth import Stealth
          async def main():
              async with Stealth().use_async(async_playwright()) as p:
                  b = await p.chromium.launch(headless=True)
                  await b.close()
              print('stealth chromium OK')
          asyncio.run(main())
          "
          fi
          echo "smoke OK: ${{ matrix.name }}"

      # --- 보안 게이트: Harbor push '전' 스캔 → 취약 이미지 반입 차단 (build-push-app 과 동일 정책) ---
      - name: Trivy 스캔 리포트 (HIGH·CRITICAL, 비차단)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache \
            aquasec/trivy:0.72.0 image \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 0 \
              "${{ steps.img.outputs.ref }}:${{ github.sha }}"

      - name: Trivy 게이트 (CRITICAL 발견 시 실패)
        if: matrix.gate == 'critical'
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache \
            aquasec/trivy:0.72.0 image \
              --scanners vuln \
              --severity CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              "${{ steps.img.outputs.ref }}:${{ github.sha }}"

      - name: Harbor push
        run: |
          REF="${{ steps.img.outputs.ref }}"
          docker push "$REF:${{ github.sha }}"
          docker push "$REF:latest"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            docker push "$REF:${{ env.APP_VERSION }}"   # 릴리스 런만 버전 태그 push
          fi

      - name: 로그아웃 (항상)
        if: always()
        run: docker logout "$REGISTRY" || true
