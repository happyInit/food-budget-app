# ══════════════════════════════════════════════════════════════════════════════
# SonarQube — 코드 품질 **측정** (C-38 · 서버 = Ansible `gitlab_sonarqube`)
# ══════════════════════════════════════════════════════════════════════════════
# 🔴 **비차단이다**(`allow_failure: true`) — 온프렘 Jenkins 와 같은 성질을 그대로 옮겼다.
#    🟢 **사용자 확정(2026-08-14): 당분간 이대로 가고, 차단 게이트는 나중에 시간이 되면 해본다.**
#       ⇒ 정본 C-38 의 *"차단 게이트 목적"* 서술을 **정정**했다(그 행의 ⟳ 참조).
#    ⚠️ 나중에 차단으로 돌릴 때 필요한 것 = ① 서비스별 품질 게이트 기준선 ② `allow_failure` 제거
#       ③ 🔴 **`sonar-scanner` 는 게이트 결과를 안 기다린다** — `-Dsonar.qualitygate.wait=true` 가 있어야
#          분석 전송이 아니라 **판정**을 기다린다(없으면 항상 초록이라 차단이 안 걸린다).
#
# 🔴 **main 에서만 돈다.** Community 에디션은 브랜치 분석이 없어서, 기능 브랜치 분석이
#    main 프로젝트를 **덮어쓴다**(온프렘 실측 — 기준선이 통째로 오염됐다).
#
# 🔴 스캐너는 이미지가 아니라 **네이티브 aarch64 zip** 이다(실측 2026-08-14):
#      sonarsource/sonar-scanner-cli = **amd64 단독** → Graviton 에서 QEMU 를 타야 한다.
#    체크섬을 핀한다 — 외부에서 받는 실행파일이라 검증 없이 쓰지 않는다.
.sonar:
  stage: test
  # 🔴 alpine(musl)이 아니라 **glibc** 이미지다 — SonarJS 분석기가 자기 Node 바이너리를
  #    번들로 들고 오는데 그게 glibc 빌드다(frontend 분석이 musl 에선 조용히 깨진다).
  image: eclipse-temurin:21-jre
  services: []
  allow_failure: true
  needs: []
  variables:
    SONAR_HOST_URL: "http://172.17.0.1:9000"
    SONAR_SCANNER_VERSION: "7.3.0.5189"
    SONAR_SCANNER_SHA256: "e35d13dcd861659ed021c63f858ad3abfc8e2637ed2eb45f8702d086aad8b09c"
    SONAR_USER_HOME: "$CI_PROJECT_DIR/.sonar"
    # 🔴 얕은 클론이면 "새 코드" 판정이 어긋난다(기본 depth 20).
    GIT_DEPTH: "0"
  cache:
    key: "sonar-scanner-$SONAR_SCANNER_VERSION"
    paths: [".sonar/"]
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl unzip >/dev/null
  script:
    - |
      set -e
      if [ -z "${SONAR_TOKEN:-}" ]; then
        echo "🔴 SONAR_TOKEN 이 없다 — Ansible `gitlab.yml --tags sonarqube` 를 돌리지 않았거나"
        echo "   프로젝트 변수가 지워졌다. 측정만 하는 단계라 여기서 멈춘다(비차단)."
        exit 1
      fi
      SC="${SONAR_USER_HOME}/sonar-scanner-${SONAR_SCANNER_VERSION}-linux-aarch64"
      if [ ! -x "${SC}/bin/sonar-scanner" ]; then
        mkdir -p "${SONAR_USER_HOME}"
        Z="${SONAR_USER_HOME}/scanner.zip"
        curl -sSLf -o "$Z" \
          "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${SONAR_SCANNER_VERSION}-linux-aarch64.zip"
        echo "${SONAR_SCANNER_SHA256}  ${Z}" | sha256sum -c -
        unzip -q -o "$Z" -d "${SONAR_USER_HOME}"
        rm -f "$Z"
      fi
      export PATH="${SC}/bin:$PATH"
    - |
      cd "$SRC"
      # 🔴 `projectVersion` 을 sha 로 준다 — 안 주면 버전이 붙박이가 돼서 "새 코드" 창이
      #    영원히 첫 분석 시점에 고정된다(온프렘 실측 — 게이트가 기준선에 붙박였다).
      sonar-scanner \
        -Dsonar.host.url="${SONAR_HOST_URL}" \
        -Dsonar.token="${SONAR_TOKEN}" \
        -Dsonar.projectKey="${IMAGE}" \
        -Dsonar.projectVersion="${RELEASE_VERSION:-$CI_COMMIT_SHORT_SHA}" \
        -Dsonar.sources=. \
        -Dsonar.exclusions="${SONAR_EXCLUSIONS}" \
        -Dsonar.python.coverage.reportPaths=coverage.xml

# 🔴 커버리지는 `test:*` 잡의 아티팩트로 들어온다 — 그래서 테스트가 있는 것은 `needs` 를 건다.
#    없는 것(chat·frontend·ranking-serving)은 `needs: []` 로 즉시 시작한다(템플릿 기본값).
# 🔴 pgsync·es-nori·rollouts-plugin 은 **분석 대상이 아니다** — Dockerfile 뿐이라 잴 소스가 없다.
sonar:account:    { extends: .sonar, needs: [test:account],    variables: { SRC: services/account,    IMAGE: mp-account-service },    rules: [{ if: '$CI_COMMIT_BRANCH != "main"', when: never }, { if: '$SERVICES == "all" || $SERVICES =~ /(^|[ ,])account([ ,]|$)/' }, { if: '$SERVICES != ""', when: never }, { changes: [services/account/**/*] }] }
sonar:pantry:     { extends: .sonar, needs: [test:pantry],     variables: { SRC: services/pantry,     IMAGE: mp-pantry-service },     rules: [{ if: '$CI_COMMIT_BRANCH != "main"', when: never }, { if: '$SERVICES == "all" || $SERVICES =~ /(^|[ ,])pantry([ ,]|$)/' }, { if: '$SERVICES != ""', when: never }, { changes: [services/pantry/**/*] }] }
sonar:price:      { extends: .sonar, needs: [test:price],      variables: { SRC: services/price,      IMAGE: mp-price-service },      rules: [{ if: '$CI_COMMIT_BRANCH != "main"', when: never }, { if: '$SERVICES == "all" || $SERVICES =~ /(^|[ ,])price([ ,]|$)/' }, { if: '$SERVICES != ""', when: never }, { changes: [services/price/**/*] }] }
sonar:recipebook: { extends: .sonar, needs: [test:recipebook], variables: { SRC: services/recipebook, IMAGE: mp-recipebook-service }, rules: [{ if: '$CI_COMMIT_BRANCH != "main"', when: never }, { if: '$SERVICES == "all" || $SERVICES =~ /(^|[ ,])recipebook([ ,]|$)/' }, { if: '$SERVICES != ""', when: never }, { changes: [services/recipebook/**/*] }] }
sonar:mealplan:   { extends: .sonar, needs: [test:mealplan],   variables: { SRC: services/mealplan,   IMAGE: mp-mealplan-service },   rules: [{ if: '$CI_COMMIT_BRANCH != "main"', when: never }, { if: '$SERVICES == "all" || $SERVICES =~ /(^|[ ,])mealplan([ ,]|$)/' }, { if: '$SERVICES != ""', when: never }, { changes: [services/mealplan/**/*] }] }
sonar:notify:     { extends: .sonar, needs: [test:notify],     variables: { SRC: services/notify,     IMAGE: mp-notify-service },     rules: [{ if: '$CI_COMMIT_BRANCH != "main"', when: never }, { if: '$SERVICES == "all" || $SERVICES =~ /(^|[ ,])notify([ ,]|$)/' }, { if: '$SERVICES != ""', when: never }, { changes: [services/notify/**/*] }] }
sonar:ocr:        { extends: .sonar, needs: [test:ocr],        variables: { SRC: services/ocr,        IMAGE: mp-ocr-service },        rules: [{ if: '$CI_COMMIT_BRANCH != "main"', when: never }, { if: '$SERVICES == "all" || $SERVICES =~ /(^|[ ,])ocr([ ,]|$)/' }, { if: '$SERVICES != ""', when: never }, { changes: [services/ocr/**/*] }] }
sonar:recipe:     { extends: .sonar, needs: [test:recipe],     variables: { SRC: services/recipe,     IMAGE: mp-recipe-service },     rules: [{ if: '$CI_COMMIT_BRANCH != "main"', when: never }, { if: '$SERVICES == "all" || $SERVICES =~ /(^|[ ,])recipe([ ,]|$)/' }, { if: '$SERVICES != ""', when: never }, { changes: [services/recipe/**/*] }] }
sonar:video:      { extends: .sonar, needs: [test:video],      variables: { SRC: services/video,      IMAGE: mp-video-service },      rules: [{ if: '$CI_COMMIT_BRANCH != "main"', when: never }, { if: '$SERVICES == "all" || $SERVICES =~ /(^|[ ,])video([ ,]|$)/' }, { if: '$SERVICES != ""', when: never }, { changes: [services/video/**/*, ml/video-recipe/**/*] }] }
sonar:chat:            { extends: .sonar, variables: { SRC: services/chat,      IMAGE: mp-chat-service },    rules: [{ if: '$CI_COMMIT_BRANCH != "main"', when: never }, { if: '$SERVICES == "all" || $SERVICES =~ /(^|[ ,])chat([ ,]|$)/' }, { if: '$SERVICES != ""', when: never }, { changes: [services/chat/**/*] }] }
sonar:frontend:        { extends: .sonar, variables: { SRC: frontend,           IMAGE: mp-frontend },        rules: [{ if: '$CI_COMMIT_BRANCH != "main"', when: never }, { if: '$SERVICES == "all" || $SERVICES =~ /(^|[ ,])frontend([ ,]|$)/' }, { if: '$SERVICES != ""', when: never }, { changes: [frontend/**/*] }] }
sonar:ranking-serving: { extends: .sonar, variables: { SRC: ml/recipe-ranking,  IMAGE: mp-ranking-serving }, rules: [{ if: '$CI_COMMIT_BRANCH != "main"', when: never }, { if: '$SERVICES == "all" || $SERVICES =~ /(^|[ ,])ranking-serving([ ,]|$)/' }, { if: '$SERVICES != ""', when: never }, { changes: [ml/recipe-ranking/**/*] }] }

# ══════════════════════════════════════════════════════════════════════════════
# CD 인계 — config 레포에 :sha 핀
# ══════════════════════════════════════════════════════════════════════════════
# 🔴 main 에서만. 없으면 PR 이 프로덕션에 배포된다(#389 위험1).
# 🔴 핀은 :sha 만. :latest 를 쓰면 ArgoCD 가 변화를 감지하지 못하고 롤백도 불가하다(플랜 §7.3).
# 🔴 config 레포는 GitHub 유지 — AWS 리전 장애 때 온프렘 ArgoCD 가 읽어야 한다(C-61③).
#    ⇒ 이 잡만 GitLab 밖(GitHub)으로 나간다. deploy key 는 보호 변수 $CONFIG_REPO_SSH_KEY.
config-pin:
  stage: deploy
  image: alpine/git:latest
  services: []
  # 🔴🔴 **기본 비활성이다 — C-89 의 명시적 유예.**
  #    지금 `Jenkinsfile` 이 `overlays/{onprem,eks}` 를 **둘 다** 핀한다(A-42/#624).
  #    여기서도 핀하면 **두 CI 가 같은 파일을 쓴다.** 분담 정리(Jenkins=onprem / GitLab=eks)는
  #    이관 후로 미뤘다(사용자 판단 = *"지금 급한 건 마이그레이션"*).
  #    ⇒ 켤 때 = `MP_ENABLE_CD=1` + **같은 커밋으로 Jenkinsfile 의 `SITES` 를 onprem 단독으로** 되돌린다.
  rules:
    - if: '$MP_ENABLE_CD == "1" && $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE != "merge_request_event"'
  before_script:
    # 🔴 이 잡엔 docker 가 없다(services: []) → kustomize 를 이미지로 못 띄운다. 바이너리를 받는다.
    #    러너가 arm64(C-63)이므로 arm64 배포본을 고정 버전으로 받는다.
    - apk add --no-cache curl tar
    - |
      curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_arm64.tar.gz" \
        | tar xz -C /usr/local/bin kustomize
    - kustomize version
  script:
    - mkdir -p ~/.ssh && echo "$CONFIG_REPO_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
    - export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new"
    - git clone --depth 1 git@github.com:happyInit/mealplanning-config.git .cfgrepo
    - |
      CHANGED=""
      for svc in $EKS_PINNED_SERVICES; do
        # 🔴 오버레이는 eks — 온프렘은 Jenkins 가 따로 onprem 오버레이를 핀한다.
        overlay=".cfgrepo/services/${svc%%=*}/overlays/eks"
        [ -d "$overlay" ] || { echo "오버레이 없음(스킵): ${svc%%=*}"; continue; }
        # 🔴 키는 Harbor 주소(오버레이의 `images[].name`). ECR 주소를 키로 쓰면 매칭이 안 돼
        #    죽은 엔트리만 하나 붙고 기존 태그는 낡은 채로 남는다.
        key="${HARBOR_IMAGE_PREFIX}/${svc##*=}"
        # 🔴 newName 은 **기존 값을 읽어 그대로 돌려준다.** kustomize v5.4.3 실측 —
        #    `<key>=<img>:<sha>` 는 newName 을 덮어쓰고, `<key>:<sha>` 는 newName 을 지운다.
        #    둘 다 ECR 매핑을 파괴한다. 태그만 갈아끼우려면 이 형식뿐이다.
        newname=$(grep -m1 'newName:' "$overlay/kustomization.yaml" | awk '{print $2}' || true)
        # 🔴 전역 IMAGE_PREFIX 를 없앴다(계정 ID 비커밋) → 여기서도 롤 ARN 에서 유도한다.
        [ -n "$newname" ] || newname="$(echo "${MP_CI_ROLE_ARN}" | cut -d: -f5).dkr.ecr.${MP_AWS_REGION}.amazonaws.com/mealplanning/${svc##*=}"
        ( cd "$overlay" && kustomize edit set image "${key}=${newname}:${CI_COMMIT_SHA}" )
        CHANGED="$CHANGED ${svc%%=*}"
      done
      echo "pinned:$CHANGED"
    - |
      cd .cfgrepo
      git config user.email 'ci@mealbong.cloud'
      git config user.name  'mealbong-ci'
      git add -A
      if git diff --cached --quiet; then
        echo 'config 변경 없음 (동일 :sha 재빌드)'
      else
        git commit -m "ci(cd): eks pin to ${CI_COMMIT_SHA:0:12}"
        git push origin HEAD:main
      fi

# ══════════════════════════════════════════════════════════════════════════════
# 🔴 아직 옮기지 않은 것 — 별건으로 남긴다
# ══════════════════════════════════════════════════════════════════════════════
# 1. SonarQube (측정만·비차단·main 한정)
#    A-29 ① 미해결 — sonar-scanner-cli 공식 이미지가 amd64 단일이라 arm64 러너에서 못 돈다.
#    aarch64 zip(sonar-scanner-cli-<v>-linux-aarch64.zip) 으로 갈아타는 작업이 선행.
# 2. S3 이미지 백업 (Jenkinsfile 의 backupFailed 경로 — UNSTABLE 로만 내리던 것)
# 3. RELEASE_VERSION 릴리스 런의 SERVICES 명시 강제 (Jenkins 파라미터 → GitLab 수동 파이프라인 변수)
