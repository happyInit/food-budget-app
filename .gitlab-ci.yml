# .gitlab-ci.yml — A-29 파이프라인 이식 (Jenkinsfile → GitLab CI)
#
# 정본: docs/mp_aws_prep_checklist.md — C-61(논리 형상) · C-63(러너 arm64) · **C-89**(단일 아키·Jenkins 유지)
#
# 🔴 이 파일은 Jenkinsfile 을 대체하지 않는다. 둘은 대상이 다르다.
#      Jenkinsfile   = 온프렘(amd64) — 그대로 산다. 건드리지 않는다.
#      .gitlab-ci.yml = AWS/EKS(arm64) — 이 파일.
#    사용자 결정(2026-08-12): "2아키는 유지하되, 당장 GitLab 은 AWS 에서 쓸 것만 빌드한다."
#    🔴 **C-89(2026-08-14)가 이것을 영구 형상으로 확정했다** — C-2 의 "Jenkins 은퇴" 를 철회한다.
#      두 CI 가 나란히 영구히 돈다. **manifest list 를 만들지 않는다**(각자 네이티브).
#
# 🔴 **잡의 AWS 신원 = GitLab OIDC (A-50 · 2026-08-13 라이브).** ~~A-30(러너가 ECR 토큰 주입)~~ 은
#    **폐기**됐다. 정적 AWS 키를 CI 변수에 넣지 않는다 — 인스턴스 롤에도 ECR 권한이 없다
#    (실측 확인: `mp-ci-server` = `ssm-transfer-bucket` + `AmazonSSMManagedInstanceCore` 뿐).
#
# ── 필요한 CI/CD 변수 ────────────────────────────────────────────────────────
#   MP_CI_ROLE_ARN  (필수) `arn:aws:iam::<계정>:role/mp-ci-job`.
#                   🔴 계정 ID 가 들어가므로 **레포에 커밋하지 않는다**(이 레포는 공개다).
#                   레지스트리 주소는 이 값에서 유도한다 — 변수를 둘로 늘리지 않는다.
#   CONFIG_REPO_SSH_KEY (config-pin 을 켤 때만 · 지금은 기본 비활성)
#
# 🔴 단일 아키(arm64)인 것이 안전장치를 지킨다 —
#    멀티아치 buildx 는 로컬 데몬에 --load 가 안 돼 `build → 스캔 → push` 순서가 깨진다(A-29 ②).
#    단일 플랫폼이면 --load 가 되므로 Jenkinsfile 의 "나쁜 이미지는 절대 안 올라간다" 가 그대로 유지된다.
#    ⇒ 나중에 여기서 amd64 까지 만들기로 하면 그 문제가 되살아난다. 그때 A-29 ② 를 먼저 풀 것.
#
# 러너 = GitLab EC2(t4g.xlarge · Graviton) 위 privileged DinD (C-61① · C-63)
#        ⇒ arm64 가 네이티브다. QEMU 를 타지 않는다.

stages: [test, build, deploy]

variables:
  # ── 레지스트리 ────────────────────────────────────────────────────────────
  # 🔴 **계정 ID 를 레포에 넣지 않는다**(이 레포는 공개다). 잡 안에서 롤 ARN 으로부터 유도한다.
  #    `MP_CI_ROLE_ARN`(CI/CD 변수) = `arn:aws:iam::<계정>:role/mp-ci-job` — A-50 이 만든 잡 전용 롤.
  MP_AWS_REGION: "ap-northeast-2"
  # 🔴 config 오버레이의 **매칭 키**(`images[].name`)는 지금도 Harbor 주소다 — 두 사이트 오버레이가
  #    같은 키를 쓰고 eks 만 `newName` 으로 ECR 을 덮는 구조라, 핀할 때 키는 이 값이어야 한다.
  #    (ECR 주소를 키로 쓰면 매칭되는 엔트리가 없어 **죽은 엔트리가 하나 더 붙고** 태그는 안 오른다.)
  HARBOR_IMAGE_PREFIX: "192.168.0.10/mealplanning"
  PLATFORM: "linux/arm64"

  # ── 도구 핀 ───────────────────────────────────────────────────────────────
  # 🔴 C-63 의 CI 도구 arm64 전수 실측이 확인한 버전으로 맞춘다(종전 `0.68.0` 은 그 실측 이전 값).
  TRIVY_IMAGE: "aquasec/trivy:0.72.0"
  KUSTOMIZE_VERSION: "v5.4.3"

  DOCKER_HOST: "tcp://docker:2376"
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_CERT_PATH: "/certs/client"
  DOCKER_TLS_VERIFY: "1"
  # BuildKit 강제 — 클래식 빌더로 떨어지면 TARGETARCH·BUILDPLATFORM 이 빈 값이 된다(1-6 실측 함정).
  DOCKER_BUILDKIT: "1"

  # 릴리스 런에서만 채운다. 비어 있으면 :sha + :latest 2태그(3태그 정책 · 플랜 §7.3).
  RELEASE_VERSION: ""
  # 🔴 릴리스 대상. `RELEASE_VERSION` 을 줄 때 **반드시 함께** 준다 — 아래 `release-guard` 가 강제한다.
  SERVICES: ""
  # 🔴 A-50 신뢰정책의 `ci_oidc_allowed_refs` 와 짝이다. 한쪽만 늘리면 조용히 어긋난다.
  MP_PUSH_REFS: "main"

  # config 레포에 핀할 대상 = "<오버레이 디렉터리명>=<이미지명>".
  # 🔴 앱 워크로드만 오버레이가 있다. pgsync·es-nori·rollouts-plugin 은 여기 없다(플랫폼 트랙).
  EKS_PINNED_SERVICES: >-
    account=mp-account-service
    pantry=mp-pantry-service
    price=mp-price-service
    recipebook=mp-recipebook-service
    mealplan=mp-mealplan-service
    notify=mp-notify-service
    ocr=mp-ocr-service
    operations=mp-operations-service
    recipe=mp-recipe-service
    video=mp-video-service
    chat=mp-chat-service
    frontend=mp-frontend
    ranking-serving=mp-ranking-serving

default:
  image: docker:29-cli
  services:
    - name: docker:29-dind
      alias: docker
  # 🔴 **`tags:` 를 두지 않는다** — 러너가 `gitlab_runner_run_untagged: true` 로 **태그 없이**
  #    등록돼 있다(롤 defaults: *"러너가 1대뿐이라 태그는 아직 정보가 아니다"*).
  #    `run_untagged` 는 *"태그 없는 잡도 받는다"* 이지 *"아무 태그나 맞는다"* 가 아니라서,
  #    `tags: [mp-aws]` 를 두면 매칭되는 러너가 없어 **모든 잡이 영구 pending** 이 된다.
  #    ⚠️ 러너를 늘려 태그로 가르게 되면 **롤과 이 파일을 같이** 고칠 것.
  interruptible: true

# ══════════════════════════════════════════════════════════════════════════════
# 공통
# ══════════════════════════════════════════════════════════════════════════════

# ── 릴리스 가드 ──────────────────────────────────────────────────────────────
# 🔴 `Jenkinsfile` 의 릴리스 가드를 옮긴 것이다. 앱·파이프라인·pgsync 는 **별개 버전 트랙**이라
#    한 릴리스 = 한 트랙이어야 하고, 변경감지·전체빌드에 버전 태그를 얹으면 **부분 버전세트**가
#    남는다(어떤 서비스는 1.2.0 이 있고 어떤 것은 없는 상태 = landmine).
# 🔴 `.gitlab-ci.yml` 은 `rules:changes` 로 대상을 고르므로 Jenkins 처럼 SERVICES 로 좁힐 수 없다.
#    ⇒ **릴리스 런은 SERVICES 를 명시**하게 하고, 그 값이 이 파이프라인의 계약임을 로그에 남긴다.
release-guard:
  stage: test
  image: alpine:3.20
  services: []
  rules:
    - if: $RELEASE_VERSION
  script:
    - |
      set -eu
      if [ -z "${SERVICES}" ]; then
        echo "🔴 릴리스 런은 SERVICES 명시 필수 — 트랙 별칭(app/pipeline) 또는 이름 나열."
        echo "   all·변경감지에는 버전 태그를 찍지 않는다(부분 버전세트 방지)."
        exit 1
      fi
      case "${SERVICES}" in all|ALL) echo "🔴 SERVICES=all 에는 버전 태그를 찍지 않는다."; exit 1 ;; esac
      echo "🏷  릴리스 ${RELEASE_VERSION} · 대상 '${SERVICES}'"


# ── pytest 게이트 ────────────────────────────────────────────────────────────
# Jenkinsfile 카탈로그의 test:true 만. 실패하면 그 서비스는 빌드·push 하지 않는다.
# httpx = fastapi TestClient 의 런타임 의존성 — 테스트 전용이라 여기서만 설치한다.
.pytest:
  stage: test
  image: "python:3.12-slim"
  services: []
  variables:
    REQS: "requirements.txt"
    COV: "app"
  script:
    - cd "$SRC"
    - export PYTHONPATH="$CI_PROJECT_DIR/$SRC:$CI_PROJECT_DIR"
    - |
      if [ -n "$REQS" ]; then
        pip install --no-cache-dir -q -r "$REQS" pytest pytest-cov httpx
      else
        pip install --no-cache-dir -q pytest pytest-cov httpx
      fi
    - python -m pytest -q --cov="$COV" --cov-report=xml
  artifacts:
    paths: ["$SRC/coverage.xml"]
    expire_in: 1 day
    when: always

# ── 빌드 → Trivy 게이트 → ECR push ───────────────────────────────────────────
# 🔴 순서가 곧 안전장치다: 로컬에 빌드(--load) → 스캔 → 통과한 것만 push.
#    Trivy = CRITICAL · --ignore-unfixed · exit-code 1 → **차단**. Sonar 는 측정만(비차단).
.build:
  stage: build
  variables:
    CONTEXT: "."
  id_tokens:
    # 🔴 **A-50 — 잡의 신원은 GitLab OIDC 다**(2026-08-13 라이브). 정적 AWS 키를 CI 변수에 넣지 않는다.
    #    `aud` 는 IAM 신뢰정책의 `StringEquals <issuer>:aud` 와 **정확히 같아야** 한다.
    #    ⚠️ 신뢰정책의 `sub` 가 **브랜치를 못박고 있다**(기본 `main` 하나 · `ci_oidc_allowed_refs`).
    #       허용 밖 브랜치는 아래 PUSH 판정에서 걸러 build+scan 까지만 한다.
    AWS_TOKEN:
      aud: sts.amazonaws.com
  before_script:
    - apk add --no-cache aws-cli
  script:
    - |
      # 🔴 A-50 의 `ci_oidc_allowed_refs` 와 **같이 움직여야 한다.** 여기만 늘리면 AssumeRole 이
      #    거부돼 전부 빨강이 되고, 저기만 늘리면 잡이 push 까지 가지 않는다.
      PUSH=0
      case " ${MP_PUSH_REFS:-main} " in *" ${CI_COMMIT_BRANCH:-} "*) PUSH=1 ;; esac
      [ "${CI_PIPELINE_SOURCE:-}" = "merge_request_event" ] && PUSH=0
      echo "── ${IMAGE} · arm64 · push=${PUSH} ──"

      # 🔴 계정 ID 는 **롤 ARN 에서 꺼낸다** — 레지스트리 주소를 위해 변수를 하나 더 두지 않는다.
      ACCOUNT="$(echo "${MP_CI_ROLE_ARN}" | cut -d: -f5)"
      export ECR_REGISTRY="${ACCOUNT}.dkr.ecr.${MP_AWS_REGION}.amazonaws.com"
      export IMAGE_PREFIX="${ECR_REGISTRY}/mealplanning"
      export IMG="${IMAGE_PREFIX}/${IMAGE}"

      # 🔴 **로그인은 빌드 앞에 와야 한다** — registry 빌드캐시(`--cache-to`)가 **빌드 도중**
      #    레지스트리에 쓰기 때문이다. 로그인이 push 직전에 있으면 캐시 쓰기가 조용히 실패한다.
      #    🟢 **게이트는 안 깨진다** — 여기서 하는 건 인증뿐이고, `:buildcache` 는 배포되지 않는
      #      레이어 캐시다. **배포 가능한 태그(`:sha`·`:latest`·`:X.Y.Z`)는 Trivy 통과 뒤에만** 올라간다.
      if [ "${PUSH}" = "1" ]; then
        echo "${AWS_TOKEN}" > /tmp/mp-oidc-token
        export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/mp-oidc-token
        export AWS_ROLE_ARN="${MP_CI_ROLE_ARN}"
        export AWS_ROLE_SESSION_NAME="gitlab-${CI_PROJECT_PATH_SLUG}-${CI_JOB_ID}"
        export AWS_REGION="${MP_AWS_REGION}"
        aws ecr get-login-password | docker login --username AWS --password-stdin "${ECR_REGISTRY}"
      else
        echo "ℹ️  push 대상 브랜치가 아니다 — ECR 로그인 없이 build+scan 만 한다"
      fi
    - |
      # 🔴 **`buildx` 를 쓰지 않는다 — 평범한 `docker build` 다**(결함 #39 · 라이브 실측).
      #    ① 만드는 것이 **arm64 단일**이고 러너가 Graviton 이라 `--platform` 이 할 일이 없다(C-89).
      #    ② `buildx create --driver docker-container` 는 **TLS 환경변수를 못 읽는다**(알려진 제약):
      #         could not create a builder instance with TLS data loaded from environment
      #       우회하려면 `docker context create` 가 선행돼야 하는데, 단일 아키에선 얻는 게 없다.
      #    🟢 ③ 이게 진짜 이유 — `docker build` 는 이미지를 **로컬 데몬에 남긴다.**
      #       그래서 아래 Trivy 가 push 앞에 설 수 있다. **C-89 가 지키려던 성질이 바로 이것이다.**
      #    ⚠️ 잃은 것 = registry 빌드캐시. 필요해지면 `docker context create` 로 되살릴 수 있다
      #       (그때 `:buildcache` 태그의 수명·라이프사이클도 같이 정할 것 — A-49).
      docker build \
        -f "$DOCKERFILE" \
        -t "${IMG}:${CI_COMMIT_SHA}" \
        -t "${IMG}:latest" \
        ${RELEASE_VERSION:+-t "${IMG}:${RELEASE_VERSION}"} \
        "$CONTEXT"
    - |
      # ── Trivy 게이트 (CRITICAL · --ignore-unfixed · **차단**) ────────────────
      # 🔴 DinD 에는 /var/run/docker.sock 이 없다(DOCKER_HOST=tcp + TLS).
      #    그래서 소켓을 물리지 않고 tar 로 떠서 `--input` 으로 스캔한다.
      #
      # 🔴🔴 **`-v /tmp/image.tar:...` 로는 안 된다**(결함 #40 · 라이브 실측 · 16/16 실패).
      #    `-v` 의 **왼쪽 경로는 데몬(= dind 서비스 컨테이너)의 파일시스템**에서 해석된다.
      #    `docker save` 는 **잡 컨테이너**에 썼으니 데몬 쪽엔 그 파일이 없고, 도커는 규칙대로
      #    **빈 디렉터리를 만들어** 물린다 → 스캔이 이렇게 죽는다:
      #        unable to open /tmp/image.tar as a Docker image: ... is a directory
      #    ⚠️ **이게 "빈 이미지를 통과시키는" 모양이 아니라 실패로 나온 건 운이 좋았던 것이다.**
      #       tar 를 못 읽으면 취약점 0건이 아니라 FATAL 이라 게이트는 열리지 않았다.
      #
      # 🟢 고침 = 공유 볼륨에 기대지 말고 **`docker cp` 로 Docker API 를 통해 밀어 넣는다.**
      #    파일 경로가 아니라 스트림이라 잡↔데몬 경계를 항상 넘는다(러너 `volumes` 설정과 무관).
      #    그래서 `--rm` 대신 `create → cp → start -a` 3단이다.
      docker save "${IMG}:${CI_COMMIT_SHA}" -o /tmp/image.tar
      SCAN="trivy-${CI_JOB_ID}"
      docker rm -f "$SCAN" >/dev/null 2>&1 || true
      docker create --name "$SCAN" \
        -v trivy-cache:/root/.cache \
        "$TRIVY_IMAGE" image --scanners vuln \
          --severity CRITICAL --ignore-unfixed --exit-code 1 \
          --skip-version-check --input /tmp/image.tar
      docker cp /tmp/image.tar "${SCAN}:/tmp/image.tar"
      set +e
      docker start -a "$SCAN"          # `start -a` 는 컨테이너 종료코드를 그대로 돌려준다
      TRIVY_RC=$?
      set -e
      docker rm -f "$SCAN" >/dev/null 2>&1 || true
      rm -f /tmp/image.tar
      if [ "$TRIVY_RC" != "0" ]; then
        echo "🔴 Trivy 게이트 실패(rc=${TRIVY_RC}) — push 하지 않는다"
        exit "$TRIVY_RC"
      fi
    - |
      if [ "${PUSH}" = "0" ]; then
        echo "✅ 빌드·스캔 통과 — push 대상 브랜치가 아니라 여기서 멈춘다(MP_PUSH_REFS='${MP_PUSH_REFS:-main}')"
        exit 0
      fi
      # 🟢 로그인은 위에서 이미 했다(빌드캐시 때문에 앞으로 옮겼다). 여기서는 push 만 한다.
      docker push "${IMG}:${CI_COMMIT_SHA}"
      docker push "${IMG}:latest"
      if [ -n "${RELEASE_VERSION}" ]; then docker push "${IMG}:${RELEASE_VERSION}"; fi
      echo "✅ ${IMAGE} → ${IMG}:${CI_COMMIT_SHA}"

# ══════════════════════════════════════════════════════════════════════════════
# 서비스 — AWS/EKS 에서 쓰는 것만 (16종)
#   제외 2종: data-pipeline · crawler-kurly = 온프렘 잔류 (C-20 · C-44).
#             그 둘은 Jenkinsfile 이 계속 amd64 로 만든다.
# ══════════════════════════════════════════════════════════════════════════════

# ── 앱 서비스 (image = mp-<이름>-service) ────────────────────────────────────
test:account:    { extends: .pytest, variables: { SRC: services/account },    rules: [{ changes: [services/account/**/*] }] }
test:pantry:     { extends: .pytest, variables: { SRC: services/pantry },     rules: [{ changes: [services/pantry/**/*] }] }
test:price:      { extends: .pytest, variables: { SRC: services/price },      rules: [{ changes: [services/price/**/*] }] }
test:recipebook: { extends: .pytest, variables: { SRC: services/recipebook }, rules: [{ changes: [services/recipebook/**/*] }] }
test:mealplan:   { extends: .pytest, variables: { SRC: services/mealplan },   rules: [{ changes: [services/mealplan/**/*] }] }
test:notify:     { extends: .pytest, variables: { SRC: services/notify },     rules: [{ changes: [services/notify/**/*] }] }
test:ocr:        { extends: .pytest, variables: { SRC: services/ocr },        rules: [{ changes: [services/ocr/**/*] }] }
test:operations: { extends: .pytest, variables: { SRC: services/operations }, rules: [{ changes: [services/operations/**/*] }] }
test:recipe:     { extends: .pytest, variables: { SRC: services/recipe },     rules: [{ changes: [services/recipe/**/*] }] }
test:video:      { extends: .pytest, variables: { SRC: services/video },      rules: [{ changes: [services/video/**/*, ml/video-recipe/**/*] }] }
# 🔴 chat 은 Jenkinsfile 카탈로그에 test 플래그가 없다(게이트 없음). 그대로 옮긴다.

build:account:    { extends: .build, needs: [test:account],    variables: { IMAGE: mp-account-service,    DOCKERFILE: services/account/Dockerfile,    CONTEXT: services/account },    rules: [{ changes: [services/account/**/*] }] }
build:pantry:     { extends: .build, needs: [test:pantry],     variables: { IMAGE: mp-pantry-service,     DOCKERFILE: services/pantry/Dockerfile,     CONTEXT: services/pantry },     rules: [{ changes: [services/pantry/**/*] }] }
