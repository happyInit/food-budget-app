# ══════════════════════════════════════════════════════════════════════════════
# CD 인계 — config 레포에 :sha 핀
# ══════════════════════════════════════════════════════════════════════════════
# 🔴 main 에서만. 없으면 PR 이 프로덕션에 배포된다(#389 위험1).
# 🔴 핀은 :sha 만. :latest 를 쓰면 ArgoCD 가 변화를 감지하지 못하고 롤백도 불가하다(플랜 §7.3).
# 🔴 config 레포는 GitHub 유지 — AWS 리전 장애 때 온프렘 ArgoCD 가 읽어야 한다(C-61③).
#    ⇒ 이 잡만 GitLab 밖(GitHub)으로 나간다. deploy key 는 보호 변수 $CONFIG_REPO_SSH_KEY.
config-pin:
  stage: deploy
  image: alpine/git:latest
  services: []
  # 🔴🔴 **기본 비활성이다 — C-89 의 명시적 유예.**
  #    지금 `Jenkinsfile` 이 `overlays/{onprem,eks}` 를 **둘 다** 핀한다(A-42/#624).
  #    여기서도 핀하면 **두 CI 가 같은 파일을 쓴다.** 분담 정리(Jenkins=onprem / GitLab=eks)는
  #    이관 후로 미뤘다(사용자 판단 = *"지금 급한 건 마이그레이션"*).
  #    ⇒ 켤 때 = `MP_ENABLE_CD=1` + **같은 커밋으로 Jenkinsfile 의 `SITES` 를 onprem 단독으로** 되돌린다.
  rules:
    - if: '$MP_ENABLE_CD == "1" && $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE != "merge_request_event"'
  before_script:
    # 🔴 이 잡엔 docker 가 없다(services: []) → kustomize 를 이미지로 못 띄운다. 바이너리를 받는다.
    #    러너가 arm64(C-63)이므로 arm64 배포본을 고정 버전으로 받는다.
    - apk add --no-cache curl tar
    - |
      curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_arm64.tar.gz" \
        | tar xz -C /usr/local/bin kustomize
    - kustomize version
  script:
    - mkdir -p ~/.ssh && echo "$CONFIG_REPO_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
    - export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new"
    - git clone --depth 1 git@github.com:happyInit/mealplanning-config.git .cfgrepo
    - |
      CHANGED=""
      for svc in $EKS_PINNED_SERVICES; do
        # 🔴 오버레이는 eks — 온프렘은 Jenkins 가 따로 onprem 오버레이를 핀한다.
        overlay=".cfgrepo/services/${svc%%=*}/overlays/eks"
        [ -d "$overlay" ] || { echo "오버레이 없음(스킵): ${svc%%=*}"; continue; }
        # 🔴 키는 Harbor 주소(오버레이의 `images[].name`). ECR 주소를 키로 쓰면 매칭이 안 돼
        #    죽은 엔트리만 하나 붙고 기존 태그는 낡은 채로 남는다.
        key="${HARBOR_IMAGE_PREFIX}/${svc##*=}"
        # 🔴 newName 은 **기존 값을 읽어 그대로 돌려준다.** kustomize v5.4.3 실측 —
        #    `<key>=<img>:<sha>` 는 newName 을 덮어쓰고, `<key>:<sha>` 는 newName 을 지운다.
        #    둘 다 ECR 매핑을 파괴한다. 태그만 갈아끼우려면 이 형식뿐이다.
        newname=$(grep -m1 'newName:' "$overlay/kustomization.yaml" | awk '{print $2}' || true)
        # 🔴 전역 IMAGE_PREFIX 를 없앴다(계정 ID 비커밋) → 여기서도 롤 ARN 에서 유도한다.
        [ -n "$newname" ] || newname="$(echo "${MP_CI_ROLE_ARN}" | cut -d: -f5).dkr.ecr.${MP_AWS_REGION}.amazonaws.com/mealplanning/${svc##*=}"
        ( cd "$overlay" && kustomize edit set image "${key}=${newname}:${CI_COMMIT_SHA}" )
        CHANGED="$CHANGED ${svc%%=*}"
      done
      echo "pinned:$CHANGED"
    - |
      cd .cfgrepo
      git config user.email 'ci@mealbong.cloud'
      git config user.name  'mealbong-ci'
      git add -A
      if git diff --cached --quiet; then
        echo 'config 변경 없음 (동일 :sha 재빌드)'
      else
        git commit -m "ci(cd): eks pin to ${CI_COMMIT_SHA:0:12}"
        git push origin HEAD:main
      fi

# ══════════════════════════════════════════════════════════════════════════════
# 🔴 아직 옮기지 않은 것 — 별건으로 남긴다
# ══════════════════════════════════════════════════════════════════════════════
# 1. SonarQube (측정만·비차단·main 한정)
#    A-29 ① 미해결 — sonar-scanner-cli 공식 이미지가 amd64 단일이라 arm64 러너에서 못 돈다.
#    aarch64 zip(sonar-scanner-cli-<v>-linux-aarch64.zip) 으로 갈아타는 작업이 선행.
# 2. S3 이미지 백업 (Jenkinsfile 의 backupFailed 경로 — UNSTABLE 로만 내리던 것)
# 3. RELEASE_VERSION 릴리스 런의 SERVICES 명시 강제 (Jenkins 파라미터 → GitLab 수동 파이프라인 변수)
