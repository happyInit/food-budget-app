# .gitlab-ci.yml — A-29 파이프라인 이식 (Jenkinsfile → GitLab CI)
#
# 정본: docs/mp_aws_prep_checklist.md — C-2(CI=GitLab) · C-61(논리 형상) · C-63(러너 arm64)
#
# 🔴 이 파일은 Jenkinsfile 을 대체하지 않는다. 둘은 대상이 다르다.
#      Jenkinsfile   = 온프렘(amd64) — 그대로 산다. 건드리지 않는다.
#      .gitlab-ci.yml = AWS/EKS(arm64) — 이 파일.
#    사용자 결정(2026-08-12): "2아키는 유지하되, 당장 GitLab 은 AWS 에서 쓸 것만 빌드한다."
#
# 🔴 단일 아키(arm64)인 것이 안전장치를 지킨다 —
#    멀티아치 buildx 는 로컬 데몬에 --load 가 안 돼 `build → 스캔 → push` 순서가 깨진다(A-29 ②).
#    단일 플랫폼이면 --load 가 되므로 Jenkinsfile 의 "나쁜 이미지는 절대 안 올라간다" 가 그대로 유지된다.
#    ⇒ 나중에 여기서 amd64 까지 만들기로 하면 그 문제가 되살아난다. 그때 A-29 ② 를 먼저 풀 것.
#
# 러너 = GitLab EC2(t4g.xlarge · Graviton) 위 privileged DinD (C-61① · C-63)
#        ⇒ arm64 가 네이티브다. QEMU 를 타지 않는다.

stages: [test, build, deploy]

variables:
  # ── 레지스트리 ────────────────────────────────────────────────────────────
  # ECR. 🔴 ECR_REGISTRY 는 CI/CD 변수로 주입한다(<acct>.dkr.ecr.ap-northeast-2.amazonaws.com).
  IMAGE_PREFIX: "${ECR_REGISTRY}/mealplanning"
  PLATFORM: "linux/arm64"

  # ── 도구 핀 ───────────────────────────────────────────────────────────────
  TRIVY_IMAGE: "aquasec/trivy:0.68.0"
  KUSTOMIZE_VERSION: "v5.4.3"

  DOCKER_HOST: "tcp://docker:2376"
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_CERT_PATH: "/certs/client"
  DOCKER_TLS_VERIFY: "1"
  # BuildKit 강제 — 클래식 빌더로 떨어지면 TARGETARCH·BUILDPLATFORM 이 빈 값이 된다(1-6 실측 함정).
  DOCKER_BUILDKIT: "1"

  # 릴리스 런에서만 채운다. 비어 있으면 :sha + :latest 2태그(3태그 정책 · 플랜 §7.3).
  RELEASE_VERSION: ""

  # config 레포에 핀할 대상 = "<오버레이 디렉터리명>=<이미지명>".
  # 🔴 앱 워크로드만 오버레이가 있다. pgsync·es-nori·rollouts-plugin 은 여기 없다(플랫폼 트랙).
  EKS_PINNED_SERVICES: >-
    account=mp-account-service
    pantry=mp-pantry-service
    price=mp-price-service
    recipebook=mp-recipebook-service
    mealplan=mp-mealplan-service
    notify=mp-notify-service
    ocr=mp-ocr-service
    operations=mp-operations-service
    recipe=mp-recipe-service
    video=mp-video-service
    chat=mp-chat-service
    frontend=mp-frontend
    ranking-serving=mp-ranking-serving

default:
  image: docker:29-cli
  services:
    - name: docker:29-dind
      alias: docker
  tags: [mp-aws]          # GitLab EC2 러너
  interruptible: true

# ══════════════════════════════════════════════════════════════════════════════
# 공통
# ══════════════════════════════════════════════════════════════════════════════

# ── pytest 게이트 ────────────────────────────────────────────────────────────
# Jenkinsfile 카탈로그의 test:true 만. 실패하면 그 서비스는 빌드·push 하지 않는다.
# httpx = fastapi TestClient 의 런타임 의존성 — 테스트 전용이라 여기서만 설치한다.
.pytest:
  stage: test
  image: "python:3.12-slim"
  services: []
  variables:
    REQS: "requirements.txt"
    COV: "app"
  script:
    - cd "$SRC"
    - export PYTHONPATH="$CI_PROJECT_DIR/$SRC:$CI_PROJECT_DIR"
    - |
      if [ -n "$REQS" ]; then
        pip install --no-cache-dir -q -r "$REQS" pytest pytest-cov httpx
      else
        pip install --no-cache-dir -q pytest pytest-cov httpx
      fi
    - python -m pytest -q --cov="$COV" --cov-report=xml
  artifacts:
    paths: ["$SRC/coverage.xml"]
    expire_in: 1 day
    when: always

# ── 빌드 → Trivy 게이트 → ECR push ───────────────────────────────────────────
# 🔴 순서가 곧 안전장치다: 로컬에 빌드(--load) → 스캔 → 통과한 것만 push.
#    Trivy = CRITICAL · --ignore-unfixed · exit-code 1 → **차단**. Sonar 는 측정만(비차단).
.build:
  stage: build
  variables:
    CONTEXT: "."
  before_script:
    # 🔴 A-30 미해결 — 여기가 그 결정이 들어올 자리다.
    #    IMDS hop-limit 1 이면 빌드 컨테이너에서 `aws ecr get-login-password` 가 안 된다.
    #    A-30 채택안 = 러너(호스트)가 12h ECR 토큰만 얻어 컨테이너에 주입.
    #    ⇒ 그때까지는 보호 변수 $ECR_PASSWORD 로 받는다.
    - echo "$ECR_PASSWORD" | docker login "$ECR_REGISTRY" -u AWS --password-stdin
    - docker buildx create --use --driver docker-container --name mpx || docker buildx use mpx
  script:
    - IMG="${IMAGE_PREFIX}/${IMAGE}"
    - |
      docker buildx build \
        --platform "$PLATFORM" \
        --load \
        -f "$DOCKERFILE" \
        -t "${IMG}:${CI_COMMIT_SHA}" \
        -t "${IMG}:latest" \
        ${RELEASE_VERSION:+-t "${IMG}:${RELEASE_VERSION}"} \
        --cache-from "type=registry,ref=${IMG}:buildcache" \
        --cache-to   "type=registry,ref=${IMG}:buildcache,mode=max" \
        "$CONTEXT"
    # 🔴 DinD 에는 /var/run/docker.sock 이 없다(DOCKER_HOST=tcp + TLS).
    #    그래서 소켓을 물리지 않고 tar 로 떠서 --input 으로 스캔한다 — 결과는 동일하고 의존이 하나 준다.
    - docker save "${IMG}:${CI_COMMIT_SHA}" -o /tmp/image.tar
    - |
      docker run --rm \
        -v /tmp/image.tar:/tmp/image.tar:ro \
        -v trivy-cache:/root/.cache \
        "$TRIVY_IMAGE" image --scanners vuln \
          --severity CRITICAL --ignore-unfixed --exit-code 1 \
          --input /tmp/image.tar
    - docker push "${IMG}:${CI_COMMIT_SHA}"
    - docker push "${IMG}:latest"
    - if [ -n "$RELEASE_VERSION" ]; then docker push "${IMG}:${RELEASE_VERSION}"; fi

# ══════════════════════════════════════════════════════════════════════════════
# 서비스 — AWS/EKS 에서 쓰는 것만 (16종)
#   제외 2종: data-pipeline · crawler-kurly = 온프렘 잔류 (C-20 · C-44).
#             그 둘은 Jenkinsfile 이 계속 amd64 로 만든다.
# ══════════════════════════════════════════════════════════════════════════════

# ── 앱 서비스 (image = mp-<이름>-service) ────────────────────────────────────
test:account:    { extends: .pytest, variables: { SRC: services/account },    rules: [{ changes: [services/account/**/*] }] }
test:pantry:     { extends: .pytest, variables: { SRC: services/pantry },     rules: [{ changes: [services/pantry/**/*] }] }
test:price:      { extends: .pytest, variables: { SRC: services/price },      rules: [{ changes: [services/price/**/*] }] }
test:recipebook: { extends: .pytest, variables: { SRC: services/recipebook }, rules: [{ changes: [services/recipebook/**/*] }] }
test:mealplan:   { extends: .pytest, variables: { SRC: services/mealplan },   rules: [{ changes: [services/mealplan/**/*] }] }
test:notify:     { extends: .pytest, variables: { SRC: services/notify },     rules: [{ changes: [services/notify/**/*] }] }
test:ocr:        { extends: .pytest, variables: { SRC: services/ocr },        rules: [{ changes: [services/ocr/**/*] }] }
test:operations: { extends: .pytest, variables: { SRC: services/operations }, rules: [{ changes: [services/operations/**/*] }] }
test:recipe:     { extends: .pytest, variables: { SRC: services/recipe },     rules: [{ changes: [services/recipe/**/*] }] }
test:video:      { extends: .pytest, variables: { SRC: services/video },      rules: [{ changes: [services/video/**/*, ml/video-recipe/**/*] }] }
# 🔴 chat 은 Jenkinsfile 카탈로그에 test 플래그가 없다(게이트 없음). 그대로 옮긴다.

build:account:    { extends: .build, needs: [test:account],    variables: { IMAGE: mp-account-service,    DOCKERFILE: services/account/Dockerfile,    CONTEXT: services/account },    rules: [{ changes: [services/account/**/*] }] }
build:pantry:     { extends: .build, needs: [test:pantry],     variables: { IMAGE: mp-pantry-service,     DOCKERFILE: services/pantry/Dockerfile,     CONTEXT: services/pantry },     rules: [{ changes: [services/pantry/**/*] }] }
build:price:      { extends: .build, needs: [test:price],      variables: { IMAGE: mp-price-service,      DOCKERFILE: services/price/Dockerfile,      CONTEXT: services/price },      rules: [{ changes: [services/price/**/*] }] }
build:recipebook: { extends: .build, needs: [test:recipebook], variables: { IMAGE: mp-recipebook-service, DOCKERFILE: services/recipebook/Dockerfile, CONTEXT: services/recipebook }, rules: [{ changes: [services/recipebook/**/*] }] }
build:mealplan:   { extends: .build, needs: [test:mealplan],   variables: { IMAGE: mp-mealplan-service,   DOCKERFILE: services/mealplan/Dockerfile,   CONTEXT: services/mealplan },   rules: [{ changes: [services/mealplan/**/*] }] }
build:notify:     { extends: .build, needs: [test:notify],     variables: { IMAGE: mp-notify-service,     DOCKERFILE: services/notify/Dockerfile,     CONTEXT: services/notify },     rules: [{ changes: [services/notify/**/*] }] }
build:ocr:        { extends: .build, needs: [test:ocr],        variables: { IMAGE: mp-ocr-service,        DOCKERFILE: services/ocr/Dockerfile,        CONTEXT: services/ocr },        rules: [{ changes: [services/ocr/**/*] }] }
build:operations: { extends: .build, needs: [test:operations], variables: { IMAGE: mp-operations-service, DOCKERFILE: services/operations/Dockerfile, CONTEXT: services/operations }, rules: [{ changes: [services/operations/**/*] }] }
build:recipe:     { extends: .build, needs: [test:recipe],     variables: { IMAGE: mp-recipe-service,     DOCKERFILE: services/recipe/Dockerfile,     CONTEXT: "." },                 rules: [{ changes: [services/recipe/**/*] }] }
build:video:      { extends: .build, needs: [test:video],      variables: { IMAGE: mp-video-service,      DOCKERFILE: services/video/Dockerfile,      CONTEXT: "." },                 rules: [{ changes: [services/video/**/*, ml/video-recipe/**/*] }] }
build:chat:       { extends: .build,                           variables: { IMAGE: mp-chat-service,       DOCKERFILE: services/chat/Dockerfile,       CONTEXT: "." },                 rules: [{ changes: [services/chat/**/*] }] }

# ── 그 외 (image 접미사 없음 — CLAUDE.md 명명 규칙) ──────────────────────────
build:frontend:        { extends: .build, variables: { IMAGE: mp-frontend,        DOCKERFILE: frontend/Dockerfile,                              CONTEXT: frontend },                              rules: [{ changes: [frontend/**/*] }] }
build:ranking-serving: { extends: .build, variables: { IMAGE: mp-ranking-serving, DOCKERFILE: ml/recipe-ranking/Dockerfile,                     CONTEXT: ml/recipe-ranking },                     rules: [{ changes: [ml/recipe-ranking/**/*] }] }
build:pgsync:          { extends: .build, variables: { IMAGE: mp-pgsync,          DOCKERFILE: deploy/pgsync/Dockerfile,                         CONTEXT: deploy/pgsync },                         rules: [{ changes: [deploy/pgsync/**/*] }] }
build:es-nori:         { extends: .build, variables: { IMAGE: mp-elasticsearch-nori, DOCKERFILE: infra/images/elasticsearch-nori/Dockerfile,    CONTEXT: infra/images/elasticsearch-nori },       rules: [{ changes: [infra/images/elasticsearch-nori/**/*] }] }
# 🔴 rollouts 플러그인은 Rollouts 컨트롤러의 initContainer 다 — arm64 에서 안 뜨면 배포 게이트가 멈춘다(1-6 ④).
build:rollouts-plugin: { extends: .build, variables: { IMAGE: mp-rollouts-gatewayapi-plugin, DOCKERFILE: infra/images/rollouts-gatewayapi-plugin/Dockerfile, CONTEXT: infra/images/rollouts-gatewayapi-plugin }, rules: [{ changes: [infra/images/rollouts-gatewayapi-plugin/**/*] }] }

# ══════════════════════════════════════════════════════════════════════════════
# CD 인계 — config 레포에 :sha 핀
# ══════════════════════════════════════════════════════════════════════════════
# 🔴 main 에서만. 없으면 PR 이 프로덕션에 배포된다(#389 위험1).
# 🔴 핀은 :sha 만. :latest 를 쓰면 ArgoCD 가 변화를 감지하지 못하고 롤백도 불가하다(플랜 §7.3).
# 🔴 config 레포는 GitHub 유지 — AWS 리전 장애 때 온프렘 ArgoCD 가 읽어야 한다(C-61③).
#    ⇒ 이 잡만 GitLab 밖(GitHub)으로 나간다. deploy key 는 보호 변수 $CONFIG_REPO_SSH_KEY.
config-pin:
  stage: deploy
  image: alpine/git:latest
  services: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE != "merge_request_event"'
  before_script:
    # 🔴 이 잡엔 docker 가 없다(services: []) → kustomize 를 이미지로 못 띄운다. 바이너리를 받는다.
    #    러너가 arm64(C-63)이므로 arm64 배포본을 고정 버전으로 받는다.
    - apk add --no-cache curl tar
    - |
      curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_arm64.tar.gz" \
        | tar xz -C /usr/local/bin kustomize
    - kustomize version
  script:
    - mkdir -p ~/.ssh && echo "$CONFIG_REPO_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
    - export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new"
    - git clone --depth 1 git@github.com:happyInit/mealplanning-config.git .cfgrepo
    - |
      CHANGED=""
      for svc in $EKS_PINNED_SERVICES; do
        # 🔴 오버레이는 eks — 온프렘은 Jenkins 가 따로 onprem 오버레이를 핀한다.
        overlay=".cfgrepo/services/${svc%%=*}/overlays/eks"
        [ -d "$overlay" ] || { echo "오버레이 없음(스킵): ${svc%%=*}"; continue; }
        img="${IMAGE_PREFIX}/${svc##*=}"
        ( cd "$overlay" && kustomize edit set image "${img}=${img}:${CI_COMMIT_SHA}" )
        CHANGED="$CHANGED ${svc%%=*}"
      done
      echo "pinned:$CHANGED"
    - |
      cd .cfgrepo
      git config user.email 'ci@mealbong.cloud'
      git config user.name  'mealbong-ci'
      git add -A
      if git diff --cached --quiet; then
        echo 'config 변경 없음 (동일 :sha 재빌드)'
      else
        git commit -m "ci(cd): eks pin to ${CI_COMMIT_SHA:0:12}"
        git push origin HEAD:main
      fi

# ══════════════════════════════════════════════════════════════════════════════
# 🔴 아직 옮기지 않은 것 — 별건으로 남긴다
# ══════════════════════════════════════════════════════════════════════════════
# 1. SonarQube (측정만·비차단·main 한정)
#    A-29 ① 미해결 — sonar-scanner-cli 공식 이미지가 amd64 단일이라 arm64 러너에서 못 돈다.
#    aarch64 zip(sonar-scanner-cli-<v>-linux-aarch64.zip) 으로 갈아타는 작업이 선행.
# 2. S3 이미지 백업 (Jenkinsfile 의 backupFailed 경로 — UNSTABLE 로만 내리던 것)
# 3. RELEASE_VERSION 릴리스 런의 SERVICES 명시 강제 (Jenkins 파라미터 → GitLab 수동 파이프라인 변수)
