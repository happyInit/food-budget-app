<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>파그 · 영수증 스캔 (데모)</title>
<style>
  :root { --accent:#F26419; --accent-soft:#FCEBDD; --bg:#F4F4F2; --card:#fff; --line:#E6E6E6; --muted:#9A9A9A; --text:#1c1c1a; --ok:#2f7d33; --bad:#F04452; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; }
  body { background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    display:flex; justify-content:center; padding:20px; }
  .app { width:100%; max-width:680px; background:var(--card); border:1px solid var(--line);
    border-radius:16px; overflow:hidden; box-shadow:0 8px 30px rgba(0,0,0,.06); }
  header { display:flex; align-items:center; gap:11px; padding:16px 18px; border-bottom:1px solid var(--line); }
  .avatar { width:40px; height:40px; border-radius:50%; background:var(--accent-soft); display:grid; place-items:center; font-size:22px; }
  header h1 { font-size:17px; font-weight:800; letter-spacing:-.3px; margin:0; }
  header .tag { margin-left:auto; font-size:11px; font-weight:700; color:var(--accent); background:var(--accent-soft); padding:4px 9px; border-radius:6px; }
  .body { padding:18px; }
  .drop { border:1.5px dashed var(--line); border-radius:12px; padding:22px; text-align:center; cursor:pointer; transition:.15s; }
  .drop:hover { border-color:var(--accent); background:#fafafa; }
  .drop input { display:none; }
  .drop .ico { font-size:34px; }
  .drop .hint { font-size:13px; color:var(--muted); margin-top:6px; }
  .preview { margin-top:14px; display:none; }
  .preview img { max-width:100%; max-height:280px; border-radius:10px; border:1px solid var(--line); display:block; margin:0 auto; }
  .preview .fname { font-size:12px; color:var(--muted); text-align:center; margin-top:6px; }
  .actions { margin-top:14px; display:flex; gap:10px; }
  button { flex:1; padding:12px; border:none; border-radius:100px; font-size:14px; font-weight:700; cursor:pointer; }
  .go { background:var(--accent); color:#fff; }
  .go:disabled { opacity:.45; cursor:default; }
  .reset { background:#f0f0ee; color:#555; flex:0 0 auto; padding:12px 18px; }
  .status { margin-top:16px; font-size:14px; }
  .dots span { display:inline-block; width:7px; height:7px; margin:0 2px; border-radius:50%; background:#c7c7c2; animation:b 1s infinite; }
  .dots span:nth-child(2){ animation-delay:.15s; } .dots span:nth-child(3){ animation-delay:.3s; }
  @keyframes b { 0%,60%,100%{ transform:translateY(0); opacity:.5; } 30%{ transform:translateY(-5px); opacity:1; } }
  .meta { display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 10px; }
  .chip { font-size:12.5px; background:#F5F5F3; border:1px solid var(--line); border-radius:100px; padding:5px 11px; }
  .chip b { color:var(--accent); }
  table { width:100%; border-collapse:collapse; font-size:13px; margin-top:6px; }
  th,td { padding:8px 9px; text-align:left; border-bottom:1px solid var(--line); }
  th { font-size:11px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.3px; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  tr.nonfood td { color:var(--muted); }
  .badge { font-size:11px; font-weight:700; padding:2px 7px; border-radius:100px; }
  .badge.food { background:#E9F5EA; color:var(--ok); }
  .badge.no { background:#F3F3F1; color:var(--muted); }
  .mid { color:var(--muted); font-size:12px; }
  .err { color:var(--bad); font-weight:700; }
  .note { font-size:11px; color:var(--muted); margin-top:12px; line-height:1.6; }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="avatar">🧾</div>
      <h1>파그 · 영수증 스캔</h1>
      <span class="tag">OCR DEMO</span>
    </header>
    <div class="body">
      <label class="drop" id="drop">
        <input type="file" id="file" accept="image/*" />
        <div class="ico">📷</div>
        <div>영수증 사진을 올려주세요</div>
        <div class="hint">클릭해서 선택 · JPG/PNG</div>
      </label>
      <div class="preview" id="preview"><img id="pimg" alt="preview" /><div class="fname" id="fname"></div></div>
      <div class="actions">
        <button class="go" id="go" disabled>분석하기</button>
        <button class="reset" id="reset" type="button">초기화</button>
      </div>
      <div class="status" id="status"></div>
      <div class="note">Gemini Vision으로 매장·품목·금액을 추출합니다. 결과는 확정 전 초안(HITL 검수 대상) · 식재료가 아닌 항목(봉투·할인 등)은 회색 처리.</div>
    </div>
  </div>
<script>
const $ = (id) => document.getElementById(id);
const file = $('file'), go = $('go'), status = $('status');
let picked = null;

$('drop').onclick = () => file.click();
file.onchange = () => {
  picked = file.files[0] || null;
  if (!picked) return;
  $('pimg').src = URL.createObjectURL(picked);
  $('fname').textContent = picked.name;
  $('preview').style.display = 'block';
  go.disabled = false;
  status.innerHTML = '';
};
$('reset').onclick = () => {
  picked = null; file.value = ''; go.disabled = true;
  $('preview').style.display = 'none'; status.innerHTML = '';
};

go.onclick = async () => {
  if (!picked) return;
  go.disabled = true;
  status.innerHTML = '<span class="mid">업로드 중…</span>';
  try {
    const fd = new FormData(); fd.append('image', picked);
    const acc = await fetch('/api/pantry/ocr', { method:'POST', body: fd });
    if (!acc.ok) throw new Error('업로드 실패 (HTTP ' + acc.status + ')');
    const { job_id } = await acc.json();
    status.innerHTML = '분석 중 <span class="dots"><span></span><span></span><span></span></span>';
    let data = null;
    for (let i = 0; i < 40; i++) {
      await new Promise(r => setTimeout(r, 1200));
      const r = await fetch('/api/pantry/ocr/' + job_id);
      data = await r.json();
      if (data.status !== 'PENDING') break;
    }
    render(data);
  } catch (e) {
    status.innerHTML = '<span class="err">오류: ' + e.message + '</span>';
  } finally { go.disabled = false; }
};

function won(v){ return v == null ? '<span class="mid">—</span>' : Number(v).toLocaleString('ko-KR') + '원'; }
function esc(s){ const d=document.createElement('div'); d.textContent = s==null?'':s; return d.innerHTML; }

function render(d){
  if (!d || d.status === 'FAILED') {
    status.innerHTML = '<span class="err">분석 실패: ' + esc(d && d.reason || '알 수 없음') + '</span>'; return;
  }
  if (d.status === 'PENDING') { status.innerHTML = '<span class="mid">아직 처리 중이에요. 잠시 후 다시 시도해 주세요.</span>'; return; }
  const items = d.items || [];
  const meta = [
    d.store ? '<span class="chip">🏪 <b>' + esc(d.store) + '</b></span>' : '',
    d.purchased_at ? '<span class="chip">🕒 ' + esc(d.purchased_at.replace('T',' ').slice(0,16)) + '</span>' : '',
    '<span class="chip">합계 <b>' + (d.total_amount!=null ? Number(d.total_amount).toLocaleString('ko-KR')+'원' : '—') + '</b></span>',
    '<span class="chip">품목 <b>' + items.length + '</b></span>',
    d.backend ? '<span class="chip">' + esc(d.backend) + '</span>' : '',
  ].join('');
  const rows = items.map(it => `<tr class="${it.is_food?'':'nonfood'}">
    <td>${esc(it.raw_text)}</td>
    <td>${esc(it.name) || '<span class="mid">—</span>'}</td>
    <td>${esc(it.quantity) || '<span class="mid">—</span>'}</td>
    <td class="num">${won(it.price)}</td>
    <td>${it.is_food ? '<span class="badge food">식재료</span>' : '<span class="badge no">비식품</span>'}</td>
    <td>${it.item_id!=null ? esc(String(it.item_id)) : '<span class="mid">미매칭</span>'}</td>
  </tr>`).join('');
  status.innerHTML = '<div class="meta">' + meta + '</div>' +
    (items.length ? `<table><thead><tr><th>원문</th><th>품목명</th><th>수량</th><th>가격</th><th>구분</th><th>품목코드</th></tr></thead><tbody>${rows}</tbody></table>`
                  : '<span class="mid">추출된 품목이 없어요. 다른 사진으로 시도해 보세요.</span>');
}
</script>
</body>
</html>
