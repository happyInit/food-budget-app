server {
    listen 8080;
    server_name _;

    # Dashboard assets are bind-mounted during local verification and later
    # replaced by SHA-tagged images. Do not let an old app.js keep presenting
    # obsolete anomaly criteria after a container recreation.
    add_header Cache-Control "no-store, max-age=0" always;

    root /usr/share/nginx/html;
    index index.html;

    # The browser only talks to this public container. Dashboard data requests
    # are forwarded to the internal-only Python proxy on the Compose network.
    location /api/ {
        proxy_pass http://dashboard-proxy:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
