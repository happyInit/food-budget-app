          <button class="nav-item" data-view="traces">Traces <span>탐색</span></button>
          <p>CORE SERVICES</p>
          <button class="nav-item" data-view="services">Services / APM <span id="navServiceCount">--</span></button>
          <button class="nav-item" data-view="pipeline">Data Pipeline <span>03</span></button>
          <p>INTELLIGENCE</p>
          <button class="nav-item" data-view="anomalies">Anomalies · AI <span id="navAnomalyCount">--</span></button>

        </nav>
        <div class="connection"><i></i><span id="connectionState">로컬 목업</span></div>

          <div><p id="eyebrow">MEALPLAN OPERATIONS</p><h1 id="pageTitle">서비스 운영 개요</h1></div>

          </div>
        </header>
        <section id="overviewBanner" class="overview-banner" hidden></section>
        <section id="summaryCards" class="summary-cards"></section>
        <section id="pageIntro" class="page-intro"></section>
        <section id="dashboardContent"></section>
      </main>
    </div>
    <div id="startupError" hidden role="alert"></div>
    <script>
      window.addEventListener("error", function (event) {
        var target = document.getElementById("startupError");
        target.hidden = false;
        target.textContent = "대시보드 화면 오류: " + (event.message || "스크립트 실행 실패");
      });
    </script>
