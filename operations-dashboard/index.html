<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MealPlan Observability</title>
    <link rel="stylesheet" href="./styles.css?v=20260818-3" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h18"/><path d="M4 11a8 6.2 0 0 0 16 0"/><path d="M9.5 8c-.6-1.4-.1-2.4.9-3.4"/><path d="M14 8c.6-1.4.1-2.4-.9-3.4"/></svg></span><div><strong>MealPlan<br>Observability</strong></div></div>
        <nav aria-label="Operations navigation">
          <p>OVERVIEW</p>
          <button class="nav-item active" data-view="overview">Overview <span>01</span></button>
          <p>TELEMETRY</p>
          <button class="nav-item" data-view="metrics">Metrics <span>LIVE</span></button>
          <button class="nav-item" data-view="logs">Logs <span>탐색</span></button>
          <button class="nav-item" data-view="traces">Traces <span>탐색</span></button>
          <p>CORE SERVICES</p>
          <button class="nav-item" data-view="services">Services / APM <span id="navServiceCount">--</span></button>
          <button class="nav-item" data-view="pipeline">Data Pipeline <span>03</span></button>
          <p>INTELLIGENCE</p>
          <button class="nav-item" data-view="investigations">장애 조사 <span id="navInvestigationCount">--</span></button>
        </nav>
        <div class="connection"><i></i><span id="connectionState">로컬 목업</span></div>
      </aside>

      <main>
        <header class="topbar">
          <div><p id="eyebrow">MEALPLAN OPERATIONS</p><h1 id="pageTitle">서비스 운영 개요</h1></div>
          <div class="filters">
            <label class="period-filter">기간 <select id="periodFilter"><option value="1">최근 1시간</option><option value="6">최근 6시간</option><option value="24">최근 24시간</option></select></label>
            <label class="service-filter">서비스 <select id="serviceFilter"><option value="all">전체 서비스</option><option value="mealplan">mealplan</option><option value="price">price</option><option value="recipe">recipe</option><option value="account">account</option><option value="chat">chat</option></select></label>
            <button id="refreshButton" title="새로고침" aria-label="새로고침">↻</button>
          </div>
        </header>
        <section id="overviewBanner" class="overview-banner" hidden></section>
        <section id="summaryCards" class="summary-cards"></section>
        <section id="pageIntro" class="page-intro"></section>
        <section id="dashboardContent"></section>
      </main>
    </div>
    <div id="startupError" hidden role="alert"></div>
    <div id="rcaReportModal" hidden></div>
    <div id="chatWidget"></div>
    <script>
      window.addEventListener("error", function (event) {
        var target = document.getElementById("startupError");
        target.hidden = false;
        target.textContent = "대시보드 화면 오류: " + (event.message || "스크립트 실행 실패");
      });
    </script>
    <script src="./mock-data.js?v=20260818-3"></script>
    <script src="./live-data.js?v=20260818-3"></script>
    <script src="./app.js?v=20260818-3"></script>
  </body>
</html>
